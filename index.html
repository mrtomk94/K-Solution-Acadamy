        { t: "terms", items: [
          { term: { en: "CPU / Controller", vi: "CPU / Controller" }, def: { en: "Runs the program and holds the tags (memory).", vi: "Chạy chương trình và lưu các tag (bộ nhớ)." } },
          { term: { en: "Input module", vi: "Module ngõ vào" }, def: { en: "Reads field signals: buttons, sensors, switches.", vi: "Đọc tín hiệu hiện trường: nút nhấn, cảm biến, công tắc." } },
          { term: { en: "Output module", vi: "Module ngõ ra" }, def: { en: "Turns field devices on/off: lights, relays, contactor coils.", vi: "Bật/tắt thiết bị hiện trường: đèn, rơ-le, cuộn hút contactor." } },
          { term: { en: "Power supply", vi: "Nguồn" }, def: { en: "Powers the controller and modules (usually 24 VDC).", vi: "Cấp nguồn cho controller và module (thường là 24 VDC)." } },
          { term: { en: "Comms port", vi: "Cổng truyền thông" }, def: { en: "EtherNet/IP port to talk to your laptop, HMI and drives.", vi: "Cổng EtherNet/IP để kết nối laptop, HMI và biến tần." } }
        ] },
        { t: "h", en: "The scan cycle", vi: "Chu kỳ quét (scan cycle)" },
        { t: "p", en: "A PLC repeats the same loop over and over, usually in a few milliseconds: **read inputs → run the logic top to bottom → write outputs**. Then it starts again.", vi: "PLC lặp đi lặp lại một vòng, thường chỉ vài mili-giây: **đọc ngõ vào → chạy logic từ trên xuống → ghi ngõ ra**. Rồi bắt đầu lại." },
        { t: "widget", name: "scan" },
        { t: "callout", kind: "tip", en: "Logix controllers (CompactLogix / ControlLogix) update I/O on its own schedule called the **RPI (Requested Packet Interval)**, not exactly once per scan. For a beginner, the read-solve-write picture is still the right way to think.", vi: "Controller Logix (CompactLogix / ControlLogix) cập nhật I/O theo chu kỳ riêng gọi là **RPI (Requested Packet Interval)**, không đúng một lần mỗi scan. Với người mới, mô hình đọc - xử lý - ghi vẫn là cách hiểu đúng." }
      ] },
      { id: "l3", title: { en: "Allen-Bradley PLC Families", vi: "Các dòng PLC Allen-Bradley" }, minutes: 15, blocks: [
        { t: "table",
          head: { en: ["Family", "Size", "Software", "Typical use"], vi: ["Dòng", "Cỡ", "Phần mềm", "Ứng dụng"] },
          rows: {
            en: [["Micro800 (Micro820/850)", "Small", "Connected Components Workbench", "Simple machines, low cost"], ["CompactLogix 5380", "Medium", "Studio 5000 Logix Designer", "Most machines and skids"], ["ControlLogix 5580", "Large", "Studio 5000 Logix Designer", "Whole plants, big processes"]],
            vi: [["Micro800 (Micro820/850)", "Nhỏ", "Connected Components Workbench", "Máy đơn giản, giá rẻ"], ["CompactLogix 5380", "Vừa", "Studio 5000 Logix Designer", "Phần lớn các máy"], ["ControlLogix 5580", "Lớn", "Studio 5000 Logix Designer", "Cả nhà máy, quy trình lớn"]]
          } },
        { t: "p", en: "CompactLogix and ControlLogix use the **same software and the same instructions**. Learn one and you know both.", vi: "CompactLogix và ControlLogix dùng **cùng phần mềm và cùng tập lệnh**. Học một cái là biết cả hai." },
        { t: "callout", kind: "kit", en: "Your kit uses a CompactLogix 5380: **5069-L306ER** controller (slot 0), **5069-IB16** 16-point 24 VDC input module (slot 1), and **5069-OW4I** 4-point isolated relay output module (slot 2).", vi: "Kit của bạn dùng CompactLogix 5380: controller **5069-L306ER** (slot 0), module **5069-IB16** 16 ngõ vào 24 VDC (slot 1), và module **5069-OW4I** 4 ngõ ra rơ-le cách ly (slot 2)." },
        { t: "lab", title: { en: "Identify the PLC hardware", vi: "Nhận diện phần cứng PLC" }, steps: {
          en: ["With the panel OFF, find the controller and read its catalog number on the side label.", "Find the input and output modules. Write down each catalog number and slot.", "Find the 24 VDC power supply and trace its wires to the controller's MOD and SA power terminals.", "Find the Ethernet cable from the controller. Where does it go?", "Draw a simple sketch: power supply → controller → IB16 → OW4I."],
          vi: ["Khi tủ đã TẮT điện, tìm controller và đọc mã sản phẩm (catalog number) trên nhãn bên hông.", "Tìm module ngõ vào và ngõ ra. Ghi lại mã và số slot của từng cái.", "Tìm nguồn 24 VDC và dò dây tới chân MOD và SA power của controller.", "Tìm cáp Ethernet từ controller. Nó đi đâu?", "Vẽ sơ đồ đơn giản: nguồn → controller → IB16 → OW4I."] } }
      ] }
    ],
    quiz: [
      { q: { en: "What is the main advantage of a PLC over relay logic?", vi: "Ưu điểm chính của PLC so với mạch rơ-le là gì?" }, opts: { en: ["It uses higher voltage", "Logic can be changed in software without rewiring", "It needs no input wiring", "It never fails"], vi: ["Dùng điện áp cao hơn", "Thay đổi logic bằng phần mềm mà không cần đi dây lại", "Không cần đi dây ngõ vào", "Không bao giờ hỏng"] }, a: 1, why: { en: "Field devices are still wired, but the logic between them is a program you can edit.", vi: "Thiết bị hiện trường vẫn đi dây, nhưng logic ở giữa là chương trình có thể sửa được." } },
      { q: { en: "What is the correct order of the scan cycle?", vi: "Thứ tự đúng của chu kỳ quét là gì?" }, opts: { en: ["Write outputs → read inputs → run logic", "Run logic → read inputs → write outputs", "Read inputs → run logic → write outputs", "Read inputs → write outputs → run logic"], vi: ["Ghi ngõ ra → đọc ngõ vào → chạy logic", "Chạy logic → đọc ngõ vào → ghi ngõ ra", "Đọc ngõ vào → chạy logic → ghi ngõ ra", "Đọc ngõ vào → ghi ngõ ra → chạy logic"] }, a: 2, why: { en: "The PLC reads the inputs, solves the logic top to bottom, then updates the outputs.", vi: "PLC đọc ngõ vào, giải logic từ trên xuống, rồi cập nhật ngõ ra." } },
      { q: { en: "Which software programs a CompactLogix 5380?", vi: "Phần mềm nào dùng để lập trình CompactLogix 5380?" }, opts: { en: ["Connected Components Workbench", "RSLogix 500", "Studio 5000 Logix Designer", "C-More Programming Software"], vi: ["Connected Components Workbench", "RSLogix 500", "Studio 5000 Logix Designer", "C-More Programming Software"] }, a: 2, why: { en: "CompactLogix and ControlLogix are both programmed in Studio 5000 Logix Designer.", vi: "CompactLogix và ControlLogix đều lập trình bằng Studio 5000 Logix Designer." } },
      { q: { en: "On the kit, what is the 5069-OW4I?", vi: "Trên kit, 5069-OW4I là gì?" }, opts: { en: ["The controller", "A 16-point input module", "A 4-point isolated relay output module", "The power supply"], vi: ["Controller", "Module 16 ngõ vào", "Module 4 ngõ ra rơ-le cách ly", "Bộ nguồn"] }, a: 2, why: { en: "OW4I = Output, relay (W), 4 points, Isolated.", vi: "OW4I = Output, rơ-le (W), 4 điểm, cách ly (Isolated)." } },
      { q: { en: "Which part of the PLC runs the program?", vi: "Bộ phận nào của PLC chạy chương trình?" }, opts: { en: ["Input module", "CPU / controller", "Output module", "Terminal block"], vi: ["Module ngõ vào", "CPU / controller", "Module ngõ ra", "Cầu đấu (terminal block)"] }, a: 1, why: { en: "The controller (CPU) executes the logic and holds the tag memory.", vi: "Controller (CPU) thực thi logic và lưu bộ nhớ tag." } }
    ]
  },
  /* ---------- c-plc-io ---------- */
  {
    id: "c-plc-io",
    title: { en: "PLC I/O & Wiring", vi: "I/O và đi dây PLC" },
    summary: { en: "Discrete and analog signals, sinking vs sourcing, and wiring the kit's input and output modules.", vi: "Tín hiệu số (discrete) và analog, sinking và sourcing, cách đi dây module ngõ vào và ngõ ra trên kit." },
    level: "Beginner", minutes: 60,
    lessons: [
      { id: "l1", title: { en: "Discrete and Analog Signals", vi: "Tín hiệu discrete và analog" }, minutes: 15, blocks: [
        { t: "p", en: "A **discrete** signal is ON or OFF (1 or 0). An **analog** signal is a range of values, like a tank level from 0 to 100%.", vi: "Tín hiệu **discrete (số)** chỉ có BẬT hoặc TẮT (1 hoặc 0). Tín hiệu **analog** là một dải giá trị, ví dụ mức bồn từ 0 đến 100%." },
        { t: "table",
          head: { en: ["Type", "Signal", "Examples"], vi: ["Loại", "Tín hiệu", "Ví dụ"] },
          rows: {
            en: [["Discrete input", "24 VDC on/off", "Pushbutton, limit switch, prox sensor"], ["Discrete output", "Relay or 24 VDC on/off", "Pilot light, contactor coil, solenoid"], ["Analog input", "4-20 mA or 0-10 V", "Pressure, level, temperature transmitter"], ["Analog output", "4-20 mA or 0-10 V", "VFD speed reference, control valve"]],
            vi: [["Ngõ vào discrete", "24 VDC bật/tắt", "Nút nhấn, công tắc hành trình, cảm biến tiệm cận"], ["Ngõ ra discrete", "Rơ-le hoặc 24 VDC bật/tắt", "Đèn báo, cuộn contactor, van điện từ"], ["Ngõ vào analog", "4-20 mA hoặc 0-10 V", "Cảm biến áp suất, mức, nhiệt độ"], ["Ngõ ra analog", "4-20 mA hoặc 0-10 V", "Tốc độ biến tần (VFD), van điều khiển"]]
          } },
        { t: "callout", kind: "tip", en: "Why 4-20 mA and not 0-20 mA? A live zero. If you read 0 mA, you know the wire is broken. 4 mA means a real 0%.", vi: "Tại sao 4-20 mA mà không phải 0-20 mA? Vì có \"live zero\". Nếu đọc được 0 mA thì biết dây bị đứt. 4 mA mới là 0% thật." },
        { t: "table",
          head: { en: ["mA", "Percent"], vi: ["mA", "Phần trăm"] },
          rows: { en: [["4", "0%"], ["8", "25%"], ["12", "50%"], ["16", "75%"], ["20", "100%"]], vi: [["4", "0%"], ["8", "25%"], ["12", "50%"], ["16", "75%"], ["20", "100%"]] } }
      ] },
      { id: "l2", title: { en: "Sinking vs Sourcing", vi: "Sinking và Sourcing" }, minutes: 20, blocks: [
        { t: "p", en: "For DC I/O, current must flow in a loop. **Sourcing** means the device supplies +24 V. **Sinking** means the device connects to 0 V (common). A sourcing sensor (PNP) pairs with a sinking input card.", vi: "Với I/O DC, dòng điện phải chạy thành vòng kín. **Sourcing** là thiết bị cấp +24 V. **Sinking** là thiết bị nối về 0 V (chân chung). Cảm biến sourcing (PNP) đi với card ngõ vào sinking." },
        { t: "widget", name: "sinksource" },
        { t: "table",
          head: { en: ["Sensor", "Output switches", "Needs input card"], vi: ["Cảm biến", "Ngõ ra đóng cắt", "Cần card ngõ vào"] },
          rows: { en: [["PNP", "+24 V (sourcing)", "Sinking"], ["NPN", "0 V (sinking)", "Sourcing"]], vi: [["PNP", "+24 V (sourcing)", "Sinking"], ["NPN", "0 V (sinking)", "Sourcing"]] } },
        { t: "callout", kind: "kit", en: "The **5069-IB16** is a **sinking** input module. So use pushbuttons wired from +24 V, and **PNP** sensors. The input common goes to 0 V.", vi: "**5069-IB16** là module ngõ vào **sinking**. Vì vậy dùng nút nhấn đi từ +24 V, và cảm biến **PNP**. Chân chung của ngõ vào nối về 0 V." },
        { t: "callout", kind: "warn", en: "Wrong pairing (NPN sensor on a sinking card) will not damage the card, but the input will never turn on. Check the sensor label before you wire.", vi: "Ghép sai (cảm biến NPN vào card sinking) không làm hỏng card, nhưng ngõ vào sẽ không bao giờ lên. Kiểm tra nhãn cảm biến trước khi đi dây." }
      ] },
      { id: "l3", title: { en: "Wiring the Kit Modules & I/O Addresses", vi: "Đi dây module trên kit & địa chỉ I/O" }, minutes: 25, blocks: [
        { t: "h", en: "Module power vs field power", vi: "Nguồn module và nguồn hiện trường" },
        { t: "list", en: ["**MOD power**: powers the controller and module electronics through the backplane.", "**SA (sensor/actuator) power**: field-side power for devices on the 5069 modules.", "Keep them on separate fused circuits so a shorted sensor does not drop the whole PLC."], vi: ["**MOD power**: cấp nguồn cho controller và mạch điện tử của module qua backplane.", "**SA power (sensor/actuator)**: nguồn phía hiện trường cho thiết bị trên module 5069.", "Để chúng trên mạch có cầu chì riêng, để cảm biến bị chập không làm sập cả PLC."] },
        { t: "h", en: "Relay outputs (5069-OW4I)", vi: "Ngõ ra rơ-le (5069-OW4I)" },
        { t: "p", en: "Each relay is a dry contact with its own two terminals. You bring the voltage: 120 VAC for a pilot light or contactor coil, or 24 VDC for an interposing relay. Because each point is isolated, different points can switch different voltages.", vi: "Mỗi rơ-le là một tiếp điểm khô (dry contact) có hai chân riêng. Bạn tự đưa điện áp vào: 120 VAC cho đèn báo hoặc cuộn contactor, hoặc 24 VDC cho rơ-le trung gian. Vì mỗi điểm cách ly nên mỗi điểm có thể đóng cắt điện áp khác nhau." },
        { t: "h", en: "I/O addresses in Studio 5000", vi: "Địa chỉ I/O trong Studio 5000" },
        { t: "table",
          head: { en: ["Device", "Wired to", "Tag address"], vi: ["Thiết bị", "Đấu vào", "Địa chỉ tag"] },
          rows: {
            en: [["Start PB (green)", "IB16 point 0", "Local:1:I.Pt00.Data"], ["Stop PB (red, NC)", "IB16 point 1", "Local:1:I.Pt01.Data"], ["Motor run light", "OW4I point 0", "Local:2:O.Pt00.Data"], ["Contactor coil M1", "OW4I point 1", "Local:2:O.Pt01.Data"]],
            vi: [["Nút Start (xanh)", "IB16 điểm 0", "Local:1:I.Pt00.Data"], ["Nút Stop (đỏ, NC)", "IB16 điểm 1", "Local:1:I.Pt01.Data"], ["Đèn motor chạy", "OW4I điểm 0", "Local:2:O.Pt00.Data"], ["Cuộn contactor M1", "OW4I điểm 1", "Local:2:O.Pt01.Data"]]
          } },
        { t: "p", en: "Read it as **Local** (same chassis) : **slot** : **I/O** . point. Older 1769 CompactLogix uses `Local:1:I.Data.0` style. 5069 modules use `Pt00.Data`.", vi: "Đọc là **Local** (cùng chassis) : **slot** : **I/O** . điểm. CompactLogix 1769 cũ dùng kiểu `Local:1:I.Data.0`. Module 5069 dùng `Pt00.Data`." },
        { t: "callout", kind: "tip", en: "Always build an **I/O list** first: tag name, description, module, point, wire number, device. It becomes your drawing, your program and your checkout sheet.", vi: "Luôn lập **I/O list** trước: tên tag, mô tả, module, điểm, số dây, thiết bị. Nó sẽ là bản vẽ, chương trình và phiếu kiểm tra của bạn." },
        { t: "lab", title: { en: "Wire and test 2 inputs and 2 outputs", vi: "Đi dây và test 2 ngõ vào, 2 ngõ ra" }, steps: {
          en: ["Lock out the trainee panel. Verify 0 V with your meter.", "Wire Start PB (NO) from +24 V to IB16 point 0. Wire Stop PB (NC) from +24 V to IB16 point 1.", "Wire the IB16 input common to 0 V.", "Wire OW4I point 0: 120 VAC hot → relay contact → green pilot light → neutral.", "Fill in the I/O list for these 4 points with wire numbers.", "Instructor checks your wiring, then power up. Press each button and watch the IB16 status LED turn on."],
          vi: ["Khóa an toàn (lock out) tủ trainee. Đo xác nhận 0 V bằng đồng hồ.", "Đấu nút Start (NO) từ +24 V vào IB16 điểm 0. Đấu nút Stop (NC) từ +24 V vào IB16 điểm 1.", "Đấu chân chung ngõ vào IB16 về 0 V.", "Đấu OW4I điểm 0: dây nóng 120 VAC → tiếp điểm rơ-le → đèn báo xanh → dây trung tính.", "Điền I/O list cho 4 điểm này kèm số dây.", "Giáo viên kiểm tra dây rồi mới cấp điện. Nhấn từng nút và xem đèn LED trạng thái trên IB16 sáng."] } }
      ] }
    ],
    quiz: [
      { q: { en: "A tank level transmitter sends a value from 0 to 100%. What signal type is this?", vi: "Cảm biến mức bồn gửi giá trị từ 0 đến 100%. Đây là loại tín hiệu gì?" }, opts: { en: ["Discrete", "Analog", "Relay", "Digital output"], vi: ["Discrete", "Analog", "Rơ-le", "Ngõ ra số"] }, a: 1, why: { en: "A range of values is analog, usually 4-20 mA.", vi: "Dải giá trị là analog, thường là 4-20 mA." } },
      { q: { en: "On a 4-20 mA loop, the PLC reads 12 mA. What percent is that?", vi: "Trên vòng 4-20 mA, PLC đọc được 12 mA. Đó là bao nhiêu phần trăm?" }, opts: { en: ["25%", "50%", "60%", "75%"], vi: ["25%", "50%", "60%", "75%"] }, a: 1, why: { en: "(12 − 4) / (20 − 4) = 8 / 16 = 50%.", vi: "(12 − 4) / (20 − 4) = 8 / 16 = 50%." } },
      { q: { en: "The 5069-IB16 is a sinking input card. Which sensor type should you use?", vi: "5069-IB16 là card ngõ vào sinking. Nên dùng loại cảm biến nào?" }, opts: { en: ["NPN", "PNP", "Either one", "Only 120 VAC sensors"], vi: ["NPN", "PNP", "Loại nào cũng được", "Chỉ cảm biến 120 VAC"] }, a: 1, why: { en: "A sinking input needs a sourcing device. PNP sensors source +24 V.", vi: "Ngõ vào sinking cần thiết bị sourcing. Cảm biến PNP cấp ra +24 V." } },
      { q: { en: "What does Local:2:O.Pt01.Data point to?", vi: "Local:2:O.Pt01.Data chỉ tới đâu?" }, opts: { en: ["Input point 2 in slot 1", "Output point 1 in slot 2", "Output point 2 in slot 1", "Controller slot 2"], vi: ["Ngõ vào điểm 2 ở slot 1", "Ngõ ra điểm 1 ở slot 2", "Ngõ ra điểm 2 ở slot 1", "Controller slot 2"] }, a: 1, why: { en: "Local : slot 2 : Output . point 01.", vi: "Local : slot 2 : Output (ngõ ra) . điểm 01." } },
      { q: { en: "Why is 4 mA used as zero instead of 0 mA?", vi: "Tại sao dùng 4 mA làm mức 0 thay vì 0 mA?" }, opts: { en: ["It saves power", "So a broken wire (0 mA) can be detected", "Because PLCs cannot read 0 mA", "It is a Rockwell rule only"], vi: ["Để tiết kiệm điện", "Để phát hiện dây đứt (0 mA)", "Vì PLC không đọc được 0 mA", "Đó chỉ là quy định của Rockwell"] }, a: 1, why: { en: "A live zero lets you tell the difference between 0% and a broken loop.", vi: "Live zero giúp phân biệt giữa 0% và vòng dây bị đứt." } }
    ]
  },
  /* ---------- c-data ---------- */
  {
    id: "c-data",
    title: { en: "Numbers & Data Types", vi: "Số và kiểu dữ liệu" },
    summary: { en: "Binary, decimal and hex, plus the Logix data types you will use every day.", vi: "Hệ nhị phân, thập phân, thập lục phân và các kiểu dữ liệu Logix dùng hằng ngày." },
    level: "Beginner", minutes: 45,
    lessons: [
      { id: "l1", title: { en: "Binary, Decimal and Hex", vi: "Nhị phân, thập phân và hex" }, minutes: 15, blocks: [
        { t: "p", en: "A PLC stores everything as **bits** (0 or 1). Group bits together and you get numbers. Each bit position is worth double the one to its right: 1, 2, 4, 8, 16...", vi: "PLC lưu mọi thứ dưới dạng **bit** (0 hoặc 1). Ghép các bit lại thành số. Mỗi vị trí bit có giá trị gấp đôi bit bên phải: 1, 2, 4, 8, 16..." },
        { t: "table",
          head: { en: ["Binary", "Decimal", "Hex"], vi: ["Nhị phân", "Thập phân", "Hex"] },
          rows: { en: [["0000 0101", "5", "16#05"], ["0000 1010", "10", "16#0A"], ["0000 1111", "15", "16#0F"], ["1111 1111", "255", "16#FF"]], vi: [["0000 0101", "5", "16#05"], ["0000 1010", "10", "16#0A"], ["0000 1111", "15", "16#0F"], ["1111 1111", "255", "16#FF"]] } },
        { t: "widget", name: "binary" },
        { t: "callout", kind: "tip", en: "In Studio 5000, `2#` means binary and `16#` means hex. Example: `2#0101` = 5, `16#FF` = 255. Change the Style column in the tag monitor to view a tag either way.", vi: "Trong Studio 5000, `2#` là nhị phân và `16#` là hex. Ví dụ: `2#0101` = 5, `16#FF` = 255. Đổi cột Style trong tag monitor để xem tag theo kiểu khác." }
      ] },
      { id: "l2", title: { en: "Logix Data Types", vi: "Các kiểu dữ liệu Logix" }, minutes: 15, blocks: [
        { t: "table",
          head: { en: ["Type", "Bits", "Range / use"], vi: ["Kiểu", "Số bit", "Dải / công dụng"] },
          rows: {
            en: [["BOOL", "1", "0 or 1 — buttons, lights, flags"], ["SINT", "8", "−128 to 127"], ["INT", "16", "−32,768 to 32,767"], ["DINT", "32", "About ±2.1 billion — use for counts and integers"], ["REAL", "32", "Decimal numbers: 72.5 °F, 3.14"], ["STRING", "82 chars", "Text: recipe names, messages"], ["TIMER / COUNTER", "structure", "Has .PRE, .ACC, .DN and more"]],
            vi: [["BOOL", "1", "0 hoặc 1 — nút nhấn, đèn, cờ"], ["SINT", "8", "−128 đến 127"], ["INT", "16", "−32.768 đến 32.767"], ["DINT", "32", "Khoảng ±2,1 tỷ — dùng cho số đếm, số nguyên"], ["REAL", "32", "Số thập phân: 72.5 °F, 3.14"], ["STRING", "82 ký tự", "Chữ: tên công thức, thông báo"], ["TIMER / COUNTER", "cấu trúc", "Có .PRE, .ACC, .DN và các thành phần khác"]]
          } },
        { t: "callout", kind: "tip", en: "Logix controllers are 32-bit. **Use DINT for integers** unless a device forces you to use INT. It is faster and avoids conversion problems.", vi: "Controller Logix là loại 32-bit. **Dùng DINT cho số nguyên** trừ khi thiết bị bắt buộc dùng INT. Nhanh hơn và tránh lỗi chuyển đổi." },
        { t: "p", en: "REAL can hold decimals but is not perfectly exact. Never compare two REALs with EQU. Use GRT/LES or a small window with LIM.", vi: "REAL chứa được số thập phân nhưng không chính xác tuyệt đối. Đừng bao giờ so sánh hai REAL bằng EQU. Dùng GRT/LES hoặc một khoảng nhỏ với LIM." }

      { id: "l3", title: { en: "Arrays and Bits Inside a DINT", vi: "Mảng và bit bên trong DINT" }, minutes: 15, blocks: [
        { t: "p", en: "An **array** is a list of the same type. `Temp[10]` of REAL gives you `Temp[0]` to `Temp[9]`. Arrays start at 0.", vi: "**Mảng (array)** là danh sách cùng một kiểu. `Temp[10]` kiểu REAL cho bạn `Temp[0]` đến `Temp[9]`. Mảng bắt đầu từ 0." },
        { t: "p", en: "You can reach any single bit inside a DINT with a dot: `Alarms.5` is bit 5 of the DINT `Alarms`. A DINT holds 32 bits, numbered 0 to 31.", vi: "Bạn có thể truy cập từng bit trong DINT bằng dấu chấm: `Alarms.5` là bit 5 của DINT `Alarms`. Một DINT có 32 bit, đánh số từ 0 đến 31." },
        { t: "ladder", rungs: [
          { comment: { en: "High level sets alarm bit 5", vi: "Mức cao bật bit cảnh báo số 5" }, els: [ { k: "XIC", tag: "Tank_High_LS" }, { k: "OTE", tag: "Alarms.5" } ] },
          { comment: { en: "Any alarm active? A DINT is not 0 when any bit is on", vi: "Có cảnh báo nào không? DINT khác 0 khi có bit nào bật" }, els: [ { k: "NEQ", tag: "Alarms", params: [["Source A", "Alarms"], ["Source B", "0"]] }, { k: "OTE", tag: "Alarm_Horn" } ] }
        ] },
        { t: "callout", kind: "tip", en: "Packing 32 alarms into one DINT makes it easy to send them to an HMI in a single tag.", vi: "Gói 32 cảnh báo vào một DINT giúp gửi lên HMI chỉ bằng một tag." },
        { t: "lab", title: { en: "Explore data types on the kit", vi: "Thực hành kiểu dữ liệu trên kit" }, steps: {
          en: ["Go online with the kit controller.", "Create tags: `Test_Dint` (DINT), `Test_Real` (REAL), `Recipe[5]` (DINT array).", "In the Monitor Tags view, type 255 into Test_Dint. Change Style to Binary, then Hex. Compare with the binary widget.", "Set bit `Test_Dint.0` to 0. What is the decimal value now?", "Write 72.5 into Test_Real. Try writing 72.5 into Test_Dint. What happens?"],
          vi: ["Online với controller của kit.", "Tạo tag: `Test_Dint` (DINT), `Test_Real` (REAL), `Recipe[5]` (mảng DINT).", "Trong Monitor Tags, nhập 255 vào Test_Dint. Đổi Style sang Binary rồi Hex. So sánh với công cụ binary.", "Đặt bit `Test_Dint.0` về 0. Giá trị thập phân bây giờ là bao nhiêu?", "Ghi 72.5 vào Test_Real. Thử ghi 72.5 vào Test_Dint. Chuyện gì xảy ra?"] } }
      ] }

    quiz: [
      { q: { en: "What is binary 0000 1010 in decimal?", vi: "Số nhị phân 0000 1010 bằng bao nhiêu thập phân?" }, opts: { en: ["8", "10", "12", "20"], vi: ["8", "10", "12", "20"] }, a: 1, why: { en: "Bit 3 (8) + bit 1 (2) = 10.", vi: "Bit 3 (8) + bit 1 (2) = 10." } },
      { q: { en: "Which data type should you use for a temperature like 72.5 °F?", vi: "Kiểu dữ liệu nào dùng cho nhiệt độ như 72.5 °F?" }, opts: { en: ["BOOL", "DINT", "REAL", "STRING"], vi: ["BOOL", "DINT", "REAL", "STRING"] }, a: 2, why: { en: "REAL holds decimal numbers.", vi: "REAL chứa số thập phân." } },
      { q: { en: "What is 16#FF in decimal?", vi: "16#FF bằng bao nhiêu thập phân?" }, opts: { en: ["16", "100", "255", "256"], vi: ["16", "100", "255", "256"] }, a: 2, why: { en: "F = 15. 15 × 16 + 15 = 255.", vi: "F = 15. 15 × 16 + 15 = 255." } },
      { q: { en: "How many bits are in a DINT?", vi: "DINT có bao nhiêu bit?" }, opts: { en: ["8", "16", "32", "64"], vi: ["8", "16", "32", "64"] }, a: 2, why: { en: "DINT = Double INTeger = 32 bits, numbered 0 to 31.", vi: "DINT = Double INTeger = 32 bit, đánh số từ 0 đến 31." } },
      { q: { en: "An array tag is Speed[8]. What is the last valid element?", vi: "Tag mảng là Speed[8]. Phần tử cuối cùng hợp lệ là gì?" }, opts: { en: ["Speed[8]", "Speed[7]", "Speed[9]", "Speed[1]"], vi: ["Speed[8]", "Speed[7]", "Speed[9]", "Speed[1]"] }, a: 1, why: { en: "Arrays start at 0, so 8 elements are [0] to [7].", vi: "Mảng bắt đầu từ 0, nên 8 phần tử là [0] đến [7]." } }

        ] },
        { t: "widget", name: "sealin" },
        { t: "h", en: "OTL / OTU — latch and unlatch", vi: "OTL / OTU — chốt và nhả" },
        { t: "ladder", rungs: [
          { els: [ { k: "XIC", tag: "Start_PB" }, { k: "OTL", tag: "Pump_Run" } ] },
          { els: [ { k: "XIO", tag: "Stop_PB_NC" }, { k: "OTU", tag: "Pump_Run" } ] }
        ] },
        { t: "callout", kind: "warn", en: "A latched bit **stays on after a power cycle**. A motor started with OTL can restart by itself when power comes back. Use the seal-in circuit for motors.", vi: "Bit đã latch **vẫn giữ nguyên sau khi mất điện rồi có lại**. Motor bật bằng OTL có thể tự chạy lại khi có điện. Dùng mạch tự giữ cho motor." },
        { t: "h", en: "ONS — one-shot", vi: "ONS — one-shot (xung một lần)" },
        { t: "p", en: "ONS makes the rung true for **one scan only** when the condition goes from false to true. Use it to count a part once, not thousands of times while the sensor stays on.", vi: "ONS làm rung đúng **chỉ trong một scan** khi điều kiện chuyển từ sai sang đúng. Dùng để đếm sản phẩm một lần, chứ không đếm hàng ngàn lần khi cảm biến vẫn đang ON." },
        { t: "ladder", rungs: [
          { els: [ { k: "XIC", tag: "Part_Eye" }, { k: "ONS", tag: "Part_Eye_ONS" }, { k: "ADD", tag: "Part_Count", params: [["Source A", "Part_Count"], ["Source B", "1"], ["Dest", "Part_Count"]] } ] }
        ] }
      ] },
      { id: "l3", title: { en: "Timers: TON, TOF and RTO", vi: "Timer: TON, TOF và RTO" }, minutes: 25, blocks: [
        { t: "table",
          head: { en: ["Timer", "Behavior", "Example"], vi: ["Timer", "Hoạt động", "Ví dụ"] },
          rows: {
            en: [["TON", "On-delay: counts while rung is true, .DN after preset", "Start horn 5 s before conveyor"], ["TOF", "Off-delay: .DN stays on for preset after rung goes false", "Cooling fan runs 60 s after motor stops"], ["RTO", "Retentive: keeps ACC when rung goes false; needs RES", "Motor run-hours"]],
            vi: [["TON", "Trễ đóng: đếm khi rung đúng, .DN bật khi tới preset", "Còi báo 5 giây trước khi băng tải chạy"], ["TOF", "Trễ ngắt: .DN giữ ON thêm thời gian preset sau khi rung sai", "Quạt làm mát chạy thêm 60 giây sau khi motor dừng"], ["RTO", "Có nhớ: giữ ACC khi rung sai; cần RES để xóa", "Đếm giờ chạy motor"]]
          } },
        { t: "p", en: "Logix timers count in **milliseconds**. Preset 5000 = 5 seconds. Key bits: **.EN** (rung true), **.TT** (timing), **.DN** (done).", vi: "Timer Logix đếm bằng **mili-giây**. Preset 5000 = 5 giây. Các bit chính: **.EN** (rung đúng), **.TT** (đang đếm), **.DN** (xong)." },
        { t: "widget", name: "ton" },
        { t: "ladder", rungs: [
          { comment: { en: "Warning horn for 5 s, then start the conveyor", vi: "Còi cảnh báo 5 giây, rồi chạy băng tải" }, els: [ { k: "XIC", tag: "Conv_Start_Req" }, { k: "TON", tag: "Horn_Timer", params: [["Preset", "5000"], ["Accum", "0"]] } ] },
          { els: [ { k: "XIC", tag: "Horn_Timer.TT" }, { k: "OTE", tag: "Warning_Horn" } ] },
          { els: [ { k: "XIC", tag: "Horn_Timer.DN" }, { k: "OTE", tag: "Conveyor_Run" } ] }
        ] }
      ] },
      { id: "l4", title: { en: "Counters: CTU, CTD and RES", vi: "Counter: CTU, CTD và RES" }, minutes: 20, blocks: [
        { t: "p", en: "**CTU** adds 1 to .ACC each time the rung goes false → true. **CTD** subtracts 1. When ACC ≥ PRE, **.DN** turns on. **RES** resets ACC to 0.", vi: "**CTU** cộng 1 vào .ACC mỗi lần rung chuyển sai → đúng. **CTD** trừ 1. Khi ACC ≥ PRE, **.DN** bật. **RES** đưa ACC về 0." },
        { t: "widget", name: "ctu" },
        { t: "ladder", rungs: [
          { comment: { en: "Count boxes, 12 per case", vi: "Đếm hộp, 12 hộp một thùng" }, els: [ { k: "XIC", tag: "Box_Eye" }, { k: "CTU", tag: "Box_Count", params: [["Preset", "12"], ["Accum", "0"]] } ] },
          { els: [ { k: "XIC", tag: "Box_Count.DN" }, { k: "OTE", tag: "Case_Full_Light" } ] },
          { els: [ { k: "BR", rows: [ [ { k: "XIC", tag: "Reset_PB" } ], [ { k: "XIC", tag: "Case_Removed" } ] ] }, { k: "RES", tag: "Box_Count" } ] }
        ] },
        { t: "callout", kind: "kit", en: "On the kit, use the green Start button as a fake 'part sensor' and the red pilot light as 'case full'.", vi: "Trên kit, dùng nút Start xanh làm \"cảm biến sản phẩm\" giả và đèn báo đỏ làm \"thùng đầy\"." },
        { t: "lab", title: { en: "Motor control with horn and counter", vi: "Điều khiển motor có còi và bộ đếm" }, steps: {
          en: ["Map tags as aliases: `Start_PB` → IB16 Pt00, `Stop_PB_NC` → IB16 Pt01, `Run_Light` → OW4I Pt00, `Horn` → OW4I Pt02.", "Write the seal-in rung for `Motor_Run` with Start, Stop and `OL_OK`.", "Add a TON so the horn sounds 3 s before `Run_Light` turns on.", "Add a CTU that counts motor starts. Show the count in Monitor Tags.", "Download and test: Start, Stop, then press Start 5 times. Does the count read 5?", "Bonus: turn on a light when the count reaches 10, and RES with a long press of Stop (TON 2 s)."],
          vi: ["Tạo tag alias: `Start_PB` → IB16 Pt00, `Stop_PB_NC` → IB16 Pt01, `Run_Light` → OW4I Pt00, `Horn` → OW4I Pt02.", "Viết rung tự giữ cho `Motor_Run` với Start, Stop và `OL_OK`.", "Thêm TON để còi kêu 3 giây trước khi `Run_Light` sáng.", "Thêm CTU đếm số lần khởi động motor. Xem số đếm trong Monitor Tags.", "Download và test: Start, Stop, rồi nhấn Start 5 lần. Số đếm có bằng 5 không?", "Thêm: bật đèn khi đếm tới 10, và RES bằng cách nhấn giữ Stop (TON 2 giây)."] } }
      ] }
    ],
    quiz: [
      { q: { en: "The Stop button is wired NC. Which instruction do you use for it in the motor rung?", vi: "Nút Stop đấu kiểu NC. Dùng lệnh nào cho nó trong rung motor?" }, opts: { en: ["XIO", "XIC", "OTU", "ONS"], vi: ["XIO", "XIC", "OTU", "ONS"] }, a: 1, why: { en: "A NC button makes the input 1 when not pressed, so XIC is true until Stop is pressed. This is also fail-safe if the wire breaks.", vi: "Nút NC làm ngõ vào = 1 khi không nhấn, nên XIC đúng cho tới khi nhấn Stop. Cách này cũng an toàn khi đứt dây." } },
      { q: { en: "Two contacts in parallel (a branch) act like which logic?", vi: "Hai tiếp điểm song song (branch) hoạt động như logic gì?" }, opts: { en: ["AND", "OR", "NOT", "XOR"], vi: ["AND", "OR", "NOT", "XOR"] }, a: 1, why: { en: "Either path being true makes the rung true.", vi: "Chỉ cần một nhánh đúng là rung đúng." } },
      { q: { en: "A TON has Preset 5000. How long is the delay?", vi: "TON có Preset 5000. Thời gian trễ là bao lâu?" }, opts: { en: ["5 ms", "0.5 s", "5 s", "50 s"], vi: ["5 ms", "0,5 giây", "5 giây", "50 giây"] }, a: 2, why: { en: "Logix timers use milliseconds: 5000 ms = 5 s.", vi: "Timer Logix dùng mili-giây: 5000 ms = 5 giây." } },
      { q: { en: "Which timer keeps its accumulated value when the rung goes false?", vi: "Timer nào giữ giá trị tích lũy khi rung sai?" }, opts: { en: ["TON", "TOF", "RTO", "CTU"], vi: ["TON", "TOF", "RTO", "CTU"] }, a: 2, why: { en: "RTO is retentive and needs a RES to clear it.", vi: "RTO là timer có nhớ và cần RES để xóa." } },
      { q: { en: "Why use ONS before an ADD that counts parts?", vi: "Tại sao dùng ONS trước lệnh ADD để đếm sản phẩm?" }, opts: { en: ["To make it faster", "So it adds only once per part, not every scan", "To save memory", "ADD needs ONS to compile"], vi: ["Để nhanh hơn", "Để chỉ cộng một lần mỗi sản phẩm, không phải mỗi scan", "Để tiết kiệm bộ nhớ", "ADD cần ONS mới biên dịch được"] }, a: 1, why: { en: "Without ONS, ADD runs every scan while the sensor is on, adding hundreds of counts.", vi: "Không có ONS, ADD chạy mỗi scan khi cảm biến ON và cộng hàng trăm lần." } }
    ]
  },
  /* ---------- c-math ---------- */
  {
    id: "c-math",
    title: { en: "Compare, Math & Move", vi: "So sánh, Toán học & Di chuyển dữ liệu" },
    summary: { en: "Compare values, do math, move data and scale an analog signal into real units.", vi: "So sánh giá trị, tính toán, chuyển dữ liệu và scale tín hiệu analog ra đơn vị thật." },
    level: "Beginner", minutes: 60,
    lessons: [
      { id: "l1", title: { en: "Compare Instructions", vi: "Lệnh so sánh" }, minutes: 20, blocks: [
        { t: "table",
          head: { en: ["Instruction", "True when", "Example"], vi: ["Lệnh", "Đúng khi", "Ví dụ"] },
          rows: {
            en: [["EQU", "A = B", "Step = 3"], ["NEQ", "A ≠ B", "Alarms ≠ 0"], ["GRT / GEQ", "A > B / A ≥ B", "Pressure > 120 psi"], ["LES / LEQ", "A < B / A ≤ B", "Level < 10%"], ["LIM", "Low ≤ Test ≤ High", "Temp between 160 and 180 °F"]],
            vi: [["EQU", "A = B", "Step = 3"], ["NEQ", "A ≠ B", "Alarms ≠ 0"], ["GRT / GEQ", "A > B / A ≥ B", "Áp suất > 120 psi"], ["LES / LEQ", "A < B / A ≤ B", "Mức < 10%"], ["LIM", "Low ≤ Test ≤ High", "Nhiệt độ trong khoảng 160 đến 180 °F"]]
          } },
        { t: "ladder", rungs: [
          { comment: { en: "High pressure alarm", vi: "Cảnh báo áp suất cao" }, els: [ { k: "GRT", tag: "Pressure_PSI", params: [["Source A", "Pressure_PSI"], ["Source B", "120.0"]] }, { k: "OTE", tag: "Hi_Press_Alarm" } ] },
          { comment: { en: "Temperature in the good window", vi: "Nhiệt độ trong khoảng tốt" }, els: [ { k: "LIM", tag: "Oven_Temp", params: [["Low Limit", "160.0"], ["Test", "Oven_Temp"], ["High Limit", "180.0"]] }, { k: "OTE", tag: "Temp_OK" } ] }
        ] },
        { t: "callout", kind: "tip", en: "Compare instructions go on the **left** side of the rung, like contacts. They are conditions, not outputs.", vi: "Lệnh so sánh đặt ở **bên trái** rung, giống tiếp điểm. Chúng là điều kiện, không phải ngõ ra." }
      ] },
      { id: "l2", title: { en: "Move and Math", vi: "Move và tính toán" }, minutes: 20, blocks: [
        { t: "terms", items: [
          { term: { en: "MOV", vi: "MOV" }, def: { en: "Copies Source into Dest. Example: load a recipe speed.", vi: "Sao chép Source vào Dest. Ví dụ: nạp tốc độ theo công thức." } },
          { term: { en: "ADD / SUB / MUL / DIV", vi: "ADD / SUB / MUL / DIV" }, def: { en: "Dest = A + B, A − B, A × B, A ÷ B.", vi: "Dest = A + B, A − B, A × B, A ÷ B." } },
          { term: { en: "CPT", vi: "CPT" }, def: { en: "Compute: write a whole formula in one box, e.g. `(Raw - 4.0) * 6.25`.", vi: "Compute: viết cả công thức trong một ô, ví dụ `(Raw - 4.0) * 6.25`." } }
        ] },
        { t: "ladder", rungs: [
          { comment: { en: "Recipe 2 selected: load speed 45 Hz", vi: "Chọn công thức 2: nạp tốc độ 45 Hz" }, els: [ { k: "EQU", tag: "Recipe_No", params: [["Source A", "Recipe_No"], ["Source B", "2"]] }, { k: "MOV", tag: "Speed_SP", params: [["Source", "45.0"], ["Dest", "Speed_SP"]] } ] },
          { comment: { en: "Convert gallons to liters", vi: "Đổi gallon sang lít" }, els: [ { k: "MUL", tag: "Tank_Liters", params: [["Source A", "Tank_Gal"], ["Source B", "3.785"], ["Dest", "Tank_Liters"]] } ] },
          { comment: { en: "Fahrenheit to Celsius in one box", vi: "Đổi độ F sang độ C trong một ô" }, els: [ { k: "CPT", tag: "Temp_C", params: [["Dest", "Temp_C"], ["Expression", "(Temp_F - 32.0) / 1.8"]] } ] }
        ] },
        { t: "callout", kind: "warn", en: "DIV by zero causes a **minor fault** and an overflow. Check the divisor with NEQ 0 before you divide.", vi: "Chia cho 0 gây **minor fault** và tràn số. Kiểm tra số chia bằng NEQ 0 trước khi chia." }
      ] },
      { id: "l3", title: { en: "Scaling a 4-20 mA Tank Level with SCP", vi: "Scale mức bồn 4-20 mA bằng SCP" }, minutes: 20, blocks: [
        { t: "p", en: "An analog card gives you a raw number. **SCP (Scale with Parameters)** turns it into real units with a straight line: two points in, two points out.", vi: "Card analog cho bạn một con số thô (raw). **SCP (Scale with Parameters)** đổi nó ra đơn vị thật theo đường thẳng: hai điểm vào, hai điểm ra." },
        { t: "svg", svg: "<svg viewBox=\"0 0 360 200\"><line x1=\"50\" y1=\"170\" x2=\"340\" y2=\"170\" stroke=\"currentColor\"/><line x1=\"50\" y1=\"170\" x2=\"50\" y2=\"20\" stroke=\"currentColor\"/><line x1=\"80\" y1=\"160\" x2=\"310\" y2=\"35\" style=\"stroke:var(--accent)\" stroke-width=\"3\"/><circle cx=\"80\" cy=\"160\" r=\"5\" style=\"fill:var(--accent)\"/><circle cx=\"310\" cy=\"35\" r=\"5\" style=\"fill:var(--accent)\"/><text x=\"80\" y=\"188\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\">4 mA</text><text x=\"310\" y=\"188\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\">20 mA</text><text x=\"44\" y=\"164\" text-anchor=\"end\" font-size=\"12\" fill=\"currentColor\">0 ft</text><text x=\"44\" y=\"39\" text-anchor=\"end\" font-size=\"12\" fill=\"currentColor\">12 ft</text><text x=\"195\" y=\"110\" font-size=\"12\" fill=\"currentColor\">12 mA → 6 ft</text></svg>", cap: { en: "Linear scaling: 4-20 mA → 0-12 ft tank level", vi: "Scale tuyến tính: 4-20 mA → mức bồn 0-12 ft" } },
        { t: "ladder", rungs: [
          { comment: { en: "Scale tank level transmitter", vi: "Scale cảm biến mức bồn" }, els: [ { k: "SCP", tag: "Tank_Level_Ft", params: [["Input", "Tank_LT_mA"], ["Input Min", "4.0"], ["Input Max", "20.0"], ["Scaled Min", "0.0"], ["Scaled Max", "12.0"], ["Output", "Tank_Level_Ft"]] } ] },
          { comment: { en: "Low level: stop the pump", vi: "Mức thấp: dừng bơm" }, els: [ { k: "LES", tag: "Tank_Level_Ft", params: [["Source A", "Tank_Level_Ft"], ["Source B", "1.0"]] }, { k: "OTE", tag: "Low_Level_Stop" } ] }
        ] },
        { t: "callout", kind: "tip", en: "Many 5069 analog modules (like 5069-IF8) can scale to engineering units in the module setup. SCP is still the tool to know, and it works on any PLC value.", vi: "Nhiều module analog 5069 (như 5069-IF8) có thể scale ra đơn vị kỹ thuật trong phần cài đặt module. Nhưng SCP vẫn là công cụ phải biết, và dùng được cho mọi giá trị trong PLC." },
        { t: "lab", title: { en: "Fake tank level on the kit", vi: "Mô phỏng mức bồn trên kit" }, steps: {
          en: ["Create REAL tags `Tank_LT_mA` and `Tank_Level_Ft`.", "Write the SCP rung: 4-20 mA → 0-12 ft.", "Add LES < 1.0 ft → `Low_Level_Light` (OW4I Pt00) and GRT > 11.0 ft → `High_Level_Light` (OW4I Pt01).", "Go online. Type values into `Tank_LT_mA`: 4, 8, 12, 19.5. Check the level and the lights.", "What level do you get at 2 mA? Why is that a problem? Add a `Sensor_Fault` bit when mA < 3.6."],
          vi: ["Tạo tag REAL `Tank_LT_mA` và `Tank_Level_Ft`.", "Viết rung SCP: 4-20 mA → 0-12 ft.", "Thêm LES < 1.0 ft → `Low_Level_Light` (OW4I Pt00) và GRT > 11.0 ft → `High_Level_Light` (OW4I Pt01).", "Online. Nhập giá trị vào `Tank_LT_mA`: 4, 8, 12, 19.5. Kiểm tra mức và đèn.", "Ở 2 mA thì ra mức bao nhiêu? Tại sao đó là vấn đề? Thêm bit `Sensor_Fault` khi mA < 3.6."] } }
      ] }
    ],
    quiz: [
      { q: { en: "Which instruction is true when a value is between a low and a high limit?", vi: "Lệnh nào đúng khi giá trị nằm giữa giới hạn thấp và cao?" }, opts: { en: ["EQU", "LIM", "MOV", "SCP"], vi: ["EQU", "LIM", "MOV", "SCP"] }, a: 1, why: { en: "LIM checks Low ≤ Test ≤ High.", vi: "LIM kiểm tra Low ≤ Test ≤ High." } },
      { q: { en: "SCP: 4-20 mA → 0-12 ft. The input is 12 mA. What is the output?", vi: "SCP: 4-20 mA → 0-12 ft. Ngõ vào là 12 mA. Ngõ ra là bao nhiêu?" }, opts: { en: ["4 ft", "6 ft", "8 ft", "12 ft"], vi: ["4 ft", "6 ft", "8 ft", "12 ft"] }, a: 1, why: { en: "12 mA is halfway between 4 and 20, so halfway between 0 and 12 ft = 6 ft.", vi: "12 mA nằm giữa 4 và 20, nên ra giữa 0 và 12 ft = 6 ft." } },
      { q: { en: "Which instruction copies a value into another tag?", vi: "Lệnh nào sao chép giá trị sang tag khác?" }, opts: { en: ["CPT", "MOV", "EQU", "ADD"], vi: ["CPT", "MOV", "EQU", "ADD"] }, a: 1, why: { en: "MOV copies Source to Dest.", vi: "MOV sao chép Source sang Dest." } },
      { q: { en: "Where do compare instructions go on a rung?", vi: "Lệnh so sánh đặt ở đâu trên rung?" }, opts: { en: ["Right side, as outputs", "Left side, as conditions", "Only in Structured Text", "Anywhere"], vi: ["Bên phải, như ngõ ra", "Bên trái, như điều kiện", "Chỉ trong Structured Text", "Đâu cũng được"] }, a: 1, why: { en: "Compares are input-type instructions, like contacts.", vi: "Lệnh so sánh là lệnh kiểu điều kiện, giống tiếp điểm." } },
      { q: { en: "What happens if you DIV by zero?", vi: "Chuyện gì xảy ra nếu DIV chia cho 0?" }, opts: { en: ["Nothing", "The controller turns off", "A minor fault / overflow", "Result is always 0 with no warning"], vi: ["Không có gì", "Controller tắt", "Minor fault / tràn số", "Kết quả luôn là 0 không cảnh báo"] }, a: 2, why: { en: "Divide by zero sets an overflow and logs a minor fault. Guard it with NEQ 0.", vi: "Chia cho 0 gây tràn số và ghi minor fault. Chặn bằng NEQ 0." } }
    ]
  },
  /* ---------- c-tags-aoi ---------- */
  {
    id: "c-tags-aoi",
    title: { en: "Tags, UDTs, AOIs & Structured Text", vi: "Tag, UDT, AOI & Structured Text" },
    summary: { en: "Organize data like a pro: tag scope, aliases, UDTs, reusable AOIs and Structured Text basics.", vi: "Tổ chức dữ liệu chuyên nghiệp: phạm vi tag, alias, UDT, AOI tái sử dụng và cơ bản về Structured Text." },
    level: "Intermediate", minutes: 90,
    lessons: [
      { id: "l1", title: { en: "Tag Scope and Aliases", vi: "Phạm vi tag và alias" }, minutes: 20, blocks: [
        { t: "table",
          head: { en: ["Scope", "Who can see it", "Use for"], vi: ["Phạm vi", "Ai thấy được", "Dùng cho"] },
          rows: {
            en: [["Controller", "Every program, HMI, other PLCs", "I/O, HMI tags, shared data"], ["Program", "Only that program", "Internal bits, timers for one area"]],
            vi: [["Controller", "Mọi program, HMI, PLC khác", "I/O, tag HMI, dữ liệu dùng chung"], ["Program", "Chỉ program đó", "Bit nội bộ, timer của một khu vực"]]
          } },
        { t: "p", en: "An **alias** is a nickname for another tag. `Start_PB` alias for `Local:1:I.Pt00.Data` makes the logic readable. If the wire moves to point 5, change the alias once, not every rung.", vi: "**Alias** là tên gọi khác cho một tag. `Start_PB` là alias của `Local:1:I.Pt00.Data` giúp logic dễ đọc. Nếu dây chuyển sang điểm 5, chỉ cần đổi alias một lần, không phải sửa từng rung." },
        { t: "callout", kind: "tip", en: "Name tags so a stranger understands them: `Conv1_Motor_Run`, not `B3_17`. Always fill in the **Description** too.", vi: "Đặt tên tag sao cho người lạ cũng hiểu: `Conv1_Motor_Run`, không phải `B3_17`. Luôn điền cả phần **Description**." }
      ] },
      { id: "l2", title: { en: "User-Defined Data Types (UDTs)", vi: "Kiểu dữ liệu người dùng (UDT)" }, minutes: 20, blocks: [
        { t: "p", en: "A **UDT** groups related data into one tag. Build it once, then create one tag per motor.", vi: "**UDT** gom các dữ liệu liên quan vào một tag. Tạo một lần, rồi tạo mỗi motor một tag." },
        { t: "table",
          head: { en: ["Member", "Type", "Meaning"], vi: ["Thành phần", "Kiểu", "Ý nghĩa"] },
          rows: {
            en: [["Start", "BOOL", "Start command (HMI or button)"], ["Stop", "BOOL", "Stop command"], ["Run", "BOOL", "Run output to the contactor"], ["Fault", "BOOL", "Overload or fail-to-start"], ["Hours", "REAL", "Run hours"]],
