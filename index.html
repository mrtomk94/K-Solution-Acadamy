};
const PREFIX={s1:"EL",s2:"CP",s3:"PLC",s4:"S5K",s5:"HMI",s6:"AE",s7:"RES",s8:"COM"};
const SECTIONS=(window.KS&&KS.sections||[]).slice().sort((a,b)=>a.num-b.num);
const C={},ORDER=[];
SECTIONS.forEach(s=>s.courses.forEach((c,i)=>{c._code=(PREFIX[s.id]||"K")+"-"+(s.num*100+i+1);c._sec=s;C[c.id]=c;ORDER.push(c.id);}));

/* ---------- storage ---------- */
const KEY="ksacademy.v1";
let S={lang:"en",done:{},quiz:{},last:null};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const L=()=>S.lang==="vi"?"vi":"en";
const T=k=>UI[L()][k];
const tx=o=>o==null?"":(typeof o==="string"?o:(o[L()]??o.en??""));

/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
function courseStats(c){const n=c.lessons.length;let d=0;c.lessons.forEach(l=>{if(S.done[c.id+"/"+l.id])d++;});const q=S.quiz[c.id];const passed=q&&q.best>=0.8;return{n,d,passed,best:q?q.best:null,frac:(d+(passed?1:0))/(n+1)};}
function overall(){let a=0,b=0;ORDER.forEach(id=>{const s=courseStats(C[id]);a+=s.d+(s.passed?1:0);b+=s.n+1;});return b?a/b:0;}
function nextSpot(){for(const id of ORDER){const c=C[id];for(let i=0;i<c.lessons.length;i++)if(!S.done[id+"/"+c.lessons[i].id])return{type:"lesson",cid:id,li:i};if(!courseStats(c).passed)return{type:"quiz",cid:id};}return{type:"lesson",cid:ORDER[0],li:0};}
const pct=f=>Math.round(f*100)+"%";

/* ---------- ladder renderer ---------- */
const BOX=new Set(["TON","TOF","RTO","CTU","CTD","RES","MOV","ADD","SUB","MUL","DIV","EQU","NEQ","GRT","GEQ","LES","LEQ","LIM","CPT","SCP","JSR","COP"]);
const COIL=new Set(["OTE","OTL","OTU"]);
function boxName(e){if(e.k==="JSR"&&/^AOI_/.test(e.tag||"")){const p=e.tag.split(/\s+/);return{k:p[0],tag:p[1]||""};}return{k:e.k,tag:e.tag||""};}
function measure(e){
  if(e.k==="BR"){const rows=e.rows.map(measureRow);return{w:Math.max(...rows.map(r=>r.w))+24,h:rows.reduce((a,r)=>a+r.h,0),rows};}
  if(BOX.has(e.k)){const b=boxName(e);const ps=e.params||[];const lw=Math.max(b.k.length,b.tag.length,...ps.map(p=>(p[0]+"").length+(p[1]+"").length+2))*7+34;return{w:Math.max(160,lw),h:Math.max(64,40+ps.length*16)+16};}
  return{w:Math.max(90,(e.tag||"").length*6.8+18),h:52};
}
function measureRow(els){let w=0,h=52;els.forEach(e=>{const m=measure(e);w+=m.w;h=Math.max(h,m.h);});return{w,h};}
function isOn(e,st){if(!st)return false;const v=!!st[e.tag];if(e.k==="XIO")return !v;if(e.k==="XIC"||e.k==="ONS")return v;if(COIL.has(e.k))return v;if(BOX.has(e.k))return !!st[e.tag+".EN"];return false;}
function drawEl(e,x,y,st){
  const m=measure(e);let s="";const on=isOn(e,st);const wc=on?"w on":"w";
  if(e.k==="BR"){
    let yy=y;const xl=x+12,xr=x+m.w-12;let last=y;
    s+=`<path class="w" d="M${x} ${y}H${xl}M${xr} ${y}H${x+m.w}"/>`;
    e.rows.forEach((r,i)=>{const rm=measureRow(r);let cx=xl;r.forEach(el=>{s+=drawEl(el,cx,yy,st);cx+=measure(el).w;});s+=`<path class="w" d="M${cx} ${yy}H${xr}"/>`;last=yy;yy+=rm.h;});
    s+=`<path class="w" d="M${xl} ${y}V${last}M${xr} ${y}V${last}"/>`;
    return s;
  }
  if(BOX.has(e.k)){
    const b=boxName(e);const bx=x+10,bw=m.w-20,bh=m.h-16;
    s+=`<path class="${wc}" d="M${x} ${y}H${bx}M${bx+bw} ${y}H${x+m.w}"/>`;
    s+=`<rect class="${on?"onf":"bx"}" x="${bx}" y="${y-14}" width="${bw}" height="${bh}" rx="3"/>`;
    s+=`<text class="t" x="${bx+8}" y="${y+1}" font-weight="700">${esc(b.k)}</text>`;
    s+=`<text class="t" x="${bx+8}" y="${y+17}">${esc(b.tag)}</text>`;
    (e.params||[]).forEach((p,i)=>{const yy=y+33+i*16;s+=`<text class="tm" x="${bx+8}" y="${yy}">${esc(p[0])}</text><text class="t" x="${bx+bw-8}" y="${yy}" text-anchor="end">${esc(st&&st[e.tag+"."+p[0]]!=null?st[e.tag+"."+p[0]]:p[1])}</text>`;});
    if(e.k==="TON"||e.k==="TOF"||e.k==="RTO"||e.k==="CTU"||e.k==="CTD"){const bits=e.k.startsWith("CT")?["CU","DN"]:["EN","DN"];bits.forEach((bt,i)=>{const yy=y-2+i*16;const bon=st&&st[e.tag+"."+bt];s+=`<text class="tm" x="${bx+bw+3}" y="${yy}" font-size="10" style="${bon?"fill:var(--live);font-weight:700":""}">${bt}</text>`;});}
    return s;
  }
  const cx=x+m.w/2;
  s+=`<text class="t" x="${cx}" y="${y-19}" text-anchor="middle">${esc(e.tag||"")}</text>`;
  if(COIL.has(e.k)){
    s+=`<path class="w" d="M${x} ${y}H${cx-12}M${cx+12} ${y}H${x+m.w}"/>`;
    s+=`<path class="${on?"w on":"w"}" d="M${cx-6} ${y-12}Q${cx-15} ${y} ${cx-6} ${y+12}M${cx+6} ${y-12}Q${cx+15} ${y} ${cx+6} ${y+12}"/>`;
    if(e.k!=="OTE")s+=`<text class="t" x="${cx}" y="${y+4}" text-anchor="middle" font-weight="700">${e.k==="OTL"?"L":"U"}</text>`;
  }else{
    s+=`<path class="w" d="M${x} ${y}H${cx-10}M${cx+10} ${y}H${x+m.w}"/>`;
    s+=`<path class="${on?"w on":"w"}" d="M${cx-10} ${y-12}V${y+12}M${cx+10} ${y-12}V${y+12}"/>`;
    if(e.k==="XIO")s+=`<path class="${on?"w on":"w"}" d="M${cx-12} ${y+12}L${cx+12} ${y-12}"/>`;
    if(e.k==="ONS")s+=`<text class="tm" x="${cx}" y="${y+26}" text-anchor="middle">ONS</text>`;
  }
  return s;
}
function ladderSVG(rungs,st){
  let y=8,W=0;const parts=[];
  rungs.forEach(r=>{const m=measureRow(r.els);W=Math.max(W,m.w,r.comment?tx(r.comment).length*6.4:0);});
  const X0=34,RW=Math.max(W+60,440),RX=X0+RW;
  rungs.forEach((r,i)=>{
    let top=y;let s="";
    if(r.comment){s+=`<text class="cm" x="${X0+8}" y="${top+12}">${esc(tx(r.comment))}</text>`;top+=18;}
    const wy=top+32;const m=measureRow(r.els);
    s+=`<text class="tm" x="6" y="${wy+4}">${i}</text>`;
    let cx=X0+6;s+=`<path class="w" d="M${X0} ${wy}H${cx}"/>`;
    const outs=[],ins=[];r.els.forEach(e=>(COIL.has(e.k)||e.k==="RES"?outs:ins).push(e));
    ins.forEach(e=>{s+=drawEl(e,cx,wy,st);cx+=measure(e).w;});
    let ow=outs.reduce((a,e)=>a+measure(e).w,0);let ox=RX-6-ow;if(ox<cx)ox=cx;
    s+=`<path class="w" d="M${cx} ${wy}H${ox}"/>`;
    outs.forEach(e=>{s+=drawEl(e,ox,wy,st);ox+=measure(e).w;});
    s+=`<path class="w" d="M${ox} ${wy}H${RX}"/>`;
    const h=(wy-y)+m.h-14;
    parts.push({s,y0:y,y1:y+h});y+=h+10;
  });
  const H=y;
  let out=`<svg viewBox="0 0 ${RX+8} ${H}" width="${RX+8}" height="${H}" role="img" aria-label="Ladder logic">`;
  out+=`<path class="rail" d="M${X0} 4V${H-4}M${RX} 4V${H-4}"/>`;
  parts.forEach(p=>out+=p.s);
  return out+"</svg>";
}

/* ---------- block renderer ---------- */
function block(b){
  const l=L();
  switch(b.t){
    case"p":return`<p>${md(b[l])}</p>`;
    case"h":return`<h3>${md(b[l])}</h3>`;
    case"list":return`<ul>${b[l].map(x=>`<li>${md(x)}</li>`).join("")}</ul>`;
    case"steps":return`<ol class="steps">${b[l].map(x=>`<li><span>${md(x)}</span></li>`).join("")}</ol>`;
    case"callout":return`<div class="callout ${b.kind}"><b class="k">${T(b.kind)}</b><div>${md(b[l])}</div></div>`;
    case"table":return`<div class="tbl"><table><thead><tr>${b.head[l].map(h=>`<th>${md(h)}</th>`).join("")}</tr></thead><tbody>${b.rows[l].map(r=>`<tr>${r.map(c=>`<td>${md(String(c))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    case"terms":return`<div class="terms">${b.items.map(it=>`<div><b>${md(tx(it.term))}</b>${md(tx(it.def))}</div>`).join("")}</div>`;
    case"ladder":return`<div class="ladder">${ladderSVG(b.rungs)}</div>`;
    case"code":return`<pre class="codeblk"><code>${esc(b.code)}</code></pre>`;
    case"svg":return`<figure><div class="fig">${b.svg}</div>${b.cap?`<figcaption>${md(tx(b.cap))}</figcaption>`:""}</figure>`;
    case"widget":return`<div class="wd" data-widget="${b.name}"></div>`;
    case"lab":return`<div class="lab"><div class="lab-h"><small>${T("lab")}</small><b>${md(tx(b.title))}</b></div><ol class="steps">${b.steps[l].map(x=>`<li><span>${md(x)}</span></li>`).join("")}</ol></div>`;
  }
  return"";
}

/* ---------- views ---------- */
const app=document.getElementById("app");
let view={type:"home"};

function renderBar(){
  document.getElementById("brandSub").textContent=T("sub");document.getElementById("bar3d").textContent=T("bar3d");document.getElementById("barHmi").textContent=T("hmiLab");document.getElementById("barLs").href=lsURL("");
  const o=overall();
  document.getElementById("meter").innerHTML=`<div class="meter-track"><div class="meter-fill" style="width:${pct(o)}"></div></div><span>${pct(o)} ${T("progress")}</span>`;
  document.getElementById("lang-en").setAttribute("aria-pressed",L()==="en");
  document.getElementById("lang-vi").setAttribute("aria-pressed",L()==="vi");
  document.documentElement.lang=L();
}
function lvl(c){return c.level==="Intermediate"?T("intermediate"):T("beginner");}

function home(){
  const nx=nextSpot();const started=Object.keys(S.done).length>0;
  let h=`<div class="wrap"><section class="hero"><div>
    <div class="eyebrow">${T("eyebrow")}</div><h1>${T("h1")}</h1><p class="lede">${T("lede")}</p>
    <div class="row"><button class="btn primary" data-go="${nx.type}:${nx.cid}:${nx.li||0}">${started?T("cont"):T("start")} →</button><button class="btn btn3d" data-3d="1">${T("enter3d")}</button><button class="btn btn3d" data-go="hmilab">${T("openHmi")}</button><a class="btn btn3d" style="text-decoration:none" href="${lsURL("KS_P10_Conveyor.L5X")}" target="_blank" rel="noopener">${T("openLs")}</a>
    <span class="meta">${SECTIONS.length} ${T("sections")} · ${ORDER.length} ${T("courses")} · ${ORDER.reduce((a,id)=>a+C[id].lessons.length,0)} ${T("lessons")}</span></div>
  </div><div><div class="strip">${SECTIONS.map(s=>{const cs=s.courses.map(courseStats);const f=cs.reduce((a,x)=>a+x.frac,0)/cs.length;
    return`<button class="term" data-jump="${s.id}"><span class="screw"></span><span class="wireno">${s.num*100}</span><span class="term-name">${esc(tx(s.title))}</span><span class="term-bar"><i style="width:${pct(f)}"></i></span></button>`;}).join("")}</div>
    <div class="strip-cap">${T("stripCap")}</div></div></section>
  <div class="how">${T("how").map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}</div>`;
  SECTIONS.forEach(s=>{
    h+=`<section class="sec" id="sec-${s.id}"><div class="sec-head"><span class="sec-no">${T("section")} ${s.num} · ${s.num*100}</span><h2>${esc(tx(s.title))}</h2><p>${md(tx(s.blurb))}</p></div><div class="grid">`;
    s.courses.forEach(c=>{const st=courseStats(c);
      const tag=st.passed?`<span class="pill ok">${T("finished")}</span>`:(st.d>0?`<span class="pill mid">${st.d}/${st.n}</span>`:`<span class="pill">${lvl(c)}</span>`);
      h+=`<button class="card" data-go="lesson:${c.id}:${firstOpen(c)}"><div class="row" style="justify-content:space-between"><span class="code">${c._code}</span>${tag}</div><h3>${esc(tx(c.title))}</h3><p>${md(tx(c.summary))}</p>
      <div class="meta"><span>${c.lessons.length} ${T("lessons")}</span><span>${c.minutes||""} ${T("min")}</span>${st.best!=null?`<span>${T("quiz")} ${T("best").toLowerCase()} ${pct(st.best)}</span>`:""}</div><div class="cbar"><i style="width:${pct(st.frac)}"></i></div></button>`;});
    h+=`</div></section>`;
  });
  h+=`<footer class="foot"><span>${T("foot")}</span><button class="btn ghost" id="resetBtn">${T("reset")}</button></footer></div>`;
  app.innerHTML=h;
  const rb=document.getElementById("resetBtn");let armed=false;
  rb.onclick=()=>{if(!armed){armed=true;rb.textContent=T("resetSure");rb.style.borderColor="var(--warn)";setTimeout(()=>{armed=false;rb.textContent=T("reset");rb.style.borderColor="";},4000);return;}S.done={};S.quiz={};save();render();};
}
function firstOpen(c){for(let i=0;i<c.lessons.length;i++)if(!S.done[c.id+"/"+c.lessons[i].id])return i;return 0;}

function railHTML(c,active){
  const st=courseStats(c);
  return`<aside class="rail"><div class="rail-head"><button class="back" data-go="home">← ${T("all")}</button>
   <div class="code" style="margin-top:12px">${c._code} · ${esc(tx(c._sec.title))}</div><h2>${esc(tx(c.title))}</h2>
   <div class="cbar"><i style="width:${pct(st.frac)}"></i></div></div>
   ${c.lessons.map((l,i)=>`<button class="ri" data-go="lesson:${c.id}:${i}" aria-current="${active===i}"><span class="n">${String(i+1).padStart(2,"0")}</span><span>${esc(tx(l.title))}</span>${S.done[c.id+"/"+l.id]?'<span class="ck">✓</span>':""}</button>`).join("")}
   <button class="ri" data-go="quiz:${c.id}" aria-current="${active==="quiz"}"><span class="n">Q</span><span>${T("quiz")}</span>${st.passed?'<span class="ck">✓</span>':""}</button></aside>`;

function lesson(cid,li){

let qa={};
function quiz(cid){
  const c=C[cid];if(!c)return home();
  const st=courseStats(c);
  const qs=c.quiz;const answered=Object.keys(qa).length;const right=qs.filter((q,i)=>qa[i]===q.a).length;
  let h=`<div class="wrap"><div class="course">${railHTML(c,"quiz")}<article class="lesson">
   <div class="crumb">${c._code} · ${T("quiz")}</div><h1>${esc(tx(c.title))}</h1>
   <div class="lesson-meta">${T("quizIntro")}${st.best!=null?` · ${T("best")}: ${pct(st.best)}`:""}</div>`;
  qs.forEach((q,i)=>{const a=qa[i];const locked=a!=null;
    h+=`<div class="q"><div class="q-n">${String(i+1).padStart(2,"0")} / ${String(qs.length).padStart(2,"0")}</div><h4>${md(tx(q.q))}</h4>`;
    q.opts[L()].forEach((o,j)=>{let cl="opt";if(locked){if(j===q.a)cl+=" right";else if(j===a)cl+=" wrong";}
      h+=`<button class="${cl}" data-q="${i}" data-o="${j}" ${locked?"disabled":""}><span class="L">${"ABCD"[j]}</span><span>${md(o)}</span></button>`;});
    if(locked)h+=`<div class="why"><b class="${a===q.a?"ok":"bad"}">${a===q.a?"✓":"✗"}</b> ${md(tx(q.why))}</div>`;
    h+=`</div>`;});
  if(answered===qs.length){const f=right/qs.length;const pass=f>=0.8;
    h+=`<div class="score"><div><div class="eyebrow">${T("score")}</div><div class="big">${right} / ${qs.length}</div></div><span class="pill ${pass?"ok":"mid"}">${pass?T("passed"):T("notyet")}</span><span class="bar-sp"></span>
    <button class="btn" id="retry">${T("retry")}</button>${(()=>{const i=ORDER.indexOf(cid);return i<ORDER.length-1?`<button class="btn primary" data-go="lesson:${ORDER[i+1]}:0">${tx(C[ORDER[i+1]].title)} →</button>`:"";})()}</div>`;
  }else h+=`<p class="msg">${T("answerAll")}</p>`;
  h+=`</article></div></div>`;
  app.innerHTML=h;
  app.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{qa[+b.dataset.q]=+b.dataset.o;
    if(Object.keys(qa).length===qs.length){const f=qs.filter((q,i)=>qa[i]===q.a).length/qs.length;const prev=S.quiz[cid];S.quiz[cid]={best:Math.max(f,prev?prev.best:0),last:f};save();renderBar();}
    const y=window.scrollY;quiz(cid);window.scrollTo(0,y);});
  const r=document.getElementById("retry");if(r)r.onclick=()=>{qa={};quiz(cid);window.scrollTo(0,0);};
}

function go(g,keepScroll){
  const p=g.split(":");

  else if(p[0]==="quiz"){if(view.type!=="quiz"||view.cid!==p[1])qa={};view={type:"quiz",cid:p[1]};}
  else if(p[0]==="hmilab")view={type:"hmilab"};

  el.innerHTML=head("scan")+`<div class="scanbox">${[[tt("1 · Read inputs","1 · Đọc ngõ vào"),tt("Copy field inputs into the input table","Chép ngõ vào thực tế vào bảng input")],[tt("2 · Run logic","2 · Chạy chương trình"),tt("Solve rungs top to bottom","Giải từng rung từ trên xuống")],[tt("3 · Write outputs","3 · Ghi ngõ ra"),tt("Send the output table to the modules","Gửi bảng output ra module")]].map((x,i)=>`<div id="sc-${i}"><b>${x[0]}</b>${x[1]}</div>`).join("")}</div>
   <div class="ladder" id="sc-l"></div>
   <div class="row" style="gap:16px"><button class="btn" id="sc-sw"></button><div class="ctl"><span class="lamp" id="sc-li"></span>${tt("Input image","Bảng input")}</div><div class="ctl"><span class="lamp" id="sc-lo"></span>${tt("Output image","Bảng output")}</div><div class="ctl"><span class="lamp amb" id="sc-lf"></span>${tt("Field light","Đèn thực tế")}</div>
   <span class="bar-sp"></span><div class="seg"><button id="sc-slow">${tt("Slow motion","Chậm")}</button><button id="sc-fast">${tt("Real speed","Tốc độ thật")}</button></div></div>
   <div class="msg">${tt("Real scans take about 1–20 ms. Slow motion shows why an input change is only seen at the start of the next scan.","Một lần quét thật mất khoảng 1–20 ms. Chế độ chậm cho thấy vì sao thay đổi ngõ vào chỉ được thấy ở đầu lần quét kế tiếp.")}</div>`;
  const upd=()=>{[0,1,2].forEach(i=>el.querySelector("#sc-"+i).classList.toggle("act",s.step===i));
   el.querySelector("#sc-sw").textContent=tt("Field switch: ","Công tắc thực tế: ")+(s.field?"ON":"OFF");
   el.querySelector("#sc-li").classList.toggle("on",s.inImg);el.querySelector("#sc-lo").classList.toggle("on",s.outImg);el.querySelector("#sc-lf").classList.toggle("on",s.fieldOut);
   el.querySelector("#sc-l").innerHTML=ladderSVG([{els:[{k:"XIC",tag:"Switch_In"},{k:"OTE",tag:"Light_Out"}]}],{Switch_In:s.inImg,Light_Out:s.outImg});
   el.querySelector("#sc-slow").setAttribute("aria-pressed",s.slow);el.querySelector("#sc-fast").setAttribute("aria-pressed",!s.slow);};
  const tick=()=>{if(!el.isConnected)return;if(s.step===0)s.inImg=s.field;if(s.step===1)s.outImg=s.inImg;if(s.step===2)s.fieldOut=s.outImg;upd();s.step=(s.step+1)%3;};
  let iv;const run=()=>{clearInterval(iv);iv=setInterval(tick,s.slow?1100:60);timers.push(iv);};
  el.querySelector("#sc-sw").onclick=()=>{s.field=!s.field;upd();};
  el.querySelector("#sc-slow").onclick=()=>{s.slow=true;run();upd();};el.querySelector("#sc-fast").onclick=()=>{s.slow=false;run();upd();};
  upd();run();
 },
 binary(el){
  let v=37;
  el.innerHTML=head("binary")+`<div class="bits" id="b-bits"></div><div class="bits" style="margin-top:2px">${Array.from({length:16},(_,i)=>`<small>${15-i}</small>`).join("")}</div>
   <div class="fgrid" style="margin-top:12px"><label class="f">${tt("Decimal (unsigned)","Thập phân (không dấu)")}<input class="inp" id="b-dec" type="number" min="0" max="65535"></label>
   <div><div class="msg" style="margin:0">Hex</div><div class="big" id="b-hex"></div></div><div><div class="msg" style="margin:0">INT (${tt("signed","có dấu")})</div><div class="big" id="b-int"></div></div></div>
   <div class="msg">${tt("Click bits to flip them. In Logix, bit 5 of a tag is written <code>MyTag.5</code>.","Bấm vào bit để đổi. Trong Logix, bit 5 của một tag viết là <code>MyTag.5</code>.")}</div>`;
  const upd=(fromInput)=>{el.querySelector("#b-bits").innerHTML=Array.from({length:16},(_,i)=>{const b=15-i;const on=(v>>b)&1;return`<button data-b="${b}" class="${on?"on":""}" aria-label="bit ${b}">${on}</button>`;}).join("");
   if(!fromInput)el.querySelector("#b-dec").value=v;el.querySelector("#b-hex").textContent="16#"+v.toString(16).toUpperCase().padStart(4,"0");el.querySelector("#b-int").textContent=v>32767?v-65536:v;
   el.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{v^=1<<+b.dataset.b;upd();});};
  el.querySelector("#b-dec").oninput=e=>{let n=parseInt(e.target.value,10);if(isNaN(n))return;v=Math.max(0,Math.min(65535,n));upd(true);};upd();
 },
 sinksource(el){
  const s={sensor:"PNP",card:"SINK"};
  el.innerHTML=head("sinksource")+`<div class="row" style="gap:18px;margin-bottom:10px"><div class="ctl"><div class="seg" id="ss-s"><button data-s="PNP">PNP (sourcing)</button><button data-s="NPN">NPN (sinking)</button></div>${tt("Sensor","Cảm biến")}</div>
   <div class="ctl"><div class="seg" id="ss-c"><button data-c="SINK">${tt("Sinking input","Input sinking")}</button><button data-c="SOURCE">${tt("Sourcing input","Input sourcing")}</button></div>${tt("PLC input card","Card input PLC")}</div></div>
   <div class="fig" id="ss-fig"></div><div class="msg" id="ss-msg"></div>`;
  const upd=()=>{const ok=(s.sensor==="PNP"&&s.card==="SINK")||(s.sensor==="NPN"&&s.card==="SOURCE");
   el.querySelectorAll("[data-s]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===s.sensor));el.querySelectorAll("[data-c]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===s.card));
   const pnp=s.sensor==="PNP";const com=s.card==="SINK"?"0 V":"+24 V";const flow=ok?"var(--live)":"var(--warn)";
   el.querySelector("#ss-fig").innerHTML=`<svg viewBox="0 0 560 190" role="img" aria-label="wiring">
    <rect x="20" y="40" width="130" height="110" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><text x="85" y="30" text-anchor="middle" fill="currentColor" font-size="13" font-weight="700">${s.sensor} ${tt("sensor","cảm biến")}</text>
    <text x="30" y="68" fill="currentColor" font-size="12">BN +24 V</text><text x="30" y="98" fill="currentColor" font-size="12">BK ${tt("signal","tín hiệu")}</text><text x="30" y="128" fill="currentColor" font-size="12">BU 0 V</text>
    <text x="85" y="170" text-anchor="middle" fill="currentColor" font-size="11">${pnp?tt("switches +24 V out","đóng ra +24 V"):tt("switches to 0 V","đóng xuống 0 V")}</text>
    <rect x="380" y="40" width="160" height="110" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><text x="460" y="30" text-anchor="middle" fill="currentColor" font-size="13" font-weight="700">5069-IB16 · ${s.card==="SINK"?"sinking":"sourcing"}</text>
    <text x="392" y="98" fill="currentColor" font-size="12">IN 0</text><text x="392" y="128" fill="currentColor" font-size="12">COM → ${com}</text>
    <path d="M150 94 H380" stroke="${flow}" stroke-width="3" fill="none"/>
    <text x="265" y="84" text-anchor="middle" font-size="12" style="fill:${flow}" font-weight="700">${ok?(pnp?tt("current flows into the input →","dòng chảy vào input →"):tt("← current flows out of the input","← dòng chảy ra từ input")):tt("no voltage difference, no current","không chênh lệch điện áp, không có dòng")}</text>
   </svg>`;
   el.querySelector("#ss-msg").innerHTML=ok?`<span class="ok">✓ ${tt("Works.","Hoạt động.")}</span> ${pnp?tt("PNP pushes +24 V into the input; the card's common goes to 0 V.","PNP đẩy +24 V vào input; COM của card nối 0 V."):tt("NPN pulls the input down to 0 V; the card's common goes to +24 V.","NPN kéo input xuống 0 V; COM của card nối +24 V.")}`:
    `<span class="bad">✗ ${tt("Will not work.","Không hoạt động.")}</span> ${tt("Rule: PNP sensor → sinking input. NPN sensor → sourcing input.","Quy tắc: cảm biến PNP → input sinking. Cảm biến NPN → input sourcing.")}`;
   el.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{s.sensor=b.dataset.s;upd();});el.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{s.card=b.dataset.c;upd();});};
  upd();
 },
 ipcalc(el){
  el.innerHTML=head("ipcalc")+`<div class="fgrid"><label class="f">${tt("Laptop IP","IP laptop")}<input class="inp" id="ip-a" value="192.168.1.50"></label><label class="f">${tt("PLC IP","IP PLC")}<input class="inp" id="ip-b" value="192.168.1.10"></label><label class="f">Subnet mask<input class="inp" id="ip-m" value="255.255.255.0"></label></div><div class="msg" id="ip-out" style="font-size:15px"></div>`;
  const P=s=>{const p=s.trim().split(".");if(p.length!==4)return null;const n=p.map(x=>/^\d{1,3}$/.test(x)?+x:-1);if(n.some(x=>x<0||x>255))return null;return n;};
  const calc=()=>{const a=P(el.querySelector("#ip-a").value),b=P(el.querySelector("#ip-b").value),m=P(el.querySelector("#ip-m").value);const o=el.querySelector("#ip-out");
   if(!a||!b||!m){o.innerHTML=`<span class="bad">${tt("Enter addresses like 192.168.1.10","Nhập địa chỉ dạng 192.168.1.10")}</span>`;return;}
   const na=a.map((x,i)=>x&m[i]).join("."),nb=b.map((x,i)=>x&m[i]).join(".");const same=na===nb;const dup=a.join(".")===b.join(".");
   o.innerHTML=dup?`<span class="bad">✗ ${tt("Duplicate IP. Two devices can never share one address.","Trùng IP. Hai thiết bị không bao giờ được dùng chung một địa chỉ.")}</span>`:
    `${tt("Network","Mạng")}: <code>${na}</code> vs <code>${nb}</code> → ${same?`<span class="ok">✓ ${tt("Same subnet. They can talk directly.","Cùng subnet. Hai bên nói chuyện trực tiếp được.")}</span>`:`<span class="bad">✗ ${tt("Different subnets. Change the laptop IP so the network part matches.","Khác subnet. Đổi IP laptop để phần network giống nhau.")}</span>`}`;};
  el.querySelectorAll("input").forEach(i=>i.oninput=calc);calc();
 }
};

<script>
window.KS_PLC={"programs": [{"name": "P10_Conveyor", "desc": "Conveyor station on the K-Solution trainer: start/stop seal-in, Hand-Off-Auto, E-stop, photo-eye box counter, 5 s jam alarm, PowerFlex 525 run/speed, C-More HMI tags.", "tags": [{"name": "IN_Stop_PB", "type": "BOOL", "desc": "STOP pushbutton, normally closed. 1 = not pressed, 0 = pressed or broken wire.", "io": "Local:1:I.Pt00.Data", "init": 1, "pre": null, "dim": null, "scope": "ctl", "sim": "Console STOP button"}, {"name": "IN_Start_PB", "type": "BOOL", "desc": "START pushbutton, normally open. 1 = pressed.", "io": "Local:1:I.Pt01.Data", "init": null, "pre": null, "dim": null, "scope": "ctl", "sim": "Console START button"}, {"name": "IN_EStop_OK", "type": "BOOL", "desc": "E-stop circuit healthy. 1 = OK, 0 = E-stop pressed.", "io": "Local:1:I.Pt02.Data", "init": 1, "pre": null, "dim": null, "scope": "ctl", "sim": "Console E-STOP"}, {"name": "IN_HOA_Hand", "type": "BOOL", "desc": "Selector switch in HAND.", "io": "Local:1:I.Pt03.Data", "init": null, "pre": null, "dim": null, "scope": "ctl", "sim": "Console H-O-A"}, {"name": "IN_HOA_Auto", "type": "BOOL", "desc": "Selector switch in AUTO.", "io": "Local:1:I.Pt04.Data", "init": 1, "pre": null, "dim": null, "scope": "ctl", "sim": "Console H-O-A"}, {"name": "IN_PhotoEye", "type": "BOOL", "desc": "Retro-reflective photo-eye. 1 = beam blocked (box in front of it).", "io": "Local:1:I.Pt05.Data", "init": null, "pre": null, "dim": null, "scope": "ctl", "sim": "Conveyor photo-eye"}, {"name": "IN_VFD_Ready", "type": "BOOL", "desc": "PowerFlex 525 ready, no fault. 1 = OK.", "io": "Local:1:I.Pt06.Data", "init": 1, "pre": null, "dim": null, "scope": "ctl", "sim": "VFD"}, {"name": "IN_Reset_PB", "type": "BOOL", "desc": "RESET pushbutton: clears the jam fault and the box count.", "io": "Local:1:I.Pt07.Data", "init": null, "pre": null, "dim": null, "scope": "ctl", "sim": "(HMI RESET in 3D)"}, {"name": "OUT_Motor_Run", "type": "BOOL", "desc": "Run command to the PowerFlex 525 (hardwired start).", "io": "Local:2:O.Pt00.Data", "init": null, "pre": null, "dim": null, "scope": "ctl", "sim": "VFD / motor"}, {"name": "OUT_Run_Light", "type": "BOOL", "desc": "Green RUN pilot light.", "io": "Local:2:O.Pt01.Data", "init": null, "pre": null, "dim": null, "scope": "ctl", "sim": "Console RUN light"}, {"name": "OUT_Fault_Light", "type": "BOOL", "desc": "Red FAULT pilot light. Solid = E-stop or VFD fault, flashing = jam.", "io": "Local:2:O.Pt02.Data", "init": null, "pre": null, "dim": null, "scope": "ctl", "sim": "Console FAULT light"}, {"name": "OUT_Jam_Beacon", "type": "BOOL", "desc": "Amber jam beacon. Flashes while the jam fault is active.", "io": "Local:2:O.Pt03.Data", "init": null, "pre": null, "dim": null, "scope": "ctl", "sim": "Beacon on photo-eye post"}, {"name": "VFD_Speed_Cmd", "type": "REAL", "desc": "Speed reference to the PowerFlex 525 in Hz (send over EtherNet/IP).", "io": "", "init": null, "pre": null, "dim": null, "scope": "ctl", "sim": "VFD"}, {"name": "VFD_Speed_Fbk", "type": "REAL", "desc": "Output frequency feedback from the PowerFlex 525 in Hz.", "io": "", "init": null, "pre": null, "dim": null, "scope": "ctl", "sim": "VFD display"}, {"name": "HMI_Start_PB", "type": "BOOL", "desc": "HMI momentary START. Works in AUTO only. The PLC clears it every scan.", "io": "", "init": null, "pre": null, "dim": null, "scope": "ctl", "sim": "HMI START"}, {"name": "HMI_Stop_PB", "type": "BOOL", "desc": "HMI momentary STOP. The PLC clears it every scan.", "io": "", "init": null, "pre": null, "dim": null, "scope": "ctl", "sim": "HMI STOP"}, {"name": "HMI_Reset_Count", "type": "BOOL", "desc": "HMI momentary RESET COUNT. The PLC clears it every scan.", "io": "", "init": null, "pre": null, "dim": null, "scope": "ctl", "sim": "HMI RESET"}, {"name": "HMI_Alarm_Ack", "type": "BOOL", "desc": "HMI momentary alarm acknowledge / jam reset. The PLC clears it every scan.", "io": "", "init": null, "pre": null, "dim": null, "scope": "ctl", "sim": "HMI RESET"}, {"name": "HMI_Box_Count", "type": "DINT", "desc": "Boxes counted by the photo-eye (shown on the HMI).", "io": "", "init": null, "pre": null, "dim": null, "scope": "ctl", "sim": "HMI BOX COUNT"}, {"name": "HMI_Speed_Hz", "type": "REAL", "desc": "Conveyor speed in Hz for the HMI.", "io": "", "init": null, "pre": null, "dim": null, "scope": "ctl", "sim": "HMI SPEED"}, {"name": "HMI_Mode", "type": "DINT", "desc": "Mode for the HMI: 0 = OFF, 1 = HAND, 2 = AUTO.", "io": "", "init": null, "pre": null, "dim": null, "scope": "ctl", "sim": "HMI MODE"}, {"name": "HMI_Status", "type": "DINT", "desc": "Status for the HMI: 0 = STOPPED, 1 = RUNNING, 2 = E-STOP, 3 = JAM, 4 = VFD FAULT.", "io": "", "init": null, "pre": null, "dim": null, "scope": "ctl", "sim": "HMI status box"}, {"name": "Mode_Hand", "type": "BOOL", "desc": "Operating mode is HAND.", "io": "", "init": null, "pre": null, "dim": null, "scope": "prg", "sim": ""}, {"name": "Mode_Auto", "type": "BOOL", "desc": "Operating mode is AUTO.", "io": "", "init": null, "pre": null, "dim": null, "scope": "prg", "sim": ""}, {"name": "Mode_Off", "type": "BOOL", "desc": "Operating mode is OFF (selector centered).", "io": "", "init": null, "pre": null, "dim": null, "scope": "prg", "sim": ""}, {"name": "Conv_Run_Latch", "type": "BOOL", "desc": "AUTO run latch (seal-in bit).", "io": "", "init": null, "pre": null, "dim": null, "scope": "prg", "sim": ""}, {"name": "Conv_Run_Cmd", "type": "BOOL", "desc": "Final run command (HAND or AUTO, no faults).", "io": "", "init": null, "pre": null, "dim": null, "scope": "prg", "sim": ""}, {"name": "EStop_Active", "type": "BOOL", "desc": "E-stop is pressed.", "io": "", "init": null, "pre": null, "dim": null, "scope": "prg", "sim": ""}, {"name": "Fault_Active", "type": "BOOL", "desc": "Any fault that must stop the conveyor.", "io": "", "init": null, "pre": null, "dim": null, "scope": "prg", "sim": ""}, {"name": "Jam_Fault", "type": "BOOL", "desc": "Jam fault latched (photo-eye blocked too long while running).", "io": "", "init": null, "pre": null, "dim": null, "scope": "prg", "sim": ""}, {"name": "Flash_1Hz", "type": "BOOL", "desc": "1 Hz flasher bit for lights.", "io": "", "init": null, "pre": null, "dim": null, "scope": "prg", "sim": ""}, {"name": "T_Jam", "type": "TIMER", "desc": "Jam timer: photo-eye blocked 5 s while running.", "io": "", "init": null, "pre": 5000, "dim": null, "scope": "prg", "sim": ""}, {"name": "T_Flash", "type": "TIMER", "desc": "Free-running 1 s timer for the flasher.", "io": "", "init": null, "pre": 1000, "dim": null, "scope": "prg", "sim": ""}, {"name": "C_Box", "type": "COUNTER", "desc": "Box counter, counts photo-eye false-to-true transitions.", "io": "", "init": null, "pre": 9999, "dim": null, "scope": "prg", "sim": ""}], "routines": [{"name": "R00_Main", "desc": "Main routine: calls each section in order, every scan.", "rungs": [{"c": "Section 1: I/O map notes (no logic).", "t": "JSR(R01_IO_Map,0);"}, {"c": "Section 2: work out the operating mode from the H-O-A selector.", "t": "JSR(R02_Modes,0);"}, {"c": "Section 3: faults (E-stop, VFD, jam). Faults are solved before the run logic so they win.", "t": "JSR(R03_Faults,0);"}, {"c": "Section 4: start/stop and run command.", "t": "JSR(R04_Run_Logic,0);"}, {"c": "Section 5: photo-eye box counter.", "t": "JSR(R05_Box_Counter,0);"}, {"c": "Section 6: physical outputs (VFD run, lights, beacon).", "t": "JSR(R06_Outputs,0);"}, {"c": "Section 7: HMI status words and momentary button clean-up.", "t": "JSR(R07_HMI,0);"}]}, {"name": "R01_IO_Map", "desc": "How the IN_/OUT_ tags connect to the 5069 I/O. Notes only.", "rungs": [{"c": "I/O MAP. Slot 1 = 5069-IB16, slot 2 = 5069-OW4I. After you add the modules in I/O Configuration, right-click each IN_/OUT_ tag, Edit Tag Properties, set Type = Alias and point it at the address in its description (example: IN_Start_PB -> Local:1:I.Pt01.Data). In the 3D Lab and in LogixSim these stay plain BOOL tags so the simulator can write them.", "t": "NOP();"}, {"c": "Inputs: Pt00 STOP (NC), Pt01 START, Pt02 E-stop OK, Pt03 HAND, Pt04 AUTO, Pt05 photo-eye, Pt06 VFD ready, Pt07 RESET.", "t": "NOP();"}, {"c": "Outputs: Pt00 VFD run, Pt01 RUN light, Pt02 FAULT light, Pt03 jam beacon.", "t": "NOP();"}]}, {"name": "R02_Modes", "desc": "Operating mode from the Hand-Off-Auto selector.", "rungs": [{"c": "HAND: selector in HAND and not in AUTO.", "t": "XIC(IN_HOA_Hand)XIO(IN_HOA_Auto)OTE(Mode_Hand);"}, {"c": "AUTO: selector in AUTO and not in HAND.", "t": "XIC(IN_HOA_Auto)XIO(IN_HOA_Hand)OTE(Mode_Auto);"}, {"c": "OFF: neither HAND nor AUTO (center position).", "t": "XIO(Mode_Hand)XIO(Mode_Auto)OTE(Mode_Off);"}]}, {"name": "R03_Faults", "desc": "E-stop, VFD and jam faults.", "rungs": [{"c": "E-stop active when the E-stop circuit input drops. Fail-safe: a broken wire also stops the machine.", "t": "XIO(IN_EStop_OK)OTE(EStop_Active);"}, {"c": "Jam timer: conveyor running and photo-eye blocked continuously. Preset 5000 ms.", "t": "XIC(Conv_Run_Cmd)XIC(IN_PhotoEye)TON(T_Jam,?,?);"}, {"c": "Latch the jam fault when the jam timer is done.", "t": "XIC(T_Jam.DN)OTL(Jam_Fault);"}, {"c": "Reset the jam fault with RESET (panel or HMI) only after the photo-eye is clear.", "t": "[XIC(IN_Reset_PB),XIC(HMI_Alarm_Ack)]XIO(IN_PhotoEye)OTU(Jam_Fault);"}, {"c": "Any fault stops the conveyor: E-stop, VFD not ready, or jam.", "t": "[XIC(EStop_Active),XIO(IN_VFD_Ready),XIC(Jam_Fault)]OTE(Fault_Active);"}]}, {"name": "R04_Run_Logic", "desc": "Start/stop seal-in, HAND/AUTO run command, VFD speed reference.", "rungs": [{"c": "AUTO seal-in. START (panel or HMI) sets the latch, the latch holds itself. STOP is NC so it must be 1 to run. Any fault drops the latch.", "t": "XIC(Mode_Auto)[XIC(IN_Start_PB),XIC(HMI_Start_PB),XIC(Conv_Run_Latch)]XIC(IN_Stop_PB)XIO(HMI_Stop_PB)XIO(Fault_Active)OTE(Conv_Run_Latch);"}, {"c": "Run command: HAND runs directly, AUTO runs from the latch. Faults always win.", "t": "[XIC(Mode_Hand),XIC(Conv_Run_Latch)]XIO(Fault_Active)OTE(Conv_Run_Cmd);"}, {"c": "Speed reference 60.0 Hz while running.", "t": "XIC(Conv_Run_Cmd)MOV(60.0,VFD_Speed_Cmd);"}, {"c": "Speed reference 0.0 Hz when stopped.", "t": "XIO(Conv_Run_Cmd)MOV(0.0,VFD_Speed_Cmd);"}]}, {"name": "R05_Box_Counter", "desc": "Count boxes with the photo-eye.", "rungs": [{"c": "Count one box each time the photo-eye goes from clear to blocked. CTU counts transitions by itself.", "t": "XIC(IN_PhotoEye)CTU(C_Box,?,?);"}, {"c": "Reset the count from the HMI or the RESET button.", "t": "[XIC(HMI_Reset_Count),XIC(IN_Reset_PB)]RES(C_Box);"}, {"c": "Copy the count to the HMI.", "t": "MOV(C_Box.ACC,HMI_Box_Count);"}]}, {"name": "R06_Outputs", "desc": "Physical outputs and the 1 Hz flasher.", "rungs": [{"c": "1 Hz flasher: free-running 1 s timer that restarts itself.", "t": "XIO(T_Flash.DN)TON(T_Flash,?,?);"}, {"c": "Flash bit is ON for the first half of each second.", "t": "LES(T_Flash.ACC,500)OTE(Flash_1Hz);"}, {"c": "Run output to the VFD.", "t": "XIC(Conv_Run_Cmd)OTE(OUT_Motor_Run);"}, {"c": "Green RUN light while running.", "t": "XIC(Conv_Run_Cmd)OTE(OUT_Run_Light);"}, {"c": "Red FAULT light: solid for E-stop or VFD fault, flashing for a jam.", "t": "[XIC(EStop_Active),XIO(IN_VFD_Ready),XIC(Jam_Fault)XIC(Flash_1Hz)]OTE(OUT_Fault_Light);"}, {"c": "Amber beacon flashes while the jam fault is active.", "t": "XIC(Jam_Fault)XIC(Flash_1Hz)OTE(OUT_Jam_Beacon);"}]}, {"name": "R07_HMI", "desc": "HMI status words and clean-up of momentary HMI buttons.", "rungs": [{"c": "HMI mode number: start at 0 = OFF.", "t": "MOV(0,HMI_Mode);"}, {"c": "1 = HAND.", "t": "XIC(Mode_Hand)MOV(1,HMI_Mode);"}, {"c": "2 = AUTO.", "t": "XIC(Mode_Auto)MOV(2,HMI_Mode);"}, {"c": "HMI status: start at 0 = STOPPED. Later rungs win, so the most important status is written last.", "t": "MOV(0,HMI_Status);"}, {"c": "1 = RUNNING.", "t": "XIC(Conv_Run_Cmd)MOV(1,HMI_Status);"}, {"c": "3 = JAM.", "t": "XIC(Jam_Fault)MOV(3,HMI_Status);"}, {"c": "4 = VFD FAULT.", "t": "XIO(IN_VFD_Ready)MOV(4,HMI_Status);"}, {"c": "2 = E-STOP (highest priority).", "t": "XIC(EStop_Active)MOV(2,HMI_Status);"}, {"c": "Speed feedback for the HMI.", "t": "MOV(VFD_Speed_Fbk,HMI_Speed_Hz);"}, {"c": "Clear the HMI momentary buttons at the end of the scan, so a lost HMI connection can never hold a button ON.", "t": "[OTU(HMI_Start_PB),OTU(HMI_Stop_PB),OTU(HMI_Reset_Count),OTU(HMI_Alarm_Ack)];"}]}]}, {"name": "P20_ADU_House", "desc": "ADU house teaching logic for the 3D Lab: switched lights with breaker status, bath fan off-delay, dusk-to-dawn porch light, interconnected smoke alarm with egress lighting.", "tags": [{"name": "ADU_SW_Living", "type": "BOOL", "desc": "Switch by the front door: living room ceiling light. 1 = ON.", "io": "", "init": null, "pre": null, "dim": null, "scope": "ctl", "sim": "ADU living room switch"}, {"name": "ADU_SW_Kitchen", "type": "BOOL", "desc": "Switch on the dining wall: kitchen can lights. 1 = ON.", "io": "", "init": null, "pre": null, "dim": null, "scope": "ctl", "sim": "ADU kitchen switch"}, {"name": "ADU_SW_Bedroom", "type": "BOOL", "desc": "Switch inside the bedroom door: bedroom ceiling light.", "io": "", "init": null, "pre": null, "dim": null, "scope": "ctl", "sim": "ADU bedroom switch"}, {"name": "ADU_SW_Hall", "type": "BOOL", "desc": "Hall switch: hall ceiling light.", "io": "", "init": null, "pre": null, "dim": null, "scope": "ctl", "sim": "ADU hall switch"}, {"name": "ADU_SW_BathLight", "type": "BOOL", "desc": "Bath switch 1: vanity light.", "io": "", "init": null, "pre": null, "dim": null, "scope": "ctl", "sim": "ADU bath switch 1"}, {"name": "ADU_SW_BathFan", "type": "BOOL", "desc": "Bath switch 2: exhaust fan.", "io": "", "init": null, "pre": null, "dim": null, "scope": "ctl", "sim": "ADU bath switch 2"}, {"name": "ADU_SW_Porch", "type": "BOOL", "desc": "Switch by the front door: porch light.", "io": "", "init": null, "pre": null, "dim": null, "scope": "ctl", "sim": "ADU porch switch"}, {"name": "ADU_Breaker_On", "type": "BOOL", "desc" /* K-Solution shared PLC core: runs the .L5X rung text, simulates the conveyor field devices,
   and talks to LogixSim. Used by the 3D Lab and the HMI Lab. */
window.KSPLC=(function(){
"use strict";
const PLC={tags:{},progs:[],src:"sim",page:0,ok:false};
const SIM_INPUTS=["IN_Stop_PB","IN_Start_PB","IN_EStop_OK","IN_HOA_Hand","IN_HOA_Auto","IN_PhotoEye","IN_VFD_Ready","IN_Reset_PB","VFD_Speed_Fbk","HMI_Start_PB","HMI_Stop_PB","HMI_Reset_Count","HMI_Alarm_Ack",
 "ADU_SW_Living","ADU_SW_Kitchen","ADU_SW_Bedroom","ADU_SW_Hall","ADU_SW_BathLight","ADU_SW_BathFan","ADU_SW_Porch","ADU_Breaker_On","ADU_Daylight","ADU_Smoke_Detected","ADU_Smoke_Reset"];
const MOMENTARY=["HMI_Start_PB","HMI_Stop_PB","HMI_Reset_Count","HMI_Alarm_Ack","ADU_Smoke_Reset"];
const F={estop:false,hoa:"AUTO",startHold:0,stopHold:0,hz:0,eye:false,boxes:[{x:-1.3,stuck:false},{x:-.3,stuck:false},{x:.7,stuck:false}],travel:0};
const api={PLC,F,SIM_INPUTS,aduHook:null,onBridge:null};
function init(){
 if(PLC.ok)return;const def=window.KS_PLC;if(!def)return;
 def.programs.forEach(P=>{
  P.tags.forEach(t=>{let v;
   if(t.type==="TIMER")v={PRE:t.pre,ACC:0,EN:0,TT:0,DN:0};else if(t.type==="COUNTER")v={PRE:t.pre,ACC:0,CU:0,DN:0};
   else if(t.dim)v=new Array(t.dim).fill(0);else v=t.init||0;PLC.tags[t.name]=v;});
  const rt={};P.routines.forEach(r=>{rt[r.name]=r;r.rungs.forEach(g=>{g.ast=parseRung(g.t);});});
  PLC.progs.push({def:P,rt});
 });
 for(let i=0;i<32;i++)PLC.tags.ADU_Breaker_On[i]=1;
 PLC.ok=true;
}
function parseRung(s){let i=0;
 function seq(){const out=[];while(i<s.length){const ch=s[i];if(ch==="]"||ch===","||ch===";")break;
  if(ch==="["){i++;const br=[seq()];while(s[i]===","){i++;br.push(seq());}i++;out.push({br});continue;}
  const m=/^([A-Z_]+)\(/.exec(s.slice(i));if(!m)throw new Error("rung parse: "+s.slice(i,i+12));i+=m[0].length;
  let d=1,st=i;while(d&&i<s.length){if(s[i]==="(")d++;else if(s[i]===")")d--;i++;}
  out.push({op:m[1],args:s.slice(st,i-1).split(",")});}
  return out;}
 return seq();}
function ref(p){const m=/^([A-Za-z_]\w*)(?:\[(\d+)\])?(?:\.(\w+))?$/.exec(String(p).trim());if(!m)return null;
 let o=PLC.tags,k=m[1];if(!(k in o))return null;if(m[2]!=null){o=o[k];k=+m[2];if(!Array.isArray(o)||k>=o.length)return null;}if(m[3]){o=o[k];k=m[3];if(!o||typeof o!=="object"||!(k in o))return null;}return{o,k};}
function exists(p){return !!ref(p);}
function tget(p){if(/^-?\d/.test(p))return parseFloat(p);const r=ref(p);return r?r.o[r.k]:0;}
function tset(p,v){const r=ref(p);if(r)r.o[r.k]=typeof v==="boolean"?(v?1:0):v;return !!r;}
function ex(seq,rin,dt,P){let c=rin;for(const e of seq){if(e.br){let o=false;for(const b of e.br)o=ex(b,c,dt,P)||o;c=o;}else c=ins(e,c,dt,P);}return c;}
function ins(e,rin,dt,P){const a=e.args;
 switch(e.op){
  case"XIC":return rin&&!!tget(a[0]);
  case"XIO":return rin&&!tget(a[0]);
  case"OTE":tset(a[0],rin);return rin;
  case"OTL":if(rin)tset(a[0],1);return rin;
  case"OTU":if(rin)tset(a[0],0);return rin;
  case"ONS":{const o=rin&&!tget(a[0]);tset(a[0],rin);return o;}
  case"TON":{const t=tget(a[0]);if(rin){t.EN=1;t.ACC=Math.min(t.PRE,t.ACC+dt);t.DN=t.ACC>=t.PRE?1:0;t.TT=t.DN?0:1;}else{t.EN=t.TT=t.DN=0;t.ACC=0;}return rin;}
  case"TOF":{const t=tget(a[0]);if(rin){t.EN=1;t.DN=1;t.TT=0;t.ACC=0;}else{t.EN=0;if(t.DN){t.ACC=Math.min(t.PRE,t.ACC+dt);t.TT=t.ACC<t.PRE?1:0;if(t.ACC>=t.PRE){t.DN=0;t.TT=0;}}}return rin;}
  case"CTU":{const c=tget(a[0]);if(rin&&!c.CU)c.ACC++;c.CU=rin?1:0;c.DN=c.ACC>=c.PRE?1:0;return rin;}
  case"RES":{if(rin){const o=tget(a[0]);o.ACC=0;o.DN=0;if("EN"in o){o.EN=0;o.TT=0;}if("CU"in o)o.CU=0;}return rin;}
  case"MOV":if(rin)tset(a[1],tget(a[0]));return rin;
  case"LES":return rin&&tget(a[0])<tget(a[1]);
  case"LEQ":return rin&&tget(a[0])<=tget(a[1]);
  case"GRT":return rin&&tget(a[0])>tget(a[1]);
  case"GEQ":return rin&&tget(a[0])>=tget(a[1]);
  case"EQU":return rin&&tget(a[0])==tget(a[1]);
  case"NEQ":return rin&&tget(a[0])!=tget(a[1]);
  case"JSR":if(rin)runRoutine(P,a[0],dt);return rin;
  case"NOP":return rin;
 }return rin;}
function runRoutine(P,name,dt){const r=P.rt[name];if(!r)return;for(const g of r.rungs)ex(g.ast,true,dt,P);}
function scan(dtMs){if(!PLC.ok||PLC.src!=="sim")return;PLC.progs.forEach(P=>runRoutine(P,P.def.routines[0].name,dtMs));}

/* ---- LogixSim bridge ----
   url "browser": LogixSim Studio open in another tab of this site (BroadcastChannel "ks-logixsim").
   any http(s) url: POST {url}/api/tags {"write":{...},"read":[...]} -> {"values":{...}} */
const BR={url:"browser",state:"idle",busy:false,last:0,err:"",project:""};
let bc=null;const pend={};let seq=0;
function chan(){if(bc||typeof BroadcastChannel==="undefined")return bc;bc=new BroadcastChannel("ks-logixsim");
 bc.onmessage=e=>{const m=e.data||{};if(m.re&&pend[m.re]){pend[m.re](m);delete pend[m.re];}};return bc;}
function viaTab(write,read){return new Promise((res,rej)=>{const c=chan();if(!c)return rej(new Error("BroadcastChannel not supported"));
 const id="q"+(++seq);const to=setTimeout(()=>{delete pend[id];rej(new Error("LogixSim tab is not open"));},1500);
 pend[id]=m=>{clearTimeout(to);m.error?rej(new Error(m.error)):res(m);};c.postMessage({id,write,read});});}
function readList(){const out=[];(window.KS_PLC?KS_PLC.programs:[]).forEach(P=>P.tags.forEach(t=>{if(t.scope==="ctl"&&!SIM_INPUTS.includes(t.name))out.push(t.name);}));return out;}
const num=v=>v===true?1:v===false?0:Array.isArray(v)?v.map(num):(v&&typeof v==="object")?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,num(x)])):v;
async function bridgeTick(){
 if(PLC.src!=="logixsim"||BR.busy)return;const now=performance.now();if(now-BR.last<100)return;BR.last=now;BR.busy=true;
 const write={};SIM_INPUTS.forEach(n=>{const v=PLC.tags[n];write[n]=Array.isArray(v)?v.slice():v;});
 MOMENTARY.forEach(n=>{PLC.tags[n]=0;});
 try{let j;
  if(!BR.url||BR.url==="browser"){j=await viaTab(write,readList());BR.project=j.project||"";}
  else{const r=await fetch(BR.url.replace(/\/$/,"")+"/api/tags",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({write,read:readList()})});
   if(!r.ok)throw new Error("HTTP "+r.status);j=await r.json();}
  const vals=j.values||j;Object.keys(vals).forEach(k=>{if(k in PLC.tags&&vals[k]!==null&&vals[k]!==undefined)PLC.tags[k]=num(vals[k]);});BR.state="on";BR.err="";}
 catch(e){BR.state="err";BR.err=e.message||String(e);}
 BR.busy=false;if(api.onBridge)api.onBridge();
}

/* ---- conveyor field model (photo-eye, VFD, boxes) ---- */
function fieldIn(dt){const T=PLC.tags;
 F.startHold=Math.max(0,F.startHold-dt);F.stopHold=Math.max(0,F.stopHold-dt);
 T.IN_Start_PB=F.startHold>0?1:0;T.IN_Stop_PB=F.stopHold>0?0:1;T.IN_EStop_OK=F.estop?0:1;
 T.IN_HOA_Hand=F.hoa==="HAND"?1:0;T.IN_HOA_Auto=F.hoa==="AUTO"?1:0;T.IN_PhotoEye=F.eye?1:0;T.IN_VFD_Ready=1;T.IN_Reset_PB=0;
 T.VFD_Speed_Fbk=Math.round(F.hz*10)/10;}
function fieldOut(dt){const T=PLC.tags;const target=T.OUT_Motor_Run?(+T.VFD_Speed_Cmd||0):0;const rate=30;

 const sp=F.hz/60;F.travel+=sp*dt;
 const stuck=F.boxes.find(b=>b.stuck);let blocked=false;
 F.boxes.forEach(b=>{let nx=b.x+sp*dt*.5;if(b.stuck)nx=Math.min(nx,0);else if(stuck&&b.x<stuck.x&&nx>stuck.x-.26)nx=Math.max(b.x,stuck.x-.26);b.x=nx;if(b.x>1.4)b.x-=3.0;if(Math.abs(b.x)<.13)blocked=true;});
 F.eye=blocked;}
function step(dt){if(!PLC.ok)return;dt=Math.min(dt,.1);fieldIn(dt);if(api.aduHook)api.aduHook();scan(dt*1000);bridgeTick();fieldOut(dt);}

 if(LBOX.has(e.op)){g.strokeStyle=K;g.beginPath();g.moveTo(x,y);g.lineTo(x+10,y);g.moveTo(x+w-10,y);g.lineTo(x+w,y);g.stroke();

  lines.forEach((s,i)=>g.fillText(s.slice(0,22),x+18,y+24+i*20));return;}
 const cx=x+w/2;g.fillStyle=K;g.font="15px JetBrains Mono, monospace";g.textAlign="center";g.fillText(e.args[0],cx,y-22);g.textAlign="left";
 g.strokeStyle=K;g.beginPath();g.moveTo(x,y);g.lineTo(cx-14,y);g.moveTo(cx+14,y);g.lineTo(x+w,y);g.stroke();
 g.strokeStyle=col;g.lineWidth=on?4:2;g.beginPath();

/* ---------- PLC access ---------- */
function plcCtlTags(){const out=[];(window.KS_PLC?KS_PLC.programs:[]).forEach(pr=>pr.tags.forEach(t=>{if(t.scope==="ctl")out.push({name:t.name,type:t.type,desc:t.desc,prog:pr.name,dim:t.dim});}));return out;}
function plcProgTags(){const out={};(window.KS_PLC?KS_PLC.programs:[]).forEach(pr=>pr.tags.forEach(t=>{if(t.scope==="prg")out[pr.name+"."+t.name]=t;}));return out;}
function resolve(addr){addr=String(addr||"").trim();if(!addr)return{err:"empty"};
 let m=/^Program:(\w+)\.(.+)$/.exec(addr);if(m){const base=m[2].split(/[.[]/)[0];const pt=plcProgTags()[m[1]+"."+base];if(!pt)return{err:"notfound"};return{flat:m[2],type:memberType(pt.type,m[2])};}
 const base=addr.split(/[.[]/)[0];const ct=plcCtlTags().find(t=>t.name===base);
 if(!ct){const anyProg=Object.keys(plcProgTags()).find(k=>k.endsWith("."+base));return{err:anyProg?"progscope":"notfound",prog:anyProg&&anyProg.split(".")[0]};}
 if(!KSPLC.exists(addr))return{err:"notfound"};return{flat:addr,type:memberType(ct.type,addr,ct.dim)};}
function memberType(t,addr,dim){const mem=/\.(\w+)$/.exec(addr);if(t==="TIMER"||t==="COUNTER"){if(!mem)return t;return["PRE","ACC"].includes(mem[1])?"DINT":"BOOL";}if(dim&&/\[\d+\]$/.test(addr))return t;return t;}
function hmiTag(name){return P.tags.find(t=>t.name===name);}
function tagCheck(t){const r=resolve(t.addr);if(r.err)return{ok:false,msg:r.err==="progscope"?tt(`Program-scope tag. Use Program:${r.prog}.${t.addr} or move it to controller scope.`,`Tag phạm vi chương trình. Dùng Program:${r.prog}.${t.addr} hoặc chuyển sang phạm vi controller.`):r.err==="empty"?tt("Enter the PLC tag name.","Nhập tên tag PLC."):tt("Tag not found in the controller.","Không có tag này trong controller.")};
 if(!TYPES[t.type].includes(r.type))return{ok:false,warn:true,msg:tt(`Type mismatch: PLC tag is ${r.type}, HMI tag is ${t.type}.`,`Sai kiểu: tag PLC là ${r.type}, tag HMI là ${t.type}.`),flat:r.flat};
 return{ok:true,flat:r.flat,ptype:r.type};}
function online(){return P.conn.ok&&(P.conn.source==="sim"||KSPLC.BR.state==="on");}
function readTag(name){const t=hmiTag(name);if(!t)return{err:"####"};const c=tagCheck(t);if(!c.ok&&!c.warn)return{err:"####"};if(!online())return{err:"----"};return{v:KSPLC.tget(c.flat)};}
function writeTag(name,v){const t=hmiTag(name);if(!t||t.rw!=="RW"||!online())return false;const c=tagCheck(t);if(!c.ok&&!c.warn)return false;KSPLC.tset(c.flat,v);if(/Start/.test(t.addr)&&v){runState.startSeen=true;runState.c0=+KSPLC.tget("HMI_Box_Count")||0;}return true;}

/* ---------- networking ---------- */
const ip=s=>{const p=String(s).trim().split(".");if(p.length!==4)return null;const n=p.map(x=>/^\d{1,3}$/.test(x)?+x:-1);return n.some(x=>x<0||x>255)?null:n;};
async function testConn(){const c=P.conn;const a=ip(c.hmiIp),b=ip(c.plcIp),m=ip(c.mask);let ok=false,msg="";
 if(!a||!b||!m)msg=tt("Every address must look like 192.168.1.10.","Mỗi địa chỉ phải có dạng 192.168.1.10.");
 else if(a.join(".")===b.join("."))msg=tt("The HMI and the PLC have the same IP address. Each device needs its own.","HMI và PLC trùng địa chỉ IP. Mỗi thiết bị cần một địa chỉ riêng.");
 else if(a.map((x,i)=>x&m[i]).join(".")!==b.map((x,i)=>x&m[i]).join("."))msg=tt(`No reply from ${c.plcIp}. The HMI (${c.hmiIp}) is on a different subnet: with mask ${c.mask} the network parts must match.`,`Không có phản hồi từ ${c.plcIp}. HMI (${c.hmiIp}) ở khác subnet: với mask ${c.mask} phần network phải giống nhau.`);
 else if(c.driver!=="ab-eip")msg=c.driver==="ab-df1"?tt("DF1 is a serial driver for MicroLogix/SLC. This CompactLogix 5380 talks EtherNet/IP.","DF1 là driver nối tiếp cho MicroLogix/SLC. CompactLogix 5380 dùng EtherNet/IP."):tt("Modbus TCP needs Modbus addresses. Use the Allen-Bradley EtherNet/IP tag-based driver for Logix tags.","Modbus TCP dùng địa chỉ Modbus. Dùng driver Allen-Bradley EtherNet/IP theo tag cho tag Logix.");
 else if(String(c.slot).trim()!=="0")msg=tt(`No controller in slot ${c.slot}. A CompactLogix 5380 controller is always slot 0.`,`Không có controller ở slot ${c.slot}. CompactLogix 5380 luôn ở slot 0.`);
 else if(c.source==="logixsim"){KSPLC.init();KSPLC.PLC.src="logixsim";KSPLC.BR.url=c.url;KSPLC.BR.state="connecting";KSPLC.start();
  msg=tt("Contacting LogixSim…","Đang kết nối LogixSim…");c.ok=false;c.msg=msg;render();await new Promise(r=>setTimeout(r,900));
  if(KSPLC.BR.state==="on"){ok=true;const pj=KSPLC.BR.project?` (${KSPLC.BR.project})`:"";msg=c.url==="browser"?tt(`Online with LogixSim Studio${pj} in your other tab.`,`Đã kết nối LogixSim Studio${pj} ở tab bên kia.`):tt(`Online with LogixSim at ${c.url}.`,`Đã kết nối LogixSim tại ${c.url}.`);}
  else msg=c.url==="browser"?tt(`LogixSim not reachable (${KSPLC.BR.err||"no reply"}). Open LogixSim (button in the top bar), load KS_P10_Conveyor and press Run, then Test connection again.`,`Không kết nối được LogixSim (${KSPLC.BR.err||"không phản hồi"}). Mở LogixSim (nút trên thanh trên cùng), nạp KS_P10_Conveyor và bấm Run, rồi Kiểm tra kết nối lại.`):tt(`LogixSim not reachable at ${c.url} (${KSPLC.BR.err||"no reply"}). Use "browser" for LogixSim Studio in another tab of this site.`,`Không kết nối được LogixSim tại ${c.url} (${KSPLC.BR.err||"không phản hồi"}). Dùng "browser" cho LogixSim Studio ở tab khác của trang này.`);}
 else{KSPLC.init();KSPLC.PLC.src="sim";KSPLC.start();ok=true;msg=tt(`Online: 5069-L306ER "KS_Trainer" at ${c.plcIp}, slot 0. Program P10_Conveyor is running.`,`Đã kết nối: 5069-L306ER "KS_Trainer" tại ${c.plcIp}, slot 0. Chương trình P10_Conveyor đang chạy.`);}
 c.ok=ok;c.msg=msg;save();render();}

function objsBound(type,addrs,extra){return P.objs.some(o=>o.type===type&&o.tag&&hmiTag(o.tag)&&addrs.includes(tagCheck(hmiTag(o.tag)).flat)&&(!extra||extra(o)));}

 return[

  [objsBound("num",["HMI_Box_Count"]),tt("Box count display → HMI_Box_Count","Hiển thị số hộp → HMI_Box_Count")],

 <div class="row" style="margin-bottom:10px"><button class="btn" id="ht_add">+ ${tt("Add tag","Thêm tag")}</button><button class="btn" id="ht_imp">${tt("Import from PLC…","Nhập từ PLC…")}</button></div>
 <div class="tbl"><table class="hl-tags"><thead><tr><th>${tt("HMI tag name","Tên tag HMI")}</th><th>${tt("Type","Kiểu")}</th><th>${tt("PLC tag (address)","Tag PLC (địa chỉ)")}</th><th>${tt("Access","Quyền")}</th><th>${tt("Value","Giá trị")}</th><th></th></tr></thead>
 <tbody>${P.tags.map((t,i)=>{const c=tagCheck(t);return`<tr><td><input data-i="${i}" data-k="name" class="mono" value="${esc(t.name)}"></td>
  <td><select data-i="${i}" data-k="type">${Object.keys(TYPES).map(k=>`<option ${t.type===k?"selected":""}>${k}</option>`).join("")}</select></td>
  <td><input data-i="${i}" data-k="addr" class="mono" list="hl_plctags" value="${esc(t.addr)}"><div class="hl-chk ${c.ok?"ok":c.warn?"warn":"bad"}">${c.ok?"✓ "+tt("found","tìm thấy")+" ("+c.ptype+")":esc(c.msg)}</div></td>
  <td><select data-i="${i}" data-k="rw"><option value="RW" ${t.rw==="RW"?"selected":""}>Read/Write</option><option value="R" ${t.rw==="R"?"selected":""}>Read</option></select></td>
  <td class="mono" data-live="${esc(t.name)}">—</td><td><button class="btn ghost" data-del="${i}" aria-label="Delete">✕</button></td></tr>`;}).join("")||`<tr><td colspan="6" class="hl-empty">${tt("No tags yet. Use “Import from PLC…” or “Add tag”.","Chưa có tag. Dùng “Nhập từ PLC…” hoặc “Thêm tag”.")}</td></tr>`}</tbody></table></div>
 <datalist id="hl_plctags">${ctl.map(t=>`<option value="${t.name}">`).join("")}</datalist>
 <div id="ht_modal"></div>
 ${P.tags.length?`<div class="row" style="margin-top:12px"><button class="btn" data-go2="2">${tt("Next: screen →","Tiếp: màn hình →")}</button></div>`:""}</div>`;
 M.querySelectorAll("[data-k]").forEach(e=>e.onchange=()=>{P.tags[+e.dataset.i][e.dataset.k]=e.value.trim();save();render();});
 M.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{P.tags.splice(+b.dataset.del,1);save();render();});
 M.querySelector("#ht_add").onclick=()=>{let n=1;while(hmiTag("Tag"+n))n++;P.tags.push({name:"Tag"+n,type:"Discrete",addr:"",rw:"R",desc:""});save();render();};
 M.querySelector("#ht_imp").onclick=()=>{const md=M.querySelector("#ht_modal");
  md.innerHTML=`<div class="hl-modal"><h3>${tt("Controller tags in KS_Trainer","Tag controller trong KS_Trainer")}</h3><p class="hl-help">${tt("Like C-more's “Import Tag Database” from an L5X. Pick the tags this screen needs.","Giống “Import Tag Database” từ file L5X của C-more. Chọn các tag màn hình này cần.")}</p>
  <div class="hl-implist">${ctl.filter(t=>!t.dim).map(t=>`<label><input type="checkbox" value="${t.name}" ${MISSION_TAGS.includes(t.name)?"checked":""} ${hmiTag(t.name)?"disabled":""}><span class="mono">${t.name}</span><small>${t.type} · ${esc(t.desc)}</small></label>`).join("")}</div>
  <div class="row"><button class="btn primary" id="hi_ok">${tt("Import selected","Nhập tag đã chọn")}</button><button class="btn ghost" id="hi_x">${tt("Cancel","Hủy")}</button></div></div>`;
  md.querySelector("#hi_x").onclick=()=>{md.innerHTML="";};
  md.querySelector("#hi_ok").onclick=()=>{md.querySelectorAll("input:checked:not(:disabled)").forEach(cb=>{const t=ctl.find(x=>x.name===cb.value);const type=t.type==="BOOL"?"Discrete":t.type==="REAL"?"Float":"Integer";
   P.tags.push({name:t.name,type,addr:t.name,rw:/^(HMI_.*(PB|Reset_Count|Ack)|IN_)/.test(t.name)?"RW":"R",desc:t.desc});});save();render();};};
 const nx=M.querySelector("[data-go2]");if(nx)nx.onclick=()=>{step=2;render();};}

function stepScreen(M){const o=P.objs.find(x=>x.id===sel);
 M.innerHTML=`<div class="hl-card hl-build"><div class="hl-pal"><b>${tt("Objects","Đối tượng")}</b>${Object.entries(OBJ).map(([k,v])=>`<button data-tool="${k}" aria-pressed="${tool===k}">${vi()?v.n[1]:v.n[0]}</button>`).join("")}
  <p class="hl-help">${tool?tt("Click on the screen to place it.","Bấm lên màn hình để đặt."):tt("Pick an object, then click on the screen. Drag to move, drag the corner to resize, Delete to remove.","Chọn đối tượng rồi bấm lên màn hình. Kéo để di chuyển, kéo góc để đổi cỡ, Delete để xóa.")}</p></div>
  <div class="hl-stage"><div class="hl-scrwrap" id="hlWrap"><div class="hl-scr edit" id="hlScr"></div></div></div>
  <div class="hl-props">${o?propsHTML(o):`<b>${tt("Properties","Thuộc tính")}</b><p class="hl-help">${tt("Select an object to edit its tag, text and colors.","Chọn một đối tượng để sửa tag, chữ và màu.")}</p>`}</div></div>
  <div class="row" style="margin-top:12px"><button class="btn" data-go2="3">${tt("Next: run it →","Tiếp: chạy thử →")}</button></div>`;
 M.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{tool=tool===b.dataset.tool?null:b.dataset.tool;render();});
 M.querySelector("[data-go2]").onclick=()=>{step=3;tool=null;sel=null;render();};
 drawScreen(M.querySelector("#hlScr"),false);fitScreen();
 if(o)bindProps(M,o);}
function propsHTML(o){const tagOpts=k=>`<select data-p="tag"><option value="">${tt("(no tag)","(không tag)")}</option>${P.tags.map(t=>`<option ${o.tag===t.name?"selected":""}>${esc(t.name)}</option>`).join("")}</select>`;
 const f=(k,label,type)=>`<label>${label}<input data-p="${k}" ${type?`type="${type}"`:""} value="${esc(o[k])}"></label>`;let h=`<b>${vi()?OBJ[o.type].n[1]:OBJ[o.type].n[0]}</b>`;
 if(["pb","lamp","num","entry","state"].includes(o.type))h+=`<label>${tt("Tag","Tag")}${tagOpts()}</label>`;
 if(o.type==="pb")h+=f("label",tt("Label","Chữ"))+`<label>${tt("Action","Tác động")}<select data-p="mode">${[["momentary",tt("Momentary ON","Nhấn nhả (ON khi giữ)")],["toggle",tt("Toggle","Đảo trạng thái")],["set",tt("Set (latch ON)","Set (giữ ON)")],["reset",tt("Reset (OFF)","Reset (OFF)")]].map(([k,n])=>`<option value="${k}" ${o.mode===k?"selected":""}>${n}</option>`).join("")}</select></label>`+f("color",tt("Color","Màu"),"color");
 if(o.type==="lamp")h+=f("label",tt("Label","Chữ"))+f("onColor",tt("ON color","Màu ON"),"color")+f("offColor",tt("OFF color","Màu OFF"),"color");
 if(o.type==="num"||o.type==="entry")h+=f("label",tt("Label","Chữ"))+f("dec",tt("Decimals","Số lẻ"),"number")+f("units",tt("Units","Đơn vị"));
 if(o.type==="entry")h+=f("min","Min","number")+f("max","Max","number");
 if(o.type==="state")h+=f("label",tt("Label","Chữ"))+`<label>${tt("States (value:text:color)","Trạng thái (giá trị:chữ:màu)")}<textarea data-p="states" rows="5">${esc(o.states)}</textarea></label>`;
 if(o.type==="text")h+=f("text",tt("Text","Chữ"))+f("size",tt("Size","Cỡ chữ"),"number")+f("color",tt("Color","Màu"),"color");
 if(o.type==="rect")h+=f("color",tt("Color","Màu"),"color");
 h+=`<div class="hl-xy">${["x","y","w","h"].map(k=>`<label>${k.toUpperCase()}<input data-p="${k}" type="number" value="${o[k]}"></label>`).join("")}</div>`;
 if(o.tag&&hmiTag(o.tag)){const c=tagCheck(hmiTag(o.tag));h+=`<div class="hl-chk ${c.ok?"ok":"bad"}">${c.ok?"✓ "+esc(o.tag)+" → "+esc(hmiTag(o.tag).addr):esc(c.msg)}</div>`;if(o.type==="pb"&&hmiTag(o.tag).rw!=="RW")h+=`<div class="hl-chk bad">${tt("This tag is Read only. A button needs Read/Write.","Tag này chỉ Read. Nút nhấn cần Read/Write.")}</div>`;}
 h+=`<button class="btn ghost" data-delobj="1">${tt("Delete object","Xóa đối tượng")}</button>`;return h;}
function bindProps(M,o){M.querySelectorAll("[data-p]").forEach(e=>{e.onchange=()=>{let v=e.value;if(["x","y","w","h","dec","min","max","size"].includes(e.dataset.p))v=+v;o[e.dataset.p]=v;save();render();};});
 M.querySelector("[data-delobj]").onclick=()=>{P.objs=P.objs.filter(x=>x.id!==o.id);sel=null;save();render();};}

let scale=1;
function fitScreen(){const w=root&&root.querySelector("#hlWrap");if(!w)return;const s=w.querySelector(".hl-scr");scale=Math.min(1,w.clientWidth/800);s.style.transform=`scale(${scale})`;w.style.height=(480*scale)+"px";}
window.addEventListener("resize",()=>{if(root)fitScreen();});
function stMap(o){return String(o.states||"").split(/\n/).map(l=>l.split(":")).filter(a=>a.length>=2).map(a=>({v:+a[0],t:a[1],c:a[2]||"#9ea4a3"}));}
function objHTML(o,run){const r=o.tag?readTag(o.tag):null;const bad=o.tag&&(!hmiTag(o.tag)||(r&&r.err==="####"));
 const val=r&&r.v!=null?r.v:null;const errTxt=r&&r.err?r.err:null;
 const fmt=(v,d)=>v==null?"":(+v).toFixed(+d||0);let inner="";
 if(o.type==="pb")inner=`<div class="hm-pb" style="background:${o.color};color:${lum(o.color)>.55?"#111":"#fff"}">${esc(o.label)}</div>`;
 if(o.type==="lamp"){const on=val?1:0;inner=`<div class="hm-lamp" style="background:${errTxt?"#3a3f3e":on?o.onColor:o.offColor};box-shadow:${on&&!errTxt?`0 0 18px ${o.onColor}`:"none"}"></div><div class="hm-lab">${esc(o.label)}</div>`;}
 if(o.type==="num"||o.type==="entry")inner=`<div class="hm-lab">${esc(o.label)}</div><div class="hm-val ${o.type==="entry"?"ent":""}">${errTxt?errTxt:run||val!=null?esc(fmt(val,o.dec)):"0"}${o.units?` <small>${esc(o.units)}</small>`:""}</div>`;
 if(o.type==="state"){const m=stMap(o);const s=m.find(x=>x.v===(+val))||{t:errTxt||(run?"?":m[0]&&m[0].t||""),c:"#9ea4a3"};inner=`<div class="hm-lab">${esc(o.label)}</div><div class="hm-st" style="background:${errTxt?"#9ea4a3":s.c};color:${lum(s.c)>.55?"#111":"#fff"}">${esc(errTxt||s.t)}</div>`;}
 if(o.type==="text")inner=`<div style="font-size:${+o.size||24}px;color:${o.color};font-weight:700;line-height:1">${esc(o.text)}</div>`;
 if(o.type==="rect")inner=`<div style="position:absolute;inset:0;background:${o.color};border-radius:4px"></div>`;
 return `<div class="hm-o t-${o.type} ${sel===o.id&&!run?"sel":""} ${bad?"bad":""}" data-o="${o.id}" style="left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px">${inner}${!run&&sel===o.id?'<span class="hm-rs" data-rs="1"></span>':""}</div>`;}
function lum(hex){const m=/^#?([0-9a-f]{6})$/i.exec(hex||"");if(!m)return 0;const n=parseInt(m[1],16);return(((n>>16)&255)*.299+((n>>8)&255)*.587+(n&255)*.114)/255;}
function drawScreen(scr,run){scr.innerHTML=P.objs.map(o=>objHTML(o,run)).join("")+(run&&!online()?`<div class="hm-comm">${tt("NO COMMUNICATION · test the connection in step 1","MẤT KẾT NỐI · kiểm tra kết nối ở bước 1")}</div>`:"");
 if(run)bindRuntime(scr);else bindEdit(scr);}
function bindEdit(scr){
 scr.onpointerdown=e=>{const pt=toScr(e,scr);const ob=e.target.closest("[data-o]");
  if(tool&&!ob){const d=OBJ[tool];const o={id:P.nextId++,type:tool,x:snap(pt.x-d.w/2),y:snap(pt.y-d.h/2),w:d.w,h:d.h,...JSON.parse(JSON.stringify(d.d))};clampO(o);P.objs.push(o);sel=o.id;tool=null;save();render();return;}
  if(!ob){sel=null;render();return;}
  const o=P.objs.find(x=>x.id===+ob.dataset.o);sel=o.id;const rs=!!e.target.closest("[data-rs]");const st={x:pt.x,y:pt.y,ox:o.x,oy:o.y,ow:o.w,oh:o.h};
  scr.setPointerCapture(e.pointerId);
  const mv=ev=>{const p=toScr(ev,scr);if(rs){o.w=Math.max(30,snap(st.ow+p.x-st.x));o.h=Math.max(24,snap(st.oh+p.y-st.y));}else{o.x=snap(st.ox+p.x-st.x);o.y=snap(st.oy+p.y-st.y);}clampO(o);const el=scr.querySelector(`[data-o="${o.id}"]`);if(el){el.style.left=o.x+"px";el.style.top=o.y+"px";el.style.width=o.w+"px";el.style.height=o.h+"px";}};
  const up=()=>{scr.removeEventListener("pointermove",mv);scr.removeEventListener("pointerup",up);save();render();};
  scr.addEventListener("pointermove",mv);scr.addEventListener("pointerup",up);e.preventDefault();};}
const snap=v=>Math.round(v/10)*10;function clampO(o){o.x=Math.max(0,Math.min(800-o.w,o.x));o.y=Math.max(0,Math.min(480-o.h,o.y));}
function toScr(e,scr){const r=scr.getBoundingClientRect();return{x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale};}

function stepRun(M){
 M.innerHTML=`<div class="hl-card"><h2>${tt("Runtime","Chạy thử")}</h2><p class="hl-help">${tt("Your screen is now live on the panel. The machine on the right is the trainer conveyor, driven by the same PLC. Try START, jam a box, then RESET.","Màn hình của bạn đang chạy trên panel. Máy bên phải là băng tải thực hành, cùng một PLC điều khiển. Thử START, làm kẹt hộp, rồi RESET.")}</p>
 <div class="hl-runwrap"><div class="hl-stage"><div class="hl-bezel"><div class="hl-scrwrap" id="hlWrap"><div class="hl-scr run" id="hlScr"></div></div><div class="hl-brand">${P.panel==="EA9-T7CL"?"C-more":"PanelView Plus 7"}</div></div></div>
 <div class="hl-field"><b>${tt("Machine (field devices)","Máy (thiết bị hiện trường)")}</b><canvas id="hlConv" width="560" height="190"></canvas>
  <div class="hl-fbtn"><button class="hm-fpb g" id="hf_start">START</button><button class="hm-fpb r" id="hf_stop">STOP</button><button class="btn" id="hf_estop"></button></div>
  <div class="row"><span class="hl-k">H-O-A</span><div class="seg" id="hf_hoa">${["HAND","OFF","AUTO"].map(h=>`<button data-h="${h}">${h}</button>`).join("")}</div><button class="btn" id="hf_jam"></button></div>
  <div class="hl-io" id="hf_io"></div></div></div></div>`;
 drawScreen(M.querySelector("#hlScr"),true);fitScreen();
 const F=KSPLC.F;const hold=(id,on,off)=>{const b=M.querySelector(id);b.onpointerdown=e=>{e.preventDefault();on();b.setPointerCapture(e.pointerId);};b.onpointerup=b.onpointercancel=off;};
 hold("#hf_start",()=>{F.startHold=9;},()=>{F.startHold=.05;});hold("#hf_stop",()=>{F.stopHold=9;},()=>{F.stopHold=.05;});
 M.querySelector("#hf_estop").onclick=()=>{F.estop=!F.estop;fieldUI();};M.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{F.hoa=b.dataset.h;fieldUI();});
 M.querySelector("#hf_jam").onclick=()=>{F.boxes[1].stuck=!F.boxes[1].stuck;fieldUI();};fieldUI();}
function fieldUI(){if(!root)return;const F=KSPLC.F,M=root;const e=M.querySelector("#hf_estop");if(!e)return;
 e.textContent=F.estop?tt("E-STOP pressed (click to reset)","E-STOP đang nhấn (bấm để reset)"):tt("E-STOP","E-STOP");e.classList.toggle("hot",F.estop);
 M.querySelectorAll("[data-h]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.h===F.hoa));
 M.querySelector("#hf_jam").textContent=F.boxes[1].stuck?tt("Clear jammed box","Gỡ hộp bị kẹt"):tt("Jam a box","Làm kẹt một hộp");}
function bindRuntime(scr){scr.querySelectorAll(".t-pb,.t-entry").forEach(el=>{const o=P.objs.find(x=>x.id===+el.dataset.o);if(!o)return;
 if(o.type==="pb"){el.onpointerdown=e=>{e.preventDefault();el.classList.add("down");const cur=readTag(o.tag).v;if(o.mode==="momentary")writeTag(o.tag,1);if(o.mode==="toggle")writeTag(o.tag,cur?0:1);if(o.mode==="set")writeTag(o.tag,1);if(o.mode==="reset")writeTag(o.tag,0);el.setPointerCapture(e.pointerId);};
  el.onpointerup=el.onpointercancel=()=>{el.classList.remove("down");if(o.mode==="momentary")writeTag(o.tag,0);};}
 if(o.type==="entry")el.onclick=()=>keypad(o);});}
function keypad(o){const md=document.createElement("div");md.className="hl-kp";md.innerHTML=`<div class="hl-modal"><h3>${esc(o.label)}</h3><p class="hl-help">${tt("Range","Khoảng")} ${o.min} – ${o.max}</p><input type="number" step="any" class="mono" id="kpv"><div class="row"><button class="btn primary" id="kpok">Enter</button><button class="btn ghost" id="kpx">${tt("Cancel","Hủy")}</button></div><p class="hl-msg bad" id="kpm"></p></div>`;
 root.appendChild(md);const i=md.querySelector("#kpv");i.focus();md.querySelector("#kpx").onclick=()=>md.remove();
 md.querySelector("#kpok").onclick=()=>{const v=parseFloat(i.value);if(isNaN(v)||v<+o.min||v>+o.max){md.querySelector("#kpm").textContent=tt("Value out of range.","Giá trị ngoài khoảng.");return;}if(!writeTag(o.tag,v)){md.querySelector("#kpm").textContent=tt("Write failed: check the tag is Read/Write and the PLC is online.","Ghi thất bại: kiểm tra tag Read/Write và PLC online.");return;}md.remove();};}

function tick(){if(!root)return;
 if(step===3){const scr=root.querySelector("#hlScr");if(scr){P.objs.forEach(o=>{const el=scr.querySelector(`[data-o="${o.id}"]`);if(!el||o.type==="pb"||o.type==="text"||o.type==="rect")return;const tmp=document.createElement("div");tmp.innerHTML=objHTML(o,true);el.innerHTML=tmp.firstChild.innerHTML;});
   const comm=scr.querySelector(".hm-comm");if(!online()&&!comm)drawScreen(scr,true);if(online()&&comm)comm.remove();}
  drawConv();const io=root.querySelector("#hf_io");if(io){const T=KSPLC.PLC.tags;io.innerHTML=[["OUT_Motor_Run","VFD RUN"],["OUT_Run_Light","RUN"],["OUT_Fault_Light","FAULT"],["OUT_Jam_Beacon","BEACON"]].map(([k,n])=>`<span class="${T[k]?"on":""} ${k==="OUT_Fault_Light"?"red":k==="OUT_Jam_Beacon"?"amb":""}"><i></i>${n}</span>`).join("")+`<span class="hl-k">VFD ${KSPLC.F.hz.toFixed(1)} Hz</span>`;}
  const was=P.ranTest;mission();if(P.ranTest&&!was){save();render();}}
 if(step===1){root.querySelectorAll("[data-live]").forEach(td=>{const r=readTag(td.dataset.live);td.textContent=r.err?r.err:(typeof r.v==="number"?(Number.isInteger(r.v)?r.v:r.v.toFixed(2)):String(r.v));});}
 const ol=root.querySelector(".hl-online");if(ol){ol.classList.toggle("on",online());ol.textContent=online()?tt("PLC online","PLC online"):tt("PLC offline","PLC offline");}}
function drawConv(){const c=root.querySelector("#hlConv");if(!c)return;const g=c.getContext("2d"),W=c.width,H=c.height,F=KSPLC.F,T=KSPLC.PLC.tags;
 const cs=getComputedStyle(document.body);const ink=cs.getPropertyValue("--ink")||"#222",mut=cs.getPropertyValue("--mut")||"#777";
 g.clearRect(0,0,W,H);const X=x=>40+(x+1.5)/3*(W-120),by=110;
 g.fillStyle="#2b3033";g.fillRect(30,by,W-100,18);g.strokeStyle="#4a5257";for(let i=0;i<24;i++){const xx=30+((i*22-F.travel*60)%(W-100)+(W-100))%(W-100);g.beginPath();g.moveTo(xx,by);g.lineTo(xx+8,by+18);g.stroke();}
 g.fillStyle="#3b5f8c";g.fillRect(30,by+18,W-100,8);[60,W/2,W-90].forEach(x=>g.fillRect(x,by+26,8,44));
 F.boxes.forEach(b=>{if(b.x<-1.45||b.x>1.38)return;g.fillStyle=b.stuck?"#c97a2a":"#b98a52";g.fillRect(X(b.x)-24,by-44,48,44);g.strokeStyle="#7b5a35";g.strokeRect(X(b.x)-24,by-44,48,44);});
 const ex=X(0);g.fillStyle="#f2c200";g.fillRect(ex-6,by-78,12,18);g.strokeStyle=F.eye?"rgba(255,80,60,.25)":"rgba(255,60,40,.9)";g.setLineDash([4,4]);g.beginPath();g.moveTo(ex,by-60);g.lineTo(ex,by-4);g.stroke();g.setLineDash([]);
 g.fillStyle=mut.trim();g.font="12px sans-serif";g.fillText(tt("photo-eye","mắt quang"),ex+10,by-66);
 const mx=W-40,my=by+8;g.fillStyle="#2f5c8a";g.beginPath();g.arc(mx,my,24,0,7);g.fill();g.save();g.translate(mx,my);g.rotate(F.travel*12);g.fillStyle="#d8a400";g.fillRect(-18,-3,36,6);g.restore();
 g.fillStyle=ink.trim();g.font="600 13px sans-serif";g.fillText("M1",mx-8,my+42);
 if(T.OUT_Jam_Beacon){g.fillStyle="#ffb000";g.beginPath();g.arc(ex,by-92,8,0,7);g.fill();}}

return{mount,unmount};
})();

</script>
