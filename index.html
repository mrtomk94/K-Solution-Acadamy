        { t: "p", en: "A **load center** is the breaker panel. Two hot bus bars run down the middle. Breakers snap on and alternate L1, L2, L1, L2 down each side.", vi: "**Load center** là tủ CB. Hai thanh cái nóng (bus bar) chạy giữa tủ. CB gắn vào và xen kẽ L1, L2, L1, L2 theo từng bên." },
        { t: "list", en: ["A **1-pole** breaker takes one space → 120 V.", "A **2-pole** breaker takes two spaces (L1 + L2) → 240 V.", "**Neutral bar**: white wires land here.", "**Ground bar**: bare / green wires land here.", "Panel cover (dead front) and the directory label must be filled out."],
                vi: ["CB **1 cực (1-pole)** chiếm một chỗ → 120 V.", "CB **2 cực (2-pole)** chiếm hai chỗ (L1 + L2) → 240 V.", "**Thanh neutral**: dây trắng đấu vào đây.", "**Thanh ground**: dây trần / xanh lá đấu vào đây.", "Nắp tủ (dead front) và bảng ghi tên mạch phải ghi đầy đủ."] },
        { t: "table", head: { en: ["Breaker type", "What it protects", "Where"], vi: ["Loại CB", "Bảo vệ gì", "Ở đâu"] },
          rows: { en: [["Standard", "Overload + short circuit", "General circuits"], ["GFCI", "Ground fault (people)", "Wet areas — NEC 210.8"], ["AFCI", "Arc faults (fire)", "Living areas — NEC 210.12"], ["Dual-function", "Both GFCI + AFCI", "Kitchens, laundry"]],
                  vi: [["Thường", "Quá tải + ngắn mạch", "Mạch thông thường"], ["GFCI", "Rò điện xuống đất (bảo vệ người)", "Khu vực ẩm ướt — NEC 210.8"], ["AFCI", "Hồ quang (chống cháy)", "Khu sinh hoạt — NEC 210.12"], ["Dual-function", "Cả GFCI + AFCI", "Bếp, phòng giặt"]] } },
        { t: "callout", kind: "tip", en: "Use only breakers listed for that panel brand and type. A breaker that “fits” is not always allowed.", vi: "Chỉ dùng CB được chứng nhận cho đúng hãng và loại tủ. CB “gắn vừa” chưa chắc đã được phép." },
        { t: "callout", kind: "kit", en: "In the 3D classroom, walk to the practice stud wall and click the 200 A load center to see the bus, neutral bar and ground bar.", vi: "Trong lớp học 3D, đi tới vách tường tập và bấm vào tủ 200 A để xem thanh cái, thanh neutral và thanh ground." }
      ] },
      { id: "l3", title: { en: "Grounding & Bonding", vi: "Nối đất & đẳng thế (grounding & bonding)" }, minutes: 20, blocks: [
        { t: "p", en: "**Grounding** connects the system to the earth. **Bonding** connects metal parts together so a fault trips the breaker fast. NEC Article 250 covers both.", vi: "**Grounding** là nối hệ thống xuống đất. **Bonding** là nối các phần kim loại lại với nhau để khi có sự cố thì CB nhảy nhanh. NEC Article 250 quy định cả hai." },
        { t: "h", en: "Neutral-to-ground bond: one place only", vi: "Nối neutral với ground: chỉ một chỗ" },
        { t: "list", en: ["At the **service / main panel**: neutral and ground are bonded (main bonding jumper or green screw).", "At a **subpanel**: neutral and ground are kept **separate**. Remove the bonding screw. Use a 4-wire feeder.", "Bonding in two places puts normal neutral current on ground wires and metal pipes."],
                vi: ["Tại **tủ chính / service**: neutral và ground được nối chung (main bonding jumper hoặc vít xanh).", "Tại **tủ phụ (subpanel)**: neutral và ground phải **tách riêng**. Tháo vít bonding. Dùng dây cấp 4 sợi.", "Nối ở hai chỗ sẽ làm dòng neutral bình thường chạy trên dây ground và ống kim loại."] },
        { t: "h", en: "Grounding electrode system", vi: "Hệ thống điện cực nối đất" },
        { t: "list", en: ["**Ground rods**: 8 ft rods; if you need two, keep them at least 6 ft apart.", "**Concrete-encased electrode (Ufer)**: rebar or copper in the footing. Very good electrode in new builds.", "**Metal water pipe**: bond it near where it enters the house.", "Gas piping is bonded, but never used as the grounding electrode."],
                vi: ["**Cọc tiếp địa**: cọc dài 8 ft; nếu cần hai cọc, đặt cách nhau ít nhất 6 ft.", "**Điện cực trong bê tông (Ufer)**: thép hoặc đồng trong móng nhà. Điện cực rất tốt cho nhà mới.", "**Ống nước kim loại**: bond gần chỗ ống đi vào nhà.", "Ống gas phải được bond, nhưng không bao giờ dùng làm điện cực nối đất."] },
        { t: "callout", kind: "warn", en: "Never cut or remove a grounding electrode conductor or water-pipe bond on an energized service. It can carry current.", vi: "Không bao giờ cắt hoặc tháo dây nối đất hay dây bond ống nước khi hệ thống đang có điện. Nó có thể đang mang dòng." },
        { t: "lab", title: { en: "Find the bond", vi: "Tìm điểm bond" }, steps: {
          en: ["With the instructor, open the de-energized practice load center (LOTO first).", "Find the main bonding screw or strap. Note its color.", "Trace the grounding electrode conductor to its lug.", "Compare with a subpanel diagram: where is the bond missing, and why?", "Write the panel directory for 6 circuits."],
          vi: ["Cùng giảng viên mở tủ tập đã cắt điện (khóa LOTO trước).", "Tìm vít hoặc thanh bonding chính. Ghi lại màu của nó.", "Dò dây nối đất (GEC) tới đầu cosse.", "So với sơ đồ tủ phụ: chỗ nào không có bond, và vì sao?", "Ghi bảng tên mạch cho 6 mạch."] } }
      ] }
    ],
    quiz: [
      { q: { en: "In a 120/240 V split-phase service, what do you read from L1 to L2?", vi: "Trong nguồn split-phase 120/240 V, đo giữa L1 và L2 được bao nhiêu?" }, opts: { en: ["120 V", "208 V", "240 V", "480 V"], vi: ["120 V", "208 V", "240 V", "480 V"] }, a: 2, why: { en: "Each leg is 120 V to neutral; leg to leg is 240 V.", vi: "Mỗi dây nóng tới neutral là 120 V; giữa hai dây nóng là 240 V." } },
      { q: { en: "Where are neutral and ground bonded together?", vi: "Neutral và ground được nối chung ở đâu?" }, opts: { en: ["At every panel", "Only at the service / main disconnect", "Only at subpanels", "At every outlet"], vi: ["Ở mọi tủ", "Chỉ ở tủ chính / service", "Chỉ ở tủ phụ", "Ở mọi ổ cắm"] }, a: 1, why: { en: "One bond point at the service. Subpanels keep them separate.", vi: "Chỉ một điểm bond ở service. Tủ phụ phải tách riêng." } },
      { q: { en: "A 2-pole breaker supplies…", vi: "CB 2 cực cấp điện…" }, opts: { en: ["120 V", "240 V", "24 V DC", "Only the neutral"], vi: ["120 V", "240 V", "24 V DC", "Chỉ dây neutral"] }, a: 1, why: { en: "It connects to both L1 and L2.", vi: "Nó nối vào cả L1 và L2." } },
      { q: { en: "Which breaker is mainly for fire protection from damaged wiring?", vi: "CB nào chủ yếu để chống cháy do dây hư?" }, opts: { en: ["GFCI", "AFCI", "Standard", "Main"], vi: ["GFCI", "AFCI", "Thường", "CB tổng"] }, a: 1, why: { en: "AFCI detects arcing. GFCI protects people from shock.", vi: "AFCI phát hiện hồ quang. GFCI bảo vệ người khỏi bị giật." } },
      { q: { en: "With the main breaker OFF, which part is still energized?", vi: "Khi tắt CB tổng, phần nào vẫn có điện?" }, opts: { en: ["Branch breakers", "Neutral bar", "Line side of the main and the meter base", "Nothing"], vi: ["Các CB nhánh", "Thanh neutral", "Phía line của CB tổng và đế đồng hồ", "Không có gì"] }, a: 2, why: { en: "Utility power still reaches the main's line terminals.", vi: "Điện từ công ty điện vẫn tới đầu line của CB tổng." } }
    ]
  },
  /* ================= c-res-wiring ================= */
  {
    id: "c-res-wiring",
    title: { en: "Cable, Wire & Boxes", vi: "Cáp, dây & hộp điện" },
    summary: { en: "Pick the right NM-B cable, run it through studs the right way, choose boxes, count box fill, and make good terminations.", vi: "Chọn đúng cáp NM-B, đi dây qua khung tường đúng cách, chọn hộp, tính box fill, và đấu nối chắc chắn." },
    level: "Beginner", minutes: 60,
    lessons: [
      { id: "l1", title: { en: "NM-B Cable and Wire Colors", vi: "Cáp NM-B và màu dây" }, minutes: 15, blocks: [
        { t: "p", en: "**NM-B** (often called Romex) is the cable used inside most house walls. The sheath color tells you the wire size.", vi: "**NM-B** (thường gọi là Romex) là loại cáp dùng trong tường hầu hết nhà ở. Màu vỏ cho biết cỡ dây." },
        { t: "table", head: { en: ["Sheath", "Wire size", "Typical breaker"], vi: ["Màu vỏ", "Cỡ dây", "CB thường dùng"] },
          rows: { en: [["White", "14 AWG Cu", "15 A"], ["Yellow", "12 AWG Cu", "20 A"], ["Orange", "10 AWG Cu", "30 A"], ["Black", "8 or 6 AWG Cu", "40–55 A (check tables)"]],
                  vi: [["Trắng", "14 AWG đồng", "15 A"], ["Vàng", "12 AWG đồng", "20 A"], ["Cam", "10 AWG đồng", "30 A"], ["Đen", "8 hoặc 6 AWG đồng", "40–55 A (tra bảng)"]] } },
        { t: "list", en: ["**14/2 with ground**: black, white, bare. One circuit.", "**14/3 with ground**: black, red, white, bare. 3-way switches, or two circuits sharing a neutral (needs a 2-pole/handle-tied breaker).", "Black / red = hot. White = neutral. Bare / green = equipment ground.", "If a white wire is used as a hot (switch loop), re-mark it with black tape."],
                vi: ["**14/2 có ground**: đen, trắng, trần. Một mạch.", "**14/3 có ground**: đen, đỏ, trắng, trần. Dùng cho công tắc 3 chiều, hoặc hai mạch dùng chung neutral (cần CB 2 cực/cần gạt nối chung).", "Đen / đỏ = nóng. Trắng = neutral. Trần / xanh lá = dây tiếp địa thiết bị.", "Nếu dây trắng dùng làm dây nóng (switch loop), quấn băng keo đen để đánh dấu lại."] },
        { t: "callout", kind: "tip", en: "Read the jacket print: “12-2 W/G TYPE NM-B 600V”. It tells you size, count, ground, and type.", vi: "Đọc chữ in trên vỏ: “12-2 W/G TYPE NM-B 600V”. Nó cho biết cỡ, số sợi, có ground, và loại cáp." }
      ] },
      { id: "l2", title: { en: "Running Cable Through Studs", vi: "Đi cáp qua khung tường" }, minutes: 15, blocks: [
        { t: "svg", svg: "<svg viewBox=\"0 0 540 240\"><rect x=\"20\" y=\"20\" width=\"500\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><rect x=\"20\" y=\"206\" width=\"500\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"40\" y=\"34\" width=\"14\" height=\"172\"/><rect x=\"160\" y=\"34\" width=\"14\" height=\"172\"/><rect x=\"280\" y=\"34\" width=\"14\" height=\"172\"/><rect x=\"400\" y=\"34\" width=\"14\" height=\"172\"/><rect x=\"506\" y=\"34\" width=\"14\" height=\"172\"/></g><text x=\"80\" y=\"60\" fill=\"currentColor\" font-size=\"12\">16 in on center</text><path d=\"M47 66 H167\" stroke=\"currentColor\" fill=\"none\" stroke-dasharray=\"4 3\"/><rect x=\"296\" y=\"130\" width=\"28\" height=\"40\" rx=\"3\" fill=\"none\" style=\"stroke:var(--accent)\" stroke-width=\"2.5\"/><text x=\"330\" y=\"160\" font-size=\"12\" style=\"fill:var(--accent)\">box</text><path d=\"M30 110 H287 Q310 110 310 130\" fill=\"none\" style=\"stroke:var(--accent)\" stroke-width=\"3\"/><g stroke=\"currentColor\" stroke-width=\"2\" fill=\"none\"><path d=\"M276 104 v12\"/><path d=\"M160 104 v12\"/></g><text x=\"190\" y=\"100\" fill=\"currentColor\" font-size=\"11\">staple ≤ 12 in from box</text><text x=\"60\" y=\"132\" fill=\"currentColor\" font-size=\"11\">hole 1¼ in from edge</text><text x=\"60\" y=\"232\" fill=\"currentColor\" font-size=\"11\">bottom plate</text></svg>",
          cap: { en: "Cable drilled through studs, stapled within 12 in of the box, box flush with the drywall face.", vi: "Cáp khoan xuyên qua stud, bấm đinh trong vòng 12 in từ hộp, hộp ngang mặt tấm thạch cao." } },
        { t: "steps", en: ["Drill holes in the center of the stud, at least **1¼ in** from the face. If closer, add a steel **nail plate**.", "Pull the cable without twisting or kinking.", "Staple within **12 in** of each box and at least every **4½ ft**.", "Leave at least 6 in of free conductor in the box (3 in past the box face).", "Do not staple flat cable on edge or crush the jacket."],
                vi: ["Khoan lỗ giữa stud, cách mặt stud ít nhất **1¼ in**. Nếu gần hơn thì gắn **tấm thép chống đinh (nail plate)**.", "Kéo cáp, không để xoắn hay gập.", "Bấm đinh trong vòng **12 in** từ mỗi hộp và tối đa mỗi **4½ ft**.", "Chừa ít nhất 6 in dây trong hộp (dư 3 in ra khỏi mặt hộp).", "Không bấm cáp dẹt nằm nghiêng hoặc làm dập vỏ."] },
        { t: "callout", kind: "tip", en: "Drywall screws are about 1¼ in long. That is why the 1¼ in rule exists.", vi: "Vít bắt tấm thạch cao dài khoảng 1¼ in. Đó là lý do có quy định 1¼ in." }
      ] },
      { id: "l3", title: { en: "Boxes and Box Fill", vi: "Hộp điện và box fill" }, minutes: 15, blocks: [
        { t: "table", head: { en: ["Box", "Use"], vi: ["Loại hộp", "Dùng khi"] },
          rows: { en: [["New-work (nail-on)", "Open studs, new construction"], ["Old-work (remodel)", "Existing finished walls; ears clamp the drywall"], ["Plastic (PVC)", "With NM cable; nothing to bond"], ["Metal", "With conduit/MC; must be grounded"], ["Fan-rated ceiling box", "Ceiling fans — marked for fan support"]],
                  vi: [["New-work (đóng đinh)", "Khung hở, nhà xây mới"], ["Old-work (remodel)", "Tường đã hoàn thiện; tai kẹp vào tấm thạch cao"], ["Nhựa (PVC)", "Dùng với cáp NM; không cần bond"], ["Kim loại", "Dùng với ống/MC; phải nối đất"], ["Hộp trần chịu quạt", "Quạt trần — có ghi chịu được quạt"]] } },
        { t: "h", en: "Box fill (NEC 314.16)", vi: "Box fill (NEC 314.16)" },
        { t: "list", en: ["Each hot and neutral conductor = 1 volume.", "All equipment grounds together = 1 volume.", "Each device (outlet/switch) = 2 volumes.", "Volume per conductor: 14 AWG = 2.00 in³, 12 AWG = 2.25 in³."],
                vi: ["Mỗi dây nóng và neutral = 1 phần thể tích.", "Tất cả dây ground gộp lại = 1 phần.", "Mỗi thiết bị (ổ cắm/công tắc) = 2 phần.", "Thể tích mỗi dây: 14 AWG = 2,00 in³, 12 AWG = 2,25 in³."] },
        { t: "p", en: "Example: two 12/2 cables + one outlet → 4 conductors + 1 (grounds) + 2 (device) = 7 × 2.25 = **15.75 in³**. An 18 in³ box works.", vi: "Ví dụ: hai cáp 12/2 + một ổ cắm → 4 dây + 1 (ground) + 2 (thiết bị) = 7 × 2,25 = **15,75 in³**. Hộp 18 in³ là đủ." }
      ] },
      { id: "l4", title: { en: "Good Terminations", vi: "Đấu nối chắc chắn" }, minutes: 15, blocks: [
        { t: "table", head: { en: ["Method", "Notes"], vi: ["Cách đấu", "Ghi chú"] },
          rows: { en: [["Screw terminal", "Hook clockwise, 3/4 turn, tighten to the device torque."], ["Back-wire clamp", "Straight wire under a clamp plate. Strong and fast."], ["Push-in (backstab)", "Allowed on some devices, 14 AWG only. Loosens over time — pros avoid it."], ["Lever nut (Wago)", "Strip to the gauge, push in, close lever. Easy to inspect."], ["Twist-on wire nut", "Pre-twist or not per maker; tug-test every wire."]],
                  vi: [["Vít bắt dây", "Uốn móc theo chiều kim đồng hồ, 3/4 vòng, siết đúng lực của thiết bị."], ["Kẹp sau (back-wire)", "Dây thẳng dưới tấm kẹp. Chắc và nhanh."], ["Cắm nhanh (backstab)", "Một số thiết bị cho phép, chỉ 14 AWG. Lâu ngày bị lỏng — thợ giỏi tránh dùng."], ["Kẹp đòn bẩy (Wago)", "Tuốt theo thước, cắm vào, đóng cần. Dễ kiểm tra."], ["Chụp xoắn (wire nut)", "Xoắn trước hay không tùy hãng; giật thử từng dây."]] } },
        { t: "callout", kind: "tip", en: "Loose connections cause most burned outlets. Use a torque screwdriver when the device lists a torque value.", vi: "Đấu lỏng là nguyên nhân chính làm cháy ổ cắm. Dùng tua vít lực khi thiết bị có ghi lực siết." },
        { t: "lab", title: { en: "Rough-in one outlet", vi: "Đi dây thô một ổ cắm" }, steps: {
          en: ["On the practice stud wall, mount a blue PVC new-work box 12–16 in above the floor.", "Drill two studs and pull 12/2 from the panel location to the box.", "Staple correctly; add a nail plate where the hole is too close.", "Strip the jacket, leave 6 in of conductor, fold neatly.", "Calculate box fill and write it on the box with a marker.", "Instructor checks before any device goes in."],
          vi: ["Trên vách tường tập, gắn hộp PVC new-work màu xanh cao 12–16 in so với sàn.", "Khoan hai stud và kéo cáp 12/2 từ vị trí tủ tới hộp.", "Bấm đinh đúng; gắn nail plate chỗ lỗ quá gần mặt stud.", "Tuốt vỏ, chừa 6 in dây, gấp gọn.", "Tính box fill và viết lên hộp bằng bút lông.", "Giảng viên kiểm tra trước khi lắp thiết bị."] } }
      ] }
    ],
    quiz: [
      { q: { en: "Yellow NM-B sheath means…", vi: "Vỏ cáp NM-B màu vàng nghĩa là…" }, opts: { en: ["14 AWG", "12 AWG", "10 AWG", "UF cable"], vi: ["14 AWG", "12 AWG", "10 AWG", "Cáp UF"] }, a: 1, why: { en: "Yellow = 12 AWG, typically on a 20 A breaker.", vi: "Vàng = 12 AWG, thường dùng với CB 20 A." } },
      { q: { en: "Holes in studs closer than 1¼ in to the face need…", vi: "Lỗ khoan cách mặt stud dưới 1¼ in cần…" }, opts: { en: ["Tape", "A steel nail plate", "A bigger box", "Nothing"], vi: ["Băng keo", "Tấm thép nail plate", "Hộp lớn hơn", "Không cần gì"] }, a: 1, why: { en: "The plate protects the cable from drywall screws and nails.", vi: "Tấm thép bảo vệ cáp khỏi vít và đinh." } },
      { q: { en: "How close to a box must NM cable be stapled?", vi: "Phải bấm đinh cáp NM cách hộp tối đa bao nhiêu?" }, opts: { en: ["Within 12 in", "Within 3 ft", "Within 4½ ft", "No rule"], vi: ["Trong vòng 12 in", "Trong vòng 3 ft", "Trong vòng 4½ ft", "Không có quy định"] }, a: 0, why: { en: "Within 12 in of the box, then at least every 4½ ft.", vi: "Trong vòng 12 in từ hộp, sau đó tối đa mỗi 4½ ft." } },
      { q: { en: "In box fill, one receptacle counts as…", vi: "Trong box fill, một ổ cắm tính là…" }, opts: { en: ["0 volumes", "1 volume", "2 volumes", "4 volumes"], vi: ["0 phần", "1 phần", "2 phần", "4 phần"] }, a: 2, why: { en: "Each device yoke counts as 2 conductor volumes.", vi: "Mỗi thiết bị tính bằng 2 phần thể tích dây." } },
      { q: { en: "A white wire used as a hot in a switch loop must be…", vi: "Dây trắng dùng làm dây nóng trong switch loop phải…" }, opts: { en: ["Left as is", "Re-marked black or red", "Connected to ground", "Cut off"], vi: ["Để nguyên", "Đánh dấu lại màu đen hoặc đỏ", "Nối vào ground", "Cắt bỏ"] }, a: 1, why: { en: "Re-identify it so the next person knows it is hot.", vi: "Đánh dấu lại để người sau biết đó là dây nóng." } }
    ]
  },
  /* ================= c-res-devices ================= */
  {
    id: "c-res-devices",
    title: { en: "Outlets, Switches & Lights", vi: "Ổ cắm, công tắc & đèn" },
    summary: { en: "Wire receptacles, GFCIs, single-pole, 3-way and 4-way switches, dimmers, fans and interconnected smoke alarms.", vi: "Đấu ổ cắm, GFCI, công tắc 1 chiều, 3 chiều, 4 chiều, dimmer, quạt trần và chuông báo khói liên kết." },
    level: "Beginner", minutes: 75,
    lessons: [
      { id: "l1", title: { en: "Receptacles and GFCIs", vi: "Ổ cắm và GFCI" }, minutes: 20, blocks: [
        { t: "list", en: ["**Brass** screw = hot (black). **Silver** screw = neutral (white). **Green** screw = ground.", "Wide slot is neutral, narrow slot is hot.", "New dwelling receptacles must be **tamper-resistant (TR)** — NEC 406.12.", "Pigtail grounds together, then one lead to the device."],
                vi: ["Vít **vàng (đồng)** = nóng (đen). Vít **bạc** = neutral (trắng). Vít **xanh lá** = ground.", "Khe rộng là neutral, khe hẹp là nóng.", "Ổ cắm nhà ở mới phải là loại **chống nhét (TR)** — NEC 406.12.", "Nối các dây ground chung, rồi một dây ra thiết bị."] },
        { t: "h", en: "GFCI: LINE vs LOAD", vi: "GFCI: LINE và LOAD" },
        { t: "list", en: ["**LINE** terminals = power coming in from the panel.", "**LOAD** terminals = feed downstream outlets you want protected.", "Swap them and most GFCIs will not reset or will not protect downstream.", "Mark protected outlets with the “GFCI Protected” sticker."],
                vi: ["Đầu **LINE** = nguồn đi vào từ tủ.", "Đầu **LOAD** = cấp cho các ổ phía sau mà bạn muốn được bảo vệ.", "Đấu ngược thì đa số GFCI sẽ không reset được hoặc không bảo vệ phía sau.", "Dán nhãn “GFCI Protected” lên các ổ được bảo vệ."] },
        { t: "p", en: "A GFCI compares current on hot and neutral. If about **5 mA** goes missing (leaking through a person), it trips in a fraction of a second.", vi: "GFCI so sánh dòng trên dây nóng và neutral. Nếu thiếu khoảng **5 mA** (rò qua người), nó nhảy trong chưa tới một giây." },
        { t: "table", head: { en: ["3-light tester shows", "Meaning"], vi: ["Đèn thử 3 bóng báo", "Ý nghĩa"] },
          rows: { en: [["Correct", "Wired right"], ["Open ground", "No ground connection"], ["Open neutral", "Neutral broken"], ["Hot/neutral reversed", "Black and white swapped"], ["No lights", "No power (check GFCI/breaker)"]],
                  vi: [["Correct", "Đấu đúng"], ["Open ground", "Mất ground"], ["Open neutral", "Đứt neutral"], ["Hot/neutral reversed", "Đen và trắng bị đấu ngược"], ["Không đèn", "Mất điện (kiểm tra GFCI/CB)"]] } },
        { t: "callout", kind: "tip", en: "A plug-in tester cannot detect a bootleg ground (neutral jumped to ground). Look inside the box.", vi: "Đèn thử cắm không phát hiện được ground giả (nối tắt neutral sang ground). Phải mở hộp ra xem." }
      ] },
      { id: "l2", title: { en: "Single-Pole, 3-Way and 4-Way Switches", vi: "Công tắc 1 chiều, 3 chiều và 4 chiều" }, minutes: 25, blocks: [
        { t: "p", en: "Switches break the **hot**, never the neutral. New switch boxes need a neutral available for smart switches.", vi: "Công tắc ngắt dây **nóng**, không bao giờ ngắt neutral. Hộp công tắc mới cần có sẵn neutral cho công tắc thông minh." },
        { t: "svg", svg: "<svg viewBox=\"0 0 560 230\"><text x=\"20\" y=\"22\" fill=\"currentColor\" font-size=\"13\" font-weight=\"700\">3-way switching</text><text x=\"20\" y=\"110\" fill=\"currentColor\" font-size=\"12\">Hot in</text><path d=\"M20 120 H100\" stroke=\"currentColor\" stroke-width=\"2\" fill=\"none\"/><circle cx=\"100\" cy=\"120\" r=\"5\" fill=\"currentColor\"/><text x=\"78\" y=\"145\" fill=\"currentColor\" font-size=\"11\">COM</text><path d=\"M100 120 L150 80\" stroke=\"currentColor\" stroke-width=\"3\" fill=\"none\"/><circle cx=\"155\" cy=\"78\" r=\"4\" fill=\"currentColor\"/><circle cx=\"155\" cy=\"162\" r=\"4\" fill=\"currentColor\"/><path d=\"M155 78 H345 M155 162 H345\" fill=\"none\" style=\"stroke:var(--accent)\" stroke-width=\"2.5\"/><text x=\"210\" y=\"70\" font-size=\"12\" style=\"fill:var(--accent)\">traveler (red)</text><text x=\"210\" y=\"182\" font-size=\"12\" style=\"fill:var(--accent)\">traveler (black)</text><circle cx=\"350\" cy=\"78\" r=\"4\" fill=\"currentColor\"/><circle cx=\"350\" cy=\"162\" r=\"4\" fill=\"currentColor\"/><path d=\"M355 78 L400 120\" stroke=\"currentColor\" stroke-width=\"3\" fill=\"none\"/><circle cx=\"400\" cy=\"120\" r=\"5\" fill=\"currentColor\"/><text x=\"390\" y=\"145\" fill=\"currentColor\" font-size=\"11\">COM</text><path d=\"M400 120 H470\" stroke=\"currentColor\" stroke-width=\"2\" fill=\"none\"/><circle cx=\"490\" cy=\"120\" r=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M476 106 L504 134 M504 106 L476 134\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"470\" y=\"160\" fill=\"currentColor\" font-size=\"12\">Light</text><text x=\"20\" y=\"215\" fill=\"currentColor\" font-size=\"11\">Neutral goes straight to the light. Ground goes to every switch and box.</text></svg>",
          cap: { en: "Hot to the COMMON of switch 1, two travelers between switches, COMMON of switch 2 to the light.", vi: "Dây nóng vào COMMON của công tắc 1, hai dây traveler nối giữa hai công tắc, COMMON của công tắc 2 ra đèn." } },
        { t: "steps", en: ["Find the **common** terminal (darker screw) on each 3-way.", "Run 14/3 between the switches: red and black are travelers.", "Line hot → common of switch 1.", "Common of switch 2 → light. Neutral spliced through to the light.", "For 3+ locations, put **4-way** switches between the two 3-ways on the travelers."],
                vi: ["Tìm đầu **common** (vít màu sẫm) trên mỗi công tắc 3 chiều.", "Kéo cáp 14/3 giữa hai công tắc: đỏ và đen là traveler.", "Dây nóng nguồn → common của công tắc 1.", "Common của công tắc 2 → đèn. Neutral nối thẳng tới đèn.", "Từ 3 vị trí trở lên, gắn công tắc **4 chiều** giữa hai công tắc 3 chiều trên đường traveler."] },
        { t: "callout", kind: "kit", en: "The 3D classroom stud wall has a 3-way pair at both ends of the hallway light. Click each switch to see the travelers.", vi: "Vách tường tập trong lớp 3D có cặp công tắc 3 chiều ở hai đầu cho đèn hành lang. Bấm vào từng công tắc để xem dây traveler." }
      ] },
      { id: "l3", title: { en: "Dimmers, Fans and Smoke Alarms", vi: "Dimmer, quạt trần và chuông báo khói" }, minutes: 15, blocks: [
        { t: "list", en: ["Use an LED-rated dimmer for LED lights; check the minimum load.", "Ceiling fans must hang from a box **listed for fan support**.", "Fan + light on separate switches needs 14/3 (or 12/3) from switch to fan.", "Smoke alarms in new work are hard-wired with battery backup and **interconnected**: one sounds, all sound.", "The interconnect is usually the red wire in 14/3 between alarms."],
                vi: ["Dùng dimmer cho đèn LED với đèn LED; kiểm tra tải tối thiểu.", "Quạt trần phải treo trên hộp **được chứng nhận chịu quạt**.", "Quạt + đèn điều khiển riêng cần cáp 14/3 (hoặc 12/3) từ công tắc tới quạt.", "Chuông báo khói nhà mới đấu điện cứng, có pin dự phòng và **liên kết với nhau**: một cái kêu thì tất cả kêu.", "Dây liên kết thường là dây đỏ trong cáp 14/3 giữa các chuông."] },
        { t: "callout", kind: "warn", en: "Turn off the breaker and test with a non-contact tester AND a meter before touching any device. Switch boxes can hold more than one circuit.", vi: "Tắt CB và đo bằng bút thử không tiếp xúc VÀ đồng hồ trước khi chạm thiết bị. Hộp công tắc có thể chứa nhiều hơn một mạch." },
        { t: "lab", title: { en: "Wire a GFCI and a 3-way", vi: "Đấu GFCI và công tắc 3 chiều" }, steps: {
          en: ["On the trainee panel's 120 VAC practice circuit (de-energized, LOTO), wire a GFCI with LINE from the breaker.", "Feed a second outlet from the GFCI LOAD terminals.", "Instructor energizes. Plug the tester into the second outlet: it should read Correct.", "Press TEST on the GFCI: the second outlet must go dead.", "De-energize and wire a 3-way pair to a lamp holder. Test from both ends."],
          vi: ["Trên mạch tập 120 VAC của tủ trainee (đã cắt điện, LOTO), đấu GFCI với LINE từ CB.", "Cấp cho ổ thứ hai từ đầu LOAD của GFCI.", "Giảng viên đóng điện. Cắm đèn thử vào ổ thứ hai: phải báo Correct.", "Nhấn TEST trên GFCI: ổ thứ hai phải mất điện.", "Cắt điện và đấu cặp công tắc 3 chiều cho đui đèn. Thử bật tắt từ cả hai đầu."] } }
      ] }
    ],
    quiz: [
      { q: { en: "Which screw on a receptacle gets the black hot wire?", vi: "Vít nào trên ổ cắm đấu dây nóng màu đen?" }, opts: { en: ["Silver", "Brass", "Green", "Any"], vi: ["Bạc", "Vàng (đồng)", "Xanh lá", "Vít nào cũng được"] }, a: 1, why: { en: "Brass = hot, silver = neutral, green = ground.", vi: "Vàng = nóng, bạc = neutral, xanh lá = ground." } },
      { q: { en: "To protect outlets downstream of a GFCI, wire them to…", vi: "Để bảo vệ các ổ phía sau GFCI, đấu chúng vào…" }, opts: { en: ["LINE", "LOAD", "Ground", "Neutral bar"], vi: ["LINE", "LOAD", "Ground", "Thanh neutral"] }, a: 1, why: { en: "LOAD terminals feed protected downstream outlets.", vi: "Đầu LOAD cấp cho các ổ phía sau được bảo vệ." } },
      { q: { en: "In a 3-way circuit, the two wires between the switches are called…", vi: "Trong mạch 3 chiều, hai dây giữa hai công tắc gọi là…" }, opts: { en: ["Commons", "Travelers", "Neutrals", "Grounds"], vi: ["Common", "Traveler", "Neutral", "Ground"] }, a: 1, why: { en: "Travelers carry the hot between the switches.", vi: "Traveler mang dây nóng qua lại giữa hai công tắc." } },
      { q: { en: "Switching a light from 3 places needs…", vi: "Bật tắt đèn từ 3 chỗ cần…" }, opts: { en: ["Three 3-ways", "Two 3-ways and one 4-way", "Three single-poles", "One dimmer"], vi: ["Ba công tắc 3 chiều", "Hai công tắc 3 chiều và một 4 chiều", "Ba công tắc 1 chiều", "Một dimmer"] }, a: 1, why: { en: "3-ways go at the ends, 4-ways in the middle.", vi: "Công tắc 3 chiều ở hai đầu, 4 chiều ở giữa." } },
      { q: { en: "Interconnected smoke alarms mean…", vi: "Chuông báo khói liên kết nghĩa là…" }, opts: { en: ["Each has its own breaker", "One alarm sounds, all sound", "They have no battery", "They use Wi-Fi only"], vi: ["Mỗi cái có CB riêng", "Một cái kêu thì tất cả kêu", "Không có pin", "Chỉ dùng Wi-Fi"] }, a: 1, why: { en: "So everyone in the house hears it.", vi: "Để mọi người trong nhà đều nghe thấy." } }
    ]
  },
  /* ================= c-res-circuits ================= */
  {
    id: "c-res-circuits",
    title: { en: "Kitchen, Bath, Laundry & 240 V Appliances", vi: "Bếp, phòng tắm, phòng giặt & thiết bị 240 V" },
    summary: { en: "The circuits every house needs, sizing 240 V appliance circuits, and a first look at load calculations.", vi: "Các mạch mà nhà nào cũng cần, chọn cỡ mạch cho thiết bị 240 V, và làm quen với tính tải." },
    level: "Intermediate", minutes: 60,
    lessons: [
      { id: "l1", title: { en: "Required Branch Circuits", vi: "Các mạch nhánh bắt buộc" }, minutes: 20, blocks: [
        { t: "list", en: ["**Kitchen counters**: two or more 20 A small-appliance circuits (NEC 210.52).", "**Bathroom**: at least one 20 A circuit for the bathroom receptacles.", "**Laundry**: at least one 20 A circuit.", "**Dedicated**: dishwasher, disposal, microwave, fridge often get their own circuit — follow the nameplate and local code.", "Receptacles in kitchens, baths, garages, outdoors, laundry areas and near sinks need GFCI protection (NEC 210.8)."],
                vi: ["**Mặt bếp**: hai mạch 20 A trở lên cho thiết bị nhỏ (NEC 210.52).", "**Phòng tắm**: ít nhất một mạch 20 A cho ổ cắm phòng tắm.", "**Phòng giặt**: ít nhất một mạch 20 A.", "**Mạch riêng**: máy rửa chén, máy nghiền rác, lò vi sóng, tủ lạnh thường có mạch riêng — theo nhãn thiết bị và code địa phương.", "Ổ cắm ở bếp, phòng tắm, garage, ngoài trời, phòng giặt và gần bồn rửa phải có bảo vệ GFCI (NEC 210.8)."] },
        { t: "callout", kind: "tip", en: "California uses the **California Electrical Code (CEC)**, which is based on the NEC, plus local amendments. When in doubt, check with your AHJ / inspector.", vi: "California dùng **California Electrical Code (CEC)**, dựa trên NEC, cộng thêm quy định địa phương. Khi không chắc, hỏi AHJ / inspector." }
      ] },
      { id: "l2", title: { en: "240 V Appliance Circuits", vi: "Mạch thiết bị 240 V" }, minutes: 20, blocks: [
        { t: "table", head: { en: ["Load", "Typical breaker", "Typical Cu wire"], vi: ["Thiết bị", "CB thường dùng", "Dây đồng thường dùng"] },
          rows: { en: [["Electric dryer", "30 A 2-pole", "10 AWG, 4-wire"], ["Electric range", "40–50 A 2-pole", "8–6 AWG, 4-wire"], ["Water heater 4500 W", "30 A 2-pole", "10 AWG"], ["A/C condenser", "Per nameplate MOCP", "Per nameplate MCA"], ["EV charger 32 A (Level 2)", "40 A 2-pole", "8 AWG"]],
                  vi: [["Máy sấy điện", "30 A 2 cực", "10 AWG, 4 dây"], ["Bếp điện", "40–50 A 2 cực", "8–6 AWG, 4 dây"], ["Bình nước nóng 4500 W", "30 A 2 cực", "10 AWG"], ["Dàn nóng máy lạnh", "Theo MOCP trên nhãn", "Theo MCA trên nhãn"], ["Sạc xe điện 32 A (Level 2)", "40 A 2 cực", "8 AWG"]] } },
        { t: "callout", kind: "warn", en: "These are typical sizes only. Always verify with the appliance nameplate, the installation manual, and the code before you buy wire.", vi: "Đây chỉ là cỡ thường gặp. Luôn kiểm tra nhãn thiết bị, hướng dẫn lắp đặt và code trước khi mua dây." },
        { t: "list", en: ["A/C condensers need a **disconnect within sight** of the unit.", "EV chargers and water heaters are continuous loads: the circuit is sized at **125%** of the load (32 A × 1.25 = 40 A).", "New dryer and range circuits are 4-wire: two hots, neutral, ground."],
                vi: ["Dàn nóng máy lạnh cần **cầu dao cách ly trong tầm nhìn** của máy.", "Sạc xe điện và bình nước nóng là tải liên tục: mạch tính bằng **125%** tải (32 A × 1,25 = 40 A).", "Mạch máy sấy và bếp mới là 4 dây: hai dây nóng, neutral, ground."] }
      ] },
      { id: "l3", title: { en: "Intro to Load Calculation", vi: "Làm quen với tính tải" }, minutes: 20, blocks: [
        { t: "p", en: "Before adding an ADU, EV charger or heat pump, you check whether the service can carry it. NEC **Article 220** gives the method.", vi: "Trước khi thêm ADU, sạc xe điện hay heat pump, phải kiểm tra nguồn có chịu nổi không. NEC **Article 220** đưa ra cách tính." },
        { t: "steps", en: ["List general lighting by square footage, plus small-appliance and laundry circuits.", "Apply the demand factors from Article 220.", "Add fixed appliances: range, dryer, water heater, A/C, EV charger.", "Convert total VA to amps at 240 V.", "Compare to the service rating (100 A, 200 A…)."],
                vi: ["Tính đèn chung theo diện tích, cộng mạch thiết bị nhỏ và phòng giặt.", "Áp dụng hệ số nhu cầu (demand factor) theo Article 220.", "Cộng thiết bị cố định: bếp, máy sấy, bình nước nóng, máy lạnh, sạc xe.", "Đổi tổng VA ra ampe ở 240 V.", "So với công suất nguồn (100 A, 200 A…)."] },
        { t: "callout", kind: "tip", en: "Older homes with a 100 A panel often need a service upgrade (or a load-management device) before an EV charger plus an ADU.", vi: "Nhà cũ dùng tủ 100 A thường phải nâng cấp nguồn (hoặc dùng thiết bị quản lý tải) trước khi thêm sạc xe điện và ADU." },
        { t: "lab", title: { en: "Plan a JADU kitchenette", vi: "Lên kế hoạch bếp nhỏ cho JADU" }, steps: {
          en: ["Sketch a JADU kitchenette: counter, sink, fridge, microwave, 240 V cooktop.", "List each circuit, breaker size and cable type.", "Mark which outlets need GFCI and which circuits need AFCI.", "Estimate the added load in VA.", "Review your plan with the instructor."],
          vi: ["Vẽ phác bếp nhỏ JADU: mặt bếp, bồn rửa, tủ lạnh, lò vi sóng, bếp 240 V.", "Liệt kê từng mạch, cỡ CB và loại cáp.", "Đánh dấu ổ nào cần GFCI và mạch nào cần AFCI.", "Ước tính tải tăng thêm theo VA.", "Xem lại kế hoạch với giảng viên."] } }
      ] }
    ],
    quiz: [
      { q: { en: "How many 20 A small-appliance circuits does a kitchen counter need at minimum?", vi: "Mặt bếp cần tối thiểu bao nhiêu mạch 20 A cho thiết bị nhỏ?" }, opts: { en: ["One", "Two", "Three", "None"], vi: ["Một", "Hai", "Ba", "Không cần"] }, a: 1, why: { en: "Two or more, per NEC 210.52.", vi: "Hai mạch trở lên, theo NEC 210.52." } },
      { q: { en: "A 32 A EV charger is a continuous load. The circuit should be at least…", vi: "Sạc xe điện 32 A là tải liên tục. Mạch phải ít nhất…" }, opts: { en: ["32 A", "35 A", "40 A", "60 A"], vi: ["32 A", "35 A", "40 A", "60 A"] }, a: 2, why: { en: "32 A × 125% = 40 A.", vi: "32 A × 125% = 40 A." } },
      { q: { en: "Where do you find an A/C condenser's breaker size?", vi: "Cỡ CB cho dàn nóng máy lạnh tìm ở đâu?" }, opts: { en: ["Guess by tonnage", "Nameplate MOCP", "Always 20 A", "The thermostat"], vi: ["Đoán theo tấn lạnh", "MOCP trên nhãn máy", "Luôn là 20 A", "Trên thermostat"] }, a: 1, why: { en: "Maximum overcurrent protection is printed on the nameplate.", vi: "Bảo vệ quá dòng tối đa có in trên nhãn máy." } },
      { q: { en: "Which NEC article covers load calculations?", vi: "Article nào của NEC nói về tính tải?" }, opts: { en: ["Article 220", "Article 250", "Article 406", "Article 314"], vi: ["Article 220", "Article 250", "Article 406", "Article 314"] }, a: 0, why: { en: "Article 220: branch-circuit, feeder and service load calculations.", vi: "Article 220: tính tải mạch nhánh, dây cấp và nguồn." } },
      { q: { en: "What does California use as its electrical code?", vi: "California dùng code điện nào?" }, opts: { en: ["IEC 60364", "California Electrical Code, based on the NEC", "No code", "Only utility rules"], vi: ["IEC 60364", "California Electrical Code, dựa trên NEC", "Không có code", "Chỉ quy định của công ty điện"] }, a: 1, why: { en: "The CEC is based on the NEC with California changes, plus local amendments.", vi: "CEC dựa trên NEC có sửa đổi của California, cộng thêm quy định địa phương." } }
    ]
  },
  /* ================= c-res-troubleshoot ================= */
  {
    id: "c-res-troubleshoot",
    title: { en: "Troubleshooting, Permits & Inspection", vi: "Sửa lỗi, giấy phép & kiểm tra" },
    summary: { en: "Find dead outlets and tripping breakers safely, spot an open neutral, and take a job from permit to final inspection.", vi: "Tìm ổ mất điện và CB hay nhảy một cách an toàn, nhận ra đứt neutral, và đưa công trình từ xin giấy phép đến kiểm tra cuối." },
    level: "Intermediate", minutes: 60,
    lessons: [
      { id: "l1", title: { en: "Dead Outlets and Tripping Breakers", vi: "Ổ mất điện và CB hay nhảy" }, minutes: 20, blocks: [
        { t: "steps", en: ["Dead outlet? First look for a tripped **GFCI upstream** — in a bath, garage, kitchen or outside.", "Check the panel for a tripped breaker (handle in the middle).", "Test live-dead-live: test your meter on a known live outlet, test the dead one, test the known live one again.", "Still dead? Look for a loose push-in connection at the last working outlet."],
                vi: ["Ổ mất điện? Trước tiên tìm **GFCI phía trước** bị nhảy — ở phòng tắm, garage, bếp hoặc ngoài trời.", "Kiểm tra tủ xem CB nào nhảy (cần gạt nằm giữa).", "Đo live-dead-live: thử đồng hồ trên ổ đang có điện, đo ổ mất điện, rồi thử lại ổ có điện.", "Vẫn mất điện? Tìm mối cắm nhanh bị lỏng ở ổ cuối cùng còn chạy."] },
        { t: "table", head: { en: ["Trips when…", "Likely cause"], vi: ["Nhảy khi…", "Nguyên nhân có thể"] },
          rows: { en: [["Many things run, after a while", "Overload"], ["Instantly when reset", "Short circuit"], ["GFCI trips, often when wet", "Ground fault"], ["AFCI trips randomly", "Arc fault, loose connection, damaged cable, or shared neutral"]],
                  vi: [["Chạy nhiều thứ, một lúc sau", "Quá tải"], ["Ngay khi bật lại", "Ngắn mạch"], ["GFCI nhảy, hay khi ẩm ướt", "Rò điện xuống đất"], ["AFCI nhảy bất chợt", "Hồ quang, mối nối lỏng, cáp hư, hoặc dùng chung neutral"]] } },
        { t: "callout", kind: "warn", en: "Never replace a breaker with a bigger one to stop tripping. The breaker protects the wire.", vi: "Không bao giờ thay CB lớn hơn để hết nhảy. CB bảo vệ dây dẫn." }
      ] },
      { id: "l2", title: { en: "Open Neutral", vi: "Đứt neutral" }, minutes: 15, blocks: [
        { t: "p", en: "If the service neutral opens, the two 120 V legs are in series. Lights on one leg go **dim** while lights on the other go **bright**. You might read 80 V on one leg and 160 V on the other.", vi: "Nếu neutral chính bị đứt, hai nhánh 120 V nối tiếp nhau. Đèn ở một nhánh **mờ** còn đèn nhánh kia **sáng chói**. Có thể đo được 80 V ở nhánh này và 160 V ở nhánh kia." },
        { t: "list", en: ["Symptoms: dim/bright lights, electronics failing, motors humming.", "Measure each leg to neutral at the panel under load.", "A service neutral problem is a utility call. Shut off sensitive loads."],

    id: "c-com-conduit",
    title: { en: "Conduit, Raceway & Wire", vi: "Ống luồn dây, máng dây & dây dẫn" },
    summary: { en: "EMT, rigid, PVC, flex and MC cable; how to support and bend conduit; conduit fill; THHN wire and color conventions.", vi: "Ống EMT, ống thép dày, PVC, ống mềm và cáp MC; cách đỡ và uốn ống; độ lấp đầy ống; dây THHN và quy ước màu dây." },
    level: "Intermediate", minutes: 75,
    lessons: [
      { id: "l1", title: { en: "Types of Raceway", vi: "Các loại ống và máng dây" }, minutes: 20, blocks: [
        { t: "p", en: "Commercial wiring is usually pulled through **conduit** instead of using Romex (NM cable). Conduit protects the wire and, if it is metal, can also be the ground path when installed correctly.", vi: "Đi dây thương mại thường kéo dây trong **ống (conduit)** thay vì dùng cáp Romex (NM). Ống bảo vệ dây và, nếu là ống kim loại lắp đúng cách, có thể làm đường tiếp địa." },
        { t: "table", head: { en: ["Type", "NEC article", "Where you see it"], vi: ["Loại", "Điều NEC", "Thường gặp ở"] }, rows: {
          en: [["EMT (thin-wall steel)", "358", "Indoor walls and ceilings — the most common"], ["IMC (intermediate)", "342", "Where more protection is needed"], ["RMC (rigid metal)", "344", "Outdoors, exposed to damage, service masts"], ["PVC (rigid nonmetallic)", "352", "Underground, wet and corrosive areas"], ["FMC (flex)", "348", "Short connections to motors, lights, equipment"], ["MC cable", "330", "Tenant improvements, above ceilings"]],
          vi: [["EMT (thép mỏng)", "358", "Tường và trần trong nhà — phổ biến nhất"], ["IMC (thép trung bình)", "342", "Nơi cần bảo vệ nhiều hơn"], ["RMC (thép dày)", "344", "Ngoài trời, nơi dễ va đập, cột service"], ["PVC (nhựa cứng)", "352", "Dưới đất, nơi ẩm ướt và ăn mòn"], ["FMC (ống mềm)", "348", "Đoạn nối ngắn tới motor, đèn, thiết bị"], ["Cáp MC", "330", "Sửa chữa mặt bằng thuê, trên trần"]] } },
        { t: "h", en: "EMT fittings", vi: "Phụ kiện EMT" },
        { t: "list", en: ["**Set-screw** couplings and connectors: for dry indoor locations.", "**Compression** fittings: tighten a nut on a ring; use where rated for damp or wet locations.", "Always use a connector with a **locknut** or the listed method so the box and conduit stay bonded."], vi: ["Khớp nối và đầu nối **vít (set-screw)**: cho nơi khô trong nhà.", "Phụ kiện **siết ống (compression)**: siết đai ốc lên vòng ép; dùng ở nơi ẩm/ướt khi phụ kiện được chứng nhận cho điều kiện đó.", "Luôn dùng đầu nối có **khóa (locknut)** hoặc cách lắp được chứng nhận để hộp và ống được nối đất liên tục."] },
        { t: "callout", kind: "tip", en: "EMT must be securely fastened within **3 ft** of every box or fitting and at least every **10 ft** (NEC 358.30).", vi: "Ống EMT phải được kẹp chắc trong vòng **3 ft** từ mỗi hộp hoặc phụ kiện, và ít nhất mỗi **10 ft** (NEC 358.30)." },
        { t: "callout", kind: "warn", en: "California uses the California Electrical Code (CEC), which is based on the NEC, plus local amendments. Always check with your AHJ (the local inspector) for your city's rules.", vi: "California dùng Bộ luật Điện California (CEC), dựa trên NEC, cộng với các sửa đổi địa phương. Luôn hỏi AHJ (thanh tra địa phương) về quy định của thành phố bạn." }
      ]},
      { id: "l2", title: { en: "Bending EMT", vi: "Uốn ống EMT" }, minutes: 25, blocks: [
        { t: "p", en: "A hand bender has marks: an **arrow** for stub-ups, a **star** for back-to-back 90s, and angle marks. The **take-up** is how much the bend uses. Common hand benders: ½ in EMT = 5 in, ¾ in = 6 in, 1 in = 8 in. Check the number stamped on your bender.", vi: "Cây uốn ống tay có các dấu: **mũi tên** cho uốn đứng (stub-up), **ngôi sao** cho hai co 90 lưng tựa lưng, và các vạch góc. **Take-up** là phần chiều dài mà đường uốn ăn mất. Thường gặp: EMT ½ in = 5 in, ¾ in = 6 in, 1 in = 8 in. Kiểm tra số in trên cây uốn của bạn." },
        { t: "steps", en: ["**90° stub-up:** stub height − take-up = mark. For a 12 in stub with ½ in EMT: 12 − 5 = 7 in.", "Line the arrow up with the mark, put your foot on the heel, and pull the handle until the conduit is plumb.", "**Offset:** two equal bends to go around something. Distance between marks = offset depth × multiplier.", "**Back-to-back 90:** measure from the back of the first 90, mark, and use the star."], vi: ["**Co 90° đứng:** chiều cao đoạn đứng − take-up = điểm đánh dấu. Đoạn đứng 12 in với EMT ½ in: 12 − 5 = 7 in.", "Đặt mũi tên trùng dấu, đạp chân lên gót cây uốn và kéo cần cho tới khi ống thẳng đứng.", "**Offset:** hai đường uốn bằng nhau để vòng qua vật cản. Khoảng cách giữa hai dấu = độ sâu offset × hệ số.", "**Hai co 90 lưng tựa lưng:** đo từ lưng co 90 thứ nhất, đánh dấu, rồi dùng dấu ngôi sao."] },
        { t: "table", head: { en: ["Offset angle", "Multiplier", "Shrink per inch of offset"], vi: ["Góc offset", "Hệ số", "Hao hụt mỗi inch offset"] }, rows: {
          en: [["10°", "6", "1/16 in"], ["22.5°", "2.6", "3/16 in"], ["30°", "2", "1/4 in"], ["45°", "1.4", "3/8 in"]],
          vi: [["10°", "6", "1/16 in"], ["22.5°", "2.6", "3/16 in"], ["30°", "2", "1/4 in"], ["45°", "1.4", "3/8 in"]] } },
        { t: "p", en: "Example: a 4 in offset at 30° → marks are 4 × 2 = **8 in** apart, and the run gets 4 × ¼ = **1 in** shorter.", vi: "Ví dụ: offset 4 in góc 30° → hai dấu cách nhau 4 × 2 = **8 in**, và đoạn ống bị ngắn đi 4 × ¼ = **1 in**." },
        { t: "callout", kind: "tip", en: "The NEC limits a run between pull points to **360° total** of bends. Four 90s is the maximum; add a pull box if you need more.", vi: "NEC giới hạn tổng các góc uốn giữa hai điểm kéo dây là **360°**. Tối đa bốn co 90; cần thêm thì đặt hộp kéo dây (pull box)." },
        { t: "lab", title: { en: "Bend a stub, an offset and a box offset", vi: "Uốn co đứng, offset và offset vào hộp" }, steps: {
          en: ["Take a 10 ft stick of ½ in EMT and a hand bender.", "Bend a 12 in 90° stub-up. Check it with a torpedo level and a tape.", "Bend a 4 in offset at 30° (marks 8 in apart).", "Make a small box offset so the conduit enters a 4 in square box flat against the wall.", "Mount your piece on the scrap backboard with straps: one within 3 ft of the box.", "Have the instructor check height, plumb and dog-leg (twist)."],
          vi: ["Lấy một cây EMT ½ in dài 10 ft và một cây uốn tay.", "Uốn co 90° đứng cao 12 in. Kiểm tra bằng thước thủy và thước dây.", "Uốn offset 4 in góc 30° (hai dấu cách nhau 8 in).", "Uốn một offset nhỏ để ống vào hộp vuông 4 in sát tường.", "Gắn ống lên tấm ván tập bằng kẹp: một kẹp trong vòng 3 ft từ hộp.", "Nhờ giảng viên kiểm tra chiều cao, độ thẳng đứng và độ xoắn (dog-leg)."] } }
      ]},
      { id: "l3", title: { en: "Wire, Fill & Color Code", vi: "Dây dẫn, độ lấp ống & màu dây" }, minutes: 20, blocks: [
        { t: "p", en: "Most commercial building wire is **THHN/THWN-2** copper: thin nylon jacket, rated for dry and wet locations. You pull it into conduit with a fish tape or pull rope and lube.", vi: "Đa số dây dùng trong tòa nhà thương mại là đồng **THHN/THWN-2**: vỏ nylon mỏng, dùng được nơi khô và ướt. Kéo vào ống bằng fish tape hoặc dây kéo và chất bôi trơn." },
        { t: "h", en: "Conduit fill", vi: "Độ lấp đầy ống" },
        { t: "p", en: "Too many wires in a pipe overheat and get damaged during the pull. NEC Chapter 9, Table 1 limits fill to **40%** of the conduit area for three or more wires. Use the fill tables (Annex C) to find how many wires fit.", vi: "Quá nhiều dây trong một ống sẽ nóng và bị trầy khi kéo. NEC Chương 9, Bảng 1 giới hạn độ lấp **40%** diện tích ống khi có từ ba dây trở lên. Dùng bảng tra (Annex C) để biết bao nhiêu dây vừa." },
        { t: "table", head: { en: ["Conductor", "208Y/120 V", "480Y/277 V"], vi: ["Dây", "208Y/120 V", "480Y/277 V"] }, rows: {
          en: [["Phase A", "Black", "Brown"], ["Phase B", "Red", "Orange"], ["Phase C", "Blue", "Yellow"], ["Neutral", "White", "Gray"], ["Equipment ground", "Green (or bare)", "Green (or bare)"]],
          vi: [["Pha A", "Đen", "Nâu"], ["Pha B", "Đỏ", "Cam"], ["Pha C", "Xanh dương", "Vàng"], ["Neutral", "Trắng", "Xám"], ["Tiếp địa thiết bị", "Xanh lá (hoặc dây trần)", "Xanh lá (hoặc dây trần)"]] } },
        { t: "callout", kind: "tip", en: "The phase colors are an **industry convention**, not all mandated by code. The code requires white or gray for neutrals and green for grounds, and when a building has more than one system, the identification method must be posted at each panel. Follow the job specs.", vi: "Màu dây pha là **quy ước của ngành**, không phải tất cả đều bắt buộc trong code. Code yêu cầu trắng hoặc xám cho neutral, xanh lá cho tiếp địa, và khi tòa nhà có hơn một hệ điện áp thì cách nhận biết phải được dán tại mỗi tủ. Làm theo spec của công trình." },
        { t: "callout", kind: "warn", en: "Never trust color alone. A brown wire in an old building could be anything. Test it.", vi: "Đừng bao giờ chỉ tin vào màu dây. Dây nâu trong tòa nhà cũ có thể là bất cứ gì. Hãy đo kiểm." }
      ]}
    ],
    quiz: [
      { q: { en: "Which raceway is most common inside commercial walls and ceilings?", vi: "Loại ống nào phổ biến nhất trong tường và trần thương mại?" }, opts: { en: ["RMC", "EMT", "PVC", "Liquidtight flex"], vi: ["RMC", "EMT", "PVC", "Ống mềm kín nước"] }, a: 1, why: { en: "EMT is light, cheap and easy to bend, so it is used for most indoor runs.", vi: "EMT nhẹ, rẻ và dễ uốn nên dùng cho hầu hết các tuyến trong nhà." } },
      { q: { en: "How close to a box must EMT be fastened?", vi: "Ống EMT phải được kẹp cách hộp tối đa bao nhiêu?" }, opts: { en: ["1 ft", "3 ft", "6 ft", "10 ft"], vi: ["1 ft", "3 ft", "6 ft", "10 ft"] }, a: 1, why: { en: "Within 3 ft of each box or fitting, and at least every 10 ft.", vi: "Trong vòng 3 ft từ mỗi hộp hoặc phụ kiện, và ít nhất mỗi 10 ft." } },
      { q: { en: "A 5 in offset bent at 30°: how far apart are the marks?", vi: "Offset 5 in uốn góc 30°: hai dấu cách nhau bao xa?" }, opts: { en: ["5 in", "7 in", "10 in", "13 in"], vi: ["5 in", "7 in", "10 in", "13 in"] }, a: 2, why: { en: "Offset × multiplier: 5 × 2 = 10 in.", vi: "Offset × hệ số: 5 × 2 = 10 in." } },
      { q: { en: "What is the maximum total degrees of bends between pull points?", vi: "Tổng số độ uốn tối đa giữa hai điểm kéo dây là bao nhiêu?" }, opts: { en: ["180°", "270°", "360°", "450°"], vi: ["180°", "270°", "360°", "450°"] }, a: 2, why: { en: "360° total — for example four 90° bends.", vi: "Tổng 360° — ví dụ bốn co 90°." } },
      { q: { en: "In a 480Y/277 V system, what color is commonly used for the neutral?", vi: "Trong hệ 480Y/277 V, neutral thường dùng màu gì?" }, opts: { en: ["White", "Gray", "Green", "Brown"], vi: ["Trắng", "Xám", "Xanh lá", "Nâu"] }, a: 1, why: { en: "Gray is used for the 277 V neutral so it is not confused with the white 120 V neutral.", vi: "Dùng màu xám cho neutral 277 V để không nhầm với neutral trắng của hệ 120 V." } }
    ]
  },

  /* ---------------- c-com-lighting ---------------- */
  {
    id: "c-com-lighting",
    title: { en: "Commercial Lighting & Controls", vi: "Chiếu sáng & điều khiển thương mại" },
    summary: { en: "277 V lighting, LED troffers and drivers, 0–10 V dimming, sensors, Title 24 controls, emergency lights and lighting contactors.", vi: "Đèn 277 V, đèn LED troffer và driver, dimming 0–10 V, cảm biến, điều khiển theo Title 24, đèn khẩn cấp và contactor chiếu sáng." },
    level: "Intermediate", minutes: 60,
    lessons: [
      { id: "l1", title: { en: "277 V Lighting & LED Troffers", vi: "Đèn 277 V & đèn LED troffer" }, minutes: 20, blocks: [
        { t: "p", en: "In a 480Y/277 V building, lights usually run on **277 V**: one phase to the gray neutral. Higher voltage means less current, so more fixtures fit on one 20 A circuit.", vi: "Trong tòa nhà 480Y/277 V, đèn thường chạy **277 V**: một pha tới neutral xám. Điện áp cao hơn thì dòng nhỏ hơn, nên một mạch 20 A gắn được nhiều đèn hơn." },
        { t: "p", en: "The **2×4 LED troffer** sits in a T-bar (drop) ceiling grid. Inside is an LED **driver** that turns line voltage into DC for the LEDs. Many drivers accept 120–277 V. Read the label.", vi: "**Đèn LED troffer 2×4** đặt trong khung trần thả T-bar. Bên trong có **driver** LED đổi điện lưới sang DC cho LED. Nhiều driver nhận 120–277 V. Đọc nhãn." },
        { t: "list", en: ["Feed troffers with a short flex whip from a junction box above the ceiling.", "Fixtures in a drop ceiling must be supported per code and the manufacturer, usually with tie wires to the structure, not just resting on the grid.", "Label each junction box with panel and circuit, e.g. **LP-4H-12**."], vi: ["Cấp điện cho troffer bằng đoạn ống mềm ngắn (whip) từ hộp nối phía trên trần.", "Đèn trong trần thả phải được đỡ theo code và nhà sản xuất, thường bằng dây treo lên kết cấu, không chỉ đặt trên khung trần.", "Ghi nhãn mỗi hộp nối bằng tủ và số mạch, ví dụ **LP-4H-12**."] },
        { t: "callout", kind: "warn", en: "277 V is more dangerous than 120 V, and a lighting circuit can be fed from a different panel than you expect. Find the right breaker, lock it, and test before opening a fixture.", vi: "277 V nguy hiểm hơn 120 V, và mạch đèn có thể được cấp từ một tủ khác với bạn nghĩ. Tìm đúng CB, khóa lại và đo kiểm trước khi mở đèn." }
      ]},
      { id: "l2", title: { en: "Dimming, Sensors & Title 24", vi: "Dimming, cảm biến & Title 24" }, minutes: 20, blocks: [
        { t: "p", en: "**0–10 V dimming** uses two extra low-voltage wires (commonly purple + and gray −) from the dimmer to each driver. 10 V = full bright, near 0 V = dimmest.", vi: "**Dimming 0–10 V** dùng thêm hai dây điện áp thấp (thường tím + và xám −) từ bộ dimmer tới từng driver. 10 V = sáng nhất, gần 0 V = tối nhất." },
        { t: "terms", items: [
          { term: { en: "Occupancy sensor", vi: "Cảm biến có người (occupancy)" }, def: { en: "Turns lights ON automatically and OFF when the room is empty.", vi: "Tự bật đèn khi có người và tắt khi phòng trống." } },
          { term: { en: "Vacancy sensor", vi: "Cảm biến vắng người (vacancy)" }, def: { en: "You turn lights ON by hand; it turns them OFF automatically.", vi: "Bạn bật đèn bằng tay; nó tự tắt đèn." } },
          { term: { en: "Daylight sensor", vi: "Cảm biến ánh sáng ban ngày" }, def: { en: "Dims fixtures near windows when sunlight is strong.", vi: "Giảm sáng các đèn gần cửa sổ khi nắng mạnh." } },
          { term: { en: "Time clock", vi: "Đồng hồ hẹn giờ" }, def: { en: "Turns lights on and off on a schedule, e.g. parking lot lights.", vi: "Bật/tắt đèn theo lịch, ví dụ đèn bãi xe." } }
        ]},
        { t: "p", en: "California's energy code, **Title 24 Part 6**, requires lighting controls in most new and altered commercial spaces: things like automatic shut-off, occupancy sensing, multi-level (dimming) control and daylight controls. The exact rules depend on the space type and the code edition. Check the plans and the AHJ.", vi: "Bộ luật năng lượng California, **Title 24 Phần 6**, yêu cầu điều khiển chiếu sáng cho hầu hết không gian thương mại mới và sửa chữa: ví dụ tự động tắt, cảm biến có người, điều khiển nhiều mức (dimming) và điều khiển theo ánh sáng ban ngày. Quy định cụ thể tùy loại không gian và phiên bản code. Kiểm tra bản vẽ và hỏi AHJ." },
        { t: "callout", kind: "tip", en: "Keep 0–10 V control wires separate from line-voltage wires unless both are rated for it. Follow the driver and dimmer instructions.", vi: "Giữ dây điều khiển 0–10 V tách khỏi dây điện lưới, trừ khi cả hai được chứng nhận cho phép. Làm theo hướng dẫn của driver và dimmer." }
      ]},
      { id: "l3", title: { en: "Emergency Lights & Lighting Contactors", vi: "Đèn khẩn cấp & contactor chiếu sáng" }, minutes: 20, blocks: [
        { t: "p", en: "**Exit signs** and **emergency lights** keep people safe when power fails. Battery units switch on by themselves and must run for at least **90 minutes**. NEC Article 700 covers emergency systems.", vi: "**Biển EXIT** và **đèn khẩn cấp** giữ an toàn cho người khi mất điện. Bộ đèn có pin tự bật và phải sáng ít nhất **90 phút**. NEC Điều 700 quy định về hệ thống khẩn cấp." },
        { t: "list", en: ["Connect battery units to the **unswitched** hot of the local lighting circuit, so they sense a real power loss.", "Push the test button: the lamps must come on from the battery.", "Life Safety Code (NFPA 101) testing: a 30-second test every month and a 90-minute test every year. Keep a log."], vi: ["Nối bộ đèn có pin vào dây nóng **không qua công tắc** của mạch đèn khu vực đó, để nó nhận biết khi mất điện thật.", "Nhấn nút test: đèn phải sáng bằng pin.", "Kiểm tra theo Life Safety Code (NFPA 101): test 30 giây mỗi tháng và test 90 phút mỗi năm. Ghi sổ theo dõi."] },
        { t: "h", en: "Lighting contactors: where automation comes in", vi: "Contactor chiếu sáng: nơi tự động hóa xuất hiện" },
        { t: "p", en: "A **lighting contactor** switches many lighting circuits at once from a small control signal. The coil can be driven by a time clock, a photocell, a building automation system, or a **PLC output**: the same relay logic you learned in Section 200.", vi: "**Contactor chiếu sáng** đóng/ngắt nhiều mạch đèn cùng lúc từ một tín hiệu điều khiển nhỏ. Cuộn dây có thể được điều khiển bởi đồng hồ hẹn giờ, cảm biến quang (photocell), hệ thống tự động tòa nhà, hoặc **ngõ ra PLC**: chính là logic rơ-le bạn đã học ở Phần 200." },
        { t: "ladder", rungs: [
          { comment: { en: "Parking lot lights: ON at night by photocell, OFF after closing unless override", vi: "Đèn bãi xe: BẬT ban đêm theo photocell, TẮT sau giờ đóng cửa trừ khi override" }, els: [ { k: "XIC", tag: "Photocell_Dark" }, { k: "BR", rows: [ [ { k: "XIC", tag: "Store_Open" } ], [ { k: "XIC", tag: "Override_SW" } ] ] }, { k: "OTE", tag: "LC1_Coil" } ] }
        ]},
        { t: "lab", title: { en: "Control lights with the PLC", vi: "Điều khiển đèn bằng PLC" }, steps: {
          en: ["In the 3D classroom, find the 2×4 LED troffer and the exit sign on the commercial wall. Click each one and read the card.", "On the trainee panel, use a selector as `Photocell_Dark` and a pushbutton as `Override_SW` (5069-IB16 inputs).", "Use an OW4I relay output as `LC1_Coil` and a pilot light as the 'lighting contactor'.", "Write the rung above. Add a TON so the override turns off by itself after 30 s.", "Test every combination and fill in a truth table."],
          vi: ["Trong lớp học 3D, tìm đèn LED troffer 2×4 và biển EXIT trên vách điện thương mại. Bấm vào từng cái và đọc thẻ.", "Trên tủ thực hành, dùng một công tắc chọn làm `Photocell_Dark` và một nút nhấn làm `Override_SW` (input 5069-IB16).", "Dùng một output relay OW4I làm `LC1_Coil` và một đèn báo làm 'contactor chiếu sáng'.", "Viết rung ở trên. Thêm một TON để override tự tắt sau 30 giây.", "Thử mọi tổ hợp và điền bảng sự thật (truth table)."] } }
      ]}
    ],
    quiz: [
      { q: { en: "In a 480Y/277 V building, lights usually run on…", vi: "Trong tòa nhà 480Y/277 V, đèn thường chạy ở…" }, opts: { en: ["120 V", "208 V", "277 V", "480 V"], vi: ["120 V", "208 V", "277 V", "480 V"] }, a: 2, why: { en: "277 V is one phase to neutral, and it carries more fixtures per circuit.", vi: "277 V là một pha tới neutral, và gắn được nhiều đèn hơn trên mỗi mạch." } },
      { q: { en: "What does a vacancy sensor do?", vi: "Cảm biến vắng người (vacancy) làm gì?" }, opts: { en: ["Turns lights on and off automatically", "Only turns lights off automatically", "Dims lights near windows", "Tests emergency lights"], vi: ["Tự bật và tắt đèn", "Chỉ tự tắt đèn", "Giảm sáng đèn gần cửa sổ", "Kiểm tra đèn khẩn cấp"] }, a: 1, why: { en: "You turn lights on by hand; the vacancy sensor turns them off.", vi: "Bạn bật đèn bằng tay; cảm biến vacancy tự tắt đèn." } },
      { q: { en: "In 0–10 V dimming, what signal gives full brightness?", vi: "Trong dimming 0–10 V, tín hiệu nào cho độ sáng tối đa?" }, opts: { en: ["0 V", "5 V", "10 V", "120 V"], vi: ["0 V", "5 V", "10 V", "120 V"] }, a: 2, why: { en: "10 V = full bright; near 0 V = dimmest.", vi: "10 V = sáng nhất; gần 0 V = tối nhất." } },
      { q: { en: "How long must battery emergency lights run?", vi: "Đèn khẩn cấp dùng pin phải sáng trong bao lâu?" }, opts: { en: ["10 minutes", "30 minutes", "90 minutes", "8 hours"], vi: ["10 phút", "30 phút", "90 phút", "8 giờ"] }, a: 2, why: { en: "At least 90 minutes, tested yearly for the full 90 minutes.", vi: "Ít nhất 90 phút, mỗi năm kiểm tra đủ 90 phút." } },
      { q: { en: "What can drive the coil of a lighting contactor?", vi: "Cái gì có thể điều khiển cuộn dây contactor chiếu sáng?" }, opts: { en: ["Only a wall switch", "A time clock, photocell, BAS or PLC output", "Only the main breaker", "The neutral wire"], vi: ["Chỉ công tắc tường", "Đồng hồ hẹn giờ, photocell, BAS hoặc output PLC", "Chỉ CB tổng", "Dây neutral"] }, a: 1, why: { en: "Any small control signal can switch the coil, including a PLC output.", vi: "Bất kỳ tín hiệu điều khiển nhỏ nào cũng đóng được cuộn dây, kể cả output PLC." } }
    ]
  },

  /* ---------------- c-com-equipment ---------------- */
  {
    id: "c-com-equipment",
    title: { en: "Motors, HVAC & Equipment", vi: "Motor, HVAC & thiết bị" },
    summary: { en: "Rooftop units, disconnects within sight, MCA and MOCP on nameplates, motor circuits, kitchen equipment and dedicated receptacles.", vi: "Máy lạnh trên mái (RTU), cầu dao trong tầm nhìn, MCA và MOCP trên nhãn thiết bị, mạch motor, thiết bị bếp và ổ cắm riêng." },
    level: "Intermediate", minutes: 55,
    lessons: [
      { id: "l1", title: { en: "Rooftop Units & Nameplates", vi: "Máy RTU & nhãn thiết bị" }, minutes: 20, blocks: [
        { t: "p", en: "Most shops are cooled by a **rooftop unit (RTU)**. Before you wire it, read its **nameplate**. Two numbers matter most:", vi: "Hầu hết cửa hàng được làm mát bằng **máy lạnh trên mái (RTU)**. Trước khi đi dây, đọc **nhãn thiết bị (nameplate)**. Hai số quan trọng nhất:" },
        { t: "terms", items: [
          { term: { en: "MCA — Minimum Circuit Ampacity", vi: "MCA — Dòng mạch tối thiểu" }, def: { en: "Use this to size the **wire**. The conductors must carry at least this many amps.", vi: "Dùng để chọn cỡ **dây**. Dây phải chịu được ít nhất số ampe này." } },
          { term: { en: "MOCP — Maximum Overcurrent Protection", vi: "MOCP — Bảo vệ quá dòng tối đa" }, def: { en: "The **largest** fuse or breaker allowed. Do not go bigger.", vi: "Cầu chì hoặc CB **lớn nhất** được phép. Không được lắp lớn hơn." } }
        ]},
        { t: "p", en: "Example: RTU-1 nameplate says 460 V, 3 ph, MCA 28 A, MOCP 45 A. Size the wire for at least 28 A (check the ampacity table and terminal ratings), and use a breaker or fuses no larger than 45 A. If the nameplate says HACR or 'fuses only', follow it.", vi: "Ví dụ: nhãn RTU-1 ghi 460 V, 3 pha, MCA 28 A, MOCP 45 A. Chọn dây chịu ít nhất 28 A (tra bảng dòng cho phép và nhiệt độ đầu cos), và dùng CB hoặc cầu chì không lớn hơn 45 A. Nếu nhãn ghi HACR hoặc 'chỉ dùng cầu chì' thì làm theo." },
        { t: "callout", kind: "tip", en: "Equipment rated 460 V runs on a 480 V system. Nameplates use motor voltage (460, 200/230), while systems use service voltage (480, 208).", vi: "Thiết bị ghi 460 V chạy trên hệ 480 V. Nhãn thiết bị ghi điện áp motor (460, 200/230), còn hệ thống ghi điện áp nguồn (480, 208)." },
        { t: "h", en: "Disconnect within sight", vi: "Cầu dao trong tầm nhìn" },
        { t: "p", en: "HVAC equipment needs a **disconnecting means within sight** of the unit (NEC 440.14), so a technician can see the switch while working. A service receptacle is also required near rooftop HVAC equipment.", vi: "Thiết bị HVAC cần **cầu dao cách ly trong tầm nhìn** của máy (NEC 440.14), để thợ nhìn thấy cầu dao khi làm việc. Gần máy HVAC trên mái cũng phải có ổ cắm phục vụ sửa chữa." },
        { t: "callout", kind: "warn", en: "Turn off the disconnect AND lock it. A rooftop is far from the panel, and someone downstairs can turn the breaker back on.", vi: "Tắt cầu dao VÀ khóa lại. Mái nhà ở xa tủ điện, và người ở dưới có thể bật CB lên lại." }
      ]},
      { id: "l2", title: { en: "Motor Circuits Review", vi: "Ôn lại mạch motor" }, minutes: 15, blocks: [
        { t: "p", en: "Commercial motors (exhaust fans, pumps, compressors) use the same pieces you learned in **Section 200**: disconnect → short-circuit protection → contactor → overload → motor. NEC Article 430 covers motors.", vi: "Motor thương mại (quạt hút, bơm, máy nén) dùng đúng các bộ phận đã học ở **Phần 200**: cầu dao → bảo vệ ngắn mạch → contactor → rơ-le nhiệt → motor. NEC Điều 430 quy định về motor." },
        { t: "table", head: { en: ["Device", "Protects against", "Sized from"], vi: ["Thiết bị", "Bảo vệ khỏi", "Chọn theo"] }, rows: {
          en: [["Breaker / fuses", "Short circuits and ground faults", "NEC tables + nameplate"], ["Overload relay", "Motor running too hot for too long", "Motor nameplate FLA"], ["Disconnect", "Gives a safe, lockable OFF", "Motor HP and voltage"]],
          vi: [["CB / cầu chì", "Ngắn mạch và chạm đất", "Bảng NEC + nhãn thiết bị"], ["Rơ-le nhiệt", "Motor chạy quá nóng quá lâu", "FLA trên nhãn motor"], ["Cầu dao", "Tạo trạng thái TẮT an toàn, khóa được", "HP và điện áp motor"]] } },
        { t: "callout", kind: "kit", en: "The trainer kit's HV power box has the same chain: disconnect, contactor and overload feeding a 480 V motor. Watch the instructor demonstrate; energized work in that box is instructor-only.", vi: "Tủ động lực trên bộ kit có đúng chuỗi này: cầu dao, contactor và rơ-le nhiệt cấp cho motor 480 V. Xem giảng viên làm mẫu; làm việc có điện trong tủ này chỉ dành cho giảng viên." }
      ]},
      { id: "l3", title: { en: "Kitchens & Dedicated Circuits", vi: "Bếp & mạch riêng" }, minutes: 20, blocks: [
        { t: "p", en: "Restaurants are full of heavy loads: walk-in coolers, ovens, fryers, dish machines, hood fans. Each usually gets its own **dedicated circuit**, sized from the equipment nameplate or the cut sheet.", vi: "Nhà hàng có rất nhiều tải nặng: phòng lạnh, lò nướng, nồi chiên, máy rửa chén, quạt hút. Mỗi thiết bị thường có **mạch riêng (dedicated)**, chọn theo nhãn hoặc tờ thông số thiết bị." },
        { t: "list", en: ["Many commercial receptacles are **20 A** (T-slot). A 20 A receptacle on a 20 A circuit is normal.", "Kitchen receptacles need **GFCI** protection (NEC 210.8). Read the current code for exact locations and ratings.", "On exposed walls, use **4 in square boxes** with **industrial (raised) covers**, fed with EMT.", "Check the plug type on the equipment cut sheet (for example NEMA 6-30 or L21-30) before you install the receptacle."], vi: ["Nhiều ổ cắm thương mại là loại **20 A** (khe chữ T). Ổ 20 A trên mạch 20 A là bình thường.", "Ổ cắm trong bếp cần bảo vệ **GFCI** (NEC 210.8). Đọc code hiện hành để biết vị trí và định mức chính xác.", "Trên tường lộ, dùng **hộp vuông 4 in** với **nắp công nghiệp (nắp nổi)**, đi ống EMT.", "Kiểm tra loại phích cắm trên tờ thông số thiết bị (ví dụ NEMA 6-30 hoặc L21-30) trước khi lắp ổ cắm."] },
        { t: "callout", kind: "tip", en: "Ask the owner for equipment cut sheets before rough-in. Moving one receptacle after the walls are closed costs far more than asking early.", vi: "Xin chủ nhà tờ thông số thiết bị trước khi đi ống thô (rough-in). Dời một ổ cắm sau khi đã đóng tường tốn hơn rất nhiều so với hỏi sớm." },
        { t: "lab", title: { en: "Size the circuit for RTU-1", vi: "Chọn mạch cho RTU-1" }, steps: {
          en: ["In the 3D classroom, click the fused disconnect for RTU-1 on the commercial wall and read its card.", "Use the example nameplate: 460 V, 3 ph, MCA 28 A, MOCP 45 A.", "Pick a wire size from the ampacity table that carries at least 28 A at the 75 °C column.", "Pick a fuse size that is not larger than 45 A.", "Write a panel schedule line for LP-4H: circuit, load, breaker/poles, phases, wire size.", "Have the instructor check your answer."],
          vi: ["Trong lớp học 3D, bấm vào cầu dao có cầu chì của RTU-1 trên vách điện thương mại và đọc thẻ.", "Dùng nhãn ví dụ: 460 V, 3 pha, MCA 28 A, MOCP 45 A.", "Chọn cỡ dây từ bảng dòng cho phép chịu ít nhất 28 A ở cột 75 °C.", "Chọn cầu chì không lớn hơn 45 A.", "Viết một dòng panel schedule cho LP-4H: số mạch, tải, CB/số cực, pha, cỡ dây.", "Nhờ giảng viên kiểm tra kết quả."] } }
      ]}
    ],
    quiz: [
      { q: { en: "What is the MCA on a nameplate used for?", vi: "MCA trên nhãn thiết bị dùng để làm gì?" }, opts: { en: ["Sizing the breaker", "Sizing the wire", "Sizing the transformer", "Setting the thermostat"], vi: ["Chọn cỡ CB", "Chọn cỡ dây", "Chọn cỡ biến áp", "Cài thermostat"] }, a: 1, why: { en: "Minimum Circuit Ampacity sets the minimum wire ampacity.", vi: "Minimum Circuit Ampacity quyết định dòng tối thiểu của dây." } },
      { q: { en: "Nameplate MOCP is 40 A. Which breaker is allowed?", vi: "MOCP trên nhãn là 40 A. CB nào được phép?" }, opts: { en: ["50 A", "60 A", "40 A or smaller (if the unit starts)", "Any size"], vi: ["50 A", "60 A", "40 A hoặc nhỏ hơn (nếu máy khởi động được)", "Cỡ nào cũng được"] }, a: 2, why: { en: "MOCP is the maximum. Never go larger.", vi: "MOCP là mức tối đa. Không bao giờ lắp lớn hơn." } },
      { q: { en: "Where must the HVAC disconnect be?", vi: "Cầu dao của máy HVAC phải đặt ở đâu?" }, opts: { en: ["In the main switchboard only", "Within sight of the unit", "Anywhere in the building", "Inside the unit only"], vi: ["Chỉ trong tủ chính", "Trong tầm nhìn của máy", "Bất kỳ đâu trong tòa nhà", "Chỉ bên trong máy"] }, a: 1, why: { en: "NEC 440.14 requires the disconnect within sight of the equipment.", vi: "NEC 440.14 yêu cầu cầu dao trong tầm nhìn của thiết bị." } },
      { q: { en: "A nameplate says 460 V. What system feeds it?", vi: "Nhãn ghi 460 V. Hệ điện nào cấp cho nó?" }, opts: { en: ["208 V", "240 V", "480 V", "600 V"], vi: ["208 V", "240 V", "480 V", "600 V"] }, a: 2, why: { en: "460 V is motor utilization voltage on a 480 V system.", vi: "460 V là điện áp sử dụng của motor trên hệ 480 V." } },
      { q: { en: "Which protects a motor from running too hot for too long?", vi: "Thiết bị nào bảo vệ motor khi chạy quá nóng quá lâu?" }, opts: { en: ["The disconnect", "The overload relay", "The neutral", "The GFCI"], vi: ["Cầu dao", "Rơ-le nhiệt", "Dây neutral", "GFCI"] }, a: 1, why: { en: "The overload relay is set from the motor FLA and trips on sustained overcurrent.", vi: "Rơ-le nhiệt chỉnh theo FLA của motor và ngắt khi quá dòng kéo dài." } }
    ]
  },

  /* ---------------- c-com-jobsite ---------------- */
  {
    id: "c-com-jobsite",
    title: { en: "The Commercial Jobsite", vi: "Công trường thương mại" },
    summary: { en: "Plans, specs, submittals, RFIs and as-builts; working space at panels; LOTO in occupied buildings; working with other trades; moving from residential to commercial.", vi: "Bản vẽ, spec, submittal, RFI và bản vẽ hoàn công; không gian làm việc trước tủ; LOTO trong tòa nhà đang hoạt động; phối hợp với các đội khác; chuyển từ điện dân dụng sang thương mại." },
    level: "Intermediate", minutes: 55,
    lessons: [
      { id: "l1", title: { en: "Plans, Specs & Paperwork", vi: "Bản vẽ, spec & giấy tờ" }, minutes: 20, blocks: [
        { t: "p", en: "Commercial work is built from a **drawing set** and a **spec book**. The electrical sheets start with **E**: E-001 symbols and notes, E-1xx power, E-2xx lighting, E-6xx one-lines and panel schedules (numbering varies by engineer).", vi: "Công trình thương mại được làm theo **bộ bản vẽ** và **cuốn spec**. Các trang điện bắt đầu bằng **E**: E-001 ký hiệu và ghi chú, E-1xx động lực, E-2xx chiếu sáng, E-6xx sơ đồ một sợi và panel schedule (cách đánh số tùy kỹ sư)." },
        { t: "callout", kind: "tip", en: "Read the **symbol legend** and **general notes** first. They tell you mounting heights, wire sizes and what the engineer expects.", vi: "Đọc **bảng ký hiệu** và **ghi chú chung** trước. Chúng cho biết chiều cao lắp đặt, cỡ dây và yêu cầu của kỹ sư." },
        { t: "terms", items: [
          { term: { en: "Submittal", vi: "Submittal" }, def: { en: "Product data you send for approval before buying: panels, fixtures, devices.", vi: "Tài liệu sản phẩm gửi duyệt trước khi mua: tủ, đèn, thiết bị." } },
          { term: { en: "RFI", vi: "RFI" }, def: { en: "Request for Information: a written question to the architect or engineer when the drawings are unclear.", vi: "Yêu cầu thông tin: câu hỏi bằng văn bản gửi kiến trúc sư hoặc kỹ sư khi bản vẽ không rõ." } },
          { term: { en: "Change order", vi: "Change order" }, def: { en: "Approved change to scope and price. Get it in writing before doing extra work.", vi: "Thay đổi phạm vi và giá đã được duyệt. Phải có văn bản trước khi làm thêm." } },
          { term: { en: "As-builts", vi: "Bản vẽ hoàn công" }, def: { en: "Drawings marked up to show what was really installed.", vi: "Bản vẽ được đánh dấu lại theo những gì thực tế đã lắp." } }
        ]}
      ]},
      { id: "l2", title: { en: "Working Space & LOTO on Live Jobs", vi: "Không gian làm việc & LOTO tại công trình đang hoạt động" }, minutes: 20, blocks: [
        { t: "p", en: "NEC **110.26** requires clear working space in front of panels and equipment that may be worked on while energized. For 0–150 V to ground (like 208Y/120), the depth is typically **3 ft**. For 151–600 V (like 480Y/277), it can be 3, 3½ or 4 ft depending on what is across from the panel. The space must also be at least **30 in** wide and **6½ ft** high.", vi: "NEC **110.26** yêu cầu không gian trống trước tủ và thiết bị có thể phải làm việc khi có điện. Với 0–150 V so với đất (như 208Y/120), chiều sâu thường là **3 ft**. Với 151–600 V (như 480Y/277), có thể là 3, 3½ hoặc 4 ft tùy thứ nằm đối diện tủ. Không gian cũng phải rộng ít nhất **30 in** và cao **6½ ft**." },
        { t: "callout", kind: "warn", en: "Never let storage, shelves or equipment block the space in front of a panel. Verify the exact condition and depth in the code your AHJ enforces.", vi: "Không bao giờ để hàng hóa, kệ hay thiết bị chắn không gian trước tủ điện. Xác nhận điều kiện và chiều sâu chính xác theo code mà AHJ đang áp dụng." },
        { t: "steps", en: ["Tell the owner or manager what will lose power and when.", "Identify the circuit on the panel schedule, then **prove it** with a tester.", "Turn off, lock and tag the breaker with your own lock.", "Test live-dead-live at the point of work.", "Work, then remove your lock only when you are done and everyone is clear."], vi: ["Báo chủ hoặc quản lý biết chỗ nào sẽ mất điện và khi nào.", "Xác định mạch trên panel schedule, rồi **chứng minh** bằng bút/máy đo.", "Tắt, khóa và treo thẻ CB bằng ổ khóa của chính bạn.", "Đo live-dead-live tại điểm làm việc.", "Làm việc, chỉ tháo khóa khi đã xong và mọi người đã tránh xa."] },
        { t: "callout", kind: "warn", en: "Panel schedules in old buildings are often wrong. A shop can have tenants, signs and refrigerators that must not lose power. Confirm with your tester, not the label.", vi: "Panel schedule trong tòa nhà cũ thường sai. Cửa hàng có thể có khách thuê, bảng hiệu và tủ lạnh không được mất điện. Xác nhận bằng máy đo, không phải bằng nhãn." }
      ]},
      { id: "l3", title: { en: "Other Trades & Your Career Path", vi: "Các đội khác & con đường nghề nghiệp" }, minutes: 15, blocks: [
        { t: "list", en: ["**Coordinate** with framers, HVAC, plumbers and ceiling installers. Get your boxes and conduit in before walls and ceilings close.", "**Fire alarm** is a specialty system (NEC Article 760 and NFPA 72). Do not modify it unless you are trained and licensed for it.", "**Low voltage** (data, security, access control) is often a separate contractor."], vi: ["**Phối hợp** với đội khung, HVAC, ống nước và thợ trần. Lắp hộp và ống trước khi đóng tường và trần.", "**Báo cháy** là hệ thống chuyên biệt (NEC Điều 760 và NFPA 72). Không tự sửa nếu chưa được đào tạo và cấp phép.", "**Điện nhẹ** (mạng, an ninh, kiểm soát ra vào) thường do nhà thầu khác làm."] },
        { t: "h", en: "From residential to commercial", vi: "Từ dân dụng sang thương mại" },
        { t: "p", en: "If you already wire houses, you know boxes, devices and safety. Commercial adds conduit bending, 3-phase power, bigger panels, lighting controls and more paperwork. Commercial work also leads naturally to **industrial controls and PLCs**, the rest of this school.", vi: "Nếu bạn đã đi điện nhà ở, bạn đã biết hộp, thiết bị và an toàn. Thương mại thêm phần uốn ống, điện 3 pha, tủ lớn hơn, điều khiển chiếu sáng và nhiều giấy tờ hơn. Công việc thương mại cũng dẫn tự nhiên tới **điều khiển công nghiệp và PLC**, phần còn lại của trường này." },
        { t: "callout", kind: "tip", en: "California: people doing electrical work for a C-10 contractor must be state-certified electricians or registered electrician trainees. Other states have their own rules. Check your state's licensing board before you work.", vi: "California: người làm điện cho nhà thầu C-10 phải là thợ điện có chứng chỉ của tiểu bang hoặc học viên thợ điện đã đăng ký (trainee). Các bang khác có quy định riêng. Kiểm tra với cơ quan cấp phép của bang bạn trước khi làm." },
        { t: "lab", title: { en: "Walk the commercial wall like an inspector", vi: "Đi kiểm tra vách điện thương mại như thanh tra" }, steps: {
          en: ["In the 3D classroom, stand in front of panel LP-4H and LP-2.", "Check: is the working space clear 3 ft deep and 30 in wide?", "Follow the EMT runs: are there straps near each box?", "Find the exit sign and the troffer. Which panel and circuit should feed them?", "Write a short punch list of anything you would fix, like a real walk-through."],
          vi: ["Trong lớp học 3D, đứng trước tủ LP-4H và LP-2.", "Kiểm tra: không gian làm việc có trống sâu 3 ft và rộng 30 in không?", "Lần theo các tuyến EMT: có kẹp gần mỗi hộp không?", "Tìm biển EXIT và đèn troffer. Tủ và mạch nào nên cấp điện cho chúng?", "Viết một punch list ngắn những gì bạn sẽ sửa, giống một buổi kiểm tra thật."] } }
      ]}
    ],

      { q: { en: "Who should modify a fire alarm system?", vi: "Ai nên sửa hệ thống báo cháy?" }, opts: { en: ["Any electrician", "Only trained and licensed fire alarm technicians", "The building owner", "The HVAC tech"], vi: ["Bất kỳ thợ điện nào", "Chỉ kỹ thuật viên báo cháy được đào tạo và cấp phép", "Chủ tòa nhà", "Thợ HVAC"] }, a: 1, why: { en: "Fire alarm is a specialty life-safety system with its own codes and licensing.", vi: "Báo cháy là hệ thống an toàn sinh mạng chuyên biệt, có code và giấy phép riêng." } }
    ]
  }
  ]
