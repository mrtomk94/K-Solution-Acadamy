<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="K-Solution Academy - lop hoc ao Dien, Tu dien, PLC, HMI. Virtual class for electrical, control panels, PLC and HMI.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23f5b400%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27Arial%27 font-weight=%27900%27 font-size=%2720%27 text-anchor=%27middle%27 fill=%27%230b1424%27%3EK%3C/text%3E%3C/svg%3E">
<title>K-Solution Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky top bar · home = terminal-strip section rail + course grid · course = lesson rail + reading column */
:root{
  --bg:#eceeeb; --surface:#f8f9f6; --raised:#ffffff; --ink:#191d1b; --mut:#5a625d; --line:#cdd3ce;
  --accent:#1c58cf; --accent-soft:#dfe8fb; --accent-ink:#ffffff;
  --live:#14874a; --live-soft:#dcf1e4; --amber:#a86400; --amber-soft:#fbecd2; --warn:#c0302a; --warn-soft:#fbe1df;
  --duct:#d9ddd8;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111413; --surface:#181c1a; --raised:#1e2320; --ink:#e5eae6; --mut:#9ba49e; --line:#2d3430;
  --accent:#7ba3ff; --accent-soft:#1d2a45; --accent-ink:#0d1220;
  --live:#43c97f; --live-soft:#173826; --amber:#f2a93b; --amber-soft:#3a2a10; --warn:#ff7169; --warn-soft:#45201e;
  --duct:#222825; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111413; --surface:#181c1a; --raised:#1e2320; --ink:#e5eae6; --mut:#9ba49e; --line:#2d3430;
  --accent:#7ba3ff; --accent-soft:#1d2a45; --accent-ink:#0d1220;
  --live:#43c97f; --live-soft:#173826; --amber:#f2a93b; --amber-soft:#3a2a10; --warn:#ff7169; --warn-soft:#45201e;
  --duct:#222825; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0;text-align:left}
.brand-mark{width:34px;height:34px;border-radius:5px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.02em}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.02em;line-height:1}
.brand-sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.bar-sp{flex:1}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;padding:5px 12px;cursor:pointer;font-weight:600;font-size:13px;letter-spacing:.06em}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.meter{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.meter-track{width:90px;height:6px;border-radius:3px;background:var(--duct);overflow:hidden}
.meter-fill{height:100%;background:var(--live)}
@media (max-width:620px){#barHmi,#barLs{display:none}.brand-sub,.meter{display:none}.brand-name{font-size:18px;white-space:nowrap}.brand-mark{width:30px;height:30px;font-size:17px}}

/* home */
.hero{padding-block:36px 8px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:36px;align-items:end}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,6vw,64px);line-height:.95;margin:.25em 0 .3em;text-wrap:balance;letter-spacing:.005em}
.lede{font-size:18px;color:var(--mut);max-width:58ch;margin:0 0 20px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:var(--r);padding:10px 16px;border:1px solid var(--line);background:var(--raised);cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* terminal strip */
.strip{background:var(--duct);border-radius:8px;padding:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.term{background:var(--raised);border:1px solid var(--line);border-radius:3px;padding:8px 6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.term:hover{border-color:var(--accent)}
.screw{width:18px;height:18px;border-radius:50%;border:2px solid var(--mut);position:relative}
.screw::after{content:"";position:absolute;left:2px;right:2px;top:6px;height:2px;background:var(--mut)}
.wireno{font-family:var(--f-mono);font-size:12px;font-weight:600}
.term-name{font-size:11px;line-height:1.2;color:var(--mut);min-height:2.4em}
.term-bar{width:100%;height:4px;background:var(--duct);border-radius:2px;overflow:hidden}
.term-bar i{display:block;height:100%;background:var(--live)}
.strip-cap{font-size:12px;color:var(--mut);margin-top:8px}

.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-block:28px 8px}
.how div{border-top:2px solid var(--ink);padding-top:10px}
.how b{font-family:var(--f-display);font-size:19px;display:block;letter-spacing:.01em}
.how span{color:var(--mut);font-size:14px}

.sec{padding-block:28px 6px;scroll-margin-top:70px}
.sec-head{display:flex;gap:14px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px;flex-wrap:wrap}
.sec-no{font-family:var(--f-mono);font-size:13px;color:var(--mut)}
.sec-head h2{font-family:var(--f-display);font-size:30px;margin:0;line-height:1;letter-spacing:.01em}
.sec-head p{margin:0;color:var(--mut);flex-basis:100%;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.card:hover{border-color:var(--accent)}
.code{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.card h3{font-family:var(--f-display);font-size:22px;line-height:1.05;margin:0;letter-spacing:.01em}
.card p{margin:0;color:var(--mut);font-size:14px;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--duct);color:var(--mut)}
.pill.ok{background:var(--live-soft);color:var(--live)}
.pill.mid{background:var(--amber-soft);color:var(--amber)}
.cbar{height:4px;background:var(--duct);border-radius:2px;overflow:hidden}
.cbar i{display:block;height:100%;background:var(--live)}
.foot{padding-block:40px 60px;color:var(--mut);font-size:13px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;align-items:center}

/* course view */
.course{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;padding-block:22px 60px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 90px);overflow:auto}
.rail-head{padding:4px 0 12px}
.rail-head h2{font-family:var(--f-display);font-size:24px;line-height:1.05;margin:4px 0 6px}
.ri{display:flex;gap:10px;align-items:flex-start;background:none;border:0;border-left:2px solid var(--line);padding:8px 10px;cursor:pointer;text-align:left;font-size:14px;line-height:1.3}
.ri:hover{background:var(--surface)}
.ri[aria-current="true"]{border-left-color:var(--accent);background:var(--accent-soft);font-weight:600}
.ri .n{font-family:var(--f-mono);font-size:12px;color:var(--mut);min-width:20px;padding-top:1px}
.ri .ck{margin-left:auto;color:var(--live);font-weight:700}
.back{background:none;border:0;padding:0;cursor:pointer;color:var(--mut);font-size:13px;font-weight:600}
.back:hover{color:var(--ink)}
@media (max-width:860px){.course{grid-template-columns:minmax(0,1fr)}.rail{position:static;max-height:none}.hero{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.strip{grid-template-columns:repeat(4,minmax(0,1fr))}.how{grid-template-columns:minmax(0,1fr)}}

.lesson{max-width:760px;min-width:0}
.crumb{font-size:13px;color:var(--mut)}
.lesson h1{font-size:clamp(32px,4.5vw,46px);margin:.15em 0 .2em}
.lesson-meta{color:var(--mut);font-size:14px;margin-bottom:22px}
.lesson h3{font-family:var(--f-display);font-size:24px;margin:28px 0 8px;letter-spacing:.01em}
.lesson p{margin:0 0 14px;max-width:68ch}
.lesson ul,.lesson ol{margin:0 0 16px;padding-left:22px}
.lesson li{margin:4px 0}
code,.mono{font-family:var(--f-mono);font-size:.88em}
p code,li code,td code{background:var(--duct);padding:1px 5px;border-radius:3px}
.steps{list-style:none;padding:0!important;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;margin:8px 0}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-size:12px;font-weight:600;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center}
.callout{border-radius:var(--r);padding:12px 14px 12px 14px;margin:0 0 16px;border:1px solid;display:grid;gap:4px}
.callout b.k{font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.callout.warn{background:var(--warn-soft);border-color:var(--warn);}
.callout.warn b.k{color:var(--warn)}
.callout.tip{background:var(--accent-soft);border-color:var(--accent)}
.callout.tip b.k{color:var(--accent)}
.callout.kit{background:var(--amber-soft);border-color:var(--amber)}
.callout.kit b.k{color:var(--amber)}
.tbl{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
tr:last-child td{border-bottom:0}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:0 0 18px}
.terms div{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:14px}
.terms b{display:block;font-family:var(--f-display);font-size:18px;letter-spacing:.01em}
pre.codeblk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;overflow-x:auto;font-size:13.5px;line-height:1.5;margin:0 0 18px}
figure{margin:0 0 18px}
.fig{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:12px;overflow-x:auto}
.fig svg{display:block;width:100%;height:auto;max-height:420px;color:var(--ink);font-family:var(--f-body)}
figcaption{font-size:13px;color:var(--mut);margin-top:6px}
.lab{border:2px solid var(--ink);border-radius:var(--r);margin:0 0 18px;overflow:hidden}
.lab-h{background:var(--ink);color:var(--bg);padding:8px 14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.lab-h small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.lab-h b{font-family:var(--f-display);font-size:20px;letter-spacing:.01em}
.lab ol{padding:10px 14px 4px 38px!important}

/* ladder */
.ladder{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:8px 4px;overflow-x:auto;margin:0 0 18px}
.ladder svg{display:block;color:var(--ink);font-family:var(--f-mono)}
.ladder .w{stroke:currentColor;stroke-width:1.5;fill:none}
.ladder .rail{stroke:currentColor;stroke-width:3}
.ladder .t{fill:currentColor;font-size:11px}
.ladder .tm{fill:var(--mut);font-size:11px}
.ladder .cm{fill:var(--live);font-size:11.5px;font-family:var(--f-body);font-style:italic}
.ladder .bx{fill:var(--surface);stroke:currentColor;stroke-width:1.3}
.ladder .on{stroke:var(--live);stroke-width:3}
.ladder .onf{fill:var(--live-soft);stroke:var(--live);stroke-width:2}

/* widgets */
.wd{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 18px}
.wd-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:10px;flex-wrap:wrap}
.wd-h b{font-family:var(--f-display);font-size:19px;letter-spacing:.01em}
.wd-h small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.wd .ladder{margin-bottom:10px}
.pb{border-radius:50%;width:64px;height:64px;border:3px solid var(--line);font-weight:700;font-size:12px;cursor:pointer;user-select:none;touch-action:none;color:#fff}
.pb.g{background:#1d8a46}.pb.r{background:#c42a22}.pb.y{background:#d39400;color:#1a1a1a}
.pb:active,.pb.down{transform:translateY(2px);filter:brightness(.85)}
.lamp{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--duct);display:inline-block;vertical-align:middle}
.lamp.on{background:var(--live);box-shadow:0 0 14px var(--live)}
.lamp.amb.on{background:var(--amber);box-shadow:0 0 14px var(--amber)}
.lamp.red.on{background:var(--warn);box-shadow:0 0 14px var(--warn)}
.ctl{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mut);text-align:center}
.motor{width:64px;height:64px;border-radius:50%;border:3px solid var(--ink);position:relative;display:grid;place-items:center;font-weight:700;font-family:var(--f-mono)}
.motor .fan{width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--ink) 0 25%,transparent 0 50%,var(--ink) 0 75%,transparent 0)}
.motor.run{border-color:var(--live)}
.motor.run .fan{animation:spin .6s linear infinite;background:conic-gradient(var(--live) 0 25%,transparent 0 50%,var(--live) 0 75%,transparent 0)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.motor.run .fan{animation-duration:3s}}
.msg{font-size:14px;color:var(--mut);margin-top:8px}
.msg b{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{background:var(--raised);border:0;border-right:1px solid var(--line);padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.inp{font:inherit;font-family:var(--f-mono);font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:var(--r);background:var(--raised);color:var(--ink);width:100%;min-width:0}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut);font-weight:600;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.big{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.bits{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px}
.bits button{border:1px solid var(--line);background:var(--raised);border-radius:3px;padding:6px 0;font-family:var(--f-mono);font-size:13px;cursor:pointer;min-width:0}
.bits button.on{background:var(--live);color:#fff;border-color:var(--live)}
.bits small{font-family:var(--f-mono);font-size:9px;color:var(--mut);text-align:center}
.ok{color:var(--live);font-weight:700}.bad{color:var(--warn);font-weight:700}
.scanbox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.scanbox div{border:1.5px solid var(--line);border-radius:var(--r);padding:10px;text-align:center;font-size:13px;background:var(--raised)}
.scanbox div.act{border-color:var(--accent);background:var(--accent-soft)}
.scanbox b{display:block;font-family:var(--f-display);font-size:17px}

/* lesson footer, quiz */
.lfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:30px;padding-top:16px}
.q{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.q-n{font-family:var(--f-mono);font-size:12px;color:var(--mut)}
.q h4{margin:2px 0 10px;font-size:17px;font-weight:600}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;margin:6px 0;cursor:pointer;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .L{font-family:var(--f-mono);font-weight:600;color:var(--mut)}
.opt.right{border-color:var(--live);background:var(--live-soft)}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.why{font-size:14px;margin-top:8px;padding:8px 10px;border-left:3px solid var(--line);color:var(--mut)}
.score{border:2px solid var(--ink);border-radius:var(--r);padding:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:16px 0}
.score .big{font-size:34px}

/* 3D classroom overlay: deliberately single dark look */
html.l3-open,html.l3-open body{overflow:hidden}
.l3{position:fixed;inset:0;z-index:50;background:#14181a;color:#e8ece9;font-family:var(--f-body)}
.l3 canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.l3-top{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 18px max(12px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(12,15,16,.85),rgba(12,15,16,0));pointer-events:none}
.l3-top>*{pointer-events:auto}
.l3-title{font-family:var(--f-display);font-size:22px;letter-spacing:.02em;margin-right:6px}
.l3-chips{display:flex;gap:6px;flex-wrap:wrap}
.l3-chips button,.l3-lang button,.l3-x{background:rgba(30,36,39,.85);border:1px solid #3c464a;color:#e8ece9;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer}
.l3-chips button:hover,.l3-x:hover{border-color:#f2b33a}
.l3-sp{flex:1}
.l3-lang{display:flex;gap:2px}
.l3-lang button[aria-pressed="true"]{background:#e8ece9;color:#14181a}
.l3-x{width:36px;height:36px;padding:0;font-size:16px}
.l3-help{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));background:rgba(20,24,26,.8);border:1px solid #3c464a;border-radius:6px;padding:6px 10px;font-size:12.5px;color:#b9c2be;max-width:calc(100% - 24px)}
.l3-help b{color:#fff}
.l3-card{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100% - 24px));background:rgba(20,24,26,.96);border:1px solid #3c464a;border-left:4px solid #f2b33a;border-radius:8px;padding:14px 16px}
.l3-card h3{font-family:var(--f-display);font-size:24px;margin:2px 0 6px;line-height:1.05}

        { t: "terms", items: [

          { term: { en: "Arc flash boundary", vi: "Ranh giới arc flash" }, def: { en: "Distance where an arc flash could cause a second-degree burn. Inside it, you must wear arc-rated PPE.", vi: "Khoảng cách mà arc flash có thể gây bỏng độ 2. Bên trong ranh giới này phải mặc PPE chịu hồ quang." } },
          { term: { en: "Arc flash label", vi: "Nhãn arc flash" }, def: { en: "Sticker on the panel door showing voltage, boundary, and required PPE category or incident energy (cal/cm²).", vi: "Nhãn dán trên cửa tủ ghi điện áp, ranh giới và cấp PPE hoặc năng lượng sự cố (cal/cm²)." } }
        ] },
        { t: "table", head: { en: ["PPE category", "Min. arc rating", "Typical gear"], vi: ["Cấp PPE", "Định mức hồ quang tối thiểu", "Đồ bảo hộ điển hình"] }, rows: {
          en: [["1", "4 cal/cm²", "AR shirt + pants, face shield, safety glasses, hearing protection, leather gloves"], ["2", "8 cal/cm²", "Same as 1 with arc-rated balaclava or hood"], ["3", "25 cal/cm²", "Arc flash suit and hood, rubber gloves with leather protectors"], ["4", "40 cal/cm²", "Heavy arc flash suit and hood"]],
          vi: [["1", "4 cal/cm²", "Áo + quần AR (chịu hồ quang), tấm che mặt, kính bảo hộ, bảo vệ tai, găng da"], ["2", "8 cal/cm²", "Như cấp 1, thêm mũ trùm (balaclava) chịu hồ quang"], ["3", "25 cal/cm²", "Bộ đồ arc flash + mũ trùm, găng cao su có găng da bọc ngoài"], ["4", "40 cal/cm²", "Bộ đồ arc flash dày + mũ trùm"]] } },
        { t: "callout", kind: "tip", en: "Always read the arc flash label before you open a door. No label? Treat it as dangerous and ask.", vi: "Luôn đọc nhãn arc flash trước khi mở cửa tủ. Không có nhãn? Coi như nguy hiểm và hỏi người phụ trách." },
        { t: "list", en: ["Rubber voltage-rated gloves (Class 00 = 500 VAC, Class 0 = 1,000 VAC) — air-test them before every use", "No rings, watches, or metal jewelry", "Use insulated tools rated 1,000 V"], vi: ["Găng cao su cách điện (Class 00 = 500 VAC, Class 0 = 1.000 VAC) – thổi hơi kiểm tra trước mỗi lần dùng", "Không đeo nhẫn, đồng hồ, trang sức kim loại", "Dùng dụng cụ cách điện định mức 1.000 V"] }
      ] },
      { id: "l3", title: { en: "Lockout/Tagout and Live-Dead-Live", vi: "Lockout/Tagout và kiểm tra Live-Dead-Live" }, minutes: 20, blocks: [
        { t: "p", en: "**LOTO** (Lockout/Tagout) makes sure a machine cannot be turned on while you work on it. Your lock, your key, your life.", vi: "**LOTO** (Lockout/Tagout – khóa và treo thẻ) đảm bảo máy không thể bật lên khi bạn đang làm việc. Ổ khóa của bạn, chìa khóa của bạn, mạng sống của bạn." },
        { t: "steps", en: ["**Prepare** — know every energy source: electrical, air, hydraulic, springs, gravity", "**Notify** — tell operators and affected people the machine is going down", "**Shut down** — stop the machine with its normal controls", "**Isolate** — open the disconnect, close air/hydraulic valves", "**Lock and tag** — put your own lock and tag on each isolation point", "**Verify** — try to start the machine, then test for zero voltage (live-dead-live)"], vi: ["**Chuẩn bị** – biết hết các nguồn năng lượng: điện, hơi, thủy lực, lò xo, trọng lực", "**Thông báo** – báo cho người vận hành và những người liên quan là máy sắp dừng", "**Tắt máy** – dừng máy bằng nút điều khiển bình thường", "**Cách ly** – mở cầu dao (disconnect), khóa van hơi/thủy lực", "**Khóa và treo thẻ** – gắn ổ khóa và thẻ của riêng bạn lên từng điểm cách ly", "**Xác minh** – thử khởi động máy, rồi đo kiểm không còn điện (live-dead-live)"] },
        { t: "h", en: "Live-Dead-Live test", vi: "Kiểm tra Live-Dead-Live" },
        { t: "steps", en: ["**Live:** test your meter on a known live source (or proving unit) — proves the meter works", "**Dead:** test the locked-out circuit: every phase to phase and every phase to ground — must read 0 V", "**Live:** test the meter on the known source again — proves the meter did not fail during the test"], vi: ["**Live:** đo thử đồng hồ trên nguồn biết chắc có điện (hoặc bộ proving unit) – chứng minh đồng hồ còn tốt", "**Dead:** đo mạch đã khóa: từng pha với pha và từng pha với đất – phải là 0 V", "**Live:** đo lại trên nguồn có điện – chứng minh đồng hồ không bị hỏng trong lúc đo"] },
        { t: "callout", kind: "warn", en: "On 480 V, check L1-L2, L2-L3, L1-L3, and each phase to ground. One missed phase can kill you.", vi: "Với 480 V, đo L1-L2, L2-L3, L1-L3 và từng pha xuống đất. Bỏ sót một pha có thể chết người." },
        { t: "lab", title: { en: "LOTO the HV power box (instructor watches)", vi: "LOTO hộp HV power box (giảng viên giám sát)" }, steps: {
          en: ["Instructor energizes the kit; you start the motor from the trainee panel", "Stop the motor with the Stop button", "Turn the HV power box disconnect handle to OFF", "Put your lock and tag on the handle", "Press Start — the motor must not run", "Instructor demonstrates live-dead-live at the load side of the disconnect while you watch from outside the boundary", "Remove your lock only after everyone is clear; restore power"],
          vi: ["Giảng viên cấp điện cho kit; bạn chạy động cơ từ trainee panel", "Dừng động cơ bằng nút Stop", "Gạt tay cầu dao của HV power box về OFF", "Gắn ổ khóa và thẻ của bạn lên tay gạt", "Nhấn Start – động cơ không được chạy", "Giảng viên làm mẫu đo live-dead-live phía tải của cầu dao, bạn đứng xem ngoài ranh giới", "Chỉ tháo khóa khi mọi người đã tránh xa; cấp điện lại"] } }
      ] }
    ],
    quiz: [
      { q: { en: "About how much current through the body can make your muscles lock so you can't let go?", vi: "Khoảng bao nhiêu dòng điện qua cơ thể có thể làm cơ co cứng khiến bạn không buông tay ra được?" }, opts: { en: ["1 mA", "10–20 mA", "1 A", "10 A"], vi: ["1 mA", "10–20 mA", "1 A", "10 A"] }, a: 1, why: { en: "At 10–20 mA many people can no longer let go of the conductor.", vi: "Ở 10–20 mA nhiều người không còn tự buông dây dẫn ra được." } },
      { q: { en: "What is the correct order for the voltage test?", vi: "Thứ tự đúng khi đo kiểm điện áp là gì?" }, opts: { en: ["Dead-Live-Dead", "Live-Dead-Live", "Dead only", "Live-Live-Dead"], vi: ["Dead-Live-Dead", "Live-Dead-Live", "Chỉ đo Dead", "Live-Live-Dead"] }, a: 1, why: { en: "Prove the meter works, test the circuit, then prove the meter still works.", vi: "Chứng minh đồng hồ tốt, đo mạch, rồi chứng minh đồng hồ vẫn còn tốt." } },
      { q: { en: "Who puts the lock on the disconnect during LOTO?", vi: "Trong LOTO, ai gắn ổ khóa lên cầu dao?" }, opts: { en: ["The supervisor for everyone", "Each person working on the machine", "Only the operator", "Nobody, a tag is enough"], vi: ["Giám sát gắn một khóa cho tất cả", "Mỗi người làm việc trên máy", "Chỉ người vận hành", "Không ai, chỉ cần thẻ"] }, a: 1, why: { en: "Every worker uses their own lock and keeps their own key.", vi: "Mỗi người dùng ổ khóa riêng và giữ chìa khóa riêng." } },
      { q: { en: "Where do you find the PPE category required for a panel?", vi: "Bạn tìm cấp PPE cần thiết cho một tủ điện ở đâu?" }, opts: { en: ["On the motor nameplate", "On the arc flash label", "In the PLC program", "On the wire markers"], vi: ["Trên nhãn động cơ", "Trên nhãn arc flash", "Trong chương trình PLC", "Trên nhãn dây"] }, a: 1, why: { en: "The arc flash label lists the voltage, boundary, and PPE needed.", vi: "Nhãn arc flash ghi điện áp, ranh giới và PPE cần thiết." } },
      { q: { en: "After locking out, what is the first verification step?", vi: "Sau khi khóa nguồn, bước xác minh đầu tiên là gì?" }, opts: { en: ["Open the panel and start wiring", "Try to start the machine with its normal controls", "Call the operator", "Remove the tag"], vi: ["Mở tủ và bắt đầu đấu dây", "Thử khởi động máy bằng nút bình thường", "Gọi người vận hành", "Gỡ thẻ"] }, a: 1, why: { en: "Trying to start proves you isolated the right source, then you test for zero voltage.", vi: "Thử khởi động để chắc đã cách ly đúng nguồn, sau đó đo kiểm không còn điện." } }
    ]
  },
  /* ---------------- c-elec-basics ---------------- */
  {
    id: "c-elec-basics",
    title: { en: "Electricity Basics", vi: "Điện cơ bản" },
    summary: { en: "Voltage, current, resistance, and power — then AC, DC, 3-phase, and how to use a multimeter the right way.", vi: "Điện áp, dòng điện, điện trở và công suất – rồi đến AC, DC, điện 3 pha và cách dùng đồng hồ vạn năng đúng cách." },
    level: "Beginner", minutes: 70,
    lessons: [
      { id: "l1", title: { en: "Voltage, Current, Resistance", vi: "Điện áp, dòng điện, điện trở" }, minutes: 15, blocks: [
        { t: "p", en: "Think of water in a pipe. **Voltage** is the pressure, **current** is how much water flows, **resistance** is how narrow the pipe is.", vi: "Hãy nghĩ tới nước chảy trong ống. **Điện áp** là áp lực, **dòng điện** là lượng nước chảy, **điện trở** là độ hẹp của ống." },
        { t: "table", head: { en: ["Quantity", "Symbol", "Unit", "Measured with"], vi: ["Đại lượng", "Ký hiệu", "Đơn vị", "Đo bằng"] }, rows: {
          en: [["Voltage", "V (or E)", "Volt (V)", "Meter across two points"], ["Current", "I", "Ampere (A)", "Clamp meter around one wire"], ["Resistance", "R", "Ohm (Ω)", "Meter on a de-energized part"], ["Power", "P", "Watt (W)", "Calculated V × I"]],
          vi: [["Điện áp", "V (hoặc E)", "Volt (V)", "Đồng hồ đo giữa hai điểm"], ["Dòng điện", "I", "Ampe (A)", "Ampe kìm kẹp quanh một dây"], ["Điện trở", "R", "Ohm (Ω)", "Đồng hồ đo trên linh kiện đã mất điện"], ["Công suất", "P", "Watt (W)", "Tính bằng V × I"]] } },
        { t: "terms", items: [
          { term: { en: "Circuit", vi: "Mạch điện (circuit)" }, def: { en: "A complete loop from the source, through a load, and back. No loop, no current.", vi: "Một vòng kín từ nguồn, qua tải và quay về. Không có vòng kín thì không có dòng." } },
          { term: { en: "Open circuit", vi: "Hở mạch (open)" }, def: { en: "The loop is broken (switch off, broken wire). Current = 0.", vi: "Vòng bị đứt (công tắc tắt, dây đứt). Dòng = 0." } },
          { term: { en: "Short circuit", vi: "Ngắn mạch (short)" }, def: { en: "Current takes a path with almost no resistance. Very high current — the breaker or fuse must trip.", vi: "Dòng đi qua đường gần như không có điện trở. Dòng cực lớn – CB hoặc cầu chì phải ngắt." } }
        ] }
      ] },
      { id: "l2", title: { en: "Ohm's Law and Power", vi: "Định luật Ohm và công suất" }, minutes: 20, blocks: [
        { t: "p", en: "Ohm's law: **V = I × R**. Power: **P = V × I**. Know any two values and you can find the rest.", vi: "Định luật Ohm: **V = I × R**. Công suất: **P = V × I**. Biết hai giá trị bất kỳ là tính được các giá trị còn lại." },
        { t: "widget", name: "ohms" },
        { t: "h", en: "Example: 24 VDC pilot light", vi: "Ví dụ: đèn báo 24 VDC" },
        { t: "p", en: "A pilot light draws 0.03 A at 24 V. Power = 24 × 0.03 = **0.72 W**. Ten of them = 7.2 W, about 0.3 A from the power supply.", vi: "Một đèn báo tiêu thụ 0,03 A ở 24 V. Công suất = 24 × 0,03 = **0,72 W**. Mười cái = 7,2 W, khoảng 0,3 A từ bộ nguồn." },
        { t: "callout", kind: "tip", en: "Use this math to size a 24 VDC power supply: add up every load's current, then add about 25% spare.", vi: "Dùng phép tính này để chọn bộ nguồn 24 VDC: cộng dòng của tất cả tải, rồi cộng thêm khoảng 25% dự phòng." },
        { t: "callout", kind: "kit", en: "Your trainee panel's 24 VDC supply powers the PLC, the 5069-IB16 inputs, and pilot lights. Read its nameplate and write down its amp rating.", vi: "Bộ nguồn 24 VDC trên trainee panel cấp điện cho PLC, card ngõ vào 5069-IB16 và đèn báo. Đọc nhãn và ghi lại dòng định mức." }
      ] },
      { id: "l3", title: { en: "AC, DC, and 3-Phase", vi: "AC, DC và điện 3 pha" }, minutes: 15, blocks: [
        { t: "p", en: "**DC** (direct current) flows one way — batteries, 24 VDC control power. **AC** (alternating current) changes direction 60 times per second in the US (60 Hz).", vi: "**DC** (một chiều) chạy theo một hướng – pin, nguồn điều khiển 24 VDC. **AC** (xoay chiều) đổi chiều 60 lần mỗi giây ở Mỹ (60 Hz)." },
        { t: "svg", svg: "<svg viewBox=\"0 0 420 140\"><line x1=\"10\" y1=\"70\" x2=\"410\" y2=\"70\" stroke=\"currentColor\" stroke-dasharray=\"4 4\" opacity=\".4\"/><path d=\"M10 70 C40 10 70 10 100 70 S160 130 190 70 S250 10 280 70 S340 130 370 70\" fill=\"none\" style=\"stroke:var(--accent)\" stroke-width=\"3\"/><line x1=\"10\" y1=\"35\" x2=\"190\" y2=\"35\" stroke=\"currentColor\" stroke-width=\"2\" opacity=\".0\"/><text x=\"300\" y=\"125\" fill=\"currentColor\" font-size=\"13\">AC 60 Hz</text><text x=\"12\" y=\"20\" fill=\"currentColor\" font-size=\"12\">+170 V peak</text><text x=\"12\" y=\"135\" fill=\"currentColor\" font-size=\"12\">−170 V</text></svg>", cap: { en: "120 VAC is the RMS value; the peak is about 170 V.", vi: "120 VAC là giá trị hiệu dụng (RMS); đỉnh khoảng 170 V." } },
        { t: "table", head: { en: ["System", "Where you see it"], vi: ["Hệ thống", "Gặp ở đâu"] }, rows: {
          en: [["120 V single-phase", "Outlets, control circuits"], ["208 V 3-phase (120/208 Y)", "Small commercial buildings"], ["240 V single-phase", "Homes: dryers, AC units"], ["480 V 3-phase (277/480 Y)", "Factories: motors, VFDs"], ["24 VDC", "PLC I/O, sensors, safety circuits"]],
          vi: [["120 V 1 pha", "Ổ cắm, mạch điều khiển"], ["208 V 3 pha (120/208 Y)", "Tòa nhà thương mại nhỏ"], ["240 V 1 pha", "Nhà ở: máy sấy, máy lạnh"], ["480 V 3 pha (277/480 Y)", "Nhà máy: động cơ, biến tần (VFD)"], ["24 VDC", "I/O PLC, cảm biến, mạch an toàn"]] } },
        { t: "p", en: "**3-phase** uses three AC wires (L1, L2, L3), each shifted 120°. It gives smooth power to motors and needs smaller wire for the same power.", vi: "**3 pha** dùng ba dây AC (L1, L2, L3), lệch nhau 120°. Cấp công suất đều cho động cơ và cần dây nhỏ hơn cho cùng công suất." },
        { t: "callout", kind: "kit", en: "The HV power box takes 480 V 3-phase for the motor. A control transformer steps it down to 120 VAC for the trainee panel, and a power supply makes 24 VDC.", vi: "HV power box nhận 480 V 3 pha cho động cơ. Biến áp điều khiển hạ xuống 120 VAC cho trainee panel, và bộ nguồn tạo ra 24 VDC." }
      ] },
      { id: "l4", title: { en: "Using a Multimeter", vi: "Sử dụng đồng hồ vạn năng" }, minutes: 20, blocks: [
        { t: "table", head: { en: ["Test", "Meter setting", "Circuit state", "Leads"], vi: ["Phép đo", "Thang đo", "Trạng thái mạch", "Que đo"] }, rows: {
          en: [["AC volts", "V~", "Live", "Across two points"], ["DC volts", "V⎓", "Live", "Red on +, black on 0V"], ["Continuity", "Beep (·)))", "Dead", "Across wire or contact"], ["Resistance", "Ω", "Dead", "Across the part"], ["Current", "Clamp A~ / A⎓", "Live", "Clamp around ONE wire"]],
          vi: [["Volt AC", "V~", "Có điện", "Giữa hai điểm"], ["Volt DC", "V⎓", "Có điện", "Que đỏ vào +, đen vào 0V"], ["Thông mạch", "Bíp (·)))", "Mất điện", "Hai đầu dây hoặc tiếp điểm"], ["Điện trở", "Ω", "Mất điện", "Hai đầu linh kiện"], ["Dòng điện", "Kẹp A~ / A⎓", "Có điện", "Kẹp quanh MỘT dây"]] } },
        { t: "callout", kind: "warn", en: "Never measure ohms or continuity on a live circuit. Never put the leads in the amp jacks and then measure voltage — that is a direct short through your meter.", vi: "Không bao giờ đo ohm hoặc thông mạch trên mạch có điện. Không cắm que vào lỗ đo ampe rồi đo điện áp – đó là ngắn mạch trực tiếp qua đồng hồ." },
        { t: "list", en: ["Use a CAT III or CAT IV meter rated 600 V or more for industrial panels", "Clamp around one conductor only — clamping L and N together reads 0", "A good coil usually reads tens to hundreds of ohms; 0 Ω = shorted, OL = open"], vi: ["Dùng đồng hồ CAT III hoặc CAT IV định mức từ 600 V trở lên cho tủ công nghiệp", "Chỉ kẹp quanh một dây – kẹp cả L và N cùng lúc sẽ ra 0", "Cuộn dây tốt thường đo được vài chục đến vài trăm ohm; 0 Ω = chập, OL = đứt"] },
        { t: "lab", title: { en: "Meter practice on the trainee panel", vi: "Thực hành đồng hồ trên trainee panel" }, steps: {
          en: ["With power ON, measure 120 VAC between the control hot and neutral terminals", "Measure 24 VDC at the power supply + and − terminals", "Turn the trainee panel OFF and lock it out; verify 0 V (live-dead-live)", "Check continuity of a red Stop button: it should beep (NC), then stop beeping when pressed", "Measure the ohms of a relay coil and write it down", "Power ON, run the motor, and have the instructor clamp one motor lead in the HV box"],
          vi: ["Khi có điện, đo 120 VAC giữa cọc dây nóng (hot) điều khiển và dây trung tính (neutral)", "Đo 24 VDC ở cọc + và − của bộ nguồn", "Tắt trainee panel và khóa nguồn; xác minh 0 V (live-dead-live)", "Đo thông mạch nút Stop màu đỏ: phải kêu bíp (NC), nhấn xuống thì hết kêu", "Đo điện trở cuộn dây rơ-le và ghi lại", "Cấp điện, chạy động cơ, giảng viên kẹp ampe một dây động cơ trong hộp HV"] } }
      ] }
    ],
    quiz: [
      { q: { en: "A 24 VDC load draws 0.5 A. What is its power?", vi: "Một tải 24 VDC tiêu thụ 0,5 A. Công suất là bao nhiêu?" }, opts: { en: ["12 W", "48 W", "24.5 W", "0.02 W"], vi: ["12 W", "48 W", "24,5 W", "0,02 W"] }, a: 0, why: { en: "P = V × I = 24 × 0.5 = 12 W.", vi: "P = V × I = 24 × 0,5 = 12 W." } },
      { q: { en: "120 V across 60 Ω gives what current?", vi: "120 V đặt lên 60 Ω cho dòng bao nhiêu?" }, opts: { en: ["0.5 A", "2 A", "7,200 A", "180 A"], vi: ["0,5 A", "2 A", "7.200 A", "180 A"] }, a: 1, why: { en: "I = V / R = 120 / 60 = 2 A.", vi: "I = V / R = 120 / 60 = 2 A." } },
      { q: { en: "Which voltage is typical for factory motors in the US?", vi: "Điện áp nào phổ biến cho động cơ nhà máy ở Mỹ?" }, opts: { en: ["24 VDC", "120 V single-phase", "480 V 3-phase", "12 VDC"], vi: ["24 VDC", "120 V 1 pha", "480 V 3 pha", "12 VDC"] }, a: 2, why: { en: "Most US plants run motors on 480 V 3-phase.", vi: "Phần lớn nhà máy ở Mỹ chạy động cơ bằng 480 V 3 pha." } },
      { q: { en: "You must measure continuity on a circuit that is…", vi: "Đo thông mạch phải làm trên mạch…" }, opts: { en: ["Live", "De-energized", "Running a motor", "Any state"], vi: ["Đang có điện", "Đã mất điện", "Đang chạy động cơ", "Trạng thái nào cũng được"] }, a: 1, why: { en: "Ohms and continuity tests are only done on dead circuits.", vi: "Đo ohm và thông mạch chỉ làm trên mạch đã mất điện." } },

ộn CR1 là tham chiếu chéo tới tiếp điểm của nó." } },

        { t: "p", en: "Power enters the panel through the **disconnect**, then gets protected, then gets stepped down for control.", vi: "Điện vào tủ qua **cầu dao tổng (disconnect)**, sau đó được bảo vệ, rồi được hạ áp cho mạch điều khiển." },

          vi: [["Dòng tiếp điểm", "Khoảng 5–10 A", "9 A đến hàng trăm ampe"], ["Ứng dụng", "Logic, rơ-le trung gian cho ngõ ra PLC", "Động cơ, điện trở nhiệt"], ["Ví dụ", "Rơ-le kiếng (ice-cube), 700-HK", "Allen-Bradley 100-C, AutomationDirect XTCE"]] } },
        { t: "h", en: "Overload relay (OL)", vi: "Rơ-le nhiệt (overload – OL)" },
        { t: "p", en: "The **overload** protects the motor from running too hot for too long. It does NOT protect against a short circuit — that is the fuse or breaker's job.", vi: "**Rơ-le nhiệt** bảo vệ động cơ khỏi chạy quá nóng quá lâu. Nó KHÔNG bảo vệ ngắn mạch – đó là việc của cầu chì hoặc CB." },
        { t: "steps", en: ["Read the motor nameplate FLA (full load amps), e.g. 2.1 A at 480 V", "Pick an overload whose dial range covers that value, e.g. 1.6–2.5 A", "Set the dial to the FLA (or as the drawing says, usually 100–115% depending on service factor)", "Wire the OL's NC contact (95-96) in series with the contactor coil"], vi: ["Đọc FLA (dòng đầy tải) trên nhãn động cơ, ví dụ 2,1 A ở 480 V", "Chọn rơ-le nhiệt có dải chỉnh bao giá trị đó, ví dụ 1,6–2,5 A", "Chỉnh núm về FLA (hoặc theo bản vẽ, thường 100–115% tùy hệ số phục vụ – service factor)", "Đấu tiếp điểm NC của OL (95-96) nối tiếp với cuộn dây contactor"] },
        { t: "callout", kind: "tip", en: "Contactor terminals: power L1/L2/L3 in, T1/T2/T3 out to the motor, coil is A1/A2. Auxiliary contacts: 13-14 is NO, 21-22 is NC.", vi: "Cọc contactor: nguồn vào L1/L2/L3, ra động cơ T1/T2/T3, cuộn dây là A1/A2. Tiếp điểm phụ: 13-14 là NO, 21-22 là NC." }
      ] },
      { id: "l3", title: { en: "Terminals, Operators, and Sensors", vi: "Cầu đấu, nút nhấn và cảm biến" }, minutes: 20, blocks: [
        { t: "terms", items: [
          { term: { en: "Terminal block", vi: "Cầu đấu (terminal block)" }, def: { en: "Every field wire lands on a terminal. Types: feed-through, ground (green/yellow), fused, and disconnect.", vi: "Mọi dây hiện trường đều đấu vào cầu đấu. Các loại: thông thường, tiếp địa (xanh/vàng), có cầu chì, và có cầu dao cắt." } },
          { term: { en: "Pushbutton", vi: "Nút nhấn" }, def: { en: "Green = start (NO). Red = stop (NC). Red mushroom on yellow = E-stop (NC, latching).", vi: "Xanh = start (NO). Đỏ = stop (NC). Nấm đỏ trên nền vàng = E-stop (NC, tự giữ)." } },
          { term: { en: "Selector switch", vi: "Công tắc chọn" }, def: { en: "2- or 3-position switch, e.g. Hand-Off-Auto (HOA).", vi: "Công tắc 2 hoặc 3 vị trí, ví dụ Hand-Off-Auto (HOA)." } },
          { term: { en: "Inductive prox", vi: "Cảm biến tiệm cận (prox)" }, def: { en: "Senses metal without touching, a few mm range. 3 wires: brown +24V, blue 0V, black signal.", vi: "Phát hiện kim loại không cần chạm, khoảng cách vài mm. 3 dây: nâu +24V, xanh dương 0V, đen tín hiệu." } },
          { term: { en: "Photo-eye", vi: "Cảm biến quang (photo-eye)" }, def: { en: "Senses objects with light. Through-beam, retro-reflective, or diffuse.", vi: "Phát hiện vật bằng ánh sáng. Loại thu-phát riêng, phản xạ gương, hoặc khuếch tán." } }
        ] },
        { t: "h", en: "PNP vs NPN (sourcing vs sinking)", vi: "PNP và NPN (sourcing và sinking)" },
        { t: "p", en: "A **PNP** sensor switches +24V to the input (it *sources* current). An **NPN** sensor switches 0V (it *sinks* current). The PLC input card must be the opposite: PNP sensor → sinking input.", vi: "Cảm biến **PNP** đóng +24V vào ngõ vào (nó *sourcing* – cấp dòng). Cảm biến **NPN** đóng 0V (nó *sinking* – hút dòng). Card ngõ vào PLC phải ngược lại: cảm biến PNP → ngõ vào sinking." },
        { t: "widget", name: "sinksource" },
        { t: "callout", kind: "kit", en: "The 5069-IB16 on your kit is a sinking input card, so use PNP (sourcing) sensors. Most US plants use PNP.", vi: "Card 5069-IB16 trên kit là ngõ vào sinking, nên dùng cảm biến PNP (sourcing). Phần lớn nhà máy ở Mỹ dùng PNP." }
      ] },
      { id: "l4", title: { en: "Intro to VFDs", vi: "Giới thiệu biến tần (VFD)" }, minutes: 15, blocks: [
        { t: "p", en: "A **VFD** (variable frequency drive, biến tần) changes the frequency sent to a motor to change its speed. 60 Hz = full speed, 30 Hz ≈ half speed.", vi: "**VFD** (biến tần) thay đổi tần số cấp cho động cơ để đổi tốc độ. 60 Hz = tốc độ định mức, 30 Hz ≈ nửa tốc độ." },
        { t: "list", en: ["Soft start and stop (accel/decel ramps) — less wear and lower inrush current", "Built-in motor overload, so no separate OL relay", "Controlled by terminals (start, speed pot, 4–20 mA) or by network (EtherNet/IP)", "Example: Allen-Bradley PowerFlex 525, AutomationDirect GS20"], vi: ["Khởi động và dừng mềm (ramp tăng/giảm tốc) – ít hao mòn, dòng khởi động thấp", "Có sẵn bảo vệ quá tải động cơ, không cần OL riêng", "Điều khiển qua cọc đấu (start, chiết áp tốc độ, 4–20 mA) hoặc qua mạng (EtherNet/IP)", "Ví dụ: Allen-Bradley PowerFlex 525, AutomationDirect GS20"] },
        { t: "callout", kind: "warn", en: "VFD DC bus capacitors stay charged after power is off. Wait the time on the label (often 3–5 minutes) and measure the DC bus before touching.", vi: "Tụ DC bus trong biến tần vẫn còn điện sau khi cắt nguồn. Chờ theo thời gian ghi trên nhãn (thường 3–5 phút) và đo DC bus trước khi chạm vào." },
        { t: "lab", title: { en: "Component scavenger hunt", vi: "Tìm và nhận diện linh kiện" }, steps: {
          en: ["With the trainee panel OFF and locked, open it", "Find and label on paper: 24 VDC supply, each relay, terminal blocks, ground bar", "Read one relay's coil voltage and contact rating from its side label", "Find the 5069-IB16 and 5069-OW4I modules and read their catalog numbers", "Ask the instructor to show the contactor, overload, and its FLA setting in the HV box"],
          vi: ["Tắt và khóa nguồn trainee panel, rồi mở tủ", "Tìm và ghi lại: bộ nguồn 24 VDC, từng rơ-le, cầu đấu, thanh tiếp địa", "Đọc điện áp cuộn dây và dòng tiếp điểm trên nhãn hông của một rơ-le", "Tìm module 5069-IB16 và 5069-OW4I, đọc mã catalog", "Nhờ giảng viên chỉ contactor, rơ-le nhiệt và mức chỉnh FLA trong hộp HV"] } }
      ] }
    ],
    quiz: [
      { q: { en: "Which device protects a motor from running overloaded for too long?", vi: "Thiết bị nào bảo vệ động cơ khỏi chạy quá tải quá lâu?" }, opts: { en: ["Fuse", "Overload relay", "Disconnect", "Pilot light"], vi: ["Cầu chì", "Rơ-le nhiệt", "Cầu dao", "Đèn báo"] }, a: 1, why: { en: "The overload relay trips on sustained overcurrent based on motor FLA.", vi: "Rơ-le nhiệt ngắt khi quá dòng kéo dài, dựa trên FLA của động cơ." } },
      { q: { en: "Contactor coil terminals are labeled…", vi: "Cọc cuộn dây contactor được ký hiệu…" }, opts: { en: ["L1/L2", "T1/T2", "A1/A2", "13/14"], vi: ["L1/L2", "T1/T2", "A1/A2", "13/14"] }, a: 2, why: { en: "A1/A2 are always the coil.", vi: "A1/A2 luôn là cuộn dây." } },
      { q: { en: "A PNP sensor should connect to which input type?", vi: "Cảm biến PNP nên đấu vào loại ngõ vào nào?" }, opts: { en: ["Sourcing input", "Sinking input", "Analog input", "Relay output"], vi: ["Ngõ vào sourcing", "Ngõ vào sinking", "Ngõ vào analog", "Ngõ ra rơ-le"] }, a: 1, why: { en: "PNP sources current, so the input must sink it.", vi: "PNP cấp dòng ra, nên ngõ vào phải hút dòng (sinking)." } },
      { q: { en: "What color is the E-stop button?", vi: "Nút E-stop có màu gì?" }, opts: { en: ["Green", "Black", "Red mushroom on yellow", "Blue"], vi: ["Xanh lá", "Đen", "Nấm đỏ trên nền vàng", "Xanh dương"] }, a: 2, why: { en: "E-stops are red mushroom heads on a yellow background.", vi: "E-stop là nút nấm đỏ trên nền vàng." } },
      { q: { en: "To make a motor run at about half speed, a VFD outputs…", vi: "Để động cơ chạy khoảng nửa tốc độ, biến tần xuất ra…" }, opts: { en: ["30 Hz", "60 Hz", "120 Hz", "240 V"], vi: ["30 Hz", "60 Hz", "120 Hz", "240 V"] }, a: 0, why: { en: "Motor speed is proportional to frequency; 30 Hz is half of 60 Hz.", vi: "Tốc độ động cơ tỉ lệ với tần số; 30 Hz bằng nửa 60 Hz." } }
    ]
  },
  /* ---------------- c-motor-control ---------------- */
  {
    id: "c-motor-control",
    title: { en: "Motor Control Circuits", vi: "Mạch điều khiển động cơ" },
    summary: { en: "The classic circuits every tech must know: start/stop seal-in, jog, forward/reverse, and Hand-Off-Auto.", vi: "Các mạch kinh điển mọi kỹ thuật viên phải biết: start/stop tự giữ, jog, đảo chiều, và Hand-Off-Auto." },
    level: "Beginner", minutes: 80,
    lessons: [
      { id: "l1", title: { en: "3-Wire Start/Stop Seal-In", vi: "Mạch start/stop 3 dây tự giữ" }, minutes: 25, blocks: [
        { t: "p", en: "Press **Start** and the motor runs. Let go, it keeps running. Press **Stop** and it stops. The trick is the **seal-in** (holding) contact: an M auxiliary contact wired in parallel with Start.", vi: "Nhấn **Start** thì động cơ chạy. Buông tay, nó vẫn chạy. Nhấn **Stop** thì dừng. Bí quyết là tiếp điểm **tự giữ (seal-in)**: một tiếp điểm phụ của M đấu song song với nút Start." },
        { t: "widget", name: "sealin" },
        { t: "steps", en: ["Current flows L1 → Stop (NC) → Start (NO, pressed) → M coil → OL (NC) → L2", "M coil energizes; its aux contact M (13-14) closes", "Release Start: current now flows through the M aux contact — sealed in", "Press Stop or OL trips: the coil drops out and the seal opens"], vi: ["Dòng chạy L1 → Stop (NC) → Start (NO, đang nhấn) → cuộn M → OL (NC) → L2", "Cuộn M có điện; tiếp điểm phụ M (13-14) đóng lại", "Buông Start: dòng giờ đi qua tiếp điểm phụ M – đã tự giữ", "Nhấn Stop hoặc OL ngắt: cuộn dây mất điện và tiếp điểm tự giữ mở ra"] },
        { t: "h", en: "Same logic in a PLC", vi: "Cùng logic đó trong PLC" },
        { t: "ladder", rungs: [ { comment: { en: "Motor start/stop with seal-in. Stop_PB is wired NC, so the input is ON when not pressed — use XIC.", vi: "Start/stop động cơ tự giữ. Stop_PB đấu NC nên ngõ vào ON khi không nhấn – dùng XIC." }, els: [ { k: "XIC", tag: "Stop_PB" }, { k: "XIC", tag: "OL_OK" }, { k: "BR", rows: [ [ { k: "XIC", tag: "Start_PB" } ], [ { k: "XIC", tag: "Motor_Run" } ] ] }, { k: "OTE", tag: "Motor_Run" } ] } ] },
        { t: "callout", kind: "tip", en: "Always wire Stop buttons and E-stops NC. If a wire breaks, the machine stops — that is fail-safe.", vi: "Luôn đấu nút Stop và E-stop dạng NC. Nếu dây đứt, máy sẽ dừng – đó là nguyên tắc an toàn khi hỏng (fail-safe)." }
      ] },
      { id: "l2", title: { en: "2-Wire Control and Jog", vi: "Điều khiển 2 dây và Jog" }, minutes: 15, blocks: [
        { t: "table", head: { en: ["", "2-wire", "3-wire"], vi: ["", "2 dây", "3 dây"] }, rows: {
          en: [["Device", "Maintained switch, float, thermostat", "Momentary Start + Stop"], ["After power loss", "Restarts by itself", "Stays off until Start is pressed"], ["Name", "Low-voltage release", "Low-voltage protection"]],
          vi: [["Thiết bị", "Công tắc giữ trạng thái, phao, thermostat", "Nút nhấn nhả Start + Stop"], ["Sau khi mất điện", "Tự chạy lại", "Vẫn tắt cho tới khi nhấn Start"], ["Tên gọi", "Low-voltage release", "Low-voltage protection"]] } },
        { t: "callout", kind: "warn", en: "2-wire control can restart a machine by surprise when power comes back. Use 3-wire for anything a person could be near.", vi: "Điều khiển 2 dây có thể làm máy tự chạy lại bất ngờ khi có điện trở lại. Dùng 3 dây cho mọi thiết bị có người ở gần." },
        { t: "p", en: "**Jog** runs the motor only while the button is held — for setup and alignment. In hard-wired logic, the Jog button breaks the seal-in path so it can't latch.", vi: "**Jog** chạy động cơ chỉ khi đang giữ nút – dùng để chỉnh máy, canh vị trí. Trong mạch đấu cứng, nút Jog cắt đường tự giữ để không bị giữ lại." },
        { t: "ladder", rungs: [ { comment: { en: "Run = (Start seal-in, no Jog) OR Jog held", vi: "Chạy = (Start tự giữ, không Jog) HOẶC đang giữ Jog" }, els: [ { k: "XIC", tag: "Stop_PB" }, { k: "BR", rows: [ [ { k: "XIC", tag: "Start_PB" } ], [ { k: "XIC", tag: "Run_Latch" } ] ] }, { k: "XIO", tag: "Jog_PB" }, { k: "OTE", tag: "Run_Latch" } ] }, { els: [ { k: "BR", rows: [ [ { k: "XIC", tag: "Run_Latch" } ], [ { k: "XIC", tag: "Jog_PB" } ] ] }, { k: "XIC", tag: "Stop_PB" }, { k: "OTE", tag: "Motor_Out" } ] } ] }
      ] },
      { id: "l3", title: { en: "Forward / Reverse", vi: "Đảo chiều thuận / nghịch" }, minutes: 20, blocks: [
        { t: "p", en: "To reverse a 3-phase motor, **swap any two phases**. A reversing starter has two contactors: F wires L1-L2-L3 straight, R swaps L1 and L3.", vi: "Để đảo chiều động cơ 3 pha, **đổi hai pha bất kỳ**. Bộ khởi động đảo chiều có hai contactor: F nối L1-L2-L3 thẳng, R đổi L1 và L3." },
        { t: "callout", kind: "warn", en: "If F and R pull in at the same time you get a phase-to-phase short. You need interlocks.", vi: "Nếu F và R cùng đóng một lúc sẽ ngắn mạch pha-pha. Bắt buộc phải có liên động (interlock)." },
        { t: "list", en: ["**Mechanical interlock** — a bar between the two contactors so both can't close physically", "**Electrical interlock** — an NC aux contact of R in series with the F coil, and an NC of F in series with the R coil", "**Pushbutton interlock** (optional) — the NC side of the Reverse button in the Forward rung"], vi: ["**Liên động cơ khí** – thanh chặn giữa hai contactor để không thể cùng đóng", "**Liên động điện** – tiếp điểm phụ NC của R nối tiếp cuộn F, và NC của F nối tiếp cuộn R", "**Liên động nút nhấn** (tùy chọn) – tiếp điểm NC của nút Reverse nằm trong nấc Forward"] },
        { t: "ladder", rungs: [ { comment: { en: "Forward — blocked while Reverse is on", vi: "Chạy thuận – bị chặn khi đang chạy nghịch" }, els: [ { k: "XIC", tag: "Stop_PB" }, { k: "BR", rows: [ [ { k: "XIC", tag: "Fwd_PB" } ], [ { k: "XIC", tag: "Motor_Fwd" } ] ] }, { k: "XIO", tag: "Motor_Rev" }, { k: "OTE", tag: "Motor_Fwd" } ] }, { comment: { en: "Reverse — blocked while Forward is on", vi: "Chạy nghịch – bị chặn khi đang chạy thuận" }, els: [ { k: "XIC", tag: "Stop_PB" }, { k: "BR", rows: [ [ { k: "XIC", tag: "Rev_PB" } ], [ { k: "XIC", tag: "Motor_Rev" } ] ] }, { k: "XIO", tag: "Motor_Fwd" }, { k: "OTE", tag: "Motor_Rev" } ] } ] },
        { t: "callout", kind: "tip", en: "PLC interlocks are not enough on their own. Keep the hard-wired NC aux interlocks and the mechanical interlock in the panel too.", vi: "Liên động trong PLC thôi là chưa đủ. Trong tủ vẫn phải giữ liên động tiếp điểm phụ NC đấu cứng và liên động cơ khí." }
      ] },
      { id: "l4", title: { en: "Hand-Off-Auto", vi: "Hand-Off-Auto (HOA)" }, minutes: 20, blocks: [
        { t: "p", en: "An **HOA** selector lets the operator choose: **Hand** = run now (manual), **Off** = stopped, **Auto** = the PLC or a float/pressure switch decides.", vi: "Công tắc **HOA** cho người vận hành chọn: **Hand** = chạy ngay (bằng tay), **Off** = dừng, **Auto** = PLC hoặc phao/công tắc áp suất quyết định." },
        { t: "widget", name: "hoa" },
        { t: "ladder", rungs: [ { els: [ { k: "XIC", tag: "OL_OK" }, { k: "BR", rows: [ [ { k: "XIC", tag: "HOA_Hand" } ], [ { k: "XIC", tag: "HOA_Auto" }, { k: "XIC", tag: "Auto_Run_Cmd" } ] ] }, { k: "OTE", tag: "Pump_Run" } ] } ] },
        { t: "callout", kind: "kit", en: "The 3-position selector on the trainee panel is wired to two PLC inputs (Hand, Auto). Off = both inputs OFF.", vi: "Công tắc 3 vị trí trên trainee panel đấu vào hai ngõ vào PLC (Hand, Auto). Off = cả hai ngõ vào đều OFF." },
        { t: "lab", title: { en: "Wire and test a seal-in circuit", vi: "Đấu và thử mạch tự giữ" }, steps: {
          en: ["Power OFF and lock out the trainee panel", "Wire 120 VAC: L1 → red Stop (NC) → green Start (NO) → relay CR1 coil (A1-A2) → neutral", "Wire CR1 aux NO contact in parallel with Start", "Wire a pilot light through a second CR1 NO contact", "Have the instructor check your wiring, then power ON", "Press Start — the light stays on. Press Stop — it goes off", "Instructor uses the HV box contactor to run the real motor from your circuit"],
          vi: ["Tắt và khóa nguồn trainee panel", "Đấu 120 VAC: L1 → Stop đỏ (NC) → Start xanh (NO) → cuộn rơ-le CR1 (A1-A2) → trung tính", "Đấu tiếp điểm NO phụ của CR1 song song với Start", "Đấu đèn báo qua một tiếp điểm NO khác của CR1", "Nhờ giảng viên kiểm tra dây, rồi cấp điện", "Nhấn Start – đèn sáng giữ. Nhấn Stop – đèn tắt", "Giảng viên dùng contactor trong hộp HV để chạy động cơ thật từ mạch của bạn"] } }
      ] }
    ],
    quiz: [
      { q: { en: "In a 3-wire circuit, what keeps the motor running after Start is released?", vi: "Trong mạch 3 dây, cái gì giữ động cơ chạy sau khi buông Start?" }, opts: { en: ["The overload", "A seal-in aux contact in parallel with Start", "The Stop button", "The disconnect"], vi: ["Rơ-le nhiệt", "Tiếp điểm phụ tự giữ song song với Start", "Nút Stop", "Cầu dao"] }, a: 1, why: { en: "The M aux contact holds the coil circuit closed.", vi: "Tiếp điểm phụ M giữ mạch cuộn dây luôn kín." } },
      { q: { en: "Why are Stop buttons wired normally closed?", vi: "Tại sao nút Stop được đấu thường đóng?" }, opts: { en: ["Cheaper", "A broken wire stops the machine (fail-safe)", "PLCs need it", "It looks better"], vi: ["Rẻ hơn", "Đứt dây thì máy dừng (fail-safe)", "PLC bắt buộc", "Trông đẹp hơn"] }, a: 1, why: { en: "NC stop circuits fail to the safe state.", vi: "Mạch stop NC khi hỏng sẽ về trạng thái an toàn." } },
      { q: { en: "How do you reverse a 3-phase motor?", vi: "Làm sao để đảo chiều động cơ 3 pha?" }, opts: { en: ["Reverse the polarity of 24 VDC", "Swap any two of the three phases", "Swap all three phases", "Change the overload"], vi: ["Đảo cực nguồn 24 VDC", "Đổi hai trong ba pha bất kỳ", "Đổi cả ba pha", "Thay rơ-le nhiệt"] }, a: 1, why: { en: "Swapping two phases reverses rotation.", vi: "Đổi hai pha sẽ đảo chiều quay." } },
      { q: { en: "What is the electrical interlock in a F/R starter?", vi: "Liên động điện trong bộ đảo chiều là gì?" }, opts: { en: ["An NC aux of each contactor in the other's coil circuit", "A bar between contactors", "A fuse", "A timer"], vi: ["Tiếp điểm phụ NC của contactor này nằm trong mạch cuộn dây contactor kia", "Thanh chặn giữa hai contactor", "Cầu chì", "Timer"] }, a: 0, why: { en: "Each running contactor opens the other's coil path.", vi: "Contactor nào đang chạy sẽ cắt đường cấp điện cuộn dây của contactor kia." } },
      { q: { en: "With HOA in Auto, the motor runs when…", vi: "Khi HOA ở Auto, động cơ chạy khi…" }, opts: { en: ["Always", "Never", "The PLC or auto device commands it", "The operator holds Start"], vi: ["Luôn luôn", "Không bao giờ", "PLC hoặc thiết bị tự động ra lệnh", "Người vận hành giữ Start"] }, a: 2, why: { en: "Auto hands control to the PLC or field device.", vi: "Auto giao quyền điều khiển cho PLC hoặc thiết bị hiện trường." } }
    ]
  },

        { t: "list", en: ["High voltage at the top, low voltage (24 VDC, PLC, network) separated from it", "Terminal blocks at the bottom or side, near where field wires enter", "Leave 20–25% spare space on rails and in ducts for future changes", "Keep heat sources (VFDs, power supplies) where air can flow; follow the clearance on their manuals"], vi: ["Điện áp cao ở trên, điện áp thấp (24 VDC, PLC, mạng) tách riêng", "Cầu đấu ở dưới hoặc bên hông, gần chỗ dây hiện trường đi vào", "Chừa 20–25% chỗ trống trên thanh DIN và trong máng dây cho sau này", "Đặt thiết bị tỏa nhiệt (VFD, bộ nguồn) chỗ thoáng gió; theo khoảng cách hở trong manual"] },

        { t: "table", head: { en: ["Color (NFPA 79)", "Use"], vi: ["Màu (NFPA 79)", "Dùng cho"] }, rows: {
          en: [["Black", "AC/DC power circuits (line voltage)"], ["Red", "AC control circuits (120 VAC)"], ["Blue", "DC control circuits (24 VDC)"], ["White", "AC neutral (grounded conductor)"], ["White w/ blue stripe", "DC common (0V) — common practice"], ["Green / green-yellow", "Equipment ground"], ["Orange (or yellow)", "Foreign voltage — stays live when the panel disconnect is off"]],
          vi: [["Đen", "Mạch động lực AC/DC (điện áp nguồn)"], ["Đỏ", "Mạch điều khiển AC (120 VAC)"], ["Xanh dương", "Mạch điều khiển DC (24 VDC)"], ["Trắng", "Trung tính AC (dây nối đất làm việc)"], ["Trắng sọc xanh dương", "Chung DC (0V) – cách làm phổ biến"], ["Xanh lá / xanh-vàng", "Tiếp địa thiết bị"], ["Cam (hoặc vàng)", "Điện áp ngoài – vẫn có điện khi cầu dao tủ đã tắt"]] } },
        { t: "callout", kind: "warn", en: "Orange wires mean danger: they are fed from another source and stay live after you open this panel's disconnect.", vi: "Dây màu cam báo nguy hiểm: được cấp từ nguồn khác và vẫn có điện sau khi tắt cầu dao của tủ này." },

        { t: "list", en: ["Strip to the length printed on the terminal (often 8–10 mm)", "Crimp a ferrule on every stranded wire end with a ratcheting crimper", "Put a wire marker on both ends, reading left-to-right or bottom-to-top", "Torque every screw terminal to the value on the device (e.g. 0.5–0.6 N·m for small terminals) — loose terminals cause heat and faults"], vi: ["Tuốt vỏ đúng chiều dài in trên cầu đấu (thường 8–10 mm)", "Bấm đầu cos (ferrule) cho mọi đầu dây nhiều sợi bằng kìm bấm có cóc", "Gắn nhãn dây ở cả hai đầu, đọc từ trái sang phải hoặc dưới lên trên", "Siết mọi cọc vít đúng lực ghi trên thiết bị (ví dụ 0,5–0,6 N·m cho cọc nhỏ) – cọc lỏng gây nóng và lỗi"] }

        { t: "list", en: ["Route every wire inside the duct; no wires across the face of devices", "Leave a service loop so a wire can be re-terminated once", "Never land more than the allowed number of wires per terminal (usually 1, or 2 if rated)", "Keep 24 VDC and network cables away from 480 V power; cross at 90° if needed", "Bond the backplate and door to the ground bar"], vi: ["Đi mọi dây trong máng; không có dây vắt ngang mặt thiết bị", "Chừa một đoạn dư để có thể đấu lại một lần", "Không đấu quá số dây cho phép mỗi cọc (thường 1, hoặc 2 nếu được định mức)", "Để dây 24 VDC và cáp mạng xa dây 480 V; nếu phải cắt qua thì cắt vuông góc 90°", "Nối đất tấm đế và cửa tủ về thanh tiếp địa"] },
        { t: "terms", items: [
          { term: { en: "UL 508A", vi: "UL 508A" }, def: { en: "The US standard for industrial control panels. A UL-listed shop puts a UL label on panels that meet it. Many customers and inspectors require it.", vi: "Tiêu chuẩn Mỹ cho tủ điều khiển công nghiệp. Xưởng được UL chứng nhận sẽ dán nhãn UL cho tủ đạt chuẩn. Nhiều khách hàng và thanh tra yêu cầu." } },
          { term: { en: "SCCR", vi: "SCCR" }, def: { en: "Short-Circuit Current Rating: the fault current the panel can safely withstand, marked on the nameplate (e.g. 5 kA, 65 kA).", vi: "Định mức dòng ngắn mạch: dòng sự cố mà tủ chịu được an toàn, ghi trên nhãn tủ (ví dụ 5 kA, 65 kA)." } },
          { term: { en: "Panel nameplate", vi: "Nhãn tủ" }, def: { en: "Shows voltage, phase, FLA, SCCR, and the drawing number.", vi: "Ghi điện áp, số pha, FLA, SCCR và số bản vẽ." } }
        ] },
        { t: "callout", kind: "tip", en: "Take photos of the finished panel before shipping. They help a lot during startup and service calls.", vi: "Chụp hình tủ hoàn chỉnh trước khi giao. Rất hữu ích khi chạy thử và đi sửa sau này." }

        { t: "steps", en: ["**Visual check** — every wire landed, labeled, torqued; no loose strands or metal chips", "**Point-to-point** — with power off, use continuity to check each wire against the drawing; highlight each one", "**Short check** — measure ohms L1-L2, L1-L3, L2-L3, each to ground, and 24V to 0V. No near-zero readings", "**Megger** (insulation test) motor leads and power wiring if specified — disconnect VFDs, PLCs, and electronics first", "**Power up in stages** — all breakers OFF, close the disconnect, verify voltage, then turn on one breaker at a time", "**Check control** — 120 VAC and 24 VDC levels, then I/O checks one point at a time"], vi: ["**Kiểm tra bằng mắt** – mọi dây đã đấu, có nhãn, siết đúng lực; không sợi đồng thừa hay mạt kim loại", "**Point-to-point** – khi tắt nguồn, đo thông mạch từng dây theo bản vẽ; tô đánh dấu từng dây", "**Kiểm tra chạm chập** – đo ohm L1-L2, L1-L3, L2-L3, từng pha xuống đất và 24V với 0V. Không được gần 0", "**Megger** (đo cách điện) dây động cơ và dây động lực nếu được yêu cầu – tháo VFD, PLC và linh kiện điện tử ra trước", "**Cấp điện từng bước** – tắt hết CB, đóng cầu dao, đo điện áp, rồi bật từng CB một", "**Kiểm tra điều khiển** – mức 120 VAC và 24 VDC, rồi kiểm tra I/O từng điểm một"] },
        { t: "callout", kind: "warn", en: "Never megger with a PLC, VFD, or power supply connected. The 500–1,000 V test voltage will destroy electronics.", vi: "Không bao giờ megger khi còn nối PLC, VFD hoặc bộ nguồn. Điện áp thử 500–1.000 V sẽ làm hỏng linh kiện điện tử." },
        { t: "callout", kind: "kit", en: "The trainee panel is 120 VAC / 24 VDC, so you do the full checkout and power-up yourself. The instructor does the HV box power-up.", vi: "Trainee panel là 120 VAC / 24 VDC, nên bạn tự làm toàn bộ kiểm tra và cấp điện. Giảng viên cấp điện cho hộp HV." },
        { t: "lab", title: { en: "Wire, check, and power up the trainee panel", vi: "Đấu dây, kiểm tra và cấp điện trainee panel" }, steps: {
          en: ["Using the kit drawings, wire the 24 VDC supply output to the PLC power terminals and to the input common", "Wire Start, Stop, and HOA to 5069-IB16 inputs in blue 18 AWG with ferrules and markers at both ends", "Wire two pilot lights from 5069-OW4I outputs", "Do the point-to-point check and highlight each wire on a printed drawing", "Measure 24V to 0V and 120 VAC hot to neutral with power off — no shorts", "Instructor inspects; then close breakers one at a time and measure 120 VAC and 24 VDC", "Press each button and watch the input LED on the 5069-IB16 turn on"],

      ] }

    ]

      { id: "l1", title: { en: "Relay Logic vs PLC", vi: "Mạch rơ-le và PLC" }, minutes: 15, blocks: [
        { t: "p", en: "Before PLCs, machines were controlled by **hard-wired relay logic**. Every AND, OR and timer was a real relay or timer wired on the panel. To change how the machine works, you had to rewire it.", vi: "Trước khi có PLC, máy được điều khiển bằng **mạch rơ-le đi dây cứng (hard-wired relay logic)**. Mỗi chức năng AND, OR hay timer là một rơ-le hoặc timer thật trong tủ. Muốn thay đổi cách máy chạy thì phải đi dây lại." },
        { t: "p", en: "A **PLC (Programmable Logic Controller)** is an industrial computer that replaces most of those relays with a program. The field devices (buttons, sensors, motors) are still wired, but the logic between them lives in software.", vi: "**PLC (Programmable Logic Controller)** là máy tính công nghiệp thay thế phần lớn các rơ-le đó bằng chương trình. Thiết bị hiện trường (nút nhấn, cảm biến, motor) vẫn đi dây, nhưng logic ở giữa nằm trong phần mềm." },
        { t: "table",
