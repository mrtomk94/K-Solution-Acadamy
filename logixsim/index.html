    inp.onkeydown = (e) => { if(e.key==="Enter"){ scheduleValidate(0, true); }
                             if(e.key==="ArrowDown" && e.altKey){ e.preventDefault(); browse(inp); } };
  });
  box.querySelectorAll("button[data-browse]").forEach(b => b.onclick = (e) => { e.stopPropagation(); browse(box.querySelector(`input[data-op="${b.dataset.browse}"]`)); });
  box.querySelectorAll("button[data-newtag]").forEach(b => b.onclick = () => {
    const k = +b.dataset.newtag, raw = (n.args[k]||"").trim();
    const full = raw.match(/^Program:([A-Za-z_]\w*)\.([A-Za-z_]\w*)/i);
    const root = full ? full[2] : (raw.match(/^[A-Za-z_][A-Za-z0-9_]*/)||[""])[0];
    newTagDialog({name: root, scope: full ? full[1] : undefined, data_type: guessType(n.name, k), onCreated: () => scheduleValidate(0, true)});
  });
  const ao = $("eAddOp"); if(ao) ao.onclick = () => { n.args.push("?"); renderEditor(); scheduleValidate(); };
}
function defaultArgs(name){
  const sp = spec(name), aoi = sp ? null : aoiDef(name);
  if(sp) return sp.operands.filter(o=>!o.optional && !o.repeat).map(o => o.kind==="imm" ? "0" : "?")
                 .concat(["TON","TOF","RTO","CTU","CTD"].includes(sp.mnemonic) ? ["?","?"] : []);
  if(aoi) return ["?"].concat(aoi.call.map(()=>"?"));
  return ["?"];
}
function addInstr(name){
  const E = S.edit; if(E.textMode){ log("Switch off text mode to add instructions graphically", "wrn"); return; }
  edPush();
  const node = {kind:"instr", _id: nextNode++, name, args: defaultArgs(name)};
  const sel = E.sel;
  if(sel && sel.leg!=null){ const f = findNode(sel.leg); f.node.legs[sel.li].push(node); }
  else if(sel && sel.id!=null){ const f = findNode(sel.id); f.list.splice(f.index+1, 0, node); }
  else if(isInputNode(node)){ E.tree.splice(tailStart(E.tree), 0, node); }
  else E.tree.push(node);
  E.sel = {id: node._id};
  renderEditor(); scheduleValidate(0, true);
  setTimeout(() => { const i = document.querySelector('#eInstr input[data-op="0"]'); if(i){ i.focus(); i.select(); } }, 0);
}
function addBranch(){
  const E = S.edit; if(E.textMode) return;
  edPush();
  const sel = E.sel;
  if(sel && sel.id!=null){
    const f = findNode(sel.id);
    const br = {kind:"branch", _id: nextNode++, legs:[[f.node], []]};
    f.list.splice(f.index, 1, br); E.sel = {leg: br._id, li: 1};
  } else {
    const br = {kind:"branch", _id: nextNode++, legs:[[], []]};
    E.tree.splice(tailStart(E.tree), 0, br); E.sel = {leg: br._id, li: 0};
  }
  renderEditor(); scheduleValidate(0, true);
}
function ownerBranch(){
  const E = S.edit, sel = E.sel; if(!sel) return null;
  if(sel.leg!=null) return findNode(sel.leg).node;
  const f = findNode(sel.id); if(!f) return null;
  if(f.node.kind==="branch") return f.node;
  return f.parent ? f.parent.branch : null;
}
function addLeg(){
  const b = ownerBranch(); if(!b){ log("Select a branch (or something inside one) to add a leg", "wrn"); return; }
  edPush(); b.legs.push([]); S.edit.sel = {leg: b._id, li: b.legs.length-1}; renderEditor(); scheduleValidate(0, true);
}
function moveSel(dir){
  const E = S.edit; if(!E.sel || E.sel.id==null) return;
  const f = findNode(E.sel.id); const j = f.index + dir;
  if(j<0 || j>=f.list.length) return;
  edPush();
  [f.list[f.index], f.list[j]] = [f.list[j], f.list[f.index]];
  renderEditor(); scheduleValidate(0, true);
}
function removeSel(){
  const E = S.edit, sel = E.sel; if(!sel) return;
  edPush();
  if(sel.leg!=null){
    const f = findNode(sel.leg), b = f.node;
    b.legs.splice(sel.li, 1);
    if(b.legs.length===1) f.list.splice(f.index, 1, ...b.legs[0]);     // one leg left: no branch any more
  } else {
    const f = findNode(sel.id); if(!f) return;
    f.list.splice(f.index, 1);
    if(f.parent && f.parent.branch.legs.length===2 && f.list.length===0 && f.parent.branch.legs.every(l=>l.length===0)){
      const g = findNode(f.parent.branch._id); g.list.splice(g.index, 1);
    }
  }
  E.sel = null; renderEditor(); scheduleValidate(0, true);
}

/* validation round trip (server = the same validation the finalize step uses) */
let vTimer = null, vSeq = 0;
function scheduleValidate(delay=250, redraw=true){
  clearTimeout(vTimer); S.edit.checked = false;
  vTimer = setTimeout(() => validateEdit(redraw), delay);
}
function editText(){ const E = S.edit; return E.textMode ? E.text : serialize(E.tree); }
async function validateEdit(redraw=true){
  const E = S.edit; if(!E) return;
  const seq = ++vSeq, text = editText();
  let r;
  try { r = await api("POST","/api/studio/validate/rung",{program:E.prog, routine:E.routine, text, index:E.index, inserting:E.mode==="insert"}); }
  catch(e){ log(`Validation: ${e.message}`, "err"); return; }
  if(seq!==vSeq || S.edit!==E) return;
  E.issues = r.issues; E.valid = r.ok; E.checked = true; E.lastTree = r.tree;
  // map issues to editor nodes (instruction index = left-to-right order)
  E.byNode = {};
  const order = E.textMode ? [] : instrOrder(E.tree);
  r.issues.forEach(x => { if(x.instr!=null && order[x.instr]) (E.byNode[order[x.instr]._id] ||= []).push(x); });
  if(E.textMode && r.tree){ /* keep the text as typed */ }
  if(redraw || E.textMode){ const focus = document.activeElement; const op = focus && focus.dataset ? focus.dataset.op : null; const pos = focus && focus.selectionStart, end = focus && focus.selectionEnd;
    const fid = focus && focus.id;
    if(E.textMode){ updateEditorStatus(); } else { renderEditor();
      const i = op!=null ? document.querySelector(`#eInstr input[data-op="${op}"]`) : (fid==="eComment" || fid==="eMn" ? $(fid) : null);
      if(i){ i.focus(); try{ i.setSelectionRange(pos, end); }catch(e){} } } }
  else updateEditorStatus();
}
function updateEditorStatus(){
  // refresh highlights without stealing focus from the field being typed in
  const E = S.edit, host = $("erung"); if(!host) return;
  host.classList.toggle("valid", E.checked && E.valid); host.classList.toggle("invalid", E.checked && !E.valid);
  const fb = host.querySelector(".finbar"); const btn = $("eFinal");
  if(btn) btn.disabled = !(E.checked && E.valid);
  if(fb){ fb.classList.toggle("ready", E.checked && E.valid); fb.classList.toggle("blocked", !(E.checked && E.valid));
          const errs = E.issues.filter(x=>x.severity==="error"), warns = E.issues.filter(x=>x.severity!=="error");
          fb.children[E.mode==="insert"?3:2].innerHTML = E.valid ? `<span class="ok">✔ valid${warns.length?` · ${warns.length} warning(s)`:""}</span>` : `<span class="err">✖ ${errs.length} error(s) — fix them to finalize</span>`; }
  const list = host.querySelector(".eissues");
  if(list) list.innerHTML = E.issues.map(x=>`<div class="${x.severity==="error"?"err":"wrn"}">${x.severity==="error"?"✖":"⚠"} ${esc(x.message)}${x.pos!=null&&E.textMode?` (at character ${x.pos+1})`:""}</div>`).join("");
  if(!E.textMode){                                   // operand field states
    const sel = E.sel && E.sel.id!=null ? findNode(E.sel.id) : null;
    if(sel) document.querySelectorAll("#eInstr .eop").forEach(lab => {
      const k = +lab.querySelector("input").dataset.op, iss = (E.byNode[sel.node._id]||[]).find(x=>x.operand===k);
      lab.classList.toggle("operr", !!iss && iss.kind!=="unknown_tag"); lab.classList.toggle("opwarn", !!iss && iss.kind==="unknown_tag");
      const nb = lab.querySelector(".onew"); if(nb) nb.hidden = !(iss && iss.kind==="unknown_tag");
      const msg = lab.querySelector("em, i"); if(msg){ msg.outerHTML = iss ? `<em>${esc(iss.message)}</em>` : `<i class="dim"></i>`; }
    });
    const line = host.querySelector(".eline");
    if(line){ line.innerHTML = ""; line.appendChild(series(E.tree, {prog:S.R.prog, rn:E.index, dyn:[], top:true, edit:true}, {})); }
  }
}
async function finalize(){
  const E = S.edit; if(!E) return;
  E.state = "applying"; updateEditorStatus();
  const text = editText();
  try {
    const res = await api("POST","/api/studio/edit/rung",{program:E.prog, routine:E.routine, op: E.mode==="insert"?"insert":"replace",
                                index:E.index, text, comment:E.comment, version:E.version});
    const where = `${E.prog}/${E.routine} rung ${E.index}`;
    log(`Finalized ${where}: ${res.entry.text} — effective at scan #${res.entry.effective_scan}${res.entry.mode==="RUN"?" (applied between scans while running)":""}`, "ok");
    const again = E.mode==="insert" && E.more, at = E.index + 1;
    S.edit = null; S.flash = E.index;
    await reloadRoutine();
    if(again) startInsert(at);
  } catch(e){
    E.state = "editing";
    log(`Finalize refused: ${e.message} — the previous rung is unchanged`, "err");
    if(e.data && e.data.issues && e.data.issues.length){
      E.issues = e.data.issues; E.valid = false; E.checked = true; E.byNode = {};
      const order = E.textMode ? [] : instrOrder(E.tree);
      E.issues.forEach(x => { if(x.instr!=null && order[x.instr]) (E.byNode[order[x.instr]._id] ||= []).push(x); });
      renderEditor();
    } else if(e.status===409){
      if(await dialog({title:"The routine was changed", body:`<p>${esc(e.message)}</p>`, buttons:[["Keep editing","cancel"],["Reload routine","ok","pri"]]})==="ok"){ S.edit = null; await reloadRoutine(); }
    }
    else scheduleValidate(0, true);
  }
}
async function rungOp(op, extra){
  const E = S.edit;
  try {
    const res = await api("POST","/api/studio/edit/rung",{program:E.prog, routine:E.routine, op, index:E.index, version:E.version, ...extra});
    log(`${op==="delete"?"Deleted":"Moved"} rung ${E.index}${op==="move"?` to ${extra.to}`:""} (effective at scan #${res.entry.effective_scan})`, "ok");
    S.edit = null; await reloadRoutine();
  } catch(e){ log(`${op}: ${e.message}`, "err"); }
}

async function stCancelAsk(){

function stJumpFirstError(){

async function stValidate(){

function send(m){ if(S.ws && S.ws.readyState===1) S.ws.send(JSON.stringify(m)); }
let nextId=1; const pend={};
function req(m){ return new Promise(res=>{ m.id=nextId++; pend[m.id]=res; send(m); setTimeout(()=>{ if(pend[m.id]){ delete pend[m.id]; res({ok:false,errors:{_:"no reply"}}); } }, 4000); }); }
async function write(addr, raw){
  let v = raw; const cur = S.values[addr];
  if(typeof cur==="number"){ v = Number(raw); if(raw==="" || isNaN(v)){ log(`${addr}: not a number`, "err"); return; } }
  const r = await req({op: isForced(addr) ? "force" : "write", values:{[addr]:v}});
  if(!r.ok) log(Object.entries(r.errors||{}).map(([k,e])=>`${k}: ${e}`).join("; ") || r.error, "err"); else log(`${addr} := ${fmt(v)}`);
  if(isForced(addr)) await refreshForces();

}

/* context / drop-down menu: items are [label, fn, disabled, shortcut] or "-".
   Keyboard: Up/Down/Home/End move, Enter/Space choose, Esc closes (focus returns). */
function showMenu(e, items, anchor, opts={}){
  const m = $("menu");
  const list = items.filter(Boolean).filter((it, i, a) => it!=="-" || (i>0 && a[i-1]!=="-" && i<a.length-1));
  if(!menuOpen()) S.menuReturn = document.activeElement;
  m.innerHTML = list.map((it,i)=> it==="-" ? `<hr>` : `<div data-i="${i}" role="menuitem" tabindex="-1" class="${it[2]?"dis":""}"><span>${esc(it[0])}</span>${it[3]?`<kbd>${esc(it[3])}</kbd>`:""}</div>`).join("");
  m.setAttribute("role", "menu");
  let x = e ? e.clientX : 0, y = e ? e.clientY : 0;
  if(anchor){ const r = anchor.getBoundingClientRect(); x = r.left; y = r.bottom + 2; }
  if(e && !anchor && !e.clientX && !e.clientY && e.target && e.target.getBoundingClientRect){ const r = e.target.getBoundingClientRect(); x = r.left + 8; y = r.bottom; }
  m.style.display = "block";
  m.style.left = Math.max(4, Math.min(x, innerWidth - m.offsetWidth - 6)) + "px";
  m.style.top = Math.max(4, Math.min(y, innerHeight - m.offsetHeight - 6)) + "px";
  S.menuOpts = opts; S.menuAt = performance.now();
  const run = (el) => { const i = el && el.dataset.i; if(i===undefined) return; const it = list[+i]; if(it[2]) return; hideMenu(false); it[1](); };
  m.onclick = (ev) => run(ev.target.closest("[data-i]"));
  m.onkeydown = (ev) => {
    const els = [...m.querySelectorAll("[data-i]:not(.dis)")]; if(!els.length){ if(ev.key==="Escape") hideMenu(true); return; }
    const cur = els.indexOf(document.activeElement);
    const go = (k) => { ev.preventDefault(); els[(k + els.length) % els.length].focus(); };
    if(ev.key==="ArrowDown") go(cur + 1);
    else if(ev.key==="ArrowUp") go(cur < 0 ? els.length - 1 : cur - 1);
    else if(ev.key==="Home") go(0);
    else if(ev.key==="End") go(els.length - 1);
    else if(ev.key==="Enter" || ev.key===" "){ ev.preventDefault(); run(document.activeElement); }
    else if(ev.key==="Escape"){ ev.preventDefault(); ev.stopPropagation(); hideMenu(true); }
    else if((ev.key==="ArrowLeft" || ev.key==="ArrowRight") && opts.onSide){ ev.preventDefault(); opts.onSide(ev.key==="ArrowLeft" ? -1 : 1); }
    else if(ev.key.length===1 && /\w/.test(ev.key)){               // first letter jumps
      const k = els.findIndex((el, j) => j > cur && el.textContent.trim().toLowerCase().startsWith(ev.key.toLowerCase()));
      const k2 = k >= 0 ? k : els.findIndex(el => el.textContent.trim().toLowerCase().startsWith(ev.key.toLowerCase()));
      if(k2 >= 0) go(k2);
    }
  };
  const first = m.querySelector("[data-i]:not(.dis)"); if(first) first.focus({preventScroll:true});
}
function menuOpen(){ return $("menu").style.display==="block"; }
function hideMenu(restoreFocus){
  const m = $("menu"); if(m.style.display!=="block") return;
  m.style.display = "none";
  const back = S.menuReturn; S.menuReturn = null;
  if(S.menuOpts && S.menuOpts.onClose) S.menuOpts.onClose();
  if(restoreFocus && back && back.focus && document.contains(back)) back.focus({preventScroll:true});
}

function pruneTabs(){
  const p = S.project; if(!p) return;
  const progs = new Map([...p.tasks.flatMap(t=>t.programs), ...p.unscheduled].map(x => [x.name, x]));
  const tasks = new Set(p.tasks.map(t=>t.name));
  S.tabs = S.tabs.filter(t => {
    if(t.id.startsWith("r:") && !t.id.startsWith("r:AOI:")){ const [pr, rn] = t.id.slice(2).split("/"); return progs.has(pr) && progs.get(pr).routines.some(r=>r.name===rn); }
    if(t.id.startsWith("prog:")) return progs.has(t.id.slice(5));
    if(t.id.startsWith("task:")) return tasks.has(t.id.slice(5));
    if(t.id.startsWith("tags:") && t.id!=="tags:controller") return progs.has(t.id.slice(5));
    return true;
  });
  if(S.active && !S.tabs.find(t=>t.id===S.active)) S.active = S.tabs.length ? S.tabs[S.tabs.length-1].id : null;
}
/** Run a structure change; on "still used" (409 + references) ask, then repeat with force. */
async function structOp(method, path, body, okMsg, what){
  try {
    const r = await api(method, path, body);
    if(okMsg) log(okMsg, "ok");
    await refreshProject();
    return r;
  } catch(e){
    if(e.status===409 && e.data && e.data.references && e.data.references.length){
      const ans = await dialog({title:`Delete ${what||""}?`, buttons:[["Cancel","cancel"],["Delete anyway","ok","pri"]],
        body:`<p>${esc(e.message)}</p>${refsHtml(e.data.references)}<p class="notice-small">The logic keeps these references; Verify will report them.</p>`});
      if(ans!=="ok") return null;
      const sep = path.includes("?") ? "&" : "?";
      return structOp(method, path + sep + "force=true", body, okMsg);
    }
    log(`${okMsg ? okMsg.split(":")[0] : "Change"} failed: ${e.message}`, "err");
    throw e;
  }
}

function parseDims(text){

async function openTagBrowser(input, types, onPick){
  closeTagBrowser();
  const prog = S.R && S.R.prog && !S.R.prog.startsWith("AOI:") ? S.R.prog : "";
  let d; try { d = await api("GET", `/api/studio/tagbrowser?program=${encodeURIComponent(prog)}&depth=3`); } catch(e){ log(e.message, "err"); return; }
  const want = (types||[]).filter(t => t && t!=="any");
  const fits = (t) => !want.length || want.includes((t||"").replace(/\[.*$/, ""));
  const fitsDeep = (it, lvl=0) => fits(it.type) || (lvl<3 && (it.members||[]).some(m => fitsDeep(m, lvl+1)));
  const box = document.createElement("div"); box.id = "tbrowse";
  box.innerHTML = `<div class="tbh"><input id="tbq" placeholder="Search tags…" spellcheck="false" autocomplete="off">
     ${want.length?`<label><input type="checkbox" id="tbfit" checked> only ${esc(want.join("/"))}</label>`:""}</div><div class="tbl"></div>`;
  document.body.appendChild(box);
  const r = input.getBoundingClientRect();
  box.style.left = Math.min(r.left, innerWidth - 380) + "px";
  box.style.top = (r.bottom + 2 + 300 > innerHeight ? Math.max(4, r.top - 302) : r.bottom + 2) + "px";
  const open = new Set();
  const draw = () => {
    const q = $("tbq").value.toLowerCase(), only = $("tbfit") ? $("tbfit").checked : false;
    const rows = [];
    const add = (it, path, lvl) => {
      const kids = it.members || [];
      const key = path;
      rows.push(`<div class="tbi ${fits(it.type)?"fit":""}" data-p="${esc(path)}" style="padding-left:${6+lvl*14}px">
        <span class="tbx" data-x="${esc(key)}">${kids.length?(open.has(key)?"▾":"▸"):""}</span><b>${esc(lvl?it.name:it.name)}</b>
        <span class="dim">${esc(it.type)}</span>${lvl===0 && it.scope!=="controller"?' <span class="badge">program</span>':""}${it.description?` <span class="dim">${esc(it.description)}</span>`:""}</div>`);
      if(open.has(key)) kids.forEach(m => add(m, `${path}.${m.name}`, lvl+1));
    };
    d.items.filter(it => (!q || it.name.toLowerCase().includes(q) || (it.description||"").toLowerCase().includes(q)) && (!only || fitsDeep(it)))
           .slice(0, 400).forEach(it => add(it, it.name, 0));
    box.querySelector(".tbl").innerHTML = rows.join("") || `<div class="dim" style="padding:8px">No matching tags.</div>`;
  };
  box.addEventListener("click", (e) => {
    e.stopPropagation();
    const x = e.target.dataset.x; if(x){ open.has(x) ? open.delete(x) : open.add(x); draw(); return; }
    const row = e.target.closest(".tbi"); if(row){ onPick(row.dataset.p); closeTagBrowser(); }
  });
  $("tbq").oninput = draw; if($("tbfit")) $("tbfit").onchange = draw;
  $("tbq").onkeydown = (e) => { if(e.key==="Escape"){ closeTagBrowser(); input.focus(); }
                                if(e.key==="Enter"){ const first = box.querySelector(".tbi"); if(first){ onPick(first.dataset.p); closeTagBrowser(); } } };
  draw(); $("tbq").focus();
}

/* expected tag type of an operand, for New Tag from an unknown operand */
function guessType(instr, k){
  const sp = spec(instr), aoi = sp ? null : aoiDef(instr);
  if(aoi) return k===0 ? aoi.name : "DINT";
  if(!sp) return "DINT";
  const o = sp.operands[Math.min(k, sp.operands.length-1)] || {};
  const t = o.types || [];
  if(!t.length) return "DINT";
  if(t.includes("BOOL") && t.length===1) return "BOOL";
  for(const c of ["TIMER","COUNTER","CONTROL","STRING","FBD_TIMER","FBD_COUNTER","FBD_ONESHOT"]) if(t.includes(c)) return c;
  return t.includes("DINT") ? "DINT" : t[0];
}

  b.querySelector(".dot").className = "dot " + (LIGHTC[sum.light]||"");
  b.title = sum.items.length ? sum.items.map(i=>`${i.name}: ${i.text}`).join("\n") : "No connections yet — click to add Node-RED, Ignition, C-more or a simulator";
}
function openConnections(sel){
  if(sel) S.cx.sel = sel;
  openTab("conns", "Connections", async (doc) => { S.live = null; await loadConnections(); renderConnections(doc); });
}
function cIcon(c){ const p = S.cx.presets[c.preset] || {}; return p.icon || c.kind.slice(0,2).toUpperCase(); }
function renderConnections(doc){
  doc = doc || $("doc"); if(S.active!=="conns") return;
  const cx = S.cx;
  const cards = cx.list.map(c => `<div class="ccard ${c.id===cx.sel?"sel":""}" data-cid="${esc(c.id)}">
      <div class="t"><span class="dot ${LIGHTC[c.status.light]||""}"></span><span class="cico">${esc(cIcon(c))}</span>${esc(c.name)}

    || `<div class="empty-c"><p>No connections yet.</p><p class="dim">Add Node-RED, Ignition, a C-more HMI or a simulator. VirtualControlStudio fills in the settings and shows what to enter on the other side.</p></div>`;
  doc.innerHTML = `<div class="cpage"><div class="chead"><h2>Connections</h2><span class="dim">This PC:</span>
      ${cx.ips.map(ip=>`<span class="chip" data-copy="${esc(ip)}" title="Copy">${esc(ip)}</span>`).join("")}
      <span class="spacer"></span><button id="cAdd" class="pri">＋ Add connection</button></div>
    <div class="cgrid"><div class="clist">${cards}</div><div class="cdetail" id="cDetail"></div></div></div>`;
  $("cAdd").onclick = () => connWizard();
  doc.querySelectorAll(".ccard").forEach(el => el.onclick = (e) => { if(e.target.closest(".csw")) return; S.cx.sel = el.dataset.cid; S.cx.draft = null; S.cx.checks = null; S.cx.dirty = false; renderConnections(); });
  doc.querySelectorAll("input[data-en]").forEach(i => i.onchange = async () => {
    try { await api("POST", `/api/studio/connections/${encodeURIComponent(i.dataset.en)}/${i.checked?"enable":"disable"}`); } catch(e){ log(e.message, "err"); }
    await refreshConnections(true); });
  doc.querySelectorAll("[data-copy]").forEach(el => el.onclick = () => copyText(el.dataset.copy));

function cxShape(list){ return JSON.stringify(list.map(c => [c.id, c.name, c.enabled, c.kind, c.params, c.mapping, c.status.state, c.status.light, c.status.error, (c.status.details||{}).bad])); }
async function refreshConnections(force){
  const before = cxShape(S.cx.list), beforeAll = JSON.stringify(S.cx.list);
  try { await loadConnections(); } catch(e){ return; }
  if(S.active!=="conns") return;
  const ae = document.activeElement;
  const editing = S.cx.dirty || (ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName) && ae.closest("#cDetail"));
  const shapeChanged = cxShape(S.cx.list)!==before;
  if(force || (!editing && (shapeChanged || S.cx.tab==="log"))) { if(force) S.cx.dirty = false; renderConnections(); return; }
  // while editing: keep the edits, update lights and values in place (a full redraw follows Apply/Revert)
  if(JSON.stringify(S.cx.list)!==beforeAll || S.cx.tab==="tags") connLive();       // counters, values: in place
}
/* update the cards and live values in place (keeps unsaved edits and focus) */
function connLive(){
  const list = document.querySelector(".clist"); if(!list) return;
  for(const c of S.cx.list){
    const card = list.querySelector(`.ccard[data-cid="${CSS.escape(c.id)}"]`); if(!card) continue;
    card.querySelector(".dot").className = `dot ${LIGHTC[c.status.light]||""}`;
    card.querySelector(".s").textContent = c.status.text;
  }
  const c = curConn(); if(c && c.kind==="modbus_client" && S.cx.tab==="tags") paintPoints(c);
}
function copyText(t){
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(()=>log(`Copied ${t.length>60?t.slice(0,60)+"…":t}`, "ok"))
    .catch(()=>{ const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); log("Copied", "ok"); }catch(e){} ta.remove(); });
}
function curConn(){ return S.cx.list.find(c=>c.id===S.cx.sel); }

    try { await api("DELETE", `/api/studio/connections/${encodeURIComponent(c.id)}`); log(`${c.name} deleted`, "ok"); S.cx.sel = null; } catch(e){ log(e.message, "err"); } refreshConnections(true); };

/* settings form, generated from the connector schema */
function schemaField(f, v){
  const id = "cf_" + f.name, help = f.help ? `<div class="help">${esc(f.help)}</div>` : "";
  let input;
  if(f.choices) input = `<select id="${id}">${f.choices.map(ch=>{ const [val,lab] = Array.isArray(ch)?ch:[ch,ch]; return `<option value="${esc(val)}" ${String(val)===String(v)?"selected":""}>${esc(lab)}</option>`; }).join("")}</select>`;
  else if(f.type==="bool") input = `<input type="checkbox" id="${id}" ${v?"checked":""}>`;
  else if(f.type==="list") input = `<input id="${id}" value="${esc((v||[]).join(", "))}" spellcheck="false">`;
  else if(f.type==="dict") input = `<div class="users" id="${id}">${Object.entries(v||{}).map(([n,p])=>userRow(n,p)).join("")}<button type="button" class="addu">＋ user</button></div>`;
  else if(f.secret) input = `<input id="${id}" type="password" value="" placeholder="${v||S.cx.tokenSet?"(set — type to change)":"(none)"}" autocomplete="new-password">`;
  else input = `<input id="${id}" value="${esc(v??"")}" spellcheck="false" ${f.type==="int"||f.type==="float"?'inputmode="numeric"':""}>`;
  return `<label for="${id}" class="${f.advanced?"adv":""}">${esc(f.label||f.name)}</label><div class="${f.advanced?"adv":""}">${input}${help}</div>`;
}
function userRow(n, p){ return `<div class="urow"><input class="un" value="${esc(n)}" placeholder="user name"><input class="up" type="password" placeholder="${p?"(unchanged)":"password"}" value=""><button type="button" class="delu">✕</button></div>`; }
function readSchemaForm(schema, base){
  const out = {};
  for(const f of schema){
    const el = $("cf_" + f.name); if(!el) continue;
    if(f.type==="bool") out[f.name] = el.checked;
    else if(f.type==="list") out[f.name] = el.value.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
    else if(f.type==="dict"){ const u = {}; el.querySelectorAll(".urow").forEach(r => { const n = r.querySelector(".un").value.trim(); if(n) u[n] = r.querySelector(".up").value || (base && base[f.name] && base[f.name][n] ? "••••" : ""); }); out[f.name] = u; }
    else if(f.secret){ if(el.value) out[f.name] = el.value; }
    else out[f.name] = el.value.trim();
  }
  return out;
}
function connSettings(c, body){
  const k = S.cx.kinds[c.kind] || {schema:[]};
  S.cx.tokenSet = !!c.params.token_set;
  const groups = []; k.schema.forEach(f => { const g = f.group || "Settings"; if(!groups.includes(g)) groups.push(g); });
  const fields = groups.map(g => `<div class="grp">${esc(g)}</div>` + k.schema.filter(f => (f.group||"Settings")===g).map(f => schemaField(f, c.params[f.name])).join("")).join("");
  const hasAdv = k.schema.some(f=>f.advanced);
  body.innerHTML = `<div class="frm ${S.cx.adv?"showadv":""}" id="cForm"><label for="cf__name">Name</label><div><input id="cf__name" value="${esc(c.name)}"></div>${fields}</div>
    ${hasAdv?`<p><a href="#" id="cAdv">${S.cx.adv?"Hide advanced settings":"Show advanced settings"}</a></p>`:""}
    <div class="acts"><button class="pri" id="cApply">Apply</button><button id="cRevert">Revert</button><button id="cTest">🔎 Test connection</button></div>
    <div id="cChecks">${checksHtml(S.cx.checks)}</div>`;
  body.querySelectorAll(".addu").forEach(b => b.onclick = () => b.insertAdjacentHTML("beforebegin", userRow("", "")));
  body.addEventListener("click", (e) => { if(e.target.classList.contains("delu")) e.target.closest(".urow").remove(); });
  if($("cAdv")) $("cAdv").onclick = (e) => { e.preventDefault(); S.cx.adv = !S.cx.adv; renderConnDetail(); };
  $("cRevert").onclick = () => { S.cx.checks = null; renderConnDetail(); };
  $("cApply").onclick = async () => {
    const params = readSchemaForm(k.schema, c.params);
    try { await api("PUT", `/api/studio/connections/${encodeURIComponent(c.id)}`, {name:$("cf__name").value.trim(), params});
          log(`${c.name}: settings applied`, "ok"); S.cx.checks = null; await refreshConnections(true); }
    catch(e){ fieldError(e); }
  };
  $("cTest").onclick = async () => {
    $("cChecks").innerHTML = `<div class="dim">Testing…</div>`;
    try { const r = await api("POST", "/api/studio/connections/test", {id:c.id, params: readSchemaForm(k.schema, c.params)});
          S.cx.checks = r.checks; $("cChecks").innerHTML = checksHtml(r.checks); }
    catch(e){ $("cChecks").innerHTML = checksHtml([{ok:false, label:e.message, hint:""}]); }
  };
}
function fieldError(e){
  const f = e.data && e.data.field, el = f && $("cf_" + f);
  if(el){ el.classList.add("bad"); el.focus(); }
  log(`Connection: ${e.message}`, "err");
  const box = $("cChecks"); if(box) box.innerHTML = checksHtml([{ok:false, label:e.message, hint:""}]);
}
function checksHtml(list){
  if(!list) return "";
  return `<div class="checks">${list.map(x=>`<div class="ck"><span class="${x.ok===true?"ok":x.ok===false?"err":"wrn"}">${x.ok===true?"✔":x.ok===false?"✖":"!"}</span><div>${esc(x.label)}${x.hint?`<div class="fix">${esc(x.hint)}</div>`:""}</div></div>`).join("")}</div>`;
}
const copyVal = (v) => `<span class="copyv"><code>${esc(v)}</code><button type="button" data-copy="${esc(v)}">Copy</button></span>`;

function connTags(c, body){
  if(c.kind==="ws_client") return mappingEditor(c, body);
  if(c.kind==="modbus_client") return pointsEditor(c, body);
  if(c.kind==="modbus_tcp"){
    const m = (c.params.map||[]).slice().sort((a,b)=>a.table<b.table?-1:a.table>b.table?1:a.addr-b.addr);
    const off = {coil:1, discrete:10001, input:30001, holding:40001};
    body.innerHTML = m.length ? `<p class="dim">${m.length} tags mapped. Addresses never move when tags are added.</p>
      <table class="cvals"><tr><th>Tag</th><th>Address</th><th>Type</th><th>Access</th></tr>${m.slice(0,500).map(e=>`<tr><td>${esc(e.tag)}</td><td class="mono">${off[e.table]+e.addr}${e.words>1?`–${off[e.table]+e.addr+e.words-1}`:""}</td><td>${esc(e.type)}</td><td>${e.table==="coil"||e.table==="holding"?"read/write":"read"}</td></tr>`).join("")}</table>`
      : `<p class="dim">Turn the connection on to build the register map.</p>`;
    return;
  }
  const p = c.params;
  body.innerHTML = c.kind==="ws_server" ? `<table class="cvals"><tr><td>Access</td><td>${p.access==="ro"?"Read only":"Read and write"}</td></tr>
      <tr><td>Tags shared</td><td class="mono">${esc((p.read_tags||[]).join(", "))}</td></tr><tr><td>Tags it may write</td><td class="mono">${esc((p.write_tags||[]).join(", "))}</td></tr>
      <tr><td>Run / stop / force</td><td>${p.control?"allowed":"not allowed"}</td></tr></table><p class="dim">Change these on the Settings tab.</p>`
    : `<p>All controller and program tags are available. Read-only tags refuse writes.</p><div class="acts"><a class="btn" href="/api/studio/tags.csv" download>⤓ Tag list CSV</a></div>`;
}
const MB_TYPES = ["BOOL","INT","UINT","DINT","UDINT","REAL","LINT"];

  <td><input class="pa mono" value="${esc(m.address||"")}" size="8" spellcheck="false" placeholder="40001"></td>

  <td><select class="pd" title="in: device → tag · out: tag → device · both">${[["in","in"],["out","out"],["both","both"]].map(([d,l])=>`<option value="${d}" ${(m.dir||"in")===d?"selected":""}>${l}</option>`).join("")}</select></td>
  <td class="pv mono" data-tag="${esc(m.tag||"")}"></td><td><button type="button" class="delu" title="Remove">✕</button></td></tr>`;

function pointRowsFromDom(){
  return [...$("cPts").querySelectorAll("tr")].map(tr => ({tag:tr.querySelector(".pt").value.trim(), address:tr.querySelector(".pa").value.trim(),
    type:tr.querySelector(".pty").value, scale:tr.querySelector(".ps").value, offset:tr.querySelector(".po").value, dir:tr.querySelector(".pd").value}))
    .filter(m => m.tag || m.address);
}
function paintPoints(c){
  const box = $("cPts"); if(!box) return;
  const bad = Object.fromEntries(((c.status.details||{}).bad||[]).map(b=>[b.tag, b.message]));
  const live = c.status.state==="connected";
  box.querySelectorAll(".pv").forEach(td => {
    const t = td.dataset.tag;
    if(bad[t]){ td.textContent = "⚠ " + bad[t]; td.className = "pv mono err"; td.title = bad[t]; return; }
    const v = S.values[t]; td.className = "pv mono" + (live ? "" : " dim"); td.title = live ? "" : "not connected — last value";
    td.textContent = v===undefined ? "—" : typeof v==="number" && !Number.isInteger(v) ? (+v.toPrecision(7)).toString() : String(v);
  });
}
function pointsCsv(rows){
  const q = (x) => /[",\n]/.test(String(x)) ? `"${String(x).replace(/"/g,'""')}"` : String(x);
  return ["tag,address,type,scale,offset,dir", ...rows.map(r => [r.tag, r.address, r.type, r.scale, r.offset, r.dir].map(q).join(","))].join("\n") + "\n";
}
function splitCsvLine(line){
  const out = []; let cur = "", q = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(q){ if(ch==='"' && line[i+1]==='"'){ cur += '"'; i++; } else if(ch==='"') q = false; else cur += ch; }
    else if(ch==='"') q = true;
    else if(ch===',' || ch===';' || ch==='\t'){ out.push(cur.trim()); cur = ""; }
    else cur += ch;
  }
  out.push(cur.trim()); return out;
}
function parsePointsCsv(text){
  const rows = [];
  for(const line of String(text).split(/\r?\n/)){
    if(!line.trim() || line.trim().startsWith("#")) continue;
    const f = splitCsvLine(line);
    if(/^tag$/i.test(f[0]||"") || (!f[0] && !f[1])) continue;                   // header / empty
    const bit = /^\d{1,4}$|^1\d{4}$|\.\d+$/.test(f[1]||"");                       // coil, discrete or register bit
    rows.push({tag:f[0]||"", address:f[1]||"", type:(f[2]||"").toUpperCase() || (bit ? "BOOL" : "INT"),
               scale:f[3]||1, offset:f[4]||0, dir:(f[5]||"in").toLowerCase()});
  }
  return rows;
}

  $("cPtExp").onclick = () => { const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([pointsCsv(pointRowsFromDom())], {type:"text/csv"}));
    a.download = `${c.name.replace(/[^\w.-]+/g,"_")}_points.csv`; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000); };
  $("cPtImp").onclick = async () => {
    let text = "";
    const r = await dialog({title:"Import points", buttons:[["Cancel","cancel"],["Import","ok","pri"]],
      body:`<p class="dim">One point per line: <code>tag, address, type, scale, offset, direction</code>. A header line is skipped. Comma, semicolon or tab.</p>
        <p><input type="file" id="cPtFile" accept=".csv,.txt"></p><textarea id="cPtText" rows="10" style="width:100%" spellcheck="false" placeholder="Oven_Temp, 30001, INT, 0.1, 0, in"></textarea>
        <label><input type="checkbox" id="cPtReplace"> Replace the current points</label>`,
      onOpen:(d) => { d.querySelector("#cPtFile").onchange = async (e) => { const f = e.target.files[0]; if(f) d.querySelector("#cPtText").value = await f.text(); }; },
      onSubmit:(v, d) => { text = d.querySelector("#cPtText").value; S.cx.impReplace = d.querySelector("#cPtReplace").checked;
        if(v==="ok" && !parsePointsCsv(text).length) return "No points found in the text."; }});
    if(r!=="ok") return;
    const rows = parsePointsCsv(text);
    if(S.cx.impReplace) $("cPts").innerHTML = "";
    $("cPts").insertAdjacentHTML("beforeend", rows.map(ptRow).join("")); const e = $("cPtsEmpty"); if(e) e.remove();
    mark(); log(`${rows.length} points imported — check them and click Apply`, "ok");
  };
  $("cPtRevert").onclick = () => { S.cx.dirty = false; renderConnDetail(); };
  $("cPtSave").onclick = async () => {
    const mapping = pointRowsFromDom();
    try { await api("PUT", `/api/studio/connections/${encodeURIComponent(c.id)}`, {mapping}); S.cx.dirty = false;
          log(`${c.name}: ${mapping.length} points applied`, "ok"); await refreshConnections(true); }
    catch(e){ fieldError(e);
      const t = (e.message.match(/^([^:]+):/)||[])[1];                       // mark the row it is about
      $("cPts").querySelectorAll("tr").forEach(tr => tr.querySelectorAll("input").forEach(i => i.classList.toggle("bad", !!t && tr.querySelector(".pt").value.trim()===t))); }

}
function mappingEditor(c, body){

  body.innerHTML = `<p class="dim">Each row links a tag to a key in the simulator's JSON messages (dotted path, e.g. agv1.pos). In: simulator → tag; out: tag → simulator. tag = value × scale + offset.</p>
    <table class="cvals cmap"><tr><th>Tag</th><th>Simulator key</th><th>Direction</th><th>Scale</th><th>Offset</th><th></th></tr><tbody id="cMap">${rows}</tbody></table>
    <div class="acts"><button type="button" id="cMapAdd">＋ Add row</button><button type="button" class="pri" id="cMapSave">Apply</button></div><div id="cChecks"></div>`;
  $("cMapAdd").onclick = () => $("cMap").insertAdjacentHTML("beforeend", mapRow({dir:"both", scale:1, offset:0}));
  $("cMap").onclick = (e) => { if(e.target.classList.contains("delu")) e.target.closest("tr").remove(); };
  $("cMapSave").onclick = async () => {
    const mapping = [...$("cMap").querySelectorAll("tr")].map(tr => ({tag:tr.querySelector(".mt").value.trim(), key:tr.querySelector(".mk").value.trim(),
       dir:tr.querySelector(".md").value, scale:tr.querySelector(".ms").value, offset:tr.querySelector(".mo").value})).filter(m=>m.tag||m.key);

function mapRow(m){ return `<tr><td><input class="mt" list="tagList" value="${esc(m.tag||"")}"></td><td><input class="mk" value="${esc(m.key||"")}"></td>
  <td><select class="md">${["in","out","both"].map(d=>`<option ${m.dir===d?"selected":""}>${d}</option>`).join("")}</select></td>
  <td><input class="ms" value="${esc(m.scale??1)}" size="4"></td><td><input class="mo" value="${esc(m.offset??0)}" size="4"></td><td><button type="button" class="delu">✕</button></td></tr>`; }
async function connLog(c, body){
  if(S.cx.logHtml && S.cx.logFor===c.id) body.innerHTML = S.cx.logHtml;     // keep the old view while loading
  let d; try { d = await api("GET", `/api/studio/connections/${encodeURIComponent(c.id)}/log`); } catch(e){ body.innerHTML = esc(e.message); return; }
  const det = c.status.details || {};
  const CN = {msgs_in:"in", msgs_out:"out", polls:"polls", writes:"writes", errors:"errors", refused:"refused", poll_ms:"last poll ms"};
  const counters = Object.keys(CN).filter(k=>k in det).map(k=>`${CN[k]} ${det[k]}`).join(" · ");
  const clients = (det.clients||[]).map(x=>`<li>${esc(x.address)} — ${esc(x.client)} (in ${x.msgs_in}, out ${x.msgs_out})</li>`).join("");
  body.innerHTML = `<div class="acts" style="margin-top:0"><span class="dim">${esc(counters)}</span><span class="spacer"></span><button type="button" id="cDiag">Copy diagnostics</button></div>
    ${clients?`<p><b>Connected now</b></p><ul>${clients}</ul>`:""}
    <div class="clog">${d.log.slice().reverse().map(e=>`<div class="${e.level==="error"?"err":e.level==="warn"?"wrn":""}">${new Date(e.time*1000).toLocaleTimeString()} ${esc(e.message)}</div>`).join("") || `<span class="dim">No activity yet.</span>`}</div>`;
  S.cx.logHtml = body.innerHTML; S.cx.logFor = c.id;
  $("cDiag").onclick = () => copyText(JSON.stringify({connection:{...c, params:{...c.params, users:undefined, map:undefined}}, log:d.log.slice(-50)}, null, 1));
}
/* the add-connection wizard */
async function connWizard(){
  if(!Object.keys(S.cx.presets).length) await loadConnections();
  const order = ["node-red","ignition","cmore-cip","cmore-modbus","ws-sim-in","ws-sim-out","modbus-device","opcua","modbus"];
  let chosen = "node-red";
  const tiles = order.map(k => { const p = S.cx.presets[k]; return `<div class="tile ${k===chosen?"sel":""}" data-p="${k}"><span class="cico">${esc(p.icon)}</span><b>${esc(p.title)}</b><span>${esc(p.summary)}</span></div>`; }).join("");
  const r1 = await dialog({title:"Add a connection — 1 of 2: choose a platform", buttons:[["Cancel","cancel"],["Next ›","ok","pri"]],
    body:`<div class="tiles">${tiles}</div>`, onOpen:(d) => d.querySelectorAll(".tile").forEach(t => {
      t.onclick = () => { d.querySelectorAll(".tile").forEach(x=>x.classList.remove("sel")); t.classList.add("sel"); chosen = t.dataset.p; };
      t.ondblclick = () => { chosen = t.dataset.p; d.querySelector("button[value=ok]").click(); }; })});
  if(r1!=="ok") return;
  const p = S.cx.presets[chosen], kind = S.cx.kinds[p.kind] || {schema:[]};
  const portF = kind.schema.find(f=>f.name==="port");
  const fields = [{name:"name", label:"Name", value:p.title}];
  if(kind.role==="client" && kind.schema.find(f=>f.name==="host")){
    fields.push({name:"host", label:"Device IP address", value:"", hint:"The device's (or the Modbus gateway's) IP address, e.g. 192.168.1.20"});
    fields.push({name:"port", label:"Port", value:p.params.port ?? 502});
    fields.push({name:"unit_id", label:"Unit ID", value:1, hint:"Usually 1. Behind a Modbus gateway it selects the serial device."});
  }
  else if(kind.role==="client") fields.push({name:"url", label:"Simulator URL", value:p.params.url||"ws://", hint:"Where the simulator's WebSocket server is, e.g. ws://192.168.1.50:9000/sim"});
  else {
    fields.push({name:"where", label: chosen.startsWith("cmore") ? "The HMI is" : chosen==="ignition" ? "The Ignition gateway runs" : chosen==="node-red" ? "Node-RED runs" : "The other program runs",
                 type:"select", options:[["lan","On another PC (listen on the network)"],["local","On this PC"]], value:"lan",
                 hint:"On another PC: only this connection's port is opened to the network; the engineering UI stays local."});
    if(portF) fields.push({name:"port", label:"Port", value:p.params.port ?? portF.default, hint: chosen==="cmore-cip" ? "C-more uses the EtherNet/IP port 44818." : ""});
  }
  let made = null;
  const r2 = await formDialog({title:`Add a connection — 2 of 2: ${p.title}`, submit:"Create and test", fields,
    intro:`<p class="notice-small">${esc(p.summary)}</p>`,
    onSubmit: async (v) => {
      const params = {...p.params};
      if(v.url !== undefined) params.url = v.url;
      if(v.host !== undefined) params.host = v.host;
      if(v.unit_id !== undefined) params.unit_id = v.unit_id;
      if(v.where) params.bind = v.where;
      if(v.port) params.port = v.port;
      try { made = await api("POST", "/api/studio/connections", {preset:chosen, name:v.name, params}); } catch(e){ return e.message; }
    }});
  if(r2!=="ok" || !made) return;
  log(`Connection ${made.name} created`, "ok");
  S.cx.sel = made.id; S.cx.tab = made.kind==="modbus_client" ? "tags" : "other"; S.cx.checks = null; S.cx.dirty = false;
  openConnections(made.id);
  try { const t = await api("POST", "/api/studio/connections/test", {id:made.id}); S.cx.checks = t.checks;
        const bad = t.checks.filter(x=>x.ok===false);
        log(bad.length ? `${made.name}: ${bad[0].label}` : `${made.name}: test passed`, bad.length ? "err" : "ok");
        if(bad.length && made.kind!=="modbus_client"){ S.cx.tab = "settings"; renderConnDetail(); } } catch(e){}
}

/* ---------- resizable panes (organizer, properties, bottom console); sizes remembered ---------- */
const PANE_DEF = {orgW:285, propsW:270, conH:210};
function paneLimits(k){
  const w = $("work").getBoundingClientRect();
  return k==="conH" ? [60, Math.max(120, w.height - 120)] : k==="orgW" ? [140, Math.max(200, w.width * 0.6)] : [160, Math.max(200, w.width * 0.5)];
}
function setPane(k, px, save){
  const [lo, hi] = paneLimits(k); px = Math.round(Math.min(hi, Math.max(lo, px)));
  $("work").style.setProperty("--" + k, px + "px");
  if(save){ const all = JSON.parse(lsGet("Panes") || "{}"); all[k] = px; lsSet("Panes", JSON.stringify(all)); }
}
function initPanes(){
  try { const saved = JSON.parse(lsGet("Panes") || "{}"); for(const k in PANE_DEF) if(saved[k]) setPane(k, saved[k], false); } catch(e){}
  const bind = (id, k, calc) => {
    const el = $(id);
    el.onpointerdown = (e) => {
      e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add("drag"); document.body.classList.add("resizing");
      const w = $("work").getBoundingClientRect();
      el.onpointermove = (m) => setPane(k, calc(m, w), false);
      el.onpointerup = (m) => { el.onpointermove = el.onpointerup = null; el.classList.remove("drag"); document.body.classList.remove("resizing"); setPane(k, calc(m, w), true); };
    };
    el.ondblclick = () => setPane(k, PANE_DEF[k], true);
  };
  bind("spOrg", "orgW", (m, w) => m.clientX - w.left);
  bind("spProps", "propsW", (m, w) => w.right - m.clientX);
  bind("spCon", "conH", (m, w) => w.bottom - m.clientY);
  window.addEventListener("resize", () => { for(const k in PANE_DEF){ const v = parseInt(getComputedStyle($("work")).getPropertyValue("--" + k)); if(v) setPane(k, v, false); } });
}
initPanes();

/* ---------- data flow ---------- */
async function loadProject(){
  S.project = await api("GET","/api/studio/project"); S.state = S.project.state; renderTree(); paintStatus();
  document.querySelector("#bar .brand").textContent = `VirtualControlStudio ${S.project.version || ""}`;
  if(!S.tabs.length && hasProject()) openTags("controller");
}
function connect(){
  const ws = new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/api/v1/ws"); S.ws = ws;
  ws.onopen = () => { $("conn").textContent = "online"; send({op:"hello", client:"studio", v:1}); send({op:"subscribe", tags:["*"]}); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if(m.id && pend[m.id]){ pend[m.id](m); delete pend[m.id]; }
    if(m.op==="snapshot"){ S.values = m.values; S.kidIdx = null; S.keyVer = (S.keyVer||0)+1; S.chg = "all"; dirty = true; }
    else if(m.op==="changes"){
      for(const k in m.values){ if(!(k in S.values)){ S.kidIdx = null; S.keyVer = (S.keyVer||0)+1; } if(S.chg!=="all") S.chg.add(k); }
      Object.assign(S.values, m.values); dirty = true; }
    else if(m.op==="event"){
      if(m.kind==="state"){ S.state = m.data; paintStatus(); }
      if(m.kind==="connection"){ if(m.data && m.data.summary) paintConnLight(m.data.summary); clearTimeout(S.cxT); S.cxT = setTimeout(refreshConnections, 150); }
      if(m.kind==="tags" && m.data.action==="reload"){ S.values = {}; S.kidIdx = null; S.keyVer = (S.keyVer||0)+1; S.chg = "all"; }
    } else if(m.op==="error") log(m.error, "err");
  };
  ws.onclose = () => { $("conn").textContent = "offline — reconnecting"; setTimeout(connect, 2000); };
}
let dirty = false;
async function tick(){
  if(S.traceFor && S.tabs.find(t=>t.id===`r:${S.traceFor.prog}/${S.traceFor.routine}`) && S.active===`r:${S.traceFor.prog}/${S.traceFor.routine}`){
    try { S.trace = await api("GET", `/api/studio/trace?program=${encodeURIComponent(S.traceFor.prog)}&routine=${encodeURIComponent(S.traceFor.routine)}`); dirty = true; } catch(e){}
  }
  if(dirty){ dirty = false; const chg = S.chg; S.chg = new Set();
    if(S.live) S.live(chg); if(S.ctab==="watch") renderConsole(); if(S.sel) renderPropsLite(); }
  setTimeout(tick, 250);
}
function renderPropsLite(){ const big = document.querySelector("#pbody .big"); if(big && S.values[S.sel]!==undefined) big.textContent = fmt(S.values[S.sel]); }
async function slowTick(){
  try { const prevMode = S.state && S.state.mode;
        S.state = (await api("GET","/api/v1/status")); const fr = await api("GET","/api/studio/faults"); const f = fr.faults;
        const changed = f.length!==S.faults.length || JSON.stringify(fr.minor)!==JSON.stringify(S.minor) || JSON.stringify(fr.major)!==JSON.stringify(S.major);
        S.major = fr.major; S.minor = fr.minor || [];
        if(changed){ S.faults = f; renderConsoleTabs(); if(S.ctab==="faults") renderConsole(); }
        if(S.state.mode==="FAULTED" && prevMode!=="FAULTED" && S.major){ log(`MAJOR FAULT (Type ${S.major.type}) (Code ${S.major.code}) ${S.major.text} at ${S.major.location}`, "err"); S.ctab="faults"; renderConsoleTabs(); renderConsole(); }
        if(S.active==="conns") refreshConnections();
        else if(!(S.cxTick = ((S.cxTick||0)+1) % 4)) { try { paintConnLight((await api("GET","/api/studio/connections")).summary); } catch(e){} }
        if(S.ctab==="diag"){ S.diag = await api("GET","/api/studio/diagnostics"); renderConsole(); }
        if(S.ctab==="timers"){ S.timers = (await api("GET","/api/studio/timers")).items; renderConsole(); }
        paintStatus(); } catch(e){}
  setTimeout(slowTick, 700);
}

/* ---------- keyboard ----------
   Ctrl+T toggles the selected BOOL tag or bit (tag table, ladder contact/coil,
   watch list). Alt+T does the same where the browser keeps Ctrl+T for itself.
   Never fires while typing in a text field or the rung/ST editors. */
function typingTarget(el){
  if(!el) return false;
  const tag = (el.tagName||"").toLowerCase();
  return tag==="input" || tag==="textarea" || tag==="select" || el.isContentEditable;
}
async function toggleSelected(){
  const a = S.sel;
  if(!a){ log("Ctrl+T: select a BOOL tag or a contact/coil first", "wrn"); return; }
  const v = S.values[a];
  if(v===undefined){ log(`Ctrl+T: ${a} is a structure or array — select one of its BOOL members`, "wrn"); return; }
  if(typeof v!=="boolean"){ log(`Ctrl+T: ${a} is not a BOOL (value ${fmt(v)}); type a new value instead`, "wrn"); return; }
  const def = findDef(a);                  // External Access does not limit the programming application
  if(def && def.constant && !(await confirmConstant(a, !v))) return;
  const ok = await write(a, !v);
  if(ok!==false){
    document.querySelectorAll(`tr[data-addr="${CSS.escape(a)}"], .ins[data-addr="${CSS.escape(a)}"]`).forEach(el => { el.classList.remove("toggled"); void el.offsetWidth; el.classList.add("toggled"); });
  }
}
S.tagDefs = {};
function findDef(addr){
  let a = addr;
  while(a){ if(S.tagDefs[a]) return S.tagDefs[a]; const m = a.match(/^(.*)(\.[^.\[]+|\[[\d,]+\])$/); if(!m) break; a = m[1]; }
  return null;
}
document.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if($("dlg").open){ if((k==="s" || k==="w") && (e.ctrlKey || e.metaKey || e.altKey)) e.preventDefault(); return; }
  if(menuOpen()){ if(e.key==="Escape"){ e.preventDefault(); hideMenu(true); } return; }
  for(const h of (window.vcsKeyHooks || [])){ if(h(e)) return; }
  if(k==="s" && (e.ctrlKey || e.metaKey) && !e.altKey){ e.preventDefault(); saveProject(e.shiftKey); return; }
  if(k==="w" && ((e.altKey && !e.ctrlKey) || ((e.ctrlKey || e.metaKey) && !e.altKey)) && S.project && S.project.authoring){
    e.preventDefault(); newTagDialog(); return; }
  if(e.key==="F10" && e.shiftKey && S.treeSel && !typingTarget(document.activeElement)){
    const items = menuFor(S.treeSel), el = document.querySelector(`#tree .node[data-key="${CSS.escape(S.treeSel)}"]`);
    if(items && el){ e.preventDefault(); showMenu(null, items, el); return; } }
  if(e.key==="Escape" && $("tbrowse")){ closeTagBrowser(); return; }
  if(k==="t" && (e.ctrlKey || e.metaKey || e.altKey) && !e.shiftKey){
    if(typingTarget(document.activeElement)) return;          // let the field have its own shortcut
    if(S.edit && document.activeElement && document.activeElement.closest && document.activeElement.closest("#erung, .sted")) return;
    e.preventDefault();
    toggleSelected();
    return;
  }
  if(!S.edit || typingTarget(document.activeElement)){
    if(S.edit && e.key==="Escape" && !S.edit.st){ e.preventDefault(); cancelEdit(); }
    if(S.edit && e.key==="Escape" && S.edit.st && !$("stCompl")){ e.preventDefault(); stCancelAsk(); }
    if(S.edit && e.key==="Enter" && e.ctrlKey){ e.preventDefault();
      if(S.edit.st){ if(S.edit.checked && S.edit.valid) stFinalize(); else stJumpFirstError(); }
      else if(S.edit.valid) finalize(); }
    return;
  }
  if(S.edit.st) return;
  if(e.key==="Escape"){ e.preventDefault(); cancelEdit(); }
  else if(e.key==="Delete"){ e.preventDefault(); removeSel(); }
  else if(e.key==="Enter" && e.ctrlKey){ e.preventDefault(); if(S.edit.valid) finalize(); }
  else if(e.key==="ArrowLeft" && e.altKey){ e.preventDefault(); moveSel(-1); }
  else if(e.key==="ArrowRight" && e.altKey){ e.preventDefault(); moveSel(1); }
});
