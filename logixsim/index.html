<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogixSim Studio · K-Solution Academy</title>
<script src="boot.js"></script>
<style>
:root{
  --bg:#eef0f3;--pane:#fff;--pane2:#f7f8fa;--ink:#1c232d;--mut:#5f6b7a;--line:#d6dbe2;--sel:#dbe8ff;
  --acc:#1f5fbf;--on:#13a05a;--onbg:#d9f6e6;--off:#8a94a3;--warn:#c27c00;--bad:#c62828;--force:#d4a000;
  --run:#13a05a;--prog:#3b6fb6;--pause:#c27c00;--rail:#2b3440;--mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --org:#e9edf2;--orgline:#cfd6df;--edit:#fff8e6;--editline:#d99a00;--pf:#13a05a;--wire:#3a4554;
  --lfont:"Segoe UI","Noto Sans","Helvetica Neue",Arial,system-ui,sans-serif;--lval:#1a56b8}
/* theme: follows the system unless chosen with the toolbar ☀/🌙 button (data-theme) */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#14181e;--pane:#1b2028;--pane2:#202733;--ink:#e3e7ee;--mut:#97a2b1;--line:#2d3542;--sel:#22385c;
  --acc:#6aa5ff;--on:#3ddc84;--onbg:#173d2a;--off:#6f7a89;--warn:#f0b43c;--bad:#ff6b6b;--force:#ffd24a;--rail:#aab4c3;
  --org:#171c23;--orgline:#2a323e;--edit:#2a2414;--editline:#e0a82e;--pf:#3ddc84;--wire:#9aa6b6;--lval:#8cc0ff}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#14181e;--pane:#1b2028;--pane2:#202733;--ink:#e3e7ee;--mut:#97a2b1;--line:#2d3542;--sel:#22385c;
  --acc:#6aa5ff;--on:#3ddc84;--onbg:#173d2a;--off:#6f7a89;--warn:#f0b43c;--bad:#ff6b6b;--force:#ffd24a;--rail:#aab4c3;
  --org:#171c23;--orgline:#2a323e;--edit:#2a2414;--editline:#e0a82e;--pf:#3ddc84;--wire:#9aa6b6;--lval:#8cc0ff}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;
  grid-template-rows:auto 1fr auto;overflow:hidden}
button{font:inherit;color:inherit;background:var(--pane);border:1px solid var(--line);border-radius:5px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}button:disabled{opacity:.45;cursor:default}
input,select{font:inherit;color:inherit;background:var(--pane);border:1px solid var(--line);border-radius:4px;padding:3px 6px}
/* toolbar */
#bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 10px;background:var(--pane);border-bottom:1px solid var(--line)}
#bar .brand{font-weight:700;letter-spacing:.02em;margin-right:6px}
#bar .grp{display:flex;gap:4px;align-items:center;padding-right:8px;border-right:1px solid var(--line)}
#modebox{display:flex;align-items:center;gap:8px;padding:3px 10px;border-radius:6px;background:var(--pane2);border:1px solid var(--line)}
#modelight{width:12px;height:12px;border-radius:50%;background:var(--prog)}
#modetext{font-weight:700;min-width:70px}
#forceind{padding:2px 8px;border-radius:4px;font-weight:600;font-size:12px;background:var(--pane2);color:var(--mut)}
#forceind.on{background:var(--force);color:#000}
#forceind{cursor:pointer}
#bTiming.on{border-color:var(--acc);color:var(--acc)}
#bTheme{padding:3px 8px;min-width:34px}#forceind.blink{animation:fblink 1s steps(1) infinite;background:var(--force);color:#000}
@keyframes fblink{50%{background:var(--pane2);color:var(--mut)}}
.fmark{font-size:10px;font-weight:700;color:var(--force);margin-left:3px}.fmark.off{opacity:.55}
.cst{font-size:10px;margin-left:3px;opacity:.75}
td.desc.pass{color:var(--mut);font-style:italic}
.spacer{flex:1}
/* work area */
#work{display:grid;grid-template-columns:var(--orgW,285px) 1fr var(--propsW,270px);grid-template-rows:1fr var(--conH,210px);min-height:0;position:relative}
/* pane splitters: drag to resize, double-click to reset */
.split{position:absolute;z-index:20;background:transparent;touch-action:none}
.split:hover,.split.drag{background:color-mix(in srgb,var(--acc) 45%,transparent)}
.split.v{top:0;bottom:0;width:6px;cursor:col-resize}
.split.h{height:6px;cursor:row-resize}
#spOrg{left:calc(var(--orgW,285px) - 3px)}
#spProps{right:calc(var(--propsW,270px) - 3px)}
#spCon{left:var(--orgW,285px);right:var(--propsW,270px);bottom:calc(var(--conH,210px) - 3px)}
body.resizing{user-select:none}body.resizing iframe{pointer-events:none}
#org{grid-row:1/3;background:var(--org);border-right:1px solid var(--orgline);overflow:auto;padding:6px 4px 20px}
#center{display:flex;flex-direction:column;min-width:0;min-height:0}
#props{grid-row:1/3;grid-column:3;background:var(--pane);border-left:1px solid var(--line);overflow:auto;padding:10px}
#console{grid-column:2;display:flex;flex-direction:column;border-top:1px solid var(--line);background:var(--pane);min-height:0}
h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:4px 6px 6px}
/* organizer tree */
.tree{list-style:none;margin:0;padding-left:0}
.tree .tree{margin-left:13px;padding-left:4px;border-left:1px solid var(--orgline)}
.tree.root>li{border-bottom:1px solid var(--orgline);padding:3px 0}
.tree.root>li:last-child{border-bottom:none}
.tree li{margin:0}
.node{display:flex;align-items:center;gap:6px;padding:2px 6px;border-radius:4px;cursor:pointer;white-space:nowrap;min-height:22px}
.node:hover{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.node.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--acc)}
.node .lbl{overflow:hidden;text-overflow:ellipsis}
.node.grp>.lbl{font-weight:600;font-size:12px;letter-spacing:.02em}
.twist{width:12px;color:var(--mut);font-size:10px;text-align:center;flex:none}
.ico{flex:none;min-width:20px;height:16px;line-height:16px;border-radius:3px;text-align:center;font-size:9px;font-weight:800;color:#fff;background:var(--off);padding:0 2px}
.ico.k-ctrl{background:#334e7a}.ico.k-tags{background:#a6731b}.ico.k-task{background:#16807a}.ico.k-prog{background:#6b4fa3}
.ico.k-ld{background:#2c8a4b}.ico.k-st{background:#2f6fb5}.ico.k-fbd,.ico.k-sfc{background:#7d8794}.ico.k-dt{background:#5f6b7a}
.ico.k-aoi{background:#b85c1c}.ico.k-io{background:#4b5563}.ico.k-folder{background:transparent;color:var(--mut);font-size:12px}
.node .desc{color:var(--mut);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.dim{color:var(--off)}
.badge{font-size:10px;padding:0 5px;border-radius:3px;background:var(--pane2);color:var(--mut);border:1px solid var(--line)}
/* tabs */
#tabs{display:flex;gap:2px;padding:4px 6px 0;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{display:flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-bottom:none;border-radius:6px 6px 0 0;
  background:var(--pane2);cursor:pointer;white-space:nowrap}
.tab.act{background:var(--pane);font-weight:600}
.tab .x{color:var(--mut);padding:0 2px}.tab .x:hover{color:var(--bad)}
#doc{flex:1;overflow:auto;background:var(--pane);min-height:0}
.empty{padding:40px;color:var(--mut);max-width:620px}
.empty h2{color:var(--ink);margin-top:0}
/* ladder */
/* the routine is as wide as its longest rung: long rungs scroll sideways instead of being squeezed */
.ladder{padding:8px 14px 40px;font-size:12px;font-family:var(--lfont);width:max-content;min-width:100%}
/* each rung is as wide as the view, or as its own logic when that is longer (then the view scrolls) */
.rung{display:grid;grid-template-columns:40px 1fr;border-bottom:1px dashed var(--line);padding:8px 0;
  width:max-content;min-width:var(--ladw,100%)}
.ladder.big .rung{content-visibility:auto;contain-intrinsic-size:auto 70px}   /* only large routines skip off-screen rungs (no layout jumps otherwise) */
.ladder>.rhead,.ladder>.insbar{width:var(--ladw,100%)}
.rnum{font-family:var(--mono);color:var(--mut);padding-top:16px;text-align:right;padding-right:8px;position:sticky;left:0;background:var(--pane);z-index:1}
.rnum.err{color:var(--bad);font-weight:700}
.rcomment{color:var(--mut);font-style:italic;margin:0 0 4px 4px;white-space:pre-wrap}
.rline{display:flex;align-items:stretch;border-left:3px solid var(--rail);border-right:3px solid var(--rail);min-height:44px;padding:0}
.rline.energized{border-left-color:var(--pf)}
.series{display:flex;align-items:stretch;flex:0 0 auto}
.rline>.series{flex:1}
.branch>.series{flex:1 0 auto}            /* a level never shrinks below its content (nested branches) */
.branch.grow{flex:1 1 auto}
.wire{flex:0 0 26px;min-width:22px;background:linear-gradient(var(--wire),var(--wire)) center/100% 2px no-repeat}
.wire.grow{flex:1 1 56px;min-width:56px}      /* gap between the last input and the outputs */
.wire.pf{background:linear-gradient(var(--pf),var(--pf)) center/100% 3px no-repeat}
.rhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.rhead .hint{font-size:11px}
.insbar{height:9px;margin:0 0 0 36px;border-radius:4px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center}
.insbar span{display:none;font-size:11px;font-weight:600;color:var(--acc);background:var(--pane);padding:0 8px;border-radius:8px;border:1px solid var(--acc)}
.insbar:hover{background:color-mix(in srgb,var(--acc) 22%,transparent);height:18px}
.insbar:hover span{display:inline-block}
.endrung .endline{border:none;justify-content:center;color:var(--mut);font-family:var(--mono);min-height:24px;align-items:center}
.erung{background:var(--edit);outline:2px dashed var(--editline);outline-offset:-2px;border-radius:6px;padding:8px 6px;margin:4px 0}
.erung.valid{outline-color:var(--on)}.erung.invalid{outline-color:var(--bad)}.erung.applying{opacity:.7}
.rung.flash{animation:flash 1.6s ease-out}@keyframes flash{0%{background:color-mix(in srgb,var(--on) 35%,transparent)}100%{background:transparent}}
.emark{display:inline-block;background:var(--editline);color:#000;font-weight:800;border-radius:3px;padding:0 4px;margin-right:2px}
.etools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.etitle{font-weight:700;margin-right:6px}
.egrp{display:flex;gap:3px;align-items:center;padding:2px 6px 2px 0;border-right:1px solid var(--line)}
.egrp:last-child{border-right:none}
.pal{font-family:var(--mono);font-size:11px;padding:2px 6px}
button.on{background:var(--sel);border-color:var(--acc)}
button.danger{color:var(--bad)}
.ecomment{width:100%;font:inherit;font-style:italic;resize:vertical;margin-bottom:4px;background:var(--pane);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 6px}
.etext{width:100%;font-family:var(--mono);font-size:13px;padding:6px;margin:4px 0}
.eline{background:var(--pane);border-radius:4px;padding:4px 0}
.erung .ins.sel .sym,.erung .ins.sel .box{box-shadow:0 0 0 3px var(--acc)}
.ins.insbad .sym,.ins.insbad .box{border:2px solid var(--bad)!important;color:var(--bad)}
.ins.insopbad .box,.ins.insopbad .sym{outline:2px solid var(--bad)}
.ins.inswarn .box,.ins.inswarn .sym{outline:2px dashed var(--warn)}
.operr{color:var(--bad)!important;font-weight:700}
.opwarn{color:var(--warn)!important;font-weight:700}
.series.emptyleg{min-width:46px;min-height:30px;border:1px dashed var(--off);border-radius:4px;margin:2px}
.series.selleg{background:var(--sel)}
.branch.selb{outline:2px solid var(--acc)}
.eins{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:6px 0;background:var(--pane)}
.eins-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.eops{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 12px}
.eop{display:grid;grid-template-columns:110px 1fr;gap:2px 6px;align-items:center;font-size:12px}
.eop span{color:var(--mut)}.eop input{font-family:var(--mono)}
.eop em,.eop i{grid-column:1/3;font-size:11px;font-style:normal}
.eop.operr input{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--pane))}
.eop.opwarn input{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--pane))}
.eop.operr em{color:var(--bad)}.eop.opwarn em{color:var(--warn)}
.ehint{margin:6px 2px;font-size:12px}
.eissues{font-size:12px;margin:4px 0;font-family:var(--mono)}
.eissues .jump{cursor:pointer}.eissues .jump:hover{text-decoration:underline}
.finbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 8px;border-radius:6px;margin-top:6px;border:1px solid var(--line);background:var(--pane2)}
.finbar.ready{border-color:var(--on);background:color-mix(in srgb,var(--on) 12%,var(--pane))}
.finbar.blocked{border-color:var(--line)}
.finbar #eFinal,.finbar #stFinal{font-weight:700;padding:5px 18px;background:var(--on);color:#fff;border-color:var(--on)}
.finbar #eFinal:disabled,.finbar #stFinal:disabled{background:var(--pane2);color:var(--mut);border-color:var(--line)}
.sted{display:grid;grid-template-columns:44px 1fr;border:2px dashed var(--editline);border-radius:6px;margin:8px 12px;height:55vh;background:var(--pane)}
.sted.valid{border-color:var(--on)}.sted.invalid{border-color:var(--bad)}
.stgut{overflow:hidden;font-family:var(--mono);font-size:12px;line-height:18px;color:var(--mut);text-align:right;padding:6px 6px 6px 0;background:var(--pane2)}
.stgut .bad{color:#fff;background:var(--bad)}
#stTa{font-family:var(--mono);font-size:12px;line-height:18px;border:none;outline:none;resize:none;padding:6px 8px;background:var(--pane);color:var(--ink);white-space:pre;overflow:auto}
#stIss,.finbar{margin-left:12px;margin-right:12px}
.ladder .rhead,.stwrap .rhead{position:sticky;top:0;background:var(--pane);z-index:3}
tr.toggled td{animation:flash 1s ease-out}
.ins.toggled{animation:flash 1s ease-out}
th.sort{cursor:pointer;user-select:none}th.sort:hover{color:var(--ink)}
td.desc{max-width:360px;overflow:hidden;text-overflow:ellipsis}
td.typ{font-family:var(--mono);font-size:12px}
.colbtn{margin-left:auto}
.info{padding:12px 16px}.info table{width:auto;min-width:420px}.info td:first-child{color:var(--mut);padding-right:24px}
.info h2{margin:0 0 8px}
.ins{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 4px;cursor:pointer;border-radius:4px;
  background:linear-gradient(var(--rail),var(--rail)) center/100% 2px no-repeat}
.ins .tagn{font-family:var(--lfont);font-size:12px;font-weight:600;color:var(--ink);max-width:180px;padding:0 3px;background:var(--pane);
  text-align:center;line-height:15px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ins .sym{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:1px;padding:1px 8px;background:var(--pane);border-radius:3px;min-width:46px;text-align:center;line-height:18px}
.ins .val{font-family:var(--mono);font-size:11px;color:var(--lval);background:var(--pane);line-height:14px;min-height:14px;min-width:8px}   /* no jump when the value arrives */
.ins.on .sym{background:var(--onbg);color:var(--on);outline:2px solid var(--on)}
.ins.sel .sym,.ins.sel .box{box-shadow:0 0 0 2px var(--acc)}
.ins.forced .tagn{color:var(--force);font-weight:700}
.box{border:1.5px solid var(--rail);border-radius:4px;background:var(--pane);min-width:180px;font-family:var(--lfont);font-size:12px;margin:4px 0}
.box .bt{font-weight:700;padding:3px 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:12.5px}
.box .bt .btt{font-weight:400;color:var(--mut);font-size:11px;white-space:nowrap}
.box .br{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:2px 8px;align-items:baseline;line-height:16px}
.box .br span:first-child{color:var(--mut);font-size:11px;white-space:nowrap}
.box .br span:nth-child(2){font-weight:600;overflow-wrap:anywhere;max-width:220px}
.box .br .lv{min-width:36px;text-align:right;font-family:var(--mono);font-size:11.5px;font-weight:400;color:var(--lval);white-space:nowrap}
.box .bits{display:flex;gap:4px;padding:2px 6px 3px;border-top:1px solid var(--line)}
.bit{padding:0 4px;border-radius:3px;background:var(--pane2);color:var(--off)}.bit.on{background:var(--on);color:#fff}
.ins.on .box{border-color:var(--on);box-shadow:inset 0 0 0 1px var(--on)}
.branch{display:flex;flex-direction:column;justify-content:flex-start;border-left:2px solid var(--rail);border-right:2px solid var(--rail);margin:0 2px}
.branch>.series{min-height:52px}
.branch>.series+.series{margin-top:2px}
.unsup .box,.unsup .sym{border-color:var(--bad)!important;color:var(--bad)}
.bound .box{border-style:dashed}
.rnum.skip{opacity:.45}
.rung.skipped .rline{opacity:.45}
.ihelp{margin-top:12px;border-top:1px solid var(--line);padding-top:8px;font-size:12px}
.ihelp h4{margin:0 0 4px;font-size:13px}.ihelp ul{margin:4px 0 0 16px;padding:0}.ihelp li{margin:2px 0}
.ihelp .meta{color:var(--mut);font-size:11px}
.majorbox{border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);padding:6px 8px;border-radius:6px;margin-bottom:6px}
.stview{font-family:var(--mono);font-size:12px;padding:10px 0;white-space:pre;counter-reset:ln}
.stview div{padding:0 12px 0 0}.stview div::before{counter-increment:ln;content:counter(ln);display:inline-block;width:40px;color:var(--mut);text-align:right;margin-right:12px}
.notice{margin:12px;padding:10px 12px;border-radius:6px;background:var(--pane2);border:1px solid var(--line)}
.notice.warn{border-color:var(--warn)}
/* tag monitor */
.tagtools{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--pane);z-index:2}
.tagtools input{flex:1;max-width:340px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:3px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--mut);background:var(--pane2);position:sticky;top:41px;z-index:1}
td.v{font-family:var(--mono)}
tr.sel td{background:var(--sel)}
tr.forced td.v{color:var(--force);font-weight:700}
.exp{display:inline-block;width:14px;color:var(--mut);cursor:pointer}
.boolbtn{font-family:var(--mono);min-width:28px;padding:0 6px}.boolbtn.on{background:var(--on);color:#fff;border-color:var(--on)}
.numin{width:110px;font-family:var(--mono)}
/* properties */
.pv{display:grid;grid-template-columns:90px 1fr;gap:4px 8px;font-size:12px;margin-bottom:10px}
.pv div:nth-child(odd){color:var(--mut)}
.pv .big{font-family:var(--mono);font-size:16px;font-weight:700}
.pbtns{display:flex;flex-wrap:wrap;gap:4px}
/* console */
#ctabs{display:flex;gap:2px;padding:3px 6px 0;border-bottom:1px solid var(--line);background:var(--pane2)}
.ctab{padding:3px 10px;cursor:pointer;border-radius:5px 5px 0 0}.ctab.act{background:var(--pane);font-weight:600}
#cbody th{position:static;top:auto}
#cbody{flex:1;overflow:auto;font-family:var(--mono);font-size:12px;padding:6px 10px;white-space:pre-wrap;min-height:0}
.ok{color:var(--on)}.err{color:var(--bad)}.wrn{color:var(--warn)}
.prog{height:8px;background:var(--pane2);border-radius:4px;overflow:hidden;min-width:120px}
.prog>div{height:100%;background:var(--acc)}
#status{display:flex;gap:16px;padding:3px 10px;font-size:12px;color:var(--mut);background:var(--pane);border-top:1px solid var(--line)}
#menu{position:fixed;display:none;background:var(--pane);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:50;padding:4px;min-width:170px}
#menu div{padding:5px 10px;border-radius:4px;cursor:pointer}#menu div:hover{background:var(--sel)}
#menu hr{border:none;border-top:1px solid var(--line);margin:3px 2px}
#menu div.dis{opacity:.45;cursor:default}
#menu div{display:flex;justify-content:space-between;gap:18px;outline:none}#menu div:focus{background:var(--sel)}
#menu kbd{font:11px var(--mono);color:var(--mut)}

<body>
<div id="bar">
  <span class="brand" id="brand" title="About VirtualControlStudio" style="cursor:pointer">VirtualControlStudio</span>
  <div class="grp">
    <button id="bFile" title="New, Open, Save, Save As, Import, Export">📁 File ▾</button>
    <button id="bImport" title="Import an .L5X project file (exported from Studio 5000 Logix Designer)">📂 Import L5X</button>
    <input type="file" id="file" accept=".l5x,.L5X,.xml" hidden>
    <button id="bVerify" title="What can VirtualControlStudio execute in this project?">✔ Verify</button>
    <button id="bSave" title="Save the project (Ctrl+S)">💾 Save</button>
    <button id="bExport" title="Download the whole project as an .L5X file (to import into Studio 5000)">⤓ Export L5X</button>
    <button id="bNewTag" title="New tag (Alt+W; Ctrl+W where the browser allows it)">＋ Tag</button>
  </div>
  <div id="modebox"><span id="modelight"></span><span id="modetext">PROGRAM</span></div>
  <div class="grp">
    <button id="bRun" title="Run (from Program mode a prescan runs first)">▶ Run</button>
    <button id="bPause" title="Pause: freeze scans and the controller clock">⏸ Pause</button>
    <button id="bStop" title="Program mode: stop scanning">■ Program</button>
    <button id="bStep" title="Execute one scan (not in Run)">⏭ Scan</button>
    <button id="bReset" title="Reset all tags to the project's initial values">↺ Reset</button>
  </div>
  <span id="forceind" title="I/O forces — click for Enable / Disable / Remove all">Forces: 0</span>
  <button id="bConn" title="Connections"><span class="dot"></span> 🔌 Connections</button>
  <button id="bTiming" title="Controller clock while running">⏱ Real time</button>
  <span class="spacer"></span>
  <span class="dim" id="conn">connecting…</span>
  <button id="bTheme" title="Switch between light and dark mode" aria-label="Switch between light and dark mode">🌙</button>
</div>
<div id="work">
  <div id="org"><h3>Controller organizer</h3><ul class="tree root" id="tree"></ul></div>
  <div id="center"><div id="tabs"></div><div id="doc"></div></div>
  <div id="props"><h3>Properties</h3><div id="pbody" class="dim">Select a tag or an instruction.</div></div>
  <div id="console">
    <div id="ctabs"></div>
    <div id="cbody"></div>
  </div>
  <div class="split v" id="spOrg" title="Drag to resize · double-click to reset"></div>
  <div class="split v" id="spProps" title="Drag to resize · double-click to reset"></div>
  <div class="split h" id="spCon" title="Drag to resize · double-click to reset"></div>
</div>
<div id="status"><span id="sCtrl">No project</span><span id="sScan"></span><span id="sClock"></span><span id="sFault"></span></div>
<div id="menu"></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"><h3 id="dlgTitle"></h3><div id="dlgBody"></div><div id="dlgErr"></div><div id="dlgBtns"></div></form></dialog>
<datalist id="isaList"></datalist><datalist id="dtList"></datalist><datalist id="tagList"></datalist><datalist id="routineList"></datalist>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S = { project:null, state:{}, values:{}, chg:"all", kidIdx:null, forces:{}, tabs:[], active:null, sel:null, selInstr:null, progTags:{}, watch:[], ctab:"output",
            output:[], faults:[], minor:[], major:null, diag:null, timers:[], trace:null, ws:null, lastFaultCount:0 };
// browser-remembered settings: keys renamed lsStudio* -> vcs* (old values are carried over once)
function lsGet(k){ try { let v = localStorage.getItem("vcs"+k); if(v===null){ v = localStorage.getItem("lsStudio"+k); if(v!==null){ localStorage.setItem("vcs"+k, v); localStorage.removeItem("lsStudio"+k); } } return v; } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem("vcs"+k, v); } catch(e){} }
try { S.watch = JSON.parse(lsGet("Watch") || "[]"); } catch(e){}
/* Instruction metadata comes from the engine (/api/studio/instructions): the UI
   only draws it, it never implements instruction behaviour. */
const CONTACTS = {XIC:"] [", XIO:"]/["}, COILS = {OTE:"( )", OTL:"(L)", OTU:"(U)"};
S.isa = {}; S.alias = {}; S.catalog = {};
function spec(name){ const n = name.toUpperCase(); return S.isa[n] || S.isa[S.alias[n]] || null; }
function aoiDef(name){ return S.project && (S.project.aois||[]).find(a => a.name.toUpperCase()===name.toUpperCase()); }
function known(name){ return !!spec(name) || !!aoiDef(name); }
async function loadIsa(){
  try { const d = await api("GET","/api/studio/instructions");
        d.instructions.forEach(i => S.isa[i.mnemonic] = i); S.alias = d.aliases || {};
        (d.catalog||[]).forEach(c => S.catalog[c.mnemonic.toUpperCase()] = c); } catch(e){ log("instruction metadata: "+e.message, "err"); }
}

async function api(method, path, body, headers){
  const r = await fetch(path, {method, headers: headers || (body!==undefined ? {"Content-Type":"application/json"} : {}),
                               body: body===undefined ? undefined : (typeof body==="string"||body instanceof ArrayBuffer ? body : JSON.stringify(body))});
  let j = {}; try { j = await r.json(); } catch(e){}
  if(!r.ok){ const err = new Error(j.error || j.detail || r.statusText); err.data = j; err.status = r.status; throw err; }
  return j;
}
// ---- modal dialog: dialog({title, body, buttons:[[label, value, "pri"]], onOpen(d), onSubmit(value, d)})
// onSubmit may return (or resolve to) an error text: the dialog then stays open and shows it.
function dialog(o){
  return new Promise(resolve => {
    const d = $("dlg"), f = $("dlgForm");
    $("dlgTitle").textContent = o.title || "";
    $("dlgBody").innerHTML = o.body || "";
    $("dlgErr").textContent = "";
    $("dlgBtns").innerHTML = (o.buttons || [["OK","ok","pri"]]).map(([l,v,c]) =>
      `<button type="submit" value="${esc(v)}" class="${c||""}">${esc(l)}</button>`).join("");
    f.onsubmit = async (e) => {
      e.preventDefault();
      const v = (e.submitter && e.submitter.value) || "ok";
      if(v !== "cancel" && o.onSubmit){
        let err;
        try { err = await o.onSubmit(v, d); } catch(x){ err = x.message || String(x); }
        if(err){ $("dlgErr").textContent = err; return; }
      }
      if(o.stay && o.stay.includes(v)){ $("dlgErr").innerHTML = `<span class="ok">✔ Applied</span>`; return; }
      d.close(v);
    };
    d.onclose = () => { d.onclose = null; f.onkeydown = null; resolve(d.returnValue || "cancel"); };
    d.returnValue = "";
    /* Enter in a one-line field runs the dialog's main button (not the first one,
       which is Cancel); Ctrl+Enter does it from anywhere, also a description box. */
    const primary = () => $("dlgBtns").querySelector("button.pri") || $("dlgBtns").querySelector('button:not([value="cancel"])');
    f.onkeydown = (e) => {
      if(e.key!=="Enter" || e.isComposing) return;
      const t = e.target, tag = (t.tagName||"").toLowerCase();
      if(tag==="button") return;                                  // Enter on a button presses that button
      if(tag==="textarea" && !e.ctrlKey && !e.metaKey) return;     // new line in a description
      if(t.closest && t.closest("#tbrowse")) return;
      const b = primary(); if(!b) return;
      e.preventDefault(); e.stopPropagation(); b.click();
    };
    d.showModal();
    if(!d.querySelector("#dlgBody input:not([type=checkbox]):not([type=hidden]),#dlgBody select,#dlgBody textarea")){
      // a question without fields: focus the main button, or Cancel for a risky one
      const b = o.danger ? $("dlgBtns").querySelector('button[value="cancel"]') : primary();
      if(b) b.focus();
    }
    if(o.onOpen) o.onOpen(d);
  });
}
function about(){
  const v = (S.project && S.project.version) || "";
  dialog({title:"About VirtualControlStudio", buttons:[["Close","cancel","pri"]], body:
    `<p><b>VirtualControlStudio</b> ${esc(v)}<br>PLC programming and simulation: ladder and Structured Text,
     tags, tasks, a soft controller, and EtherNet/IP, OPC UA and web connections for machine simulators.</p>
     <p class="notice-small">Studio 5000, Logix Designer, RSLogix, ControlLogix, CompactLogix, GuardLogix,
     FactoryTalk and Logix Echo are trademarks of Rockwell Automation, Inc. VirtualControlStudio is an
     independent project and is not affiliated with Rockwell Automation, nor endorsed or sponsored by it.
     It reads and writes the documented L5X project exchange format; it contains no Rockwell software
     or documentation.</p>`});
}
function log(msg, cls){ S.output.push({t:new Date().toLocaleTimeString(), msg, cls}); if(S.output.length>400) S.output.shift(); if(S.ctab==="output") renderConsole(); }

/* ---------- addresses ---------- */
function resolveAddr(prog, op){
  if(!op || op==="?" || /^[-+]?\d/.test(op) || /^S:/i.test(op) || /^['"]/.test(op)) return null;
  const root = (op.match(/^[^.\[]+/)||[op])[0];
  let addr = (prog && S.progTags[prog] && S.progTags[prog].has(root)) ? `Program:${prog}.${op}` : op;
  // an alias shares its base tag's value (and forces): show the base address
  const al = (S.project && S.project.aliases) || {};
  const r2 = (addr.match(/^(Program:[^.]+\.)?[^.\[]+/)||[addr])[0];
  const hit = al[r2] !== undefined ? r2 : (prog && al[`Program:${prog}.${root}`] !== undefined ? `Program:${prog}.${root}` : null);
  if(hit) addr = al[hit] + addr.slice(r2.length);
  return addr;
}
function val(addr){ return addr in S.values ? S.values[addr] : undefined; }
function fmt(v){ if(v===undefined) return "?"; if(typeof v==="boolean") return v?"1":"0"; if(typeof v==="number" && !Number.isInteger(v)) return String(+v.toFixed(5)); if(typeof v==="object") return "{…}"; return String(v); }
function isForced(addr){ return Object.keys(S.forces).some(k => addr===k || addr.startsWith(k+".") || addr.startsWith(k+"[")); }

/* ---------- organizer (built from the imported project, /api/studio/project) ---------- */
S.treeOpen = {};        // node key -> expanded?  (kept across refreshes)
S.treeSel = null;       // key of the selected node
const ICO = {ctrl:"CTL", tags:"TAG", task:"⟳", prog:"PRG", ld:"LD", st:"ST", fbd:"FBD", sfc:"SFC", dt:"DT", aoi:"AOI", io:"I/O", folder:"▤"};
function node(label, opts={}){
  const key = opts.key || label;
  const li = document.createElement("li");
  const d = document.createElement("div"); d.className = "node" + (opts.group ? " grp" : "") + (S.treeSel===key ? " sel" : "");
  d.dataset.key = key;
  const kids = opts.children && opts.children.length ? opts.children : null;
  const open = key in S.treeOpen ? S.treeOpen[key] : !!opts.open;
  d.innerHTML = `<span class="twist">${kids ? (open?"▾":"▸") : ""}</span>${opts.kind?`<span class="ico k-${opts.kind}">${ICO[opts.kind]||""}</span>`:""}<span class="lbl ${opts.dim?"dim":""}">${esc(label)}</span>${opts.badge?` <span class="badge">${esc(opts.badge)}</span>`:""}${opts.desc?` <span class="desc">${esc(opts.desc)}</span>`:""}`;
  d.title = opts.title || label;
  li.appendChild(d);
  let ul = null;
  if(kids){ ul = document.createElement("ul"); ul.className="tree"; ul.hidden = !open; kids.forEach(c=>ul.appendChild(c)); li.appendChild(ul); }
  const toggleOpen = () => { if(!ul) return; ul.hidden = !ul.hidden; S.treeOpen[key] = !ul.hidden; d.firstChild.textContent = ul.hidden?"▸":"▾"; };
  /* Studio style: a click selects (summary in Properties), a double-click or Enter opens;
     Tools > Options can make a single click open, as before. The twist only expands. */
  d._open = opts.onclick || null; d._toggle = toggleOpen; d._ul = ul;
  d.onclick = (e) => {
    if(e.target.classList.contains("twist")){ toggleOpen(); return; }
    treeSelect(d);
    if(opts.onclick && S.orgSingle) opts.onclick();
  };
  d.ondblclick = (e) => {
    e.preventDefault();
    if(e.target.classList.contains("twist")) return;
    if(opts.onclick) opts.onclick(); else toggleOpen();
  };
  return li;
}
S.orgSingle = lsGet("OrgSingle")==="1";
function treeSelect(d){
  document.querySelectorAll("#tree .node.sel").forEach(n=>n.classList.remove("sel")); d.classList.add("sel"); S.treeSel = d.dataset.key;
  if(window.quickView) quickView(d.dataset.key);
}
const rKind = (t) => ({RLL:"ld", ST:"st", FBD:"fbd", SFC:"sfc"}[t] || "ld");
function renderTree(){
  const t = $("tree"); t.innerHTML = "";
  const p = S.project;
  if(!hasProject()){ t.appendChild(node("No project — New, Open or Import L5X", {dim:true})); return; }
  const progNode = (pr, task) => node(pr.name, {key:"p:"+pr.name, kind:"prog", title: (pr.description||pr.name) + (pr.disabled?" (disabled: not executed)":""), open:true, dim: pr.disabled,
      badge: pr.disabled ? "disabled" : "", onclick:()=>openProgram(pr, task), children:[
      node("Parameters and Local Tags", {key:"pt:"+pr.name, kind:"tags", badge: pr.tags ? String(pr.tags) : "", onclick:()=>openTags(pr.name)}),
      ...pr.routines.map(r => node(r.name, {key:`r:${pr.name}/${r.name}`, kind:rKind(r.type), dim:!r.simulated,
           badge: !r.simulated ? "not simulated" : (r.main ? "main" : ""), desc: r.rungs!=null ? `${r.rungs} rungs` : "",
           title: `${r.name} — ${r.type==="RLL"?"Ladder Diagram":r.type==="ST"?"Structured Text":r.type}${r.main?" (main routine)":""}`,
           onclick:()=>openRoutine(pr.name, r.name)}))]});
  t.appendChild(node(`Controller ${p.controller.name}`, {key:"ctrl", kind:"ctrl", group:true, open:true, title:p.controller.description||p.controller.name,
    onclick:()=>openController(), children:[
    node("Controller Tags", {key:"ctags", kind:"tags", onclick:()=>openTags("controller")}),
  ]}));
  t.appendChild(node("Tasks", {key:"tasks", kind:"folder", group:true, open:true, children: p.tasks.map(tk => node(tk.name, {key:"t:"+tk.name, kind:"task",

const editTabId = () => S.edit ? `r:${S.edit.prog}/${S.edit.routine}` : null;
/* An open rung / ST edit lives in its routine tab. Closing that tab, or showing
   another routine in its place, asks first: Finalize, Discard or keep editing. */
async function leaveEdit(nextId, closing){
  const id = editTabId();
  if(!id || (!closing && (nextId===id || !String(nextId||"").startsWith("r:")))) return true;
  if(closing && nextId!==id) return true;
  const E = S.edit, can = E.st ? (E.checked && E.valid) : (E.checked && E.valid);
  const a = await dialog({title:"Unfinished edit", body:`<p>${E.st?"The Structured Text":`Rung ${E.index}`} of <b>${esc(E.prog)}/${esc(E.routine)}</b> is being edited.</p>${can?"":`<p class="wrn">It has errors, so it cannot be finalized yet.</p>`}`,
    buttons:[["Keep editing","cancel"],["Discard","discard"], ...(can ? [["Finalize","ok","pri"]] : [])]});
  if(a==="discard"){ S.edit = null; return true; }
  if(a==="ok"){ const was = S.active; S.active = id; renderTabs(); if(E.st) await stFinalize(); else await finalize(); return !S.edit; }
  if(S.active!==id){ S.active = id; renderTabs(); renderDoc(); }
  return false;
}
function openTab(id, title, render){
  if(S.edit && S.active===editTabId() && id!==S.active && id.startsWith("r:")){
    leaveEdit(id).then(ok => { if(ok) openTab(id, title, render); }); return;
  }
  if(!S.tabs.find(t=>t.id===id)) S.tabs.push({id, title, render});
  if(S.active && S.active!==id) saveTabState(S.active);
  S.active = id; renderTabs(); renderDoc();
}
async function closeTab(id){
  if(!(await leaveEdit(id, true))) return;
  const i = S.tabs.findIndex(t=>t.id===id); if(i<0) return;
  if(S.active===id){ const nb = S.tabs[i+1] || S.tabs[i-1]; S.active = nb ? nb.id : null; }
  S.tabs.splice(i, 1);
  renderTabs(); renderDoc();
}
async function activateTab(id){
  if(id===S.active) return;
  if(S.edit && S.active===editTabId() && id.startsWith("r:") && !(await leaveEdit(id))) return;
  saveTabState(S.active);
  S.active = id; renderTabs(); renderDoc();
}
/* scroll position (and ladder caret) per tab, restored after the tab renders again */
S.tabState = {};
function saveTabState(id){ if(!id) return; const t = S.tabs.find(x=>x.id===id); if(!t) return;
  S.tabState[id] = {scroll: $("doc").scrollTop, left: $("doc").scrollLeft}; }
function restoreTabState(id){ const st = S.tabState[id]; if(!st) return;
  const doc = $("doc"); doc.scrollTop = st.scroll; doc.scrollLeft = st.left; }
function renderTabs(){
  $("tabs").innerHTML = S.tabs.map(t=>`<div class="tab ${t.id===S.active?"act":""}" data-id="${esc(t.id)}" title="${esc(t.tip||t.title)}">${esc(t.title)}${editTabId()===t.id?" *":""} <span class="x" data-x="${esc(t.id)}" title="Close (Ctrl+Shift+F4)">✕</span></div>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(el => {
    el.onclick = (e) => { if(e.target.dataset.x){ closeTab(e.target.dataset.x); return; } activateTab(el.dataset.id); };
    el.onauxclick = (e) => { if(e.button===1){ e.preventDefault(); closeTab(el.dataset.id); } };
    el.onmousedown = (e) => { if(e.button===1) e.preventDefault(); };
    el.oncontextmenu = (e) => { e.preventDefault(); if(window.tabMenu) tabMenu(e, el.dataset.id); };
  });
}

/* Tag table: Name, Value, Description, Data Type by default; more columns on demand.
   Rows are keyed by their tag address (data-addr), so sorting, filtering and live
   updates never move a value to another tag. */
const EXTRA_COLS = [["force","Force"],["alias","Alias For"],["access","External Access"],["constant","Constant"],["units","Units"],["address","Address"]];
S.moreCols = lsGet("MoreCols")==="1";
S.tagMode = {};      // scope -> "monitor" | "edit"
function openTags(scope, filter, mode){
  const id = "tags:"+scope;
  if(mode) S.tagMode[scope] = mode;
  if(S.active===id && mode){ renderDoc(); return; }
  openTab(id, scope==="controller" ? "Controller Tags" : `Program Tags - ${scope}`, async (doc) => {

    const st = {defs:d.tags, open:new Set(), limit:{}, filter: filter || "", sort:"name", dir:1, cells:new Map(), needDesc:new Set()};
    const head = () => `<tr><th class="sort" data-sort="name" style="width:28%">Name${arrow("name")}</th><th style="width:16%">Value</th><th class="sort" data-sort="description">Description${arrow("description")}</th><th class="sort" data-sort="type" style="width:14%">Data Type${arrow("type")}</th>${S.moreCols?EXTRA_COLS.map(([k,l])=>`<th class="sort" data-sort="${k}">${l}${arrow(k)}</th>`).join(""):""}</tr>`;
    const arrow = (k) => st.sort===k ? (st.dir>0?" ▲":" ▼") : "";
    doc.innerHTML = `<div class="tagtools">${tagModeSwitch(scope, "monitor")}<input id="tfilter" placeholder="Filter by name or description…" value="${esc(st.filter)}"><span class="dim" id="tcount"></span>
      <span class="dim">Select a BOOL and press <b>Ctrl+T</b> to toggle · Enter writes a value · right-click to force</span>
      <button id="tcols" class="colbtn">${S.moreCols?"Hide Extra Columns":"Show More Columns"}</button></div>
      <table class="tagtable"><thead id="thead">${head()}</thead><tbody id="tbody"></tbody></table>`;
    $("tfilter").oninput = (e) => { st.filter = e.target.value; draw(); };
    bindTagModeSwitch(scope);
    $("tcols").onclick = () => { S.moreCols = !S.moreCols; lsSet("MoreCols", S.moreCols?"1":"0");
                                 $("tcols").textContent = S.moreCols?"Hide Extra Columns":"Show More Columns"; $("thead").innerHTML = head(); draw(); };
    const typeOf = (v) => typeof v==="boolean" ? "BOOL" : (typeof v==="number" ? (Number.isInteger(v)?"DINT":"REAL") : (typeof v==="string"?"STRING":""));
    const kids = (addr) => kidsOf(addr);
    function row(addr, label, depth, def, ro, cst){
      ro = false;          // the programming application has full access regardless of External Access
      cst = !!(cst || (def && def.constant));
      const leaf = addr in S.values, v = S.values[addr], forced = isForced(addr);
      const ks = leaf ? [] : kids(addr);
      const exp = ks.length ? `<span class="exp" data-exp="${esc(addr)}">${st.open.has(addr)?"−":"+"}</span>` : `<span class="exp"></span>`;
      let cell = "";
      if(leaf){
        const ca = cst ? ` data-const="1"` : "";
        if(typeof v==="boolean") cell = `<button class="boolbtn ${v?"on":""}" data-tog="${esc(addr)}"${ca} title="${cst?"constant tag — changing it asks for confirmation":"click or Ctrl+T to toggle"}">${v?1:0}</button>`;
        else if(typeof v==="string") cell = `<input class="numin strin" data-set="${esc(addr)}"${ca} value="${esc(v)}" title="${esc(v)}">`;
        else cell = `<input class="numin" data-set="${esc(addr)}"${ca} value="${esc(fmt(v))}">`;
        if(cst) cell += `<span class="cst" title="Constant tag: logic cannot change it; changes here are confirmed and logged">🔒</span>`;
      } else cell = `<span class="dim" title="${ks.length} elements / members — expand with +">{…}</span>`;
      const typ = def ? def.type + (def.dims&&def.dims.length ? `[${def.dims.join(",")}]` : (def.dim?`[${def.dim}]`:"")) : typeOf(v);
      let desc = def ? def.description || "" : "", pass = false;
      if(!def){ const pd = S.passDesc[addr]; if(pd===undefined) st.needDesc.add(addr); else { desc = pd; pass = true; } }
      let html = `<tr data-addr="${esc(addr)}" class="${forced?"forced":""} ${S.sel===addr?"sel":""}"><td style="padding-left:${8+depth*16}px" title="${esc(addr)}">${exp}${esc(label)}</td><td class="v">${cell}</td><td class="desc dim ${pass?"pass":""}" title="${esc(desc)}${pass?" (pass-through description)":""}">${esc(desc)}</td><td class="typ dim">${esc(typ)}</td>`;
      if(S.moreCols) html += `<td>${forced?"<b>forced</b>":""}</td><td class="dim">${esc(def&&def.alias_for||"")}</td><td class="dim">${esc(def?({rw:"Read/Write",ro:"Read Only",none:"None"}[def.access]||def.access||""):"")}</td><td class="dim">${def&&def.constant?"✔":""}</td><td class="dim">${esc(def&&def.units||"")}</td><td class="dim typ">${esc(addr)}</td>`;
      html += `</tr>`;
      if(st.open.has(addr)){
        const lim = st.limit[addr] || KID_PAGE;
        ks.slice(0, lim).forEach(k => { html += row(k, k.slice(addr.length).replace(/^\./,""), depth+1, null, ro, cst); });
        if(ks.length > lim) html += `<tr class="more"><td colspan="${S.moreCols?10:4}" style="padding-left:${24+depth*16}px"><a href="#" data-more="${esc(addr)}">Show ${Math.min(KID_PAGE, ks.length-lim)} more of ${ks.length-lim} remaining…</a></td></tr>`;
      }
      return html;
    }
    const sortKey = (t, k) => k==="name" ? t.name.toLowerCase() : k==="type" ? t.type : k==="description" ? (t.description||"").toLowerCase()
                            : k==="force" ? (isForced(t.address)?0:1) : k==="alias" ? (t.alias_for||"") : k==="address" ? t.address : (t[k]||"");
    function draw(){
      const f = st.filter.toLowerCase();
      const defs = st.defs.filter(t => !f || t.name.toLowerCase().includes(f) || (t.description||"").toLowerCase().includes(f))
                          .sort((a,b) => { const x = sortKey(a, st.sort), y = sortKey(b, st.sort); return (x<y?-1:x>y?1:0) * st.dir; });
      $("tcount").textContent = `${defs.length} tags`;
      const body = $("tbody"); if(!body) return;
      body.innerHTML = defs.map(t => row(t.alias_for ? t.alias_for_address || t.address : t.address, t.name, 0, t, t.access==="ro")).join("");
      st.cells = new Map(); body.querySelectorAll("[data-set],[data-tog]").forEach(el => st.cells.set(el.dataset.set || el.dataset.tog, el));
      st.keyVer = S.keyVer;
      if(st.needDesc.size){                        // pass-through descriptions of members/elements
        const want = [...st.needDesc]; st.needDesc = new Set();
        want.forEach(a => S.passDesc[a] = "");
        api("POST", "/api/studio/passthrough", {addresses: want}).then(r => {
          let any = false; for(const [a, t] of Object.entries(r.descriptions||{})){ S.passDesc[a] = t; if(t) any = true; }
          if(any && $("tbody")) draw(); }).catch(()=>{});
      }
    }
    /* live values: change only the cells whose value changed (a full redraw only when the tag list itself changed) */
    function update(chg){
      const ae = document.activeElement;
      if(chg==="all" || S.keyVer!==st.keyVer){
        if(ae && ae.dataset && ae.dataset.set && $("tbody") && $("tbody").contains(ae)){ st.redraw = true; return; }   // typing: redraw later
        return draw();
      }
      if(st.redraw && !(ae && ae.dataset && ae.dataset.set)){ st.redraw = false; return draw(); }
      for(const k of chg){
        const el = st.cells.get(k); if(!el || el===ae) continue;
        const v = S.values[k];
        if(el.dataset.tog!==undefined){ el.classList.toggle("on", !!v); el.textContent = v ? 1 : 0; }
        else { const t = typeof v==="string" ? v : fmt(v); if(el.value!==t) el.value = t; }
      }
    }
    doc.onclick = (e) => {
      const th = e.target.closest("th.sort"); if(th){ const k = th.dataset.sort; st.dir = st.sort===k ? -st.dir : 1; st.sort = k; $("thead").innerHTML = head(); draw(); return; }
      const ex = e.target.dataset.exp; if(ex){ st.open.has(ex)?st.open.delete(ex):st.open.add(ex); draw(); return; }
      const more = e.target.dataset.more; if(more){ e.preventDefault(); st.limit[more] = (st.limit[more] || KID_PAGE) + KID_PAGE; draw(); return; }
      const tg = e.target.dataset.tog; if(tg){ S.selInstr = null; select(tg); toggleSelected(); return; }
      const tr = e.target.closest("tr[data-addr]"); if(tr){ S.selInstr = null; select(tr.dataset.addr); doc.querySelectorAll("tr.sel").forEach(r=>r.classList.remove("sel")); tr.classList.add("sel"); }
    };
    doc.onkeydown = async (e) => { if(e.key==="Enter" && e.target.dataset.set){
      if(e.target.dataset.const){
        e.preventDefault();                         // the Enter must not also answer the dialog
        await new Promise(r => setTimeout(r, 0));
        if(!(await confirmConstant(e.target.dataset.set, e.target.value))) return;
      }
      write(e.target.dataset.set, e.target.value); } };
    doc.oncontextmenu = (e) => { const tr = e.target.closest("tr[data-addr]"); if(tr){ e.preventDefault(); tagMenu(e, tr.dataset.addr); } };
    draw();
    S.live = (chg) => update(chg || "all");
  });
}
/* members / elements of a structure or array tag, from an index built once per tag list
   (scanning every value for every row froze the page on large projects) */
const KID_PAGE = 500;
function kidIndex(){
  if(S.kidIdx) return S.kidIdx;
  const idx = new Map(), seg = /\.[^.\[]+|\[[\d,]+\]/g;
  for(const k in S.values){
    const root = k.match(/^(Program:[^.]+\.)?[^.\[]+/); if(!root) continue;
    let cur = root[0]; seg.lastIndex = cur.length; let m;
    while((m = seg.exec(k))){
      const child = cur + m[0];
      let set = idx.get(cur); if(!set){ set = new Set(); idx.set(cur, set); }
      set.add(child); cur = child;
    }
  }
  S.kidIdx = idx; S.kidSorted = new Map();
  return idx;
}
function kidsOf(addr){
  const idx = kidIndex();
  if(S.kidSorted.has(addr)) return S.kidSorted.get(addr);
  const set = idx.get(addr); if(!set) return [];
  const ix = (x) => { const m = x.match(/\[([\d,]+)\]$/); return m ? m[1].split(",").map(Number) : null; };
  const out = [...set].sort((a,b)=>{ const na=ix(a), nb=ix(b); if(!na||!nb) return 0;
    for(let i=0;i<Math.min(na.length,nb.length);i++){ if(na[i]!==nb[i]) return na[i]-nb[i]; } return na.length-nb.length; });
  S.kidSorted.set(addr, out); return out;
}

/* ---------- ladder: monitoring + editing ----------
   The rung text in the engine's routine is the single program model. The editor
   edits a copy of one rung (a tree), the server validates it (validation.py)
   and, on Finalize, the edit service applies it at a scan boundary
   (editing.py). Nothing here executes logic. */
const PALETTE = [["XIC","Examine if closed"],["XIO","Examine if open"],["ONS","One shot"],["OTE","Output energize"],["OTL","Output latch"],["OTU","Output unlatch"],
                 ["TON","Timer on delay"],["TOF","Timer off delay"],["CTU","Count up"],["RES","Reset"],["EQU","Equal"],["GRT","Greater than"],["MOV","Move"],["ADD","Add"]];
S.R = null;          // open routine view: {prog, routine, data, doc}
S.edit = null;       // rung being edited / inserted
let nextNode = 1;

function isInputNode(n){ if(n.kind==="branch") return n.legs.every(l => l.every(isInputNode)); const sp = spec(n.name); return sp ? !!sp.input : false; }
function isOutputNode(n){ if(n.kind==="branch") return n.legs.length>0 && n.legs.every(l => l.length>0 && l.every(isOutputNode)); return !isInputNode(n); }
function tailStart(items){            // index where the right-justified output tail begins
  let k = items.length;
  while(k>0 && isOutputNode(items[k-1])) k--;
  return k;
}

async function openRoutine(prog, routine){

  openTab(`r:${prog}/${routine}`, `${prog} - ${routine}`, async (doc) => {

    S.R = {prog, routine, data:r, doc};

    if(r.type==="ST"){ renderST(); return; }
    renderLadder();
  });
}

/* ----- monitoring render ----- */
function renderLadder(){
  const r = S.R.data, doc = S.R.doc;
  const wrap = document.createElement("div"); wrap.className = "ladder" + (S.edit ? " editing" : "") + (S.R.data.rungs.length > 60 ? " big" : "");
  const dyn = []; const flows = [];
  wrap.innerHTML = routineHeader(r);
  const n = r.rungs.length;
  const addBar = (at) => { if(r.editable && !S.edit) wrap.appendChild(insertBar(at)); };
  for(let i=0; i<=n; i++){
    if(S.edit && S.edit.mode==="insert" && S.edit.index===i) wrap.appendChild(editorRung());
    else addBar(i);
    if(i===n) break;
    if(S.edit && S.edit.mode==="edit" && S.edit.index===i){
      wrap.appendChild(editorRung());
      /* the original rung stays in view (and live) under the edited copy until Finalize */
      const orig = monitorRung(r.rungs[i], dyn, flows); orig.classList.add("orig");
      orig.title = "The rung as it runs now. It is replaced when you finalize the edit above.";
      const num = orig.querySelector(".rnum"); if(num) num.insertAdjacentHTML("afterbegin", `<span class="rmark" title="original rung (replaced on Finalize)">r</span>`);
      wrap.appendChild(orig); continue; }
    wrap.appendChild(monitorRung(r.rungs[i], dyn, flows));
  }
  if(n===0 && r.editable && !S.edit){
    const ph = document.createElement("div"); ph.className = "rung placeholder";
    ph.innerHTML = `<div class="rnum">0</div><div class="rline"><span>(empty rung) — double-click, press Enter or Ctrl+R to add logic</span></div>`;
    wrap.appendChild(ph);
  }
  const end = document.createElement("div"); end.className = "rung endrung";
  end.innerHTML = `<div class="rnum"></div><div class="rline endline"><span>(End)</span></div>`;
  if(r.editable && !S.edit) end.ondblclick = () => startInsert(n);
  wrap.appendChild(end);
  doc.innerHTML = ""; doc.appendChild(wrap);
  bindHeader();
  if(S.flash!=null){ const f = wrap.querySelector(`.rung[data-n="${S.flash}"]`); if(f){ f.classList.add("flash"); f.scrollIntoView({block:"nearest"}); } S.flash = null; }
  /* large routines: only rungs on screen are painted (IntersectionObserver) */
  if(S.rungObs) S.rungObs.disconnect();
  const vis = S.visRungs = new Set();
  const byRung = new Map();
  for(const d of dyn){ if(d.rung===undefined) continue; if(!byRung.has(d.rung)) byRung.set(d.rung, []); byRung.get(d.rung).push(d); }
  const flowBy = new Map(flows.map(f => [f.rung, f]));
  const paintSome = (ns) => { const ds = [], fs = []; ns.forEach(n => { (byRung.get(n)||[]).forEach(d=>ds.push(d)); if(flowBy.has(n)) fs.push(flowBy.get(n)); }); paintLadder(ds, fs); };
  if("IntersectionObserver" in window && n > 60){
    S.rungObs = new IntersectionObserver((entries) => {
      const shown = [];
      for(const e of entries){ const k = +e.target.dataset.n; if(e.isIntersecting){ vis.add(k); shown.push(k); } else vis.delete(k); }
      if(shown.length) paintSome(shown);
    }, {root: doc, rootMargin: "300px 0px"});
    wrap.querySelectorAll(".rung[data-n]").forEach(el => S.rungObs.observe(el));
    S.live = () => paintSome([...vis]);
  } else {
    S.live = () => { paintLadder(dyn, flows); };
    paintLadder(dyn, flows);
  }
  if(S.edit) bindEditor();
  if(window.lxAfterRender) lxAfterRender();
}
function insertBar(at){
  const b = document.createElement("div"); b.className = "insbar"; b.dataset.at = at;
  b.innerHTML = `<span>+ Insert rung ${at}</span>`;
  b.title = `Insert a new rung at position ${at}`;
  b.onclick = () => startInsert(at);
  return b;

function monitorRung(rung, dyn, flows){
  const rd = document.createElement("div"); rd.className = "rung"; rd.dataset.n = rung.n;
  rd.innerHTML = `<div class="rnum ${rung.error?"err":""}" title="${esc(rung.text)}">${rung.n}</div>`;
  dyn.push({el: rd, kind:"rung", rung: rung.n, text: rung.text});
  const body = document.createElement("div");
  if(rung.comment) body.innerHTML = `<div class="rcomment" title="Rung comment">${esc(rung.comment)}</div>`;
  if(rung.error){ body.innerHTML += `<div class="notice warn">Cannot draw this rung: ${esc(rung.error)}<br><code>${esc(rung.text)}</code></div>`; }
  else {
    const line = document.createElement("div"); line.className="rline";
    const model = {};
    line.appendChild(series(rung.tree, {prog:S.R.prog, rn:rung.n, dyn, top:true}, model));
    flows.push({rung:rung.n, model, line});
    body.appendChild(line);
  }
  rd.appendChild(body);
  return rd;
}
/* series(): builds the DOM for one series of a rung (monitor or editor) and a
   model {wires, nodes} used to paint power flow. */
function series(items, c, model){
  const s = document.createElement("div"); s.className = "series" + (c.top ? " top" : "");
  model.wires = []; model.nodes = [];
  const tail = tailStart(items);                       // outputs (also inside branch levels) are pushed against the right
  /* a last branch whose levels end in outputs stretches to the right rail instead (its
     levels then push their own outputs right), as Logix Designer draws it */
  const endsOut = (n) => n.kind==="branch" ? n.legs.some(l => l.length && endsOut(l[l.length-1])) : isOutputNode(n);
  const growBr = tail===items.length && items.length>0 && items[items.length-1].kind==="branch" && endsOut(items[items.length-1]);
  const lk = c.lk || "T";                               // edit mode: every wire is an insertion point
  const mkWire = (grow) => { const w = document.createElement("div"); w.className = "wire" + (grow ? " grow" : ""); if(c.edit) w.dataset.ip = `${lk}:${model.wires.length}`; model.wires.push(w); return w; };
  s.appendChild(mkWire(items.length===0 || tail===0));
  items.forEach((it, k) => {
    if(it.kind==="branch"){
      const sub = {kind:"branch", legs:[]};
      const be = branchEl(it, c, sub); if(growBr && k===items.length-1) be.classList.add("grow");
      s.appendChild(be); model.nodes.push(sub);
    } else {
      s.appendChild(instrEl(it, c)); model.nodes.push({kind:"instr", iid: it.id, input: isInputNode(it), nid: it._id});
    }
    const last = k===items.length-1;
    s.appendChild(mkWire(!growBr && (k===tail-1 || (tail===items.length && last))));
  });
  if(c.edit && !c.top && items.length===0){
    s.classList.add("emptyleg");
  }
  return s;
}
function branchEl(b, c, model){
  const d = document.createElement("div"); d.className="branch";
  if(c.edit){ d.dataset.nid = b._id; if(S.edit.sel && S.edit.sel.id===b._id) d.classList.add("selb"); }
  b.legs.forEach((l, li) => {
    const m = {}; const leg = series(l, {...c, top:false, lk:`${b._id}:${li}`}, m); model.legs.push(m);
    if(c.edit){
      leg.dataset.leg = `${b._id}:${li}`;
      if(S.edit.sel && S.edit.sel.leg===b._id && S.edit.sel.li===li) leg.classList.add("selleg");
    }
    d.appendChild(leg);
  });
  return d;
}
function aoiAddr(prog, op){
  // inside an AOI definition the operands are parameters of an instance we don't know
  return prog.startsWith("AOI:") ? null : resolveAddr(prog, op);
}
function instrEl(it, c){
  const prog = c.prog, name = it.name.toUpperCase(), el = document.createElement("div");
  const sp = spec(name), aoi = sp ? null : aoiDef(name);
  const cat = S.catalog[name];
  el.className = "ins" + (known(name) ? "" : " unsup") + (sp && sp.status==="boundary" ? " bound" : "");
  if(!c.edit) el.dataset.iid = it.id;
  const a0 = c.edit ? null : aoiAddr(prog, it.args[0]);
  el.dataset.addr = a0 || "";
  const issues = c.edit ? (S.edit.byNode[it._id] || []) : [];
  const opIssue = (k) => issues.find(x => x.operand===k);
  const title = sp ? sp.title : (aoi ? (aoi.description || "Add-On Instruction") : (cat ? (cat.title||cat.reason) : "unknown instruction"));
  let tip = `${it.name} — ${title}`;
  if(sp) tip += "\n" + sp.operands.map((o,k)=>`${o.name}: ${it.args[k] ?? "(missing)"}`).join("\n");
  if(issues.length) tip += "\n\n" + issues.map(x=>`${x.severity==="error"?"✖":"⚠"} ${x.message}`).join("\n");
  el.title = tip;
  if(CONTACTS[name] || COILS[name]){
    const iss = opIssue(0);
    const cls = iss ? (iss.kind==="unknown_tag" ? "opwarn" : "operr") : "";
    el.innerHTML = `<span class="tagn ${cls}" data-k="0">${iss && iss.kind==="unknown_tag" ? "⚠ " : ""}${esc(it.args[0] || "?")}</span><span class="sym">${CONTACTS[name]||COILS[name]}</span><span class="val"></span>`;
    if(!c.edit) c.dyn.push({el, kind:"bit", addr:a0, iid:it.id, rung:c.rn});
  } else {
    const rows = sp ? boxRows(sp, it.args, c.edit ? "AOI:" : prog) : aoi ? aoiRows(aoi, it.args, c.edit ? "AOI:" : prog) : it.args.map((a,i)=>[`Operand ${i+1}`, a, null]);
    if(c.edit && sp){                                   // in the editor show every operand, flag missing ones
      sp.operands.forEach((o,k) => { if(k>=it.args.length && !o.optional && !o.repeat) rows.push([o.name, "?", null, k]); });
    }
    const bits = !c.edit && sp && sp.display && sp.display.bits ? sp.display.bits : [];
    const bitBase = sp && sp.display && sp.display.bits_op ? aoiAddr(prog, it.args[sp.display.bits_op]) : a0;
    const flag = known(name) ? (sp && sp.status==="boundary" ? '<span class="wrn" title="simulation boundary: accepted, no effect">boundary</span>' : (aoi ? '<span class="dim">AOI</span>' : ""))
                             : `<span class="err">${cat ? "not executed" : "unknown"}</span>`;
    const opIdx = (label, r) => { if(r.length>3) return r[3]; if(!sp) return null; const k = sp.operands.findIndex(o=>o.name===label); return k<0?null:k; };
    const btt = sp ? sp.title : aoi ? (aoi.description || "Add-On Instruction") : "";
    el.innerHTML = `<div class="box"><div class="bt"><span>${esc(it.name)}</span><span class="btt">${esc(btt.length > 28 ? btt.slice(0, 27) + "…" : btt)}</span>${flag}</div>${rows.map(r=>{
        const k = opIdx(r[0], r), iss = k!=null ? opIssue(k) : null;
        const cls = iss ? (iss.kind==="unknown_tag" ? "opwarn" : "operr") : "";
        return `<div class="br"${k!=null?` data-k="${k}"`:""}><span>${esc(r[0])}</span><span class="${cls}" title="${esc(iss ? iss.message : r[1])}">${iss&&iss.kind==="unknown_tag"?"⚠ ":""}${esc(r[1])}</span><b class="lv" data-a="${esc(c.edit?"":(r[2]||""))}"></b></div>`; }).join("")}${bits.length?`<div class="bits">${bits.map(b=>`<span class="bit" data-b="${esc(b)}">${esc(b)}</span>`).join("")}</div>`:""}</div>`;
    if(!c.edit){
      c.dyn.push({el, kind:"box", addr:a0, bitBase, iid:it.id, rung:c.rn, name});
      el.querySelectorAll(".lv[data-a]").forEach(x => { if(x.dataset.a) c.dyn.push({el:x, kind:"num", addr:x.dataset.a, rung:c.rn}); });
    }
  }
  if(c.edit){
    el.dataset.nid = it._id;
    if(issues.some(x=>x.severity==="error" && (x.operand==null || ["unknown_instruction","language","operand_count","structure"].includes(x.kind)))) el.classList.add("insbad");
    else if(issues.some(x=>x.severity==="error")) el.classList.add("insopbad");
    else if(issues.length) el.classList.add("inswarn");
    if(S.edit.sel && S.edit.sel.id===it._id) el.classList.add("sel");
    el.onclick = (e) => { e.stopPropagation(); S.edit.sel = {id: it._id}; S.edit.ip = null; renderEditor(); };
    return el;
  }
  // click, double-click and right-click on monitored instructions: js/ladder.js (selection, caret, menus)
  if(name==="JSR" || name==="FOR") el.querySelector(".bt span").ondblclick = (e) => { e.stopPropagation(); openRoutine(prog, it.args[0]); };
  return el;
}
function liveAddr(prog, op){
  if(op==null || op==="" || op==="?" || /^[-+]?\d/.test(op)) return null;
  const a = aoiAddr(prog, op);
  if(!a) return null;
  if(/\[[^\]]*[A-Za-z_][^\]]*\]/.test(a)) return null;      // indirect subscript: not static
  return a;
}
function boxRows(sp, args, prog){
  const rows = [], d = sp.display || {}, a0 = aoiAddr(prog, args[0]);
  const ops = sp.operands || [];
  const opKind = (i) => (ops[Math.min(i, ops.length-1)] || {}).kind || "src";
  const live = (i) => ["label","routine","imm","expr","elem"].includes(opKind(i)) ? null : liveAddr(prog, args[i]);
  if(d.rows){
    for(const [label, x] of d.rows){
      if(typeof x==="number"){ if(x < args.length) rows.push([label, args[x] ?? "", live(x)]); }
      else if(typeof x==="string" && /^\d*\./.test(x)){          // ".PRE" = member of operand 0, "3.LEN" = of operand 3
        const k = x.indexOf("."), i = k ? parseInt(x.slice(0, k), 10) : 0, base = aoiAddr(prog, args[i]);
        if(base) rows.push([label, "", base + x.slice(k)]);
      }
      else if(x==="*in" || x==="*ret"){
        const n = parseInt(args[1]||"0", 10) || 0, ps = args.slice(2);
        (x==="*in" ? ps.slice(0, n) : ps.slice(n)).forEach(p => rows.push([label, p, liveAddr(prog, p)]));
      }
    }
    return rows;
  }
  return args.map((a,i)=>[(ops[Math.min(i, ops.length-1)]||{}).name || `Operand ${i+1}`, a, live(i)]);
}
function aoiRows(aoi, args, prog){
  const inst = aoiAddr(prog, args[0]);
  const rows = [[aoi.name, args[0] || "", null, 0]];
  aoi.call.forEach((pname, i) => rows.push([pname, args[i+1] ?? "?", liveAddr(prog, args[i+1]), i+1]));
  aoi.parameters.filter(p => p.visible && !p.required && p.usage!=="InOut" && !["EnableIn","EnableOut"].includes(p.name))
     .forEach(p => rows.push([p.name, "", inst ? inst+"."+p.name : null]));
  return rows;
}
function paintLadder(dyn, flows){
  const tr = S.trace && S.traceFor && S.trace.program===S.traceFor.prog && S.trace.routine===S.traceFor.routine ? S.trace.rungs : [];
  const errs = (S.trace && S.trace.errors) || {};
  for(const d of dyn){
    if(d.kind==="rung"){
      const num = d.el.firstChild, e = errs[String(d.rung)];
      num.classList.toggle("err", !!e); num.title = e ? `${d.text}\n\n${e}` : d.text;
      d.el.classList.toggle("skipped", tr.length > d.rung && tr[d.rung]===null);
      continue;
    }
    if(d.kind==="num"){ const v = val(d.addr); const t = v===undefined || (typeof v==="object") ? "" : typeof v==="string" ? `'${v}'` : (window.fmtS ? fmtS(d.addr, v) : fmt(v)); if(d.el.textContent!==t) d.el.textContent = t; continue; }
    const on = !!(tr[d.rung] && tr[d.rung][d.iid]);
    d.el.classList.toggle("on", on);
    const fz = !!d.addr && isForced(d.addr);
    d.el.classList.toggle("forced", fz);
    if(d.kind==="bit" || d.kind==="box"){
      let mk = d.el.querySelector(":scope > .fmark");
      if(fz){
        if(!mk){ mk = document.createElement("span"); mk.className = "fmark"; d.el.appendChild(mk); }
        const fv = S.forces[d.addr];
        mk.textContent = (S.forcesEnabled !== false ? "▶" : "▷") + (typeof fv==="boolean" ? (fv?"ON":"OFF") : fv!==undefined ? fmt(fv) : "");
        mk.classList.toggle("off", S.forcesEnabled === false);
        mk.title = S.forcesEnabled !== false ? "forced (forces enabled)" : "force installed, but I/O forces are disabled";
      } else if(mk) mk.remove();
    }
    if(d.kind==="bit"){ const v = val(d.addr); const s = d.el.querySelector(".val"); if(s) s.textContent = v===undefined ? "" : fmt(v); }
    if(d.kind==="box" && d.bitBase){ d.el.querySelectorAll(".bit").forEach(b => b.classList.toggle("on", !!val(d.bitBase+"."+b.dataset.b))); }
  }
  // power flow: a wire is energized when the rung condition reaching it is true
  const running = ((S.state||{}).mode||"") !== "PROGRAM";
  for(const f of flows){
    const hl = tr[f.rung];
    const live = running && Array.isArray(hl);
    f.line.classList.toggle("energized", live);
    const flow = (m, p) => {
      if(m.wires[0]) m.wires[0].classList.toggle("pf", live && p);
      m.nodes.forEach((nd, k) => {
        if(nd.kind==="instr") p = nd.input ? (p && !!(hl && hl[nd.iid])) : p;
        else p = nd.legs.map(l => flow(l, p)).some(Boolean);
        if(m.wires[k+1]) m.wires[k+1].classList.toggle("pf", live && p);
      });
      return p;
    };
    flow(f.model, true);
  }
}

/* ----- editing ----- */
function cloneTree(tree){
  return tree.map(n => n.kind==="branch" ? {kind:"branch", _id: nextNode++, legs: n.legs.map(cloneTree)}
                                         : {kind:"instr", _id: nextNode++, name: n.name, args: [...n.args]});
}
function serialize(items){
  return items.map(n => n.kind==="branch" ? "[" + n.legs.map(serialize).join(",") + "]"
                                          : n.name + "(" + n.args.join(",") + ")").join("");
}
function instrOrder(items, out=[]){ items.forEach(n => n.kind==="branch" ? n.legs.forEach(l=>instrOrder(l,out)) : out.push(n)); return out; }
function findNode(id, items=S.edit.tree, parent=null){
  for(let k=0; k<items.length; k++){
    const n = items[k];
    if(n._id===id) return {node:n, list:items, index:k, parent};
    if(n.kind==="branch") for(let li=0; li<n.legs.length; li++){ const r = findNode(id, n.legs[li], {branch:n, li}); if(r) return r; }
  }
  return null;
}
/* undo inside the rung editor: snapshots of the edited rung (Ctrl+Z / Ctrl+Y) */
function edPush(){
  const E = S.edit; if(!E || E.st) return;
  (E.hist ||= []).push(JSON.stringify({tree:E.tree, text:E.text, comment:E.comment, textMode:E.textMode}));
  if(E.hist.length > 200) E.hist.shift();
  E.redoStack = [];
}
function edRestore(snap){ const E = S.edit, o = JSON.parse(snap); E.tree = o.tree; E.text = o.text; E.comment = o.comment; E.textMode = o.textMode; E.sel = null; renderEditor(); scheduleValidate(0, true); }
function edUndo(){ const E = S.edit; if(!E || !(E.hist && E.hist.length)){ log("Nothing to undo in this rung edit", "wrn"); return; }
  (E.redoStack ||= []).push(JSON.stringify({tree:E.tree, text:E.text, comment:E.comment, textMode:E.textMode})); edRestore(E.hist.pop()); }
function edRedo(){ const E = S.edit; if(!E || !(E.redoStack && E.redoStack.length)){ log("Nothing to redo in this rung edit", "wrn"); return; }
  (E.hist ||= []).push(JSON.stringify({tree:E.tree, text:E.text, comment:E.comment, textMode:E.textMode})); edRestore(E.redoStack.pop()); }
function startEdit(index, iid){
  const rung = S.R.data.rungs[index];
  if(rung.error){ log(`Rung ${index} cannot be drawn; edit it as text`, "wrn"); }
  const tree = rung.error ? [] : cloneTree(rung.tree);
  S.edit = {mode:"edit", prog:S.R.prog, routine:S.R.routine, index, tree, comment: rung.comment || "", original: rung.text,
            textMode: !!rung.error, text: rung.text, sel:null, byNode:{}, issues:[], valid:false, checked:false, version:S.R.data.version, state:"editing"};
  if(iid!=null){ const ins = instrOrder(tree)[iid]; if(ins) S.edit.sel = {id: ins._id}; }
  log(`Editing ${S.R.prog}/${S.R.routine} rung ${index}`);
  fillLists(S.R.prog);
  renderLadder(); scheduleValidate(0);
}
function startInsert(at){
  if(S.edit){ log("Finish or cancel the current edit first", "wrn"); return; }
  S.edit = {mode:"insert", prog:S.R.prog, routine:S.R.routine, index:at, tree:[], comment:"", original:"", textMode:false, text:"",

function cancelEdit(){ S.edit = null; renderLadder(); }
function editorRung(){
  const E = S.edit;

}
function renderEditor(){
  // redraw only the edited rung (keeps the rest of the ladder and live values)

  const fresh = editorRung(); host.replaceWith(fresh); bindEditor();

function renderInstrEditor(){
  const E = S.edit, box = $("eInstr"); if(!box) return;
  if(E.textMode || !E.sel || E.sel.id==null){ box.innerHTML = E.textMode ? "" : `<div class="dim ehint">Click an instruction to edit its operands. Add elements with the Language Element toolbar at the top of the routine, Alt+Insert or quick keys: they go to the insertion point (●), or next to the selected element.</div>`; return; }
  const f = findNode(E.sel.id); if(!f){ box.innerHTML = ""; return; }
  const n = f.node;
  if(n.kind==="branch"){ box.innerHTML = `<div class="dim ehint">Branch with ${n.legs.length} legs selected: <b>+ Leg</b> adds a leg, <b>✕ Remove</b> removes the whole branch, ◀ ▶ moves it.</div>`; return; }
  const sp = spec(n.name), aoi = sp ? null : aoiDef(n.name);
  const labels = sp ? sp.operands.map(o=>o) : aoi ? [{name:aoi.name+" instance", kind:"tag", types:[aoi.name]}, ...aoi.call.map(p=>({name:p, kind:"tag", types:[]}))] : [];
  const count = Math.max(n.args.length, sp ? sp.operands.filter(o=>!o.optional && !o.repeat).length : labels.length);
  const issues = E.byNode[n._id] || [];
  const rows = [];
  for(let k=0; k<count; k++){
    const o = labels[Math.min(k, labels.length-1)] || {name:`Operand ${k+1}`, kind:"src", types:[]};
    const iss = issues.find(x=>x.operand===k);
    const hint = o.types && o.types.length ? o.types.join("/") : (o.kind==="expr" ? "expression" : o.kind==="label" ? "label" : o.kind==="routine" ? "routine" : "");
    rows.push(`<label class="eop ${iss?(iss.kind==="unknown_tag"?"opwarn":"operr"):""}"><span>${esc(o.name)}${o.repeat?" …":""}</span>
      <span class="opin"><input data-op="${k}" list="${o.kind==="routine"?"routineList":"tagList"}" value="${esc(n.args[k] ?? "")}" spellcheck="false" placeholder="${esc(hint)}">${o.kind==="routine"||o.kind==="label"||o.kind==="imm"?"":`<button type="button" class="obr" data-browse="${k}" title="Browse tags (Alt+↓)">▾</button><button type="button" class="onew" data-newtag="${k}" title="Create this tag" ${iss&&iss.kind==="unknown_tag"?"":"hidden"}>＋ Tag</button>`}</span>
      ${iss?`<em>${esc(iss.message)}</em>`:`<i class="dim">${esc(hint)}</i>`}</label>`);
  }
  const canMore = sp && sp.operands.some(o=>o.repeat || o.optional);
  const gen = issues.filter(x=>x.operand==null);
  box.innerHTML = `<div class="eins"><div class="eins-h"><label>Instruction <input id="eMn" list="isaList" value="${esc(n.name)}" size="10" spellcheck="false"></label>
      <span class="dim">${esc(sp ? sp.title : aoi ? "Add-On Instruction" : "")}</span>
      ${canMore?`<button id="eAddOp" title="Add an optional / repeated operand">+ operand</button>`:""}
      ${gen.map(x=>`<span class="${x.severity==="error"?"err":"wrn"}">${esc(x.message)}</span>`).join(" ")}</div>
    <div class="eops">${rows.join("")}</div></div>`;
  const mn = $("eMn");
  mn.onchange = () => {
    edPush();
    const name = mn.value.trim(), nsp = spec(name);
    n.name = name;
    if(nsp && !nsp.operands.some(o=>o.optional || o.repeat)){       // fixed operand count: keep positions, drop extras, pad with ?
      const want = defaultArgs(name).length, dropped = n.args.slice(want);
      n.args = n.args.slice(0, want); while(n.args.length < want) n.args.push("?");
      if(dropped.some(a => a && a!=="?")) log(`${name}: operand(s) ${dropped.join(", ")} dropped (Ctrl+Z restores)`, "wrn");
    }

  const setOp = (k, v) => { while(n.args.length<=k) n.args.push("?"); n.args[k] = v; };
  const browse = (inp) => { const k = +inp.dataset.op, o = labels[Math.min(k, labels.length-1)] || {};
    openTagBrowser(inp, o.types || [], (path) => { inp.value = path; setOp(k, path); scheduleValidate(0, true); }); };
